{day:4,mod:"4 · Quality",lessons:[
{id:"d4i",title:"Unit 4 · Quality & your first module",crumb:"Unit 4 · Open",
 mins:5,
 lead:"Last unit: calibrate your judgment against an expert's, then plan a real module. After this, the Handbook is your working reference.",
 coach:"Read the loop, answer the warm-up, Save, and head into the QA desk.",
 html:`<p><strong>By the end of Unit 4 you'll be able to:</strong></p>
 <ul class="obj"><li>Score AI-assisted work on the Integrity Rubric, calibrated to expert judgment</li><li>Plan a complete module: assessments in rhythm, files in convention, AI plan stated</li></ul><div class="diag"><svg viewBox="0 0 720 118" role="img" aria-labelledby="dq-t"><title id="dq-t">The quality loop: select each stage</title><g class="fdu hot" tabindex="0" role="button" style="animation-delay:0.0s" aria-label="Build" data-name="Build" data-info="Materials made to the standards, which you now know cold."><rect x="20" y="26" width="118" height="44" rx="9" fill="#fff" stroke="#e8e1d6"/><text x="79" y="52" text-anchor="middle" font-size="12" fill="#1c2b3a" font-weight="600">Build</text></g><g class="fdu hot" tabindex="0" role="button" style="animation-delay:0.18s" aria-label="QA review" data-name="QA review" data-info="Module and course review against the deliverables list; findings documented."><rect x="172" y="26" width="118" height="44" rx="9" fill="#e3edf8" stroke="#1d5fa8"/><text x="231" y="52" text-anchor="middle" font-size="12" fill="#164a85" font-weight="600">QA review</text></g><g class="fdu hot" tabindex="0" role="button" style="animation-delay:0.36s" aria-label="Fix & recheck" data-name="Fix & recheck" data-info="Findings go back, get fixed, get re-verified. Cheap here, expensive later."><rect x="324" y="26" width="118" height="44" rx="9" fill="#fff" stroke="#e8e1d6"/><text x="383" y="52" text-anchor="middle" font-size="12" fill="#1c2b3a" font-weight="600">Fix & recheck</text></g><g class="fdu hot" tabindex="0" role="button" style="animation-delay:0.54s" aria-label="Ship" data-name="Ship" data-info="QA sign-off releases the course to Delivery and instructor training."><rect x="476" y="26" width="108" height="44" rx="9" fill="#e7f4ee" stroke="#1f9d76"/><text x="530" y="52" text-anchor="middle" font-size="12" fill="#186b52" font-weight="600">Ship</text></g><g class="fdu hot" tabindex="0" role="button" style="animation-delay:0.72s" aria-label="Cohort" data-name="Cohort" data-info="Surveys and results come back, and become the next revision’s inputs."><rect x="618" y="26" width="88" height="44" rx="9" fill="#fff" stroke="#e8e1d6"/><text x="662" y="52" text-anchor="middle" font-size="12" fill="#1c2b3a" font-weight="600">Cohort</text></g><path class="fdu" style="animation-delay:0.1s" d="M 142 48 L 164 48" stroke="#1d5fa8" stroke-width="2.5" marker-end="url(#arrQ)"/><path class="fdu" style="animation-delay:0.28s" d="M 294 48 L 316 48" stroke="#1d5fa8" stroke-width="2.5" marker-end="url(#arrQ)"/><path class="fdu" style="animation-delay:0.46s" d="M 446 48 L 468 48" stroke="#1d5fa8" stroke-width="2.5" marker-end="url(#arrQ)"/><path class="fdu" style="animation-delay:0.64s" d="M 588 48 L 610 48" stroke="#1d5fa8" stroke-width="2.5" marker-end="url(#arrQ)"/><path d="M 662 74 Q 360 122 82 74" fill="none" stroke="#3f88c5" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arrQg)"/><text x="372" y="108" text-anchor="middle" font-size="10.5" fill="#3f88c5">findings become the next revision’s inputs</text><defs><marker id="arrQ" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1d5fa8"/></marker><marker id="arrQg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3f88c5"/></marker></defs></svg><div class="dcap">👆 <b>Select each stage</b> of the loop your capstone plan will enter.</div></div>
 <div class="pullquote"><div class="pq">“Feedback is one of the most powerful influences on learning and achievement, but its impact depends entirely on the kind of feedback given.”</div><div class="pa">Hattie &amp; Timperley, “The Power of Feedback,” Review of Educational Research, 2007. Why every activity in this course answers you, and every rubric you write must too.</div></div><div class="meta"><span class="mi">🔍</span><div><b>Design note:</b> across the four units you got objectives up front, warm-ups, concepts with visuals, activated practice, unit checks, and a capstone that produces something real. That arc is the template.</div></div>`,
 activity:{type:"journal",id:"d4ij",fields:[
  {label:"Warm-up: in your own words. What does \u201Cdone\u201D mean for a module?",ph:"Done means..."}],model:"“Done” is a checklist, not a feeling: every deliverable on the list, every graded item carrying a rubric, accessibility verified, files named to convention, and QA-ready. If your answer was about effort or completeness-as-vibe, today will sharpen it into evidence."}},

{id:"msy",title:"When the plan meets Tuesday",crumb:"Unit 4 · Simulation",
 mins:10,
 lead:"Everything so far taught the clean version of the job. This is the other version: the client changes course, the SME slips, the environment breaks, and you have to make a defensible call.",
 
 brief:{from:"ID&D Director",re:"Five situations from real builds",text:"None of these have a comfortable answer, that’s the point. What I care about is the pattern in your calls: never silent. Document, propose options, escalate early, and let the owner of the decision decide."},
 coach:"Read each situation, then <b>select the call you’d make</b>. Wrong calls explain their downstream cost and let you try again: that’s the design.",
 hint:"The pattern behind every right answer: no silent changes, no silent absorption, no silent shipping. Constraints get documented, options get proposed, decisions get made by their owners, in writing.",
 html:`<p>There\u2019s no answer key for a plan meeting reality, but there is a <b>pattern that separates a defensible call from a panic move</b>.</p>
 <div class="box info"><span class="bh">The rule when things break</span><p class="tight"><b>Never go silent.</b> Whatever the disruption. Client pivots, SME slips, environment fails. The professional move is the same shape: <b>document</b> what changed, <b>propose options</b> with tradeoffs rather than presenting a dead end, and <b>escalate early</b> while there\u2019s still room to act. The wrong move is almost never the wrong <em>option</em>: it\u2019s absorbing the problem quietly and hoping.</p></div>
 <p><strong>Plans meet reality on every build.</strong> Clients change direction, SMEs miss dates, environments break, and equipment arrives late. None of that is a failure of planning, it is the normal condition of the work. What separates a professional response from a panic response is not the option chosen, it is the shape of the response.</p>
 <div class="box info"><span class="bh">The three moves, every time</span><p class="tight"><b>1. Document what changed.</b> In writing, with the date and the specific impact on scope, timeline, or quality. A change nobody recorded becomes a dispute later about what was agreed.<br><b>2. Bring options, not a dead end.</b> \u201CThis cannot be done\u201D stops the conversation. \u201CWe can do A by the date, or B in full two weeks later, and here is what each costs\u201D lets someone decide. Include the tradeoff you would accept.<br><b>3. Escalate early, while there is room to act.</b> The value of a warning decays fast. A flag raised in week two is a decision, the same flag in week six is a fire.</p></div>
 <div class="box rule"><span class="bh">The move that is always wrong</span><p class="tight">Absorbing the problem quietly. Hidden absorption means leadership plans the next build on data saying this one went fine, so the same slip repeats. It also converts a shared problem into a personal one, usually at your own expense.</p></div>
 <p><strong>Where quality gets protected.</strong> When scope has to give, protect the evidence: the summative that proves competency is the last thing to cut, because without it the module cannot show learners can do the job. Trim practice volume, reduce polish, narrow scope, or move the date, but keep the proof.</p>
 <p class="tight" style="color:var(--muted)">Five real situations follow. For each, pick the response you would defend in writing to your director.</p>`,
 activity:{type:"story",id:"msys",points:18,
  steps:[
   {tag:"Situation 1 of 6 · Mid-build platform change",text:"Six weeks into a customized build, the client announces their environment is moving to a different platform. Half your labs assume the old one. What’s your first move?",
    opts:[{t:"Quietly start rewriting the labs for the new platform: it’s going to happen anyway.",fb:"Now the blueprint, charter, and timeline all describe a project that no longer exists. Undocumented scope change is how builds lose their paper trail."},
          {t:"File a change request with an impact assessment: affected materials, added time, environment needs, before touching anything.",ok:true,fb:"Right. Client changes are routed, not absorbed: impact first, decision by the owner, then work. The change log is the project’s memory."},
          {t:"Push back. The charter says the old platform, so the client is out of scope.",fb:"Charters are agreements, not walls. Client-driven change is normal; the discipline is routing it, not blocking it unilaterally."}]},
   {tag:"Situation 2 of 6 · The SME misses the deadline",text:"Your domain reviewer is a week late on module 3 review, and QA is scheduled. You could probably cover it yourself over the weekend.",
    opts:[{t:"Absorb it. Work the weekend, keep the timeline green.",fb:"The timeline is now lying. Hidden absorption means leadership plans the next build on data that says this one was fine. The same slip repeats on the next build."},
          {t:"Escalate early with options: shift QA a week, descope module 3 review to critical items, or bring in an alternate reviewer.",ok:true,fb:"Exactly, escalation is options, not blame. Early and with alternatives, it’s a professional act; late and bare, it’s a crisis."},
          {t:"Report the SME to leadership and demand consequences.",fb:"Escalation is about the work, not the person. Bring options for the schedule, not a case for the prosecution."}]},
   {tag:"Situation 3 of 6 · The environment can’t support the lab",text:"Infrastructure confirms the planned lab environment can’t exist as designed. The lab is the evidence for a key objective.",
    opts:[{t:"Ship the lab as written. Infra will probably catch up by launch.",fb:"“Probably” is not an environment. Learners hitting a lab that cannot run is the most expensive possible way to discover this."},
          {t:"Document the constraint, propose alternative evidence for the same objective, and get the change approved.",ok:true,fb:"Right: the objective stays, the evidence adapts, and the decision is documented and owned. Constraints are design inputs, not secrets."},
          {t:"Delete the objective: no environment, no objective.",fb:"Objectives trace to job tasks, not to environments. When evidence can’t exist, the evidence changes: the outcome shouldn’t silently vanish."}]},
   {tag:"Situation 4 of 6 · QA finds a serious problem near launch",text:"Ten days out, QA flags a serious defect in module 2. Fixing it properly risks the launch date.",
    opts:[{t:"Ship quietly and patch after the cohort starts. Nobody will notice week-one.",fb:"Learners will notice, instructors will notice, and the defect log will notice that it was known. Quiet shipping converts a product problem into a trust problem."},
          {t:"Force a readiness decision: fix before ship, or ship with a documented, owner-approved exception and a dated fix plan.",ok:true,fb:"That’s the discipline: launch readiness is a decision someone owns, made in the open. Either outcome can be right. Silence never is."},
          {t:"Push back on QA for flagging it this late.",fb:"The timing stings, but the defect is real regardless of when it was found. Shooting the messenger just teaches QA to stop finding things."}]},
   {tag:"Situation 5 of 6 · The hours get cut",text:"The client cuts the program’s hours substantially, but wants “all the same outcomes.”",
    opts:[{t:"Compress, same content, faster. Learners will keep up.",fb:"Compression collapses the activated-learning time where skill actually forms. Same topics, less learning: the outcomes become fiction."},
          {t:"Renegotiate scope openly: fewer outcomes, done to standard, documented and agreed.",ok:true,fb:"Right. Hours are the budget outcomes are bought with. Fewer hours honestly buys fewer outcomes, done well. That conversation belongs in daylight, in writing."},
          {t:"Quietly pad the difference with self-study homework.",fb:"That’s a modality and scope change wearing a disguise: it needs the same open approval as any other scope decision."}]},
   {tag:"Situation 6 of 6 · The vendor pulls the lab",text:"Two weeks before launch, the vendor discontinues the hosted lab environment module 2 depends on. A similar free alternative exists. What’s the move?",
    opts:[{t:"Swap in the free alternative quietly: it covers the same skills.",fb:"Content changed after review, unseen by QA, undocumented in the blueprint, and the instructors discover the surprise live, in front of a cohort. Fast isn’t the problem; silent is."},
          {t:"Run change control: impact assessment, approval by the review owner, blueprint and change log updated, and Delivery notified with an updated facilitator guide before day one.",ok:true,fb:"Right. A fix can be fast AND governed. Approve it, document it, and above all: the instructors find out from you, not from a broken link."},
          {t:"Push the launch until the original vendor environment is restored.",fb:"Launch dates have owners too. Delaying unilaterally is the same governance failure as swapping silently, pointed the other way. Bring options to the owner."}]}],
  fbGood:"Five Tuesdays survived, one pattern: never silent. Document, propose options, escalate early, let owners decide. That pattern is the whole skill.",
  fbBad:"Five Tuesdays survived. Reread any step where you got burned. Every wrong call here was some flavor of silence."}},
{id:"fgq",title:"Make it teachable",crumb:"Unit 4 · Review queue",
 mins:8,
 lead:"A course isn’t done when it’s built. It’s done when someone who didn’t build it can teach it. Review these facilitator-guide excerpts the way Delivery will experience them.",
 
 brief:{from:"Product Quality & Experience (QA)",re:"Facilitator guide: pre-Delivery review",text:"Instructors consistently report receiving courses without truly understanding how to teach them. These five excerpts are from the 1042 facilitator guide draft. Approve what would help an instructor at 2pm on a hard day; send back what wouldn’t."},
 demo:{eg:"FG excerpt: “Warm-up (20 min): if the room is quiet, seed with the two starter questions below; if it runs long, cut to one and move on. The lab needs its full hour.”",steps:["My lens: does this help an instructor who <em>didn’t build the course</em>, at 2pm on a hard day? It hands them a concrete move for a real classroom moment.","And it protects the load-bearing block: the lab, by naming the tradeoff out loud. Pacing plus priority: that’s the teaching layer.","Verdict: ✓ Approve. Your five excerpts: teach the teacher, and assume the author is absent."]},
 coach:`<b>✓ Approve</b> excerpts that make the module teachable by someone who didn’t build it; <b>✗ Send back</b> those that don’t, naming exactly what’s missing. FG template: ${gl('templates','templates & links')}.`,
 hint:"A facilitator guide is the teaching layer, not a copy of learner materials: pacing with priorities (what compresses, what’s never skipped), known misconceptions, demo notes, self-serve troubleshooting, and it must work with the author nowhere in the building.",
 html:`<div class="box info"><span class="bh">Teachable means a stranger can run it</span><p class="tight">The test for a facilitator guide: <b>could an instructor who didn\u2019t build the course teach it well from this alone?</b> That means it carries more than a schedule. It needs the <em>why</em> behind activities, the common places learners get stuck and how to respond, timing and setup for labs, model answers or look-fors on assessments, and what to do when the room is ahead or behind. A guide that only lists what happens, without how to teach it, hands Delivery a script with no direction.</p></div>
 <p><strong>The standard is a stranger.</strong> A facilitator guide is not a summary for the person who built the course, it is instructions for an instructor who was not in any of the design conversations and will teach this next month. The test: could someone who has never seen this module run it well from the guide alone? Everything else follows from that.</p>
 <div class="box info"><span class="bh">What a guide has to carry</span><p class="tight"><b>Purpose per activity.</b> Not just what happens, but why, so the instructor can adapt without breaking the objective.<br><b>Timing and setup.</b> How long each block runs, what must be prepared beforehand, what accounts or environments need to exist before class.<br><b>Where learners get stuck.</b> The predictable wrong turns and how to respond, which is the most-used section in practice and the one most often missing.<br><b>Look-fors and model answers.</b> What correct work looks like, and what partial understanding looks like, so feedback is consistent between instructors.<br><b>Contingencies.</b> What to do if the room is ahead, behind, or the environment fails. A lab that depends on a live service needs a fallback.</p></div>
 <div class="box rule"><span class="bh">The failure mode</span><p class="tight">A guide that only lists what happens is a schedule, not a guide. It hands Delivery a sequence with no direction, and the instructor reconstructs the intent by guessing. That is where classroom quality quietly diverges from what was designed.</p></div>
 <p><strong>Why this sits with us and not Delivery.</strong> We do not teach the course, so the guide is how our design intent survives the handoff. If the guide is thin, the module is not finished, no matter how good the lessons are.</p>
 <p><strong>In our courses.</strong> For an IT Support ticket lab, the guide needs the seeded fault, the expected diagnostic path, and what to say when a learner fixes the symptom instead of the cause. For a MERN build lab, it needs the environment setup, the common dependency failure, and what \u201Cworking\u201D looks like versus \u201Cpasses by accident.\u201D</p>
 <p class="tight" style="color:var(--muted)">Review each excerpt as Delivery would experience it. Approve what makes the module teachable by a stranger, and name what is missing when you send one back.</p>`,
 activity:{type:"review",id:"fgqr",points:15,queueTag:"Facilitator guide · draft excerpts",
  items:[
   {content:"<strong>Pacing:</strong> “The configuration demo (15 min) can compress to 8 if the morning ran long. GLAB 301.2.1 is never skipped: it produces the evidence KBA 301 measures.”",
    good:true,
    why:"✓ Approved. Priorities plus pacing: exactly what an instructor needs when time collapses: what flexes, what’s load-bearing, and why.",
    reasons:[]},
   {content:"<strong>Lesson steps:</strong> the same numbered steps as the learner lab, pasted verbatim, nothing added.",
    good:false,
    why:"✗ Sent back: a facilitator guide adds the <em>teaching</em> layer. What to demonstrate, where learners stall, what to ask. It doesn’t duplicate what learners already have.",
    reasons:[
     {t:"It duplicates learner-facing content instead of adding delivery guidance. The teaching layer is entirely missing",ok:true,fb:""},
     {t:"The formatting doesn’t match the template",fb:"Formatting is fixable in a pass. The structural problem is that there’s nothing here an instructor doesn’t already have."},
     {t:"Steps shouldn’t appear in facilitator guides at all",fb:"Steps can absolutely appear: annotated with how to teach them. Duplication without annotation is the flaw."}]},
   {content:"<strong>Troubleshooting:</strong> “If the VM image fails to load, message the course developer on Slack.”",
    good:false,
    why:"✗ Sent back: the course must run with its author nowhere in the building. The guide needs the actual troubleshooting steps. Checks, fixes, and the proper escalation path when those fail.",
    reasons:[
     {t:"It outsources troubleshooting to the author instead of equipping the instructor. The self-serve steps are missing",ok:true,fb:""},
     {t:"Slack is the wrong tool for escalation",fb:"The channel isn’t the issue. The issue is there’s nothing to try before escalating. The instructor is helpless by design."},
     {t:"Developers must never be contacted after launch",fb:"Escalation paths exist and sometimes reach the developer. The flaw is skipping straight there with zero self-serve steps."}]},
   {content:"<strong>Misconception note:</strong> “Learners reliably conflate bandwidth and latency. Surface it with the warm-up poll before the demo, then name the difference explicitly during it.”",
    good:true,
    why:"✓ Approved. Anticipating a known misconception and giving the instructor a concrete move for it. This is the guide earning its keep.",
    reasons:[]},
   {content:"<strong>Delivery notes:</strong> “(section left blank. This module is self-explanatory)”",
    good:false,
    why:"✗ Sent back: “self-explanatory” is how courses fail contact with a real classroom. Delivery detail is a required part of the deliverable. If there is truly nothing to say, the module hasn’t been thought about from the instructor’s seat.",
    reasons:[
     {t:"Delivery guidance is a required part of the deliverable. A blank section means the instructor’s experience was never designed",ok:true,fb:""},
     {t:"It should say “TBD” instead of being blank",fb:"“TBD” is a blank section with better manners. The content is what’s owed, not a placeholder."},
     {t:"Simple modules are allowed blank sections",fb:"Simplicity is the builder’s view. Instructors still need pacing, pitfalls, and priorities. Those exist even in simple modules."}]}],
  fbGood:"Five for five. You just reviewed for the person this course will actually live with. Instructor enablement is stewardship’s front line.",
  fbBad:"Queue cleared. The through-line in every send-back: the guide must teach the teacher, and it must work with the author absent."}},
{id:"schg",title:"Route the change evidence",crumb:"Unit 4 · Review queue",
 mins:8,
 lead:"Not every problem is a revision, and not every urgent request is a product problem. Stewardship is routing each issue by its actual impact, before urgency erases diagnosis.",
 coach:`<b>✓ Approve</b> proposed routes that match the evidence; <b>✗ Send back</b> anything over- or under-classified, naming the right route. Change types: ${gl('process','the Handbook')}.`,
 hint:"Hotfix = a narrow live blocker or material defect. Maintenance = low-risk correction. Planned revision = changed intent, scope, hours, outcomes, technology, or assessment strategy. No product change = a delivery, access, or support issue wearing a product costume.",
 demo:{eg:"Delivery reports: “Module 2 quiz, question 4 has a typo. ‘teh’ for ‘the.’ Proposed route: planned revision, next quarter.”",steps:[
 "Diagnose before routing: is anything blocked? No. Is intent, scope, or the assessment strategy changing? No: it’s a spelling defect.",
 "That’s maintenance: a low-risk correction, logged and done. Parking it behind a quarterly revision leaves a known defect live for months; escalating it to hotfix burns the emergency lane.",
 "Verdict: ✗ Send back, reroute as maintenance. Your queue: match the route to the impact, never to the urgency."]},
 html:`<div class="box info"><span class="bh">Route by impact, not by volume</span><p class="tight">Four routes, and the skill is telling them apart <em>before</em> urgency forces a bad call: <b>Hotfix</b>: something is broken and live; fix now. <b>Maintenance</b>: a small correction, no new version. <b>Planned revision</b>: a real content change; it earns a version bump and goes through the process. <b>No product change</b>: the issue is delivery or expectation, not the course. The trap: a loud request isn\u2019t automatically a hotfix, and \u201cwhile you\u2019re in there\u201d is how scope creeps. Diagnose impact first.</p></div>
 <p><strong>Routing is the skill, not fixing.</strong> Requests arrive urgent and unsorted, and the cost of misrouting is real in both directions: treating a small correction as a full revision burns weeks, and treating a real content change as a quick fix ships an unversioned course that nobody can reconstruct later. Diagnose impact before you touch anything.</p>
 <div class="box info"><span class="bh">The four routes</span><p class="tight"><b>Hotfix.</b> Something is broken and live: a dead link, a wrong command a learner is running right now, a missing file. Fix immediately, log it, no version change.<br><b>Maintenance.</b> A small correction with no instructional impact: a typo, a formatting fix, a clarified sentence. No new version.<br><b>Planned revision.</b> A real change to content, objectives, sequence, or assessments. Earns a version bump, goes through the process, gets QA.<br><b>No product change.</b> The issue is delivery, expectation, or scheduling rather than the course. The fix is a conversation, not an edit.</p></div>
 <div class="box rule"><span class="bh">The two traps</span><p class="tight"><b>Volume is not impact.</b> A loud or senior request is not automatically a hotfix. The route depends on what is actually broken and for whom.<br><b>\u201CWhile you are in there.\u201D</b> Bundling extra changes onto a hotfix is how a one-line fix becomes an untested release. Additional changes get their own route.</p></div>
 <p><strong>Ask three questions in order.</strong> Is anything broken for learners right now? Does this change what learners are expected to know or do? Is the real problem in the product at all? The answers pick the route, and the route decides the paperwork.</p>
 <p><strong>In our courses.</strong> \u201CThe lab link 404s\u201D is a hotfix. \u201CThis explanation is confusing\u201D is maintenance, unless the confusion is an objective problem, in which case it is a revision. \u201CLearners are arriving without prerequisites\u201D is usually no product change, however urgent it feels.</p>
 <p class="tight" style="color:var(--muted)">Route each request in the queue and name the evidence that put it there.</p>`,
 activity:{type:"review",id:"schgr",points:12,queueTag:"change control",
  items:[
   {content:"A required lab link returns 404 for the live cohort. Proposed route: emergency hotfix; replace with the verified current link, test in learner view, notify instructors, and log the change.",good:true,why:"✓ Approved. This is a narrow live blocker with a clear verification and communication path.",reasons:[]},
   {content:"An instructor wants to replace the approved SBA with a group presentation next week because it will be easier to grade. Proposed route: make the change as a maintenance update.",good:false,why:"✗ Send back. The request changes the evidence model and possibly individual proficiency; it requires design/assessment impact review, not a quiet maintenance edit.",reasons:[{t:"Route for impact analysis and authorized assessment change; determine whether it is a planned revision or rejected request",ok:true,fb:""},{t:"Allow it because the instructor owns delivery",fb:"Delivery discretion does not extend to replacing approved summative evidence without governance."},{t:"Rename the presentation SBA",fb:"A naming change does not preserve the evidence model."}]},
   {content:"Learners cannot sign into the vendor environment because site accounts were never provisioned. The course instructions and setup record are correct. Proposed route: no product change; resolve provisioning, document the operational failure, and verify whether the support path needs improvement.",good:true,why:"✓ Approved. The immediate defect is operational, though the evidence may still justify a support-process improvement.",reasons:[]},
   {content:"A certification vendor releases a new exam version that changes objectives, software versions, and the weighting of two domains. Proposed route: update a few screenshots as a hotfix.",good:false,why:"✗ Send back. The change affects scope, outcomes, evidence, content, and likely hours; it requires planned revision and impact analysis.",reasons:[{t:"Open a planned revision covering objective mapping, content, labs, assessments, schedule, instructor preparation, and version records",ok:true,fb:""},{t:"Wait until learners complain",fb:"Known external changes should be assessed before the product drifts out of alignment."},{t:"Only change the exam name",fb:"The underlying requirements changed; a label edit is insufficient."}]},
   {content:"A typo in a non-graded handout reverses two letters but does not change meaning. Proposed route: verified maintenance correction with a change-log entry.",good:true,why:"✓ Approved. Low-risk corrections still get verified and logged; they do not need revision theater.",reasons:[]}],
  fbGood:"Change queue routed. You separated live support, low-risk maintenance, and product revision by impact.",
  fbBad:"Queue complete. Revisit any miss: urgency and visibility are not the same as product impact."}},
{id:"s7",title:"Sit the QA desk",crumb:"Unit 3 · Simulation",
 mins:8,
 lead:"A learner submission with an AI reflection is in your queue. Score it on the AI Integrity Rubric: then compare with the expert scoring.",
 demo:{eg:"Dimension 1 — Purposeful AI Use. The submission reads: “I asked the AI for a plan, then reordered its steps based on the symptoms.”",steps:["I score against the anchors, never my mood: explaining <em>how</em> AI was used earns a 2 on this dimension.","But the reorder is <em>refinement</em>: visible judgment applied to the output. Refinement is what separates a 3 from a 2.","I’d score it 3, then check my reasoning against the anchor text. Now score all three dimensions yourself; we compare after."]},
 coach:`Read the submission, then <b>score each dimension 0–3</b> by clicking a number. A learner passes with 2+ on all three. When you've scored all three, press Compare. The rubric: ${gl('ai','AI standards')}.`,
 hint:"Explanation alone earns a 2. Visible refinement and independent judgment. Reordering, rejecting, correcting. Is what earns a 3.",
 html:`<p><strong>First, the instrument:</strong> the AI Integrity Rubric grades learner AI use on three dimensions, each 0–3, purposeful use, verification &amp; judgment, responsible reflection. Passing means 2+ on all three. <strong>Now the concept:</strong> a rubric only standardizes grading if the graders are calibrated. Scoring the same submission an expert scored. Then comparing, is how calibration is built.</p>
 <p><strong>What a rubric is actually for.</strong> A rubric exists so that two reviewers scoring the same work land in the same place, and so the learner knows what good looks like before they submit. If it does not do both, it is decoration. That is also why criteria come from the objectives and not from the steps of the activity: you are judging whether the learner demonstrated the capability, not whether they followed your instructions in order.</p>
 <div class="box info"><span class="bh">How a usable rubric is built</span><p class="tight"><b>Criteria.</b> One row per thing you are judging, and every row traces back to a stated objective. If a criterion does not trace to an objective, cut it.<br><b>Levels.</b> Exemplary, Proficient, Needs Improvement. Keep it to five or fewer, because Canvas shows a maximum of five per criterion.<br><b>Descriptions.</b> Each level says what is observable at that level, in language different enough from its neighbors that a reader can tell them apart without the points. \u201CGood organization\u201D versus \u201Cexcellent organization\u201D is not a rubric, it is a rating scale with adjectives.<br><b>Points.</b> Scaled to the item\u2019s weight in the course. A rubric whose total does not reconcile with the gradebook is a QA finding.</p></div>
 <div class="box rule"><span class="bh">The test for every criterion</span><p class="tight">Could two reviewers, scoring independently, agree on the level? If the difference between Proficient and Needs Improvement depends on the reviewer\u2019s mood, the descriptions are not observable yet. Write what you would <em>see</em> in the work at each level.</p></div>
 <p><strong>Two audiences, two versions.</strong> Learners get the simplified rubric so they know the target. Instructors get the full version with look-fors: common wrong turns, what partial credit looks like, and examples of work at each level. Where the task involves AI, the three AI Integrity Rubric criteria go in alongside your own.</p>
 <p><strong>In our courses.</strong> An IT Support SBA rubric row might read: <em>diagnoses the fault before changing settings</em>, with Exemplary described as \u201Cisolates the cause with a documented test before any change,\u201D and Needs Improvement as \u201Cchanges settings without establishing the cause.\u201D That is observable. \u201CDemonstrates strong troubleshooting\u201D is not.</p>
 <p class="tight" style="color:var(--muted)">Score the submission below on each dimension, then compare with the expert scoring. Where you differ, the question is which of you the rubric wording actually supports.</p>`,
 activity:{type:"rubric",id:"s7r",points:15,

   text:"\u201CI asked the AI assistant to draft a troubleshooting plan for the ticket. Its first plan skipped checking the event logs, so I added that step and reordered it to check hardware last since the symptoms pointed to software. I used its wording for the client-facing summary but rewrote the technical steps from what we did in GLAB 402.1.1. One thing it suggested. Resetting the BIOS. I left out because it didn't match the symptoms and I couldn't verify it was safe on our hardware.\u201D"},
  dims:[

   {t:"Responsible Use & Reflection: appropriate, acknowledged use with real reflection?",ans:2,why:"Expert: 2. Acknowledged and appropriate, with honest notes on what was kept and cut, but the reflection stays task-level, so it meets rather than exceeds."}],
  fbGood:"3 / 3 / 2 = 8: a clear pass, scored exactly like the expert. Note what earned the 3s: visible refinement, not just \u201CI used AI.\u201D",
  fbBad:"Compare with the expert calls above: the calibration point: explanation earns a 2; visible refinement and judgment earn the 3."}}
]},

/* ================= ENGINE ================= */
const COURSE=ALL.filter(m=>DAY==="__ALL__"||String(m.day)===DAY);
const FLAT=[];COURSE.forEach(m=>m.lessons.forEach(l=>{l._mod=m.mod;l._day=m.day;FLAT.push(l);}));
const TOTAL=FLAT.reduce((s,l)=>s+((l.activity&&l.activity.points)||0),0);
let ST={current:FLAT[0].id,done:{},earned:{},cap:false,data:{},track:null,mem:{}};

function load(){
  const s=SCORM.getSuspend();if(s)ST=Object.assign(ST,s);
  try{ const bm=SCORM.getBookmark(); if(bm && FLAT.some(l=>l.id===bm)) ST.current=bm; }catch(e){}
}
function persist(){
  SCORM.setSuspend(ST);
  try{ if(ST.current) SCORM.setBookmark(ST.current); }catch(e){}
  // completion progress (%). How many of THIS unit's activities are done, ignoring correctness
  try{
    const acts=FLAT.filter(l=>l.activity);
    if(acts.length){
      const doneCount=acts.filter(l=>ST.done[l.id]).length;
      SCORM.setScore(Math.round(100*doneCount/acts.length));
    }
  }catch(e){}
  if(FLAT.length&&FLAT.every(x=>ST.done[x.id]))SCORM.markComplete();
  const d=document.getElementById("savedot");d.textContent="saving…";clearTimeout(persist._t);persist._t=setTimeout(()=>d.textContent="saved",500);
  updateRing();
}
function updateRing(){
  const pct=Math.round(FLAT.filter(l=>ST.done[l.id]).length/FLAT.length*100);
  document.getElementById("ring").style.setProperty("--p",pct);
  document.getElementById("ringpct").textContent=pct+"%";
  let earned=0,avail=0;
  FLAT.forEach(l=>{if(l.activity&&l.activity.points!=null&&ST.done[l.id]){avail+=l.activity.points;earned+=(ST.earned[l.activity.id]||0);}});
  const _dn=FLAT.filter(x=>ST.done[x.id]).length;document.getElementById("scorechip").textContent = _dn? "✓ "+_dn+" / "+FLAT.length+" done": "✓, ";
}
function idx(id){return FLAT.findIndex(l=>l.id===id);}
/* ---------- author / preview mode ----------
   Add ?preview=1 to the launch URL (or press Shift+P) to unlock all navigation
   for admins/authors. Learners never see this; the normal gated flow is unchanged. */
const CAPSTONE_ASSIGNMENT_URL = ""; /* paste the Canvas assignment URL here to make the button a direct link */
let PREVIEW = false;
function detectPreview(){
  const pat=/[?&#]preview=1/;
  try{ if(pat.test(location.search)||pat.test(location.hash)) return true; }catch(e){}
  // Canvas launches SCORM in an iframe. Check the parent/top window URL too
  try{ if(window.parent && window.parent!==window && pat.test(window.parent.location.href)) return true; }catch(e){}
  try{ if(window.top && pat.test(window.top.location.href)) return true; }catch(e){}
  // remembered across a session (survives iframe reloads)
  try{ if(sessionStorage.getItem("pd_preview")==="1") return true; }catch(e){}
  return false;
}
PREVIEW = detectPreview();
function setPreview(on){ PREVIEW=on; try{sessionStorage.setItem("pd_preview",on?"1":"0");}catch(e){}
  renderLessonNav(); refreshNav();
  const b=document.getElementById("pvbadge"); if(b)b.style.display=on?"block":"none"; }
function togglePreview(){ setPreview(!PREVIEW); }
try{ window.addEventListener("keydown",e=>{ if(e.shiftKey&&(e.key==="P"||e.key==="p")) togglePreview(); }); }catch(e){}

function unitDone(n){
  // a unit is complete when every activity-bearing lesson in it is done
  const acts=FLAT.filter(l=>(l._day||1)===n && l.activity);
  return acts.length>0 && acts.every(l=>ST.done[l.id]);
}
function unlocked(i){
  if(PREVIEW)return true;
  // Fail open: if this browser cannot save progress, do not gate anything.
  // Gating a learner whose progress will not persist would lock them out permanently.
  try{ if(SCORM.storageAvailable===false) return true; }catch(e){ return true; }
  const l=FLAT[i];
  if(l.id==="cap")return FLAT.filter(x=>x.id!=="cap"&&x.activity).every(x=>ST.done[x.id]);
  // sequential units: a unit opens only when every earlier unit is finished
  const day=l._day||1;
  for(let n=1;n<day;n++){ if(!unitDone(n)) return false; }
  return true;
}
function markDone(id,pts){
  ST.done[id]=true;
  if(pts!=null)ST.earned[FLAT[idx(id)].activity.id]=pts;
  // analytics: log activity completion as a SCORM interaction (harmless if LMS ignores it)
  try{
    const l=FLAT[idx(id)];const a=l&&l.activity;
    if(a&&a.id&&!ST.data['int-'+a.id]){
      const track=ST.track||"none";
      SCORM.logInteraction(a.id+"|"+track, "completed", true, "completed");
      ST.data['int-'+a.id]=1;
    }
  }catch(e){}
  persist();renderLessonNav();refreshNav();paintResult(FLAT[idx(id)]);
}
function paintResult(l){
  const a=l.activity;if(!a||a.points==null||!ST.done[l.id])return;
  const pts=ST.earned[a.id]??0,max=a.points;
  const fb=document.getElementById("fb-"+a.id);if(!fb)return;
  let r=document.getElementById("res-"+a.id);
  if(!r){r=document.createElement("div");r.id="res-"+a.id;fb.parentNode.insertBefore(r,fb.nextSibling);}
  r.className="result full";
  // Report what actually happened. Per-item try counts exist for judged activities
  // (review, triage); anything else just reports completion.
  let firstTry=0, tracked=0;
  for(let i=0;i<40;i++){
    const t=ST.data[a.id+'-t'+i];
    if(t===undefined) continue;
    tracked++; if(t===0) firstTry++;
  }
  let msg;
  if(tracked>0 && firstTry===tracked){
    msg='<b>Complete. '+tracked+' of '+tracked+' right on the first try.</b>';
  }else if(tracked>0){
    msg='<b>Complete. '+firstTry+' of '+tracked+' right on the first try.</b> Review the items you corrected: the explanation for each is above.';
  }else{
    msg='<b>Activity complete.</b>';
  }
  r.innerHTML='<span class="star">★</span><span>'+msg+'</span>';
}

function renderLessonNav(){
  const el=document.getElementById("ldbody");
  const adminBtn=PREVIEW?`<button type="button" id="pvtoggle" style="width:100%;box-sizing:border-box;margin:0 0 10px;padding:8px 10px;border:1.5px dashed #fc7800;background:#fff3e8;color:#c85a00;border-radius:8px;font-family:var(--sans,Arial);font-size:11.5px;font-weight:700;cursor:pointer;letter-spacing:.03em">👁 PREVIEW ON: select to return to learner view</button>`:"";
  el.innerHTML=adminBtn+COURSE.map(m=>{
    const _fi=idx(m.lessons[0].id), _lk=!unlocked(_fi), _dn=(FLAT[_fi]._day||1);
    const _isCap=m.lessons[0].id==="cap";
    const _msg=_isCap?"Finish all four units to open the capstone":`Finish Unit ${_dn-1} to open this unit`;
    const _note=_lk?`<div style="font-size:11px;color:#9a6a00;background:#fff7e8;border:1px solid #f0d9a8;border-radius:6px;padding:5px 8px;margin:2px 0 6px">\u{1F512} ${_msg}</div>`:``;
    return `<div><div class="mod-title">${m.mod}</div>${_note}<div class="lnav">${
    m.lessons.map(l=>{const i=idx(l.id),u=unlocked(i),d=ST.done[l.id];
      return `<a data-id="${l.id}" class="${ST.current===l.id?'on':''} ${u?'':'locked'}"${u?'':' title="Locked until you finish the previous unit"'}><span class="dot ${d?'done':''}">${d?'✓':(u?'':'🔒')}</span><span>${l.title}${l.mins?` <small style="opacity:.55">· ${l.mins}m</small>`:``}</span></a>`;}).join("")
  }</div></div>`;}).join("");
  const pvt=document.getElementById("pvtoggle"); if(pvt)pvt.onclick=()=>togglePreview();
  el.querySelectorAll("a").forEach(a=>a.onclick=()=>{
    const i=idx(a.dataset.id);if(!unlocked(i))return;
    ST.current=a.dataset.id;closeLessons();render();});
}
function openLessons(){renderLessonNav();document.getElementById("ld").classList.add("open");document.getElementById("ldscrim").classList.add("open");}
function closeLessons(){document.getElementById("ld").classList.remove("open");document.getElementById("ldscrim").classList.remove("open");}
document.getElementById("menuopen").onclick=openLessons;
document.getElementById("ldclose").onclick=closeLessons;
document.getElementById("ldscrim").onclick=closeLessons;

let gdSection=GUIDE[0].id;
let gdQ="";
function renderGuide(){
  const list=GUIDE.filter(g=>!gdQ||g.title.toLowerCase().includes(gdQ)||g.html.toLowerCase().includes(gdQ));
  document.getElementById("gdnav").innerHTML=
    `<input id="gdsearch" value="${gdQ.replace(/"/g,'&quot;')}" placeholder="🔎 Search the Handbook…" style="width:100%;box-sizing:border-box;margin:2px 0 8px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font-family:var(--sans);font-size:12.5px">`+
    (list.length?list.map(g=>`<a data-g="${g.id}" class="${gdSection===g.id?'on':''}"><span class="gi">${g.icon}</span><span>${g.title}</span></a>`).join(""):`<div style="font-size:12px;color:var(--faint);padding:8px">No sections match.</div>`);
  const si=document.getElementById("gdsearch");
  si.oninput=()=>{gdQ=si.value.toLowerCase();const p=si.selectionStart;renderGuide();const s2=document.getElementById("gdsearch");s2.focus();s2.setSelectionRange(p,p);};
  const g=GUIDE.find(x=>x.id===gdSection);
  document.getElementById("gdcontent").innerHTML=`<h2>${g.title}</h2>${g.html}`;
  document.querySelectorAll("#gdnav a").forEach(a=>a.onclick=()=>{gdSection=a.dataset.g;renderGuide();document.getElementById("gdcontent").scrollTop=0;});
}
function openGuide(sec){if(sec)gdSection=sec;renderGuide();document.getElementById("gd").classList.add("open");document.getElementById("gdscrim").classList.add("open");}
function closeGuide(){document.getElementById("gd").classList.remove("open");document.getElementById("gdscrim").classList.remove("open");}
document.getElementById("guideopen").onclick=()=>openGuide();
document.getElementById("gdclose").onclick=closeGuide;
document.getElementById("gdscrim").onclick=closeGuide;

}
function coachBar(l){
  if(!l.coach)return"";
  const coach=l.coach.replace("${GUIDE}",'<span class="glink" data-g="process">The Handbook</span>');
  return `<div class="coach"><div class="cface">🧭</div><div class="ct"><b>What to do:</b> ${coach}</div>${l.hint?'<button type="button" class="hint-btn" id="hintbtn">Hint</button>':''}</div>${l.hint?`<div class="hint" id="hintbox">💡 ${l.hint}</div>`:''}`;

function getAct(l){
  if(l.variants&&ST.domain&&l.variants[ST.domain])return l.variants[ST.domain];
  return l.activity;
}
function actHtml(l){

  if(a.type==="commit")return`<div class="checklist" id="cl-${a.id}">${a.items.map(it=>`<label><input type="checkbox" ${done?'checked disabled':''}> <span>${it}</span></label>`).join("")}</div>
    <button type="button" class="act-btn" id="b-${a.id}" ${done?'disabled':''}>${done?'Done ✓':'Confirm'}</button>`;
  if(a.type==="story"){

  }
  if(a.type==="triage"){

    <div class="mk-msg" id="msg-${a.id}"></div><div class="fb" id="fb-${a.id}"></div>`;

  }
  if(a.type==="journal"){const dj=ST.data[a.id]||{};
    return a.fields.map((f,i)=>`<div style="margin-bottom:13px"><label for="ja-${a.id}-${i}" style="display:block;font-weight:600;font-size:13.5px;margin-bottom:6px">${f.label}</label><textarea id="ja-${a.id}-${i}" data-j="${i}" aria-label="${f.label.replace(/"/g,'&quot;')}" placeholder="${f.ph||''}" ${done?'disabled':''}>${dj['f'+i]||''}</textarea></div>`).join("")+
    `<button type="button" class="act-btn" id="b-${a.id}" ${done?'disabled':''}>${done?'Saved ✓':'Save & continue'}</button>`+
    `<div id="jm-${a.id}">${done&&a.model?`<div class="box info" style="margin-top:12px"><span class="bh">Compare notes: a strong response usually touches on</span>${a.model}</div>`:''}</div>`;
  }
  if(a.type==="capstone"){const d=ST.data[a.id]||{};
    const asgn=(typeof CAPSTONE_ASSIGNMENT_URL!=="undefined"&&CAPSTONE_ASSIGNMENT_URL)?CAPSTONE_ASSIGNMENT_URL:"";
    return `<div class="mk-label" style="font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px">Reflect before you plan: private, for your own thinking</div>
    ${a.fields.map((f,i)=>`<div style="margin-bottom:12px"><label for="ca-${i}" style="display:block;font-weight:600;font-size:13.5px;margin-bottom:6px">${f.label}</label><textarea id="ca-${i}" data-f="${i}" aria-label="${f.label.replace(/"/g,'&quot;')}" placeholder="${f.ph}" ${ST.cap?'disabled':''}>${d['f'+i]||''}</textarea></div>`).join("")}
    <div style="font-weight:600;font-size:14px;margin:16px 0 4px">Commit to the standard you'll be QA'd against:</div>
    <div class="checklist" id="caprub">${a.rubric.map(r=>`<label><input type="checkbox" ${ST.cap?'checked disabled':''}> <span>${r}</span></label>`).join("")}</div>
    <div class="ctrans" style="border-left-color:var(--gold);background:#fff7e8;margin-top:18px"><span class="ct-h" style="color:#9a6a00">→ Your final step, in Canvas</span><div>Open the <b>Module Development Package</b> assignment. Build your module repo in Google Drive (the plan plus one built lesson, activity, and assessment), then submit the folder link. Your manager reviews it against the readiness rubric. This is your first real assignment, not a quiz.${asgn?` <a href="${asgn}" target="_blank" rel="noopener" style="font-weight:700;color:#9a6a00">Open the capstone assignment →</a>`:` <b>(Find it in this course\u2019s Assignments.)</b>`}</div></div>
    <button type="button" class="act-btn" id="b-${a.id}" ${ST.cap?'disabled':''}>${ST.cap?'Completed ✓: course done':'Save & complete the course'}</button>`;
  }
  return"";
}

/* ---------- activity wiring ---------- */
function wire(l){
  const a=getAct(l);if(!a)return;const A=a.id;const done=!!ST.done[l.id];
  const btn=document.getElementById("b-"+A);
  const hb=document.getElementById("hintbtn");
  if(hb)hb.onclick=()=>document.getElementById("hintbox").classList.toggle("show");

  if(a.type==="commit"&&!done)btn.onclick=()=>{
    const bs=[...document.querySelectorAll("#cl-"+A+" input")];
    if(!bs.every(b=>b.checked)){btn.textContent="Tick both to continue";return;}
    bs.forEach(b=>b.disabled=true);btn.disabled=true;btn.textContent="Done ✓";markDone(l.id,null);
  };

  if(a.type==="story"){
    let step=done?a.steps.length:0,wrongs=0;
    const pipeEl=document.getElementById("pipe-"+A),host=document.getElementById("story-"+A);
    function pipe(){
      pipeEl.innerHTML=a.steps.map((_,i)=>{
        const n=`<div class="pnode ${i<step?'done':(i===step?'here':'')}">${i<step?'✓':i+1}</div>`;
        return n+(i<a.steps.length-1?`<div class="pseg ${i<step?'done':''}"></div>`:'');
      }).join("");
    }
    function scene(){
      pipe();
      if(step>=a.steps.length){
        host.innerHTML="";
        if(!done){
          const perfect=wrongs===0;
          const fb=document.getElementById("fb-"+A);fb.className="fb show "+(perfect?"good":"bad");fb.textContent=perfect?a.fbGood:a.fbBad;
          markDone(l.id,a.points);
        } else {
          const fb=document.getElementById("fb-"+A);fb.className="fb show good";fb.textContent=a.fbGood;
        }
        return;
      }
      const s=a.steps[step];
      host.innerHTML=`<div class="scene"><div class="sc-tag">${s.tag}</div><div class="sc-text">${s.text}</div>
        ${s.opts.map((o,i)=>`<button type="button" class="choice" data-i="${i}">${o.t}</button>`).join("")}
        <div class="sc-fb" id="scfb-${A}"></div></div>`;
      host.querySelectorAll(".choice").forEach(c=>c.onclick=()=>{
        const o=s.opts[+c.dataset.i];const fb=document.getElementById("scfb-"+A);
        if(o.ok){c.classList.add("yes");fb.className="sc-fb show good";fb.textContent="✓ "+o.fb;
          host.querySelectorAll(".choice").forEach(x=>x.disabled=true);
          const nb=document.createElement("button");nb.className="act-btn";
          nb.textContent=step<a.steps.length-1?"Continue to the next step →":"Finish the walk →";
          fb.parentNode.appendChild(nb);nb.onclick=()=>{step++;scene();};}
        else{wrongs++;c.classList.add("no");c.disabled=true;fb.className="sc-fb show bad";fb.textContent="✗ Not that one. "+o.fb+" Pick again.";}
      });
    }
    scene();
  }

  if(a.type==="triage"){
    const host=document.getElementById("in-"+A);
    let iCur=done?a.items.length:0,right=0;
    if(done)right=a.items.length;
    function draw(){
      host.innerHTML=a.items.map((m,i)=>{
        const graded=i<iCur||done;
        const state=done?'correct':(ST.data[A+'-'+i]!=null?(ST.data[A+'-'+i]?'correct':'wrong'):'');
        return `<div class="mail ${i>iCur&&!done?'pending':''} ${graded?('graded '+state):''}" data-i="${i}">
          <div class="mh"><span class="from">${m.from}</span><span class="mtag">intake</span></div>
          <div class="subj">${m.subj}</div><div class="body">${m.body}</div>
          <div class="stamps">${a.buckets.map((b,bi)=>{
            let cls="";
            if(graded){ if(bi===m.ans)cls="st-ok"; else if(ST.data[A+'-c'+i]===bi)cls="st-no"; }
            return `<button type="button" class="${cls}" data-b="${bi}" ${graded?'disabled':''}>${b}</button>`;}).join("")}</div>
          <div class="verdict">${graded?((ST.data[A+'-c'+i]==null||ST.data[A+'-c'+i]===m.ans)?'✓ Right call. ':'✗ You stamped “'+a.buckets[ST.data[A+'-c'+i]].replace(/^..\s*/,'')+'”, correct: “'+a.buckets[m.ans].replace(/^..\s*/,'')+'”. '):''}${m.why}</div></div>`;
      }).join("");
      host.querySelectorAll(".mail").forEach(mEl=>{
        const i=+mEl.dataset.i;if(i!==iCur||done)return;
        mEl.querySelectorAll("button").forEach(b=>b.onclick=()=>{
          const ok=+b.dataset.b===a.items[i].ans;
          ST.data[A+'-c'+i]=+b.dataset.b;
          ST.data[A+'-'+i]=ok;if(ok)right++;
          try{ SCORM.logInteraction(A+".item"+i, a.buckets[+b.dataset.b].replace(/^..\s*/,''), ok, a.buckets[a.items[i].ans].replace(/^..\s*/,'')); }catch(e){}
          const justAnswered=i;iCur++;draw();
          requestAnimationFrame(()=>{const t=host.querySelector('.mail[data-i="'+justAnswered+'"]');if(t&&t.scrollIntoView)t.scrollIntoView({behavior:'smooth',block:'nearest'});});
          if(iCur>=a.items.length){
            const perfect=right===a.items.length;
            const fb=document.getElementById("fb-"+A);fb.className="fb show "+(perfect?"good":"bad");fb.textContent=perfect?a.fbGood:a.fbBad;
            markDone(l.id,a.points);
          }
        });
      });
    }
    draw();
    if(done){const fb=document.getElementById("fb-"+A);fb.className="fb show good";fb.textContent=a.fbGood;}
  }

  if(a.type==="repo"){
    const treeEl=document.getElementById("tree-"+A);
    const doneGoals=ST.data[A+'-goals']||(done?repoGoals(a).map((_,i)=>i):[]);
    let wrongs=ST.data[A+'-w']||0;
    function tree(){
      let h="";
      for(const f in a.folders){
        h+=`<div class="tnode"><span class="tf">📁 ${f}/</span></div>`;
        a.folders[f].forEach(x=>h+=`<div class="tnode">&nbsp;&nbsp;📄 ${x}</div>`);
        repoGoals(a).forEach((g,i)=>{if(g.folder===f&&doneGoals.includes(i))h+=`<div class="tnode">&nbsp;&nbsp;📄 <span class="new">${g.label}</span></div>`;});
      }
      treeEl.innerHTML=h;
      document.querySelectorAll(".goal").forEach(g=>{g.classList.toggle("done",doneGoals.includes(+g.dataset.i));});
    }
    tree();
    if(done)return;
    const norm=s=>s.toLowerCase().replace(/[\u2013, -]+/g," ").replace(/\s+/g," ").trim().replace(/^r /,"r-");
    btn.onclick=()=>{
      const inp=document.getElementById("mk-"+A),msg=document.getElementById("msg-"+A);
      const v=norm(inp.value);if(!v)return;
      const gi=repoGoals(a).findIndex((g,i)=>!doneGoals.includes(i)&&(v===norm(g.ans)||v.startsWith(norm(g.ans))));
      if(gi>=0){
        doneGoals.push(gi);ST.data[A+'-goals']=doneGoals;
        msg.className="mk-msg okc";msg.textContent="✓ Created "+repoGoals(a)[gi].label+" → "+repoGoals(a)[gi].folder+"/";
        inp.value="";tree();persist();
        if(doneGoals.length===repoGoals(a).length){
          const perfect=wrongs===0;
          const fb=document.getElementById("fb-"+A);fb.className="fb show "+(perfect?"good":"bad");fb.textContent=perfect?a.fbGood:a.fbBad;
          inp.disabled=true;btn.disabled=true;
          markDone(l.id,a.points);
        }
      } else {
        wrongs++;ST.data[A+'-w']=wrongs;
        msg.className="mk-msg err";
        msg.textContent="✗ No pending file matches that name. Check the prefix (GLAB / R-GLAB / ALAB / Quiz / KBA / MBP) and whether it's lesson-level (301.1) or module-level (301).";
      }
    };
    document.getElementById("mk-"+A).addEventListener("keydown",e=>{if(e.key==="Enter")btn.select();});
  }

  if(a.type==="track"){
    document.querySelectorAll("#tp-"+A+" .tcard").forEach(b=>b.onclick=()=>{
      ST.track=b.dataset.t; remember("track",CASES[b.dataset.t].domain);
      markDone(l.id,a.points);
      const _m=document.querySelector("main"); render._sy=_m?_m.scrollTop:0; render(true);
    });
  }
  if(a.type==="sort"){
    const pool=document.getElementById("sp-"+A),bwrap=document.getElementById("sb-"+A),msg=document.getElementById("msg-"+A);
    let placed=ST.data[A+'-p']||(done?a.cards.map((c,i)=>i):[]);
    let wrongs=ST.data[A+'-w']||0,selCard=null;
    function draw(){
      pool.innerHTML=a.cards.map((c,i)=>placed.includes(i)?'':`<div class="scard ${selCard===i?'sel':''}" draggable="${!done}" data-c="${i}" tabindex="0" role="button" aria-label="${c.t}">${c.t}</div>`).join("");
      bwrap.querySelectorAll(".sbucket").forEach(bEl=>{
        const bi=+bEl.dataset.b;
        bEl.querySelector(".sb-slot").innerHTML=a.cards.map((c,i)=>placed.includes(i)&&c.k===a.buckets[bi].k?`<span class="placed">✓ ${c.t}</span>`:'').join("");
      });
      if(done)return;
      pool.querySelectorAll(".scard").forEach(el=>{
        el.ondragstart=e=>{e.dataTransfer.setData("text/plain",el.dataset.c);};
        el.onclick=()=>{selCard=(selCard===+el.dataset.c?null:+el.dataset.c);draw();};
        el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();el.onclick();}};
      });
      bwrap.querySelectorAll(".sbucket").forEach(bEl=>{
        const bi=+bEl.dataset.b;
        bEl.ondragover=e=>{e.preventDefault();bEl.classList.add("over");};
        bEl.ondragleave=()=>bEl.classList.remove("over");
        bEl.ondrop=e=>{e.preventDefault();bEl.classList.remove("over");attempt(+e.dataTransfer.getData("text/plain"),bi,bEl);};
        bEl.onclick=()=>{if(selCard!=null)attempt(selCard,bi,bEl);};
      });
    }
    function attempt(ci,bi,bEl){
      if(ci==null||isNaN(ci)||placed.includes(ci))return;
      if(a.cards[ci].k===a.buckets[bi].k){
        placed.push(ci);selCard=null;ST.data[A+'-p']=placed;persist();
        msg.className="mk-msg okc";msg.textContent='✓ "'+a.cards[ci].t+'" filed under '+a.buckets[bi].label+'.';
        draw();
        if(placed.length===a.cards.length){
          const perfect=wrongs===0;
          const fb=document.getElementById("fb-"+A);fb.className="fb show "+(perfect?"good":"bad");fb.textContent=perfect?a.fbGood:a.fbBad;
          markDone(l.id,a.points);
        }
      } else {
        wrongs++;ST.data[A+'-w']=wrongs;selCard=null;
        bEl.classList.add("no");setTimeout(()=>bEl.classList.remove("no"),450);
        msg.className="mk-msg err";msg.textContent='✗ "'+a.cards[ci].t+'" isn\u2019t produced at '+a.buckets[bi].label+': think about which stage creates it.';
        draw();
      }
    }
    draw();
    if(done){const fb=document.getElementById("fb-"+A);fb.className="fb show good";fb.textContent=a.fbGood;}
  }

  if(a.type==="day"){
    let sched=ST.data[A]||[];
    if(done&&!sched.length)sched=[0,3,4,6,8].map(i=>i).filter(i=>i<a.palette.length);
    const slotsEl=document.getElementById("slots-"+A);
    function stats(){
      let tot=0,act=0;const met={};
      sched.forEach(i=>{const p=a.palette[i];tot+=p.min;if(p.act)act+=p.min;if(p.req)met[p.req]=true;});
      met.t240=tot===a.total;met.a75=tot>0&&(act/tot)>=0.75;
      return{tot,act,met,pct:tot?Math.round(act/tot*100):0};
    }
    function draw(){
      slotsEl.innerHTML=sched.length?sched.map((pi,si)=>{const p=a.palette[pi];
        return `<div class="slot ${p.act?'':'pas'}"><span>${p.t} <small>${p.min}m · ${p.act?'activated':'passive'}</small></span>${done?'':`<button type="button" class="rm" data-s="${si}">×</button>`}</div>`;}).join("")
        :`<div style="font-size:12.5px;color:var(--faint);padding:10px 4px">Empty: select blocks in the palette to build the day.</div>`;
      const s=stats();
      const am=document.getElementById("am-"+A);am.style.width=s.pct+"%";am.textContent=s.pct+"%";
      document.getElementById("tm-"+A).textContent=s.tot+" / "+a.total+" min";
      document.querySelectorAll("#rq-"+A+" .req").forEach(r=>r.classList.toggle("met",!!s.met[r.dataset.k]));
      if(!done)slotsEl.querySelectorAll(".rm").forEach(b=>b.onclick=()=>{sched.splice(+b.dataset.s,1);ST.data[A]=sched;draw();});
    }
    draw();
    if(done)return;
    const schedBox=slotsEl.closest(".sched");
    function tryAdd(pi){
      const s=stats();const add=a.palette[pi];
      if(s.tot+add.min>a.total){const fb=document.getElementById("fb-"+A);fb.className="fb show bad";fb.textContent="That block would overflow the 240-minute day, remove something first.";return;}
      document.getElementById("fb-"+A).className="fb";
      sched.push(pi);ST.data[A]=sched;draw();
    }
    schedBox.ondragover=e=>{e.preventDefault();schedBox.style.borderColor="var(--indigo)";};
    schedBox.ondragleave=()=>{schedBox.style.borderColor="";};
    schedBox.ondrop=e=>{e.preventDefault();schedBox.style.borderColor="";const pi=+e.dataTransfer.getData("text/plain");if(!isNaN(pi))tryAdd(pi);};
    document.querySelectorAll(".pal-item").forEach(p=>{
      p.setAttribute("draggable","true");
      p.ondragstart=e=>{e.dataTransfer.setData("text/plain",p.dataset.i);};
    });
    document.querySelectorAll(".pal-item").forEach(p=>p.onclick=()=>tryAdd(+p.dataset.i));
    btn.onclick=()=>{
      const s=stats();
      const fails=a.reqs.filter(r=>!s.met[r.k]).map(r=>r.label);
      const fb=document.getElementById("fb-"+A);
      if(fails.length){fb.className="fb show bad";fb.textContent="Not yet, still missing: "+fails.join(", ")+". "+a.fbBad;
        markDoneSoft();return;}
      fb.className="fb show good";fb.textContent=a.fbGood;
      btn.disabled=true;markDone(l.id,a.points);
      function markDoneSoft(){/* allow retry, partial credit only on success-with-history */}
    };
  }

  if(a.type==="fix"){
    let wrongs=0;const fixedSet=new Set(done?a.sents.map((s,i)=>s.bad?i:null).filter(x=>x!=null):[]);
    const docEl=document.getElementById("doc-"+A),panel=document.getElementById("fp-"+A),fq=document.getElementById("fq-"+A),fo=document.getElementById("fo-"+A),fm=document.getElementById("fm-"+A),fc=document.getElementById("fc-"+A);
    let active=null;
    function draw(){
      docEl.innerHTML=a.sents.map((s,i)=>{
        const txt=fixedSet.has(i)?(s.fixed!==undefined?s.fixed:s.t):s.t;
        if(fixedSet.has(i)&&txt==="")return"";
        return `<span class="sent ${fixedSet.has(i)?'fixed':''} ${active===i?'active':''}" data-i="${i}">${txt}</span>`;
      }).join("");
      const badTotal=a.sents.filter(s=>s.bad).length;
      fc.textContent="Fixed "+fixedSet.size+" of "+badTotal+" problems"+(wrongs?" · "+wrongs+" missteps":"");
      if(!done)docEl.querySelectorAll(".sent").forEach(el=>el.onclick=()=>{
        const i=+el.dataset.i;if(fixedSet.has(i))return;
        const s=a.sents[i];
        if(!s.bad){wrongs++;fm.className="fix-msg err";fm.textContent="That sentence is fine, plain, accurate, on-objective. Look again.";draw();return;}
        active=i;draw();
        panel.classList.add("show");fq.innerHTML="You flagged: \u201C"+s.t.trim()+"\u201D. Pick the correct repair:";
        fo.innerHTML=s.fixes.map((f,fi)=>`<button type="button" class="fixopt" data-f="${fi}">${f.t}</button>`).join("");
        fm.textContent="";
        fo.querySelectorAll(".fixopt").forEach(b=>b.onclick=()=>{
          const f=s.fixes[+b.dataset.f];
          if(f.ok){fixedSet.add(i);active=null;panel.classList.remove("show");fm.textContent="";
            const note=document.getElementById("fb-"+A);note.className="fb show good";note.textContent="✓ "+f.fb;
            draw();
            if(fixedSet.size===a.sents.filter(x=>x.bad).length){
              const perfect=wrongs===0;
              note.className="fb show "+(perfect?"good":"bad");note.textContent=perfect?a.fbGood:a.fbBad;
              markDone(l.id,a.points);
            }
          } else {wrongs++;fm.className="fix-msg err";fm.textContent=f.fb;fc.textContent="Fixed "+fixedSet.size+" · "+wrongs+" missteps";}
        });
      });
    }
    draw();
    if(done){const fb=document.getElementById("fb-"+A);fb.className="fb show good";fb.textContent=a.fbGood;}
  }

  if(a.type==="review"){
    const host=document.getElementById("rv-"+A);
    let cur=done?a.items.length:0,wrongs=0,itemTries=0;
    function finish(){
      const perfect=wrongs===0;
      const fb=document.getElementById("fb-"+A);fb.className="fb show "+(perfect?"good":"bad");fb.textContent=perfect?a.fbGood:a.fbBad;
      if(!done)markDone(l.id,a.points);
    }
    function scrollToItem(idx){
      // keep the learner where they are: reveal the answer they just gave, then bring the next item
      // into view smoothly, never snap the page to the top.
      requestAnimationFrame(()=>{
        const target = host.querySelector('.mail[data-i="'+(idx)+'"]');
        if(target && target.scrollIntoView){ target.scrollIntoView({behavior:'smooth', block:'nearest'}); }
      });
    }
    function draw(){
      host.innerHTML=a.items.map((it,i)=>{
        const graded=i<cur||done;
        const active=i===cur&&!done;
        const tr=ST.data[A+'-t'+i];
        const perf=graded?((tr==null||tr===0)?'correct':'wrong'):'';
        const pre=graded?((tr==null||tr===0)?'✓ First try. ':'↺ Took '+(tr+1)+' attempts, worth a re-read. '):'';
        return `<div class="mail ${i>cur&&!done?'pending':''} ${graded?'graded '+perf:''}" data-i="${i}">
          <div class="mh"><span class="from">Item ${i+1} of ${a.items.length}</span><span class="mtag">${a.queueTag||'review queue'}</span></div>
          <div class="body" style="font-style:normal;color:var(--text)">${it.content}</div>
          ${active?`<div class="stamps"><button type="button" data-v="ok">✓ Approve</button><button type="button" data-v="bad">✗ Send back</button></div>
            <div id="rr-${A}" style="margin-top:9px"></div><div class="fix-msg" id="rm-${A}"></div>`:''}
          <div class="verdict" style="color:${!graded?'inherit':(perf==='correct'?'#186b52':'#9a2f2f')}"><b>${pre}</b>${graded?it.why:''}</div></div>`;
      }).join("");
      if(done||cur>=a.items.length)return;
      const it=a.items[cur];
      const card=host.querySelector('.mail[data-i="'+cur+'"]');
      const msg=document.getElementById("rm-"+A),rr=document.getElementById("rr-"+A);
      card.querySelectorAll(".stamps button").forEach(b=>b.onclick=()=>{
        const v=b.dataset.v;
        const advance=()=>{ST.data[A+'-t'+cur]=itemTries;try{SCORM.logInteraction(A+".item"+cur,(it.good?'approve':'sendback')+' ('+(itemTries+1)+' tries)',itemTries===0,it.good?'approve':'sendback');}catch(e){}const justAnswered=cur;itemTries=0;cur++;draw();scrollToItem(justAnswered);if(cur>=a.items.length)finish();};
        if(v==="ok"){
          if(it.good){advance();}
          else{wrongs++;itemTries++;msg.className="fix-msg err";msg.textContent="✗ Look again: something in this item violates the standard.";}
        } else {
          if(it.good){wrongs++;itemTries++;msg.className="fix-msg err";msg.textContent="✗ This one actually meets the standard: re-read it against the rules before stamping.";rr.innerHTML="";}
          else{
            msg.textContent="";
            rr.innerHTML=`<div style="font-size:12.5px;color:var(--muted);margin-bottom:6px">Right, it goes back. Now name the violation:</div>`+
              it.reasons.map((r,ri)=>`<button type="button" class="fixopt" data-r="${ri}">${r.t}</button>`).join("");
            rr.querySelectorAll(".fixopt").forEach(rb=>rb.onclick=()=>{
              const r=it.reasons[+rb.dataset.r];
              if(r.ok){advance();}
              else{wrongs++;itemTries++;msg.className="fix-msg err";msg.textContent="✗ "+r.fb;}
            });
          }
        }
      });
    }
    draw();
    if(done){const fb=document.getElementById("fb-"+A);fb.className="fb show good";fb.textContent=a.fbGood;}
  }

  if(a.type==="rubric"){
    const dims=[...document.querySelectorAll(".rb-dim")];
    if(done){dims.forEach(d=>{const i=+d.dataset.i;d.classList.add("graded","correct");d.querySelectorAll("button").forEach(b=>{b.disabled=true;if(+b.dataset.n===a.dims[i].ans)b.classList.add("pick");});});return;}
    dims.forEach(d=>d.querySelectorAll("button").forEach(b=>b.onclick=()=>{
      d.querySelectorAll("button").forEach(x=>x.classList.remove("pick"));b.classList.add("pick");d.dataset.pick=b.dataset.n;}));
    btn.onclick=()=>{
      if(!dims.every(d=>d.dataset.pick!=null)){const fb=document.getElementById("fb-"+A);fb.className="fb show bad";fb.textContent="Score all three dimensions first.";return;}
      let right=0;
      dims.forEach(d=>{const i=+d.dataset.i,ok=+d.dataset.pick===a.dims[i].ans;
        d.classList.add("graded",ok?"correct":"wrong");if(ok)right++;d.querySelectorAll("button").forEach(x=>x.disabled=true);});
      const perfect=right===dims.length;
      const fb=document.getElementById("fb-"+A);fb.className="fb show "+(perfect?"good":"bad");fb.textContent=perfect?a.fbGood:a.fbBad;
      btn.disabled=true;markDone(l.id,a.points);
    };
  }

  if(a.type==="journal"&&!done){
    const dj=ST.data[A]||{};
    const jhost=document.getElementById("content")||document;
    jhost.querySelectorAll("[data-j]").forEach(t=>t.oninput=()=>{dj['f'+t.dataset.j]=t.value;ST.data[A]=dj;persist();});
    btn.onclick=()=>{
      const fs=[...jhost.querySelectorAll("[data-j]")];
      if(!fs.every(t=>t.value.trim().length>=8)){btn.textContent="A sentence or two per box, then save";return;}
      fs.forEach(t=>t.disabled=true);btn.disabled=true;btn.textContent="Saved ✓";markDone(l.id,null);
      if(a.model){document.getElementById("jm-"+A).innerHTML=`<div class="box info" style="margin-top:12px"><span class="bh">Compare notes: a strong response usually touches on</span>${a.model}</div>`;}
    };
  }
  if(a.type==="capstone"&&!ST.cap){
    const d=ST.data[A]||{};
    document.querySelectorAll("[data-f]").forEach(t=>t.oninput=()=>{d['f'+t.dataset.f]=t.value;ST.data[A]=d;});
    btn.onclick=()=>{
      const rub=[...document.querySelectorAll("#caprub input")];
      const fields=[...document.querySelectorAll("[data-f]")];
      if(!fields.every(t=>t.value.trim().length>10)){btn.textContent="Fill in all three plan fields to submit";return;}
      if(!rub.every(b=>b.checked)){btn.textContent="Tick every standard to submit";return;}
      rub.forEach(b=>b.disabled=true);fields.forEach(t=>t.disabled=true);
      btn.disabled=true;btn.textContent="Submitted ✓, course complete";
      ST.cap=true;ST.done[l.id]=true;SCORM.complete();persist();renderLessonNav();refreshNav();
      let e=0,av=0;FLAT.forEach(x=>{if(x.activity&&x.activity.points!=null&&ST.done[x.id]){av+=x.activity.points;e+=(ST.earned[x.activity.id]||0);}});
      const done_div=document.createElement("div");done_div.className="result "+(av&&e>=av*0.85?"full":"part");
      done_div.innerHTML='<span class="star">🎓</span><span><b>Course complete</b>, and marked complete in Canvas. There\u2019s no grade here; this was always for your learning. Take your finished Brief to your manager or mentor. That review is your first real assignment. The 📘 Handbook stays with you from here.</span>';
      btn.parentNode.appendChild(done_div);
    };
  }
}


/* ---------- render ---------- */
function refreshNav(){
  const l=FLAT.find(x=>x.id===ST.current),i=idx(l.id),next=FLAT[i+1];
  const gate=PREVIEW?false:((l.activity&&!ST.done[l.id])||(l.demo&&ST.data['dm-'+l.id]!=='done'&&!ST.done[l.id]));
  const nb=document.getElementById("nextb");if(!nb)return;
  nb.disabled=!next||gate;
  const ln=document.getElementById("locknote");if(ln)ln.style.display=gate?"block":"none";
  if(next&&!gate)nb.onclick=()=>{ST.current=next.id;render();};
}
function render(keepScroll){
  const l=FLAT.find(x=>x.id===ST.current),i=idx(l.id);
  const prev=FLAT[i-1],next=FLAT[i+1];
  let h=`<div class="crumb">${l.crumb}${l.mins?` <span style="margin-left:6px;background:#e9eef4;color:#5b6b7a;border-radius:10px;padding:1px 9px;font-size:9.5px;letter-spacing:.05em">≈ ${l.mins} MIN</span>`:``}</div><h1>${l.title}</h1><div class="lead">${typeof l.lead==="function"?l.lead():l.lead}</div>${l.frame?frame(typeof l.frame==='function'?l.frame():l.frame):''}${l.brief?briefHtml(typeof l.brief==='function'?l.brief():l.brief):''}${(typeof l.html==='function'?l.html():(l.html||''))}${coachBar(l)}`;
  if(l.prompt)h+=`<div class="prompt"><div class="prompt-h"><span class="pl">${l.prompt.label}</span><button type="button" class="copy" id="cpy">Copy</button></div><pre>${l.prompt.text.replace(/\[([^\]]+)\]/g,'<span class="v">[$1]</span>')}</pre></div>`;
  const _dmv=ST.data['dm-'+l.id];
  const dmDone=PREVIEW||!l.demo||_dmv==='done'||ST.done[l.id];
  if(l.demo&&!dmDone){
    const k=(typeof _dmv==='number')?_dmv:0;
    h+=`<div class="demo"><div class="dh3"><span class="dt">🎬 Watch one first: a worked example</span><button type="button" class="dskip" id="dmskip">Skip: I’ve got it</button></div>
      <div class="deg">${l.demo.eg}</div>
      ${l.demo.steps.slice(0,k).map((s,i)=>`<div class="dstep"><span class="dnum">${i+1}</span><span>${s}</span></div>`).join("")}
      <button type="button" class="act-btn" id="dmnext">${k===0?'Show me the thinking →':(k<l.demo.steps.length?'Next →':'Your turn →')}</button></div>`;
  } else {
    if(l.demo){
      h+=`<button type="button" class="demo-re" id="dmre">🎬 ${ST.data['dm-re-'+l.id]?'Hide':'Rewatch'} the worked example</button>`;
      if(ST.data['dm-re-'+l.id])h+=`<div class="demo"><div class="deg">${l.demo.eg}</div>${l.demo.steps.map((s,i)=>`<div class="dstep"><span class="dnum">${i+1}</span><span>${s}</span></div>`).join("")}</div>`;
    }
    h+=actHtml(l);
  }
  if(l.transition&&ST.done[l.id])h+=transition(typeof l.transition==='function'?l.transition():l.transition);
  h+=`<div class="nav-btns"><button type="button" class="btn" id="prevb" ${prev?'':'disabled'}>← Back</button>
      <button type="button" class="btn primary" id="nextb">${next?'Next →':'Finish'}</button></div>
      <div class="locknote" id="locknote" style="display:none">Complete the activity to continue.</div>`;
  document.getElementById("content").innerHTML=h;
  document.body.dataset.day=String(l._day||1);
  const _ds=document.getElementById("dashslot"); if(_ds)_ds.outerHTML=dashHtml();
  // cross-package safety: Day 2-4 opened without a primary set
  if((DAY==="2"||DAY==="3"||DAY==="4") && !ST.track){
    const host=document.getElementById("content");
    const bar=document.createElement("div");
    bar.className="box rule"; bar.style.marginBottom="14px";
    bar.innerHTML='<span class="bh">Confirm your project to continue</span><p class="tight">This unit builds on the primary project you chose in Unit 1. Confirm it so your work stays consistent:</p><div class="track-pick" id="reconf">'+CASE_ORDER.map(id=>`<button type="button" class="tcard" data-t="${id}"><span class="tcd">${CASES[id].tag}</span><div class="tcp">${CASES[id].domain}</div></button>`).join("")+'</div>';
    host.insertBefore(bar, host.firstChild);
    bar.querySelectorAll("#reconf .tcard").forEach(b=>b.onclick=()=>{ST.track=b.dataset.t;remember("track",CASES[b.dataset.t].domain);persist();const _m=document.querySelector("main");render._sy=_m?_m.scrollTop:0;render(true);});
  }
  { const _m=document.querySelector("main"); if(keepScroll && _m){ const _y=render._sy||0; requestAnimationFrame(()=>{ _m.scrollTop=_y; }); } else if(_m){ _m.scrollTop=0; } }
  if(l.prompt)document.getElementById("cpy").onclick=function(){navigator.clipboard.writeText(l.prompt.text).then(()=>{this.textContent="Copied ✓";this.classList.add("ok");setTimeout(()=>{this.textContent="Copy";this.classList.remove("ok");},1500);});};
  document.querySelectorAll(".glink").forEach(g=>g.onclick=()=>openGuide(g.dataset.g));
  document.querySelectorAll("#dompick button").forEach(b=>{
    b.classList.toggle("pick",ST.domain===b.dataset.d);
    b.onclick=()=>{ST.domain=b.dataset.d;persist();render();};
  });
  const dmn=document.getElementById("dmnext");
  if(dmn)dmn.onclick=()=>{
    const v=ST.data['dm-'+l.id];const k=(typeof v==='number')?v:0;
    const _m=document.querySelector("main"); render._sy=_m?_m.scrollTop:0;
    ST.data['dm-'+l.id]=k<l.demo.steps.length?k+1:'done';persist();render(true);
  };
  const dms=document.getElementById("dmskip");
  if(dms)dms.onclick=()=>{const _m=document.querySelector("main"); render._sy=_m?_m.scrollTop:0; ST.data['dm-'+l.id]='done';persist();render(true);};
  const dmr=document.getElementById("dmre");
  if(dmr)dmr.onclick=()=>{ST.data['dm-re-'+l.id]=!ST.data['dm-re-'+l.id];render();};
  if(dmDone){
    wire(l);
    paintResult(l);
  }
  if(prev)document.getElementById("prevb").onclick=()=>{ST.current=prev.id;render();};
  updateRing();refreshNav();
}


/* ---------- interactive diagrams ---------- */
function diagTap(t){
  const hot=t.closest?t.closest('.hot'):null;if(!hot)return;
  const diag=hot.closest('.diag, .pwrap');if(!diag)return;
  diag.querySelectorAll('.hot.sel').forEach(x=>x.classList.remove('sel'));
  hot.classList.add('sel');
  const cap=diag.querySelector('.dcap');
  if(cap)cap.innerHTML='<b>'+(hot.dataset.name||'')+'</b>: '+(hot.dataset.info||'');
}
document.addEventListener('click',e=>diagTap(e.target));
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('hot')){e.preventDefault();diagTap(e.target);}
});

window.addEventListener("load",()=>{SCORM.init();load();render();renderGuide();
  if(SCORM.storageAvailable===false){
    const c=document.getElementById("content");
    if(c){const w=document.createElement("div");w.className="box rule";w.style.marginBottom="14px";
      w.innerHTML='<span class="bh">Progress will not save</span><p class="tight">This browser is blocking local storage, so your place in the course cannot be remembered. You can still work through everything, but closing the tab will lose your progress. Opening the course in a normal (non-private) window usually fixes it.</p>';
      c.insertBefore(w,c.firstChild);}
  }if(PREVIEW){const b=document.getElementById("pvbadge");if(b)b.style.display="block";}
  // secret admin trigger: 5 quick clicks on the course title toggles preview (invisible to learners)
  try{
    const t=document.querySelector(".title"); if(t){ t.style.cursor="default"; let n=0,last=0;
      t.addEventListener("click",()=>{ const now=Date.now(); n=(now-last<600)?n+1:1; last=now; if(n>=5){ n=0; togglePreview(); } });
    }
  }catch(e){}
});
window.addEventListener("pagehide",()=>{persist();SCORM.finish();});
window.addEventListener("beforeunload",()=>{persist();SCORM.finish();});
</script>

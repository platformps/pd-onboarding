<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 2: Designing Learning · Per Scholas</title>
<script src="storage.js"></script>
<script src="guide.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12283f; --ink2:#2a4763;
    --indigo:#1d5fa8; --indigo-d:#164a85; --indigo-bg:#e3edf8;
    --paper:#faf7f2; --card:#fff; --line:#e8e1d6; --line2:#f3eee6;
    --text:#1c2b3a; --muted:#5b6b7a; --faint:#8fa0ae;
    --ok:#1f9d76; --ok-bg:#e7f4ee; --bad:#cf4747; --bad-bg:#fbe9e9;
    --gold:#7d8ea1; --gold-bg:#e9eef4;
    --disp:'Bricolage Grotesque',system-ui,sans-serif; --sans:'Atkinson Hyperlegible',system-ui,sans-serif; --mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--paper);color:var(--text);font-family:var(--sans);font-size:14.5px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow:hidden}
  .app{display:flex;flex-direction:column;height:100%}

  /* compact header — every pixel of height matters inside the Canvas iframe */
  .topbar{background:var(--ink);color:#fff;padding:0 14px;height:48px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none}
  .t-l{display:flex;align-items:center;gap:10px;min-width:0}
  .menu-btn,.guide-btn{font-family:var(--sans);font-size:12.5px;font-weight:500;color:#fff;background:#1d3a56;border:1px solid #2c517a;border-radius:7px;padding:7px 12px;cursor:pointer;white-space:nowrap}
  .menu-btn:hover,.guide-btn:hover{background:#27496e}
  .title{font-family:var(--disp);font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .t-r{display:flex;align-items:center;gap:10px;flex:none}
  .save-dot{font-family:var(--mono);font-size:9.5px;color:#7fa3c4}
  .ring{--p:0;width:32px;height:32px;border-radius:50%;background:conic-gradient(var(--indigo) calc(var(--p)*1%), #23425f 0);display:flex;align-items:center;justify-content:center;flex:none}
  .ring i{width:24px;height:24px;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:8.5px;font-style:normal}

  /* scrolling content area */
  main{flex:1;overflow-y:auto;overscroll-behavior:contain}
  .content{max-width:860px;margin:0 auto;padding:22px 26px 70px}
  .crumb{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--indigo);margin-bottom:7px}
  h1{font-family:var(--disp);font-weight:600;font-size:23px;line-height:1.18;letter-spacing:-.015em;margin-bottom:6px}
  .lead{font-size:15px;color:var(--ink2);margin-bottom:16px}
  .content p{margin-bottom:12px}
  .content p.tight{margin-bottom:5px}
  strong{font-weight:600;color:var(--ink)}
  .mono{font-family:var(--mono);font-size:12px;background:#eeeef6;color:#1c2b3a;padding:1px 6px;border-radius:4px}
  .glink{color:var(--indigo);font-weight:500;cursor:pointer;border-bottom:1.5px dashed #b9baf0}

  /* coach bar — beginners always know what to do */
  .coach{display:flex;gap:11px;background:var(--indigo-bg);border:1px solid #d8d9f5;border-radius:11px;padding:12px 15px;margin:16px 0 14px;align-items:flex-start}
  .coach .cface{font-size:19px;flex:none;line-height:1.2}
  .coach .ct{font-size:13.5px;color:var(--ink2)}
  .coach .ct b{color:var(--indigo-d);font-weight:600}
  .hint-btn{font-size:12px;color:var(--indigo);background:none;border:1.5px solid #c9caf1;border-radius:7px;padding:5px 11px;cursor:pointer;margin-left:auto;flex:none}
  .hint{display:none;background:#eaf2fb;border-radius:9px;padding:10px 14px;font-size:13px;color:#35577d;margin:-4px 0 14px}
  .hint.show{display:block}

  .box{border-radius:10px;padding:13px 16px;margin:14px 0;font-size:13.5px}
  .box .bh{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;margin-bottom:5px;display:block}
  .box.rule{background:#12283f;color:#e8f0f9} .box.rule .bh{color:#8fc1f7}
  .box.info{background:var(--indigo-bg)} .box.info .bh{color:var(--indigo-d)}

  .fb{border-radius:9px;padding:11px 14px;margin-top:12px;font-size:13.5px;display:none}
  .fb.show{display:block}
  .fb.good{background:var(--ok-bg);color:#186b52}
  .fb.bad{background:var(--bad-bg);color:#9a2f2f}
  .act-btn{font-family:var(--sans);font-size:13.5px;font-weight:500;background:var(--indigo);color:#fff;border:none;border-radius:9px;padding:10px 19px;cursor:pointer;margin-top:12px}
  .act-btn:hover{background:var(--indigo-d)}
  .act-btn:disabled{background:#a9c6e8;cursor:default}
  .act-btn.ghost{background:none;color:var(--indigo);border:1.5px solid var(--line)}

  /* ============ STORY (pipeline walk) ============ */
  .pipe{display:flex;align-items:center;gap:0;margin:6px 0 16px;flex-wrap:wrap}
  .pnode{width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10.5px;color:var(--faint);flex:none}
  .pnode.done{background:var(--ok);border-color:var(--ok);color:#fff}
  .pnode.here{border-color:var(--indigo);color:var(--indigo);box-shadow:0 0 0 3px var(--indigo-bg)}
  .pseg{height:2px;width:22px;background:var(--line);flex:none}
  .pseg.done{background:var(--ok)}
  .scene{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:17px 19px}
  .scene .sc-tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:7px}
  .scene .sc-text{font-size:14.5px;margin-bottom:13px}
  .choice{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:11px 14px;margin-bottom:8px;cursor:pointer;font-family:var(--sans);font-size:13.5px;color:var(--text)}
  .choice:hover{border-color:#a9c6e8}
  .choice.no{border-color:var(--bad);background:var(--bad-bg);cursor:default}
  .choice.yes{border-color:var(--ok);background:var(--ok-bg)}
  .sc-fb{font-size:13px;border-radius:8px;padding:10px 13px;margin-top:4px;display:none}
  .sc-fb.show{display:block}
  .sc-fb.good{background:var(--ok-bg);color:#186b52}
  .sc-fb.bad{background:var(--bad-bg);color:#9a2f2f}

  /* ============ TRIAGE (inbox) ============ */
  .inbox{display:grid;grid-template-columns:1fr;gap:10px}
  .mail{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:14px 16px}
  .mail .mh{display:flex;justify-content:space-between;gap:10px;margin-bottom:4px}
  .mail .from{font-weight:600;font-size:13px}
  .mail .mtag{font-family:var(--mono);font-size:9.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
  .mail .subj{font-size:13.5px;color:var(--ink2);margin-bottom:6px}
  .mail .body{font-size:13px;color:var(--muted);margin-bottom:11px}
  .stamps{display:flex;gap:7px;flex-wrap:wrap}
  .stamps button{font-size:12px;border:1.5px solid var(--line);background:#fff;border-radius:7px;padding:7px 13px;cursor:pointer;font-family:var(--sans)}
  .stamps button:hover{border-color:var(--indigo);color:var(--indigo)}
  .mail.correct{border-color:var(--ok);background:var(--ok-bg)}
  .mail.wrong{border-color:var(--bad);background:var(--bad-bg)}
  .mail .verdict{font-size:12.5px;margin-top:9px;display:none}
  .mail.graded .verdict{display:block}
  .mail.correct .verdict{color:#186b52}
  .mail.wrong .verdict{color:#9a2f2f}
  .mail.pending{opacity:.35;pointer-events:none}

  /* ============ REPO BUILDER ============ */
  .repo-wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:4px}
  .goals{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:14px 16px}
  .goals h4,.tree h4{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
  .goal{display:flex;gap:9px;align-items:flex-start;padding:6px 0;font-size:13px}
  .goal .gk{width:15px;height:15px;border:1.5px solid var(--line);border-radius:4px;flex:none;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff}
  .goal.done .gk{background:var(--ok);border-color:var(--ok)}
  .goal.done span{color:var(--muted);text-decoration:line-through}
  .tree{background:var(--ink);border-radius:11px;padding:14px 16px;color:#e9eaf8}
  .tree h4{color:#9fc0da}
  .tnode{font-family:var(--mono);font-size:12px;line-height:1.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tnode .tf{color:#7fa3c4}
  .tnode .new{color:#7fe0c0}
  .mkfile{display:flex;gap:8px;margin-top:12px}
  .mkfile input{flex:1;border:1.5px solid var(--line);border-radius:9px;padding:10px 13px;font-family:var(--mono);font-size:13px}
  .mkfile input:focus{outline:none;border-color:var(--indigo)}
  .mkfile button{font-size:13px;font-weight:500;background:var(--indigo);color:#fff;border:none;border-radius:9px;padding:0 16px;cursor:pointer}
  .mk-msg{font-size:12.5px;margin-top:7px;min-height:18px}
  .mk-msg.err{color:var(--bad)} .mk-msg.okc{color:var(--ok)}

  /* ============ DAY DESIGNER ============ */
  .day-wrap{display:grid;grid-template-columns:220px 1fr;gap:14px}
  .palette{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px}
  .palette h4,.sched h4{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin-bottom:9px}
  .pal-item{border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:7px;font-size:12.5px;cursor:pointer;background:#fff}
  .pal-item:hover{border-color:var(--indigo)}
  .pal-item small{display:block;font-family:var(--mono);font-size:10px;color:var(--faint)}
  .pal-item.pas small{color:var(--gold)}
  .sched{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px;min-height:180px}
  .slot{display:flex;justify-content:space-between;align-items:center;border:1.5px solid var(--line2);background:var(--paper);border-radius:8px;padding:8px 11px;margin-bottom:6px;font-size:12.5px}
  .slot small{font-family:var(--mono);font-size:10px;color:var(--faint)}
  .slot .rm{border:none;background:none;color:var(--bad);cursor:pointer;font-size:15px;line-height:1}
  .slot.pas{background:#e9eef4;border-color:#d6dde6}
  .day-meters{margin-top:12px}
  .meter-bar{height:20px;background:var(--line2);border-radius:6px;overflow:hidden;position:relative}
  .meter-fill{height:100%;background:var(--indigo);width:0;transition:width .2s;display:flex;align-items:center;justify-content:flex-end;color:#fff;font-family:var(--mono);font-size:10.5px;padding-right:7px}
  .meter-t{position:absolute;top:-3px;bottom:-3px;width:2.5px;background:var(--ink);left:75%}
  .meter-lbl{font-size:11.5px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between}
  .reqs{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
  .req{font-family:var(--mono);font-size:10.5px;border:1.5px solid var(--line);border-radius:14px;padding:3px 10px;color:var(--faint)}
  .req.met{border-color:var(--ok);color:var(--ok)}

  /* ============ FIX-IT EDITOR ============ */
  .doc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:17px 19px;font-size:14.5px;line-height:1.95}
  .sent{cursor:pointer;border-radius:4px;padding:1px 2px}
  .sent:hover{background:#eeeef6}
  .sent.fixed{background:var(--ok-bg);box-shadow:inset 0 -2px 0 var(--ok);cursor:default}
  .sent.active{background:var(--gold-bg);box-shadow:inset 0 -2px 0 var(--gold)}
  .doc.rows{line-height:1.6;padding:12px 13px}
  .doc.rows .sent{display:block;border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:10px 44px 10px 13px;margin-bottom:7px;position:relative}
  .doc.rows .sent:hover{background:#f4f8fd;border-color:#a9c6e8}
  .doc.rows .sent:focus-visible{outline:3px solid var(--indigo);outline-offset:2px}
  .doc.rows .sent::after{content:"flag";position:absolute;right:11px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);opacity:0}
  .doc.rows .sent:hover::after,.doc.rows .sent:focus-visible::after{opacity:1}
  .doc.rows .sent.fixed{border-color:var(--ok);background:var(--ok-bg);box-shadow:none}
  .doc.rows .sent.fixed::after{content:"repaired";opacity:1;color:var(--ok)}
  .doc.rows .sent.active{border-color:var(--gold);background:var(--gold-bg);box-shadow:none}
  .doc.rows .sent.active::after{content:"choose a repair below";opacity:1;color:#9a6a00}
  .fix-lead{font-size:12.5px;color:var(--muted);margin:0 0 9px}
  .fix-note{font-size:13px;margin-top:9px;min-height:18px;border-radius:8px}
  .fix-note.err{color:var(--bad);background:var(--bad-bg);padding:8px 11px}
  .fix-note.okc{color:var(--ok);background:var(--ok-bg);padding:8px 11px}
  .fixpanel{background:var(--card);border:1.5px solid var(--indigo);border-radius:11px;padding:14px 16px;margin-top:12px;display:none}
  .fixpanel.show{display:block}
  .fixpanel .fq{font-size:13px;color:var(--ink2);margin-bottom:10px}
  .fixopt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:10px 13px;margin-bottom:7px;cursor:pointer;font-family:var(--sans);font-size:13px}
  .fixopt:hover{border-color:#a9c6e8}
  .fix-msg{font-size:12.5px;margin-top:4px;min-height:16px}
  .fix-msg.err{color:var(--bad)} .fix-msg.okc{color:var(--ok)}
  .cmp-prev{background:var(--ink);color:#e9eaf8;border-radius:10px;padding:12px 15px;margin:2px 0 14px;font-size:13.5px;line-height:1.65}
  .cmp-prev .cp-h{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:#9fc0da;margin-bottom:7px}
  .cmp-prev .cp-empty{color:#7d94ab;font-style:italic}
  .cmp-slot{border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#fff}
  .cmp-slot .cs-h{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:9px}
  .cmp-slot.correct{border-color:var(--ok)} .cmp-slot.wrong{border-color:var(--bad)}
  .cmp-opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:9px 12px;margin-bottom:6px;cursor:pointer;font-family:var(--sans);font-size:13px;line-height:1.5}
  .cmp-opt:hover:not(:disabled){border-color:#a9c6e8}
  .cmp-opt.pick{border-color:var(--indigo);background:#eef4fb;font-weight:600}
  .cmp-slot.correct .cmp-opt.pick{border-color:var(--ok);background:#eaf6f0}
  .cmp-slot.wrong .cmp-opt.pick{border-color:var(--bad);background:#fdf0ee}
  .cmp-opt .cw{display:block;font-size:12px;color:var(--muted);margin-top:5px;font-weight:400}
  .cmp-opt:disabled{cursor:default}
  .dft-ta{width:100%;box-sizing:border-box;min-height:92px;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font-family:var(--sans);font-size:14px;line-height:1.6;resize:vertical}
  .dft-ta:focus{outline:none;border-color:var(--indigo)}
  .dft-ta:disabled{background:var(--card);color:var(--ink2)}
  .dft-rules{margin:12px 0 0}
  .dft-rule{display:flex;gap:9px;align-items:flex-start;border:1.5px solid var(--line);border-radius:9px;padding:9px 12px;margin-bottom:7px;background:#fff;font-size:13px;line-height:1.5}
  .dft-rule .dr-k{flex:none;width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;background:var(--line);margin-top:1px}
  .dft-rule.pass{border-color:var(--ok)} .dft-rule.pass .dr-k{background:var(--ok)}
  .dft-rule.fail{border-color:var(--bad)} .dft-rule.fail .dr-k{background:var(--bad)}
  .dft-rule.soft{border-color:var(--line);background:var(--card)}
  .dft-rule.soft .dr-k{background:var(--faint)}
  .dft-rule.soft .dr-t{color:var(--muted);font-weight:600}
  .dr-opt{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);background:var(--card);border:1px solid var(--line);border-radius:5px;padding:1px 6px;margin-left:8px;vertical-align:1px}
  .dft-rule .dr-f{display:block;color:var(--muted);font-size:12px;margin-top:4px}
  .dft-model{background:#eef4fb;border:1.5px solid #b9d4ee;border-radius:10px;padding:12px 15px;margin-top:13px;font-size:13.5px;line-height:1.6}
  .dft-model .dm-h{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--indigo-d);margin-bottom:6px}
  .fix-count{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:8px}

  /* ============ QA DESK ============ */
  .dossier{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
  .dossier .dh{background:var(--paper);border-bottom:1px solid var(--line);padding:10px 15px;display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--muted)}
  .dossier .db{padding:14px 16px;font-size:13.5px;color:var(--ink2);font-style:italic}
  .rb-dim{border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#fff}
  .rb-dim .rt{font-weight:600;font-size:13.5px;margin-bottom:8px}
  .rb-scale{display:flex;gap:6px}
  .rb-scale button{flex:1;font-family:var(--mono);font-size:12.5px;border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:8px 0;cursor:pointer}
  .rb-scale button.pick{background:var(--indigo);color:#fff;border-color:var(--indigo)}
  .rb-dim.correct{border-color:var(--ok)} .rb-dim.wrong{border-color:var(--bad)}
  .rb-why{font-size:12px;color:var(--muted);margin-top:8px;display:none}
  .rb-dim.graded .rb-why{display:block}

  /* misc */
  textarea{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:11px 13px;font-family:var(--sans);font-size:13.5px;resize:vertical;min-height:74px;line-height:1.5}
  textarea:focus{outline:none;border-color:var(--indigo)}
  .checklist label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:14px;cursor:pointer}
  .checklist input{width:16px;height:16px;margin-top:3px;accent-color:var(--indigo);flex:none}
  .prompt{background:var(--ink);border-radius:11px;margin:14px 0;overflow:hidden}
  .prompt-h{display:flex;justify-content:space-between;align-items:center;padding:9px 13px;border-bottom:1px solid #23425f}
  .prompt-h .pl{font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:#9fc0da}
  .copy{font-size:11.5px;color:#dbe8f3;background:#1d3a56;border:none;border-radius:6px;padding:5px 11px;cursor:pointer}
  .copy.ok{background:var(--ok)}
  .prompt pre{padding:13px;color:#e9eaf8;font-family:var(--mono);font-size:11.5px;line-height:1.6;white-space:pre-wrap}
  .prompt pre .v{color:#8fc1f7}
  .nav-btns{display:flex;justify-content:space-between;gap:12px;margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
  .btn{font-size:13.5px;padding:11px 20px;border-radius:9px;cursor:pointer;border:1.5px solid var(--line);background:var(--card);color:var(--ink2)}
  .btn.primary{background:var(--indigo);color:#fff;border-color:var(--indigo);font-weight:500}
  .btn.primary:hover{background:var(--indigo-d)}
  .btn:disabled{opacity:.45;cursor:default}
  .locknote{font-size:12px;color:var(--gold);margin-top:8px;text-align:right}

  /* diagrams, animations, meta design-notes */

/* ST.track = chosen primary case id; ST.mem = decisions that carry forward */
function primary(){ return CASES[ST.track] || null; }
function repoGoals(a){
  if(a.goalsFromCase){ const c=primary(); if(c) return c.repoFiles.map(f=>({desc:f,match:f})); }
  return a.goals||[];
}
function remember(key,val){ ST.mem = ST.mem||{}; ST.mem[key]=val; persist(); }
function recall(key){ return (ST.mem||{})[key]; }
/* context frame: the standardized block from the brief §6 */
function frame(f){
  if(!f) return "";
  const row=(label,txt)=> txt? `<div class="cf-row"><span class="cf-k">${label}</span><span class="cf-v">${txt}</span></div>`: "";
  return `<div class="cframe">
    ${row("Previously", f.prev)}
    ${row("What happens now", f.now)}
    ${row("Your role", f.role)}
    ${row("Your responsibility", f.resp)}
    ${row("What to use", f.use)}
    ${row("Why it matters", f.why)}
    ${row("What happens next", f.next)}
  </div>`;
}
/* transition block that closes each activity (brief §12) */
function transition(t){
  if(!t) return "";
  return `<div class="ctrans"><span class="ct-h">→ Handoff</span><div>${t}</div></div>`;
}

{id:"w0",title:"Why we build the way we do",crumb:"Welcome · The philosophy",
 mins:10,
 lead:"The standards in this course come from a few beliefs about how adults learn. This page covers those beliefs, because the standards make more sense once you know what they are for.",

 html:`<p><strong>Who we serve.</strong> Per Scholas gives adults who have been shut out of tech careers a way in: rigorous, no-cost training aligned to what employers hire for. Our learners are career-changers with jobs, families, and everything riding on the next fifteen weeks. That reality is the design constraint behind everything you'll build.</p>
 <p><strong>What we make.</strong> Product Development builds the courses that carry that promise. Market-driven programs, client-customized cohorts, alumni upskilling, and internal training, across IT support, networking, cybersecurity, cloud, software engineering, and data.</p>
 <p><strong>How adults learn.</strong> We teach adults, so we design for andragogy. Five principles govern every material decision:</p>
 <div class="pcards-v"><div class="pcard-v"><div class="pcard-h">Relevance first</div><div class="pcard-b">Adults need the why before the what. Every lesson opens by stating its purpose, including this one.</div></div><div class="pcard-v"><div class="pcard-h">Experience counts</div><div class="pcard-b">Learners arrive with careers and lives. Strong activities put that experience to work instead of ignoring it.</div></div><div class="pcard-v"><div class="pcard-h">Self-direction</div><div class="pcard-b">Adults steer their own learning. We build in agency, choices, and reference tools, like the 📘 Handbook you’ll use throughout.</div></div><div class="pcard-v"><div class="pcard-h">Problem-centered</div><div class="pcard-b">We teach through real tasks, not abstract topics. The classroom mirrors the job, so this course is built from simulations.</div></div><div class="pcard-v"><div class="pcard-h">Internal motivation</div><div class="pcard-b">Career change is internally driven. We honor it with respect, real stakes, and zero busywork.</div></div></div></div>
 <p style="margin-top:14px">Those five produce our house commitments: <strong>learning by doing</strong> (skill comes from performing, not hearing about performing), <strong>at least 75% activated learning</strong> in every lesson, <strong>backward design</strong> (outcomes before content, always), and <strong>AI woven into real work</strong>, because our graduates will be expected to use it on the job, judiciously and transparently. You'll meet each of these concretely across the four units. Full statement: ${gl('philosophy','our philosophy')} in the Handbook.</p>
 <p><strong>What only a person can do here.</strong> A tool can produce a lesson that looks finished. It cannot know that this cohort arrived underprepared, that the last group got stuck on the same step three days running, or that someone changing careers at forty needs an early win or they start doubting the decision. It has no stake in whether anyone succeeds. Curriculum is a set of judgements about people, and those judgements decide the course: what to cut when time runs short, when a struggling learner needs a different route instead of more content, and what counts as good enough to certify someone for a job.</p>
 <div class="diag"><svg viewBox="0 0 720 176" role="img" aria-labelledby="coa-t"><title id="coa-t">Where AI helps and where human judgement is required when building curriculum</title>
  <rect x="14" y="16" width="330" height="146" rx="12" fill="#f3f0ea" stroke="#e8e1d6" stroke-width="1.5"/>
  <rect x="376" y="16" width="330" height="146" rx="12" fill="#e3edf8" stroke="#1d5fa8" stroke-width="2"/>
  <text x="179" y="42" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5a6b7b">AI CAN DRAFT</text>

  <text x="541" y="108" text-anchor="middle" font-size="11.5" fill="#1c2b3a">What to cut when time runs out</text>
  <text x="541" y="128" text-anchor="middle" font-size="11.5" fill="#1c2b3a">What counts as ready for the job</text>
  <text x="541" y="148" text-anchor="middle" font-size="11.5" fill="#1c2b3a">Whose name is on it</text>
 </svg><div class="dcap">AI is a co-author on the left. Authorship stays on the right, because that column is the course.</div></div>
 <p>So the standard here is co-authorship. Use AI to reach a draft faster, then do the work only you can do: check it, decide what it got wrong about your learners, and own what ships. This course was built the same way, and the places where a person had to intervene are the places it stops being curriculum design in general and starts being your job.</p>

 <div class="box info"><span class="bh">Why the 75% rule is non-negotiable</span><p class="tight">The rule exists because of what it changes in a graduate. Someone who practised can do the job; someone who listened has heard about it. A landmark 225-study analysis found students in lecture-only courses failed about <b>1.5\u00D7 more often</b> than those in active-learning classrooms <span style="color:var(--muted)">(Freeman et al, 2014: full cite in the Handbook)</span>. For our courses the stakes are concrete: an IT Support learner who <em>watched</em> someone troubleshoot a ticket hasn\u2019t proven they can; a MERN learner who <em>read about</em> REST endpoints hasn\u2019t built one. Active time is where the actual skill gets made, and that skill is the thing an employer hires for. That\u2019s why the meter you\u2019ll use in the day designer holds every lesson to it.</p></div>
 <p style="margin-top:14px"><strong>Fourteen minutes on why designing from folklore fails:</strong></p><div class="video"><iframe src="https://www.youtube.com/embed/rhgwIhB58PA" title="Veritasium: The Biggest Myth In Education" loading="lazy" allowfullscreen></iframe></div><div class="vidcap">🎯 <b>Watch task:</b> he takes an idea almost everyone believes and shows it does not survive testing. Our standards exist for the same reason: they are the ones that held up. As you watch, ask which of your own instincts about how people learn you have actually tested. (<a href="https://www.youtube.com/watch?v=rhgwIhB58PA" target="_blank" rel="noopener">Open on YouTube</a>)</div><div class="meta"><span class="mi">🔍</span><div><b>Design note:</b> this page gave the reasoning before the process: mission, audience, beliefs, then how we work. Adults engage more readily with materials that explain why, so put the reasoning first.</div></div>`,

   {tag:"3 of 3 · The cut",text:"The module has lost a day. You have to cut something: a 60-minute lab where learners configure the service themselves, or a 60-minute walkthrough where you configure it while they watch. Which goes?",
    opts:[{t:"Cut the lab. The walkthrough covers the same content in less risk.",fb:"It covers the same content and produces a different learner. Someone who watched you configure it has not shown they can, and that is what the employer is hiring for."},
          {t:"Cut the walkthrough. Compress the explanation into the lab and protect the time learners spend doing.",ok:true,fb:"Right. Skill comes from performing, not from hearing about performing. When time is short you protect the doing and shrink the telling, which is also what the 75% floor is enforcing."},
          {t:"Halve both so the shape of the day survives.",fb:"Tempting, and it usually produces a rushed explanation followed by a lab nobody can finish. Cutting the passive block cleanly beats damaging both."}]}],
  fbGood:"Three for three. Those five principles are not decoration, they decide what you cut when a module loses a day.",
  fbBad:"Read the explanations on the ones you changed. The through-line: state the why first, put existing experience to work, and protect the time learners spend doing."}},

 <div class="box info"><span class="bh">Why the 75% rule is non-negotiable</span><p class="tight">This isn\u2019t a stylistic preference. It\u2019s the difference between a graduate who can do the job and one who only heard about it. A landmark 225-study analysis found students in lecture-only courses failed about <b>1.5\u00D7 more often</b> than those in active-learning classrooms <span style="color:var(--muted)">(Freeman et al, 2014: full cite in the Handbook)</span>. For our courses the stakes are concrete: an IT Support learner who <em>watched</em> someone troubleshoot a ticket hasn\u2019t proven they can; a MERN learner who <em>read about</em> REST endpoints hasn\u2019t built one. Active time is where the actual skill: the thing an employer hires for, gets made. That\u2019s why the meter you\u2019ll use in the day designer holds every lesson to it.</p></div>
 <div class="meta"><span class="mi">🔍</span><div><b>Design note:</b> this page gave the reasoning before the process: mission, audience, beliefs, then how we work. Adults engage more readily with materials that explain why, so put the reasoning first.</div></div>`,
 activity:{type:"journal",id:"w0j",fields:[
  {label:"Warm-up: what drew you to building learning for career-changers, and which of the five principles is closest to how you already work?",ph:"Honestly…"}],modelHead:"What the five principles are, now that you have written your answer",model:`<p class="tight">Learning by doing: skill comes from performing, not from watching someone perform. At least 75 percent activated learning in every lesson. Backward design: decide the evidence first, then build toward it. Scaffolding that fades, so guided work gives way to independent work. And assessment that produces evidence rather than a completion tick.</p><p class="tight">If the one you picked is on that list, you already work the way we build. If it is not, it is probably a version of one of them, and this unit will give you our words for it.</p>`}},

{id:"wj",title:"The job, defined",crumb:"Welcome · The role",
 mins:8,
 lead:"Curriculum development here covers four responsibilities. Learn what they are, and where our work ends and Delivery’s begins.",
 demo:{eg:"“Deciding which assessments close module 2, and writing their rubrics.”",steps:["First question I always ask: does this shape what a learner <em>experiences</em>, or how we <em>know it worked</em>? Assessments and rubrics are the definition of ‘how we know.’","Second: is anyone else’s lane closer? Delivery teaches the class; Design scopes the outline. Designing evidence sits squarely with us, which is the Measurement face.","Verdict: ✓ Approve, ours. Take the queue with the same two questions on every statement."]},
 coach:"Read the four responsibilities and the boundary below: <b>the queue only asks about what’s on this page</b>. Then <b>✓ Approve</b> statements that describe our job and <b>✗ Send back</b> those that don’t, naming exactly why.",
 hint:"The test for “our job”: does it shape what a learner experiences, or how we know it worked? Designing evidence, writing materials, improving from feedback, ours. Building the Canvas course and running the live classroom belong to others in the delivery stage, not to us.",
 html:`<p><strong>The four responsibilities of the role:</strong></p>
 <div class="terms"><div class="th">🔤 The four responsibilities</div><dl>
 <dt>Architecture</dt><dd>Deciding outcomes and what evidence proves them, before any content exists. Its artifacts: outlines, objectives, and assessment plans.</dd>
 <dt>Authorship</dt><dd>Writing what learners touch: lessons, labs, assessments, guides. Its artifacts: the materials in the repo.</dd>
 <dt>Measurement</dt><dd>Rubrics, module assessments, and the data that says a course worked. Its artifacts: assessments and their results.</dd>
 <dt>Stewardship</dt><dd>Improving courses cohort after cohort from real feedback. Its artifact is the revision, the .1 on a course’s ID.</dd></dl></div>
 <p><strong>And the boundary:</strong> we do not run the live classroom. Our partners in <strong>Delivery</strong> teach the cohorts. Our job is making every course runnable <em>without us</em>, through facilitator guides, instructor training, and blueprints. The working test: if a course needs its author in the room to function, its facilitator guide failed.</p>
 <div class="meta"><span class="mi">🔍</span><div><b>Design note:</b> teach, then assess. This queue only tests what this page taught. Do not assess learners on material they have not been given.</div></div>
 <p><strong>Where our work ends.</strong> Product Development builds everything about a course except the live classroom. We design the outcomes, write the materials, build the assessments, and produce what an instructor needs in order to teach it. Delivery runs it with learners. The line matters because both sides fail when it blurs: if we assume Delivery will fill gaps, the guide ships thin; if we try to script the classroom, we remove the instructor\u2019s judgment where it is most needed.</p>
 <div class="diag"><svg viewBox="0 0 720 250" role="img" aria-labelledby="wjb-t"><title id="wjb-t">Design sets the objectives, Development decides how they are met, and the delivery stage covers both building the Canvas course and teaching it</title>

</svg><div class="dcap">Three stages, not three teams. The delivery stage alone involves three different groups, and one of them is us.</div></div>
 <div class="box rule"><span class="bh">Where the work starts, and where it starts being ours</span><p class="tight"><b>Design</b> owns what a course is for: the module outcomes and objectives, the key topics, and whether a request becomes a new course at all. We are not spectators while that happens. Development collaborates with Design during the design phase, and this is where you raise anything you can see will not be buildable. But the outcomes and objectives are theirs to set.<br><b>Development</b> owns how those objectives get met. We write the lesson-level objectives that break a module objective into teachable steps, then decide the activities, the assessments, the technology, and how the whole thing flows. Design may suggest an approach at a high level; the decisions about how are ours.<br><b>The delivery stage</b> is where three different groups do three different jobs. The <b>Canvas team</b>, which is what most people mean when they say the Delivery team, builds the course in Canvas. That is their scope: the build, not the teaching. <b>Instructors</b> teach the cohort, grade the work, and make the calls that come up in the room. And <b>we</b> are in this stage too, working with <b>IDQA</b> so instructors have the content and can upskill on it before they teach.</p></div>
 <div class="box info"><span class="bh">Two things both called delivery</span><p class="tight">Delivery means two different things here, and the difference matters. <b>The delivery stage</b> is a phase of the pipeline. Three groups work in it: the Canvas team builds the course, instructors teach it, and we handle instructor training with IDQA. <b>The Delivery team</b> is narrower than the stage. It is the group most people call the <b>Canvas team</b>, and building the Canvas course is what they do. They do not teach, and they do not write the outline, the materials, the blueprint, or the training content, so none of the folders in our shared drive are theirs.</p></div>
 <div class="box info"><span class="bh">Two things both called planning</span><p class="tight">Design plans the <b>package</b>: what the course is, what learners must be able to do, and what the outline contains. Development plans the <b>build</b>: how to reach those objectives, in what order, with which activities and tools. Both are planning, and they are not the same phase. When you see Planning in our pipeline, it means ours: lesson objectives and assessment design. Decisions, with no content yet.</p></div>
 <div class="box info"><span class="bh">The four responsibilities</span><p class="tight"><b>Architect.</b> Decide what learners must be able to do and in what order, from the job backward.<br><b>Author.</b> Build the lessons, labs, and assessments to standard.<br><b>Measurer.</b> Design the evidence, and make sure it actually measures the objective.<br><b>Steward.</b> Keep the course accurate and teachable over time: revisions, change requests, and the paper trail that lets someone else pick it up.</p></div>
 <p><strong>The handoff is the deliverable.</strong> Our job is to make an instructor <em>able</em> to run the course without us: the facilitator guide, the blueprint, the training. Building that handoff is our work. What happens in the room is theirs.</p>
 <p class="tight" style="color:var(--muted)">Sort each responsibility into ours or not ours, then check your reasoning against the verdicts.</p>`,

</svg><div class="dcap">👆 <b>Select each layer</b>: course, module, lesson, materials. The numbers are the whole grammar: 301.2.1 = module 301 → lesson 2 → item 1.</div><div class="box info" style="margin-top:12px"><span class="bh">The three levels, plainly</span><p class="tight"><b>Course</b>: the full program a cohort takes, weeks long. Every course carries a UCI (Unique Course Identifier), its ID in every system. <br><b>Module</b>: a multi-week unit of the course, numbered like 301. Every module closes with a summative assessment (a KBA for knowledge and/or SBA for skill) and has its own blueprint (MBP). <br><b>Lesson</b>: the daily unit inside a module. \u201C301.2\u201D reads as module 301, lesson 2. Each lesson day runs on a rhythm: warm-up in, hands-on practice in the middle, exit ticket out.</p></div></div><div class="terms"><div class="th">🔤 Terms you’ll use all week</div><dl><dt>UCI</dt><dd>Unique Course Identifier: a course’s ID number in every system (e.g. 1042). New course, new UCI; changed course, a decimal revision (e.g. 10##.1).</dd><dt>Outline</dt><dd>The course’s skeleton from the Design team: objectives, outcomes, and key topics. Every build starts from one.</dd><dt>Module</dt><dd>A multi-week unit (301). Closes with a graded assessment.</dd><dt>Lesson</dt><dd>A day of class inside a module (301.2).</dd><dt>KBA / SBA</dt><dd>Knowledge- / Skill-Based Assessment: the graded checks that close every module.</dd><dt>GLAB</dt><dd>Guided lab: a step-by-step, hands-on activity. Where most skill is actually built.</dd><dt>Blueprint (MBP)</dt><dd>The index of one module: every material, listed in delivery order and linked. Created during Developing, as soon as the module has content, then kept current as each file is built. One per module. QA and Delivery navigate by it.</dd><dt>Course Blueprint (CBP)</dt><dd>Assembled once the modules are built and put together: the index of every file Delivery adds to the Canvas course. One per course.</dd></dl></div><div class="meta"><span class="mi">🔍</span><div><b>Design note:</b> this lesson defines every term before the course uses it elsewhere. Do the same, so vocabulary supports learners instead of filtering them. Every term here also appears in the 📘 Handbook glossary, and the Product Hub holds the current source for anything that changes.</div></div>`,

{id:"s1",title:"Walk a course through the pipeline",crumb:"Unit 1 · Simulation",
 mins:12,
 lead:"A new build has arrived from the Design team. Carry it through all seven pipeline steps by making the right call at each one: the same path every project in your portfolio follows.",
 coach:"Read each scene, then <b>select the action you'd take</b>. A right call advances the tracker; a wrong one explains why and lets you try again. This is practice, not a graded test. The map is in the ${GUIDE} if you get lost.",
 hint:"Backward design is the thread: outcomes are defined before evidence, evidence before materials, and QA always stands between building and delivery.",
 html:`<div class="terms"><div class="th">🔤 New terms in this walk</div><dl><dt>Handoff</dt><dd>Design passing the finished outline to Product Development: step 1 of every build.</dd><dt>Charter</dt><dd>The project’s one-page agreement: scope, stakeholders, timeline. Written at Initiation.</dd><dt>Infrastructure request</dt><dd>Asking the infra team for environments (VMs, sandboxes), filed early, before any material assumes they exist.</dd><dt>Facilitator Guide</dt><dd>The instructor’s delivery companion: content breakdown, tips, troubleshooting. A required deliverable.</dd><dt>QA</dt><dd>Product Quality &amp; Experience reviewing everything against the standards before release.</dd><dt>Intake package</dt><dd>The five documents Development needs before accepting a handoff: the next-but-one lesson runs that check.</dd></dl></div><p><strong>The concept, in one look:</strong> every product travels the same seven steps, and each step exists to make the next one cheaper. Problems caught at Planning cost minutes; the same problems at Delivery cost a launch.</p>
 ${''}`+`<div class="diag"><svg viewBox="0 0 720 100" role="img" aria-labelledby="dp-t"><title id="dp-t">The seven-step development pipeline: select a step for detail</title><line x1="40" y1="34" x2="680" y2="34" stroke="#e8e1d6" stroke-width="3"/><line class="draw" x1="40" y1="34" x2="680" y2="34" stroke="#1d5fa8" stroke-width="3"/><g class="fdu hot" tabindex="0" role="button" style="animation-delay:0.1s" aria-label="Handoff" data-name="Handoff" data-info="Design delivers objectives, outcomes, and key topics, your raw material."><circle cx="40" cy="34" r="13" fill="#fff" stroke="#1d5fa8" stroke-width="2.5"/><text x="40" y="38.5" text-anchor="middle" font-size="12" fill="#164a85">1</text><text x="40" y="70" text-anchor="middle" font-size="10.5" fill="#5b6b7a">Handoff</text></g><g class="fdu hot" tabindex="0" role="button" style="animation-delay:0.23s" aria-label="Initiation" data-name="Initiation" data-info="Project charter, intake call, infrastructure requests. 3–5 days that prevent weeks of rework."><circle cx="147" cy="34" r="13" fill="#fff" stroke="#1d5fa8" stroke-width="2.5"/><text x="147" y="38.5" text-anchor="middle" font-size="12" fill="#164a85">2</text><text x="147" y="70" text-anchor="middle" font-size="10.5" fill="#5b6b7a">Initiation</text></g><g class="fdu hot" tabindex="0" role="button" style="animation-delay:0.36s" aria-label="Planning" data-name="Planning" data-info="Outcomes → evidence → experiences. Backward design happens here, before any content exists."><circle cx="253" cy="34" r="13" fill="#fff" stroke="#1d5fa8" stroke-width="2.5"/><text x="253" y="38.5" text-anchor="middle" font-size="12" fill="#164a85">3</text><text x="253" y="70" text-anchor="middle" font-size="10.5" fill="#5b6b7a">Planning</text></g><g class="fdu hot" tabindex="0" role="button" style="animation-delay:0.49s" aria-label="Developing" data-name="Developing" data-info="Lessons, labs, assessments, rubrics, guides. The module blueprint starts here too, as soon as there is content. Duration is set per build by the ID&amp;D Director."><circle cx="360" cy="34" r="13" fill="#fff" stroke="#1d5fa8" stroke-width="2.5"/><text x="360" y="38.5" text-anchor="middle" font-size="12" fill="#164a85">4</text><text x="360" y="70" text-anchor="middle" font-size="10.5" fill="#5b6b7a">Developing</text></g><g class="fdu hot" tabindex="0" role="button" style="animation-delay:0.62s" aria-label="QA" data-name="QA" data-info="Module and course review; findings go back for fixes before anything ships."><circle cx="467" cy="34" r="13" fill="#fff" stroke="#1d5fa8" stroke-width="2.5"/><text x="467" y="38.5" text-anchor="middle" font-size="12" fill="#164a85">5</text><text x="467" y="70" text-anchor="middle" font-size="10.5" fill="#5b6b7a">QA</text></g><g class="fdu hot" tabindex="0" role="button" style="animation-delay:0.75s" aria-label="Delivery" data-name="Delivery" data-info="Handoff via the course blueprint, plus instructor training."><circle cx="573" cy="34" r="13" fill="#fff" stroke="#1d5fa8" stroke-width="2.5"/><text x="573" y="38.5" text-anchor="middle" font-size="12" fill="#164a85">6</text><text x="573" y="70" text-anchor="middle" font-size="10.5" fill="#5b6b7a">Delivery</text></g><g class="fdu hot" tabindex="0" role="button" style="animation-delay:0.88s" aria-label="Evaluate" data-name="Evaluate" data-info="Cohort feedback becomes the next revision's inputs, the loop closes."><circle cx="680" cy="34" r="13" fill="#fff" stroke="#1d5fa8" stroke-width="2.5"/><text x="680" y="38.5" text-anchor="middle" font-size="12" fill="#164a85">7</text><text x="680" y="70" text-anchor="middle" font-size="10.5" fill="#5b6b7a">Evaluate</text></g><path d="M 680 86 Q 360 108 46 88" fill="none" stroke="#3f88c5" stroke-width="1.6" stroke-dasharray="4 4"/><text x="360" y="94" text-anchor="middle" font-size="10" fill="#3f88c5">findings feed the next revision</text></svg><div class="dcap">👆 <b>Select any step</b> (or Tab + Enter) to see what happens there. Duration is set per build by the ID&amp;D Director.</div></div>`+`
 ${''}<p>Your job now: get this build from handoff to continuous improvement. Full detail: ${gl('process','the process map')}.</p>
 <div class="meta"><span class="mi">🔍</span><div><b>Design note:</b> the concept arrived as a diagram before you were asked to do anything. Concept, then visual, then practice is a sequence worth reusing.</div></div>`,
 variants:{swe:{type:"story",id:"s1s",points:14,
  steps:[
   {tag:"Step 1 of 7 · The outline arrives",text:"Design sends you the outline: objectives, outcomes, key topics. What happens first?",
    opts:[{t:"Start building slide decks: the outline tells us the topics.",fb:"Not yet. Building before initiation means no charter, no stakeholders, no infrastructure, and rework later."},
          {t:"Initiate: draft the project charter, schedule the intake call, flag any infrastructure needs.",ok:true,fb:"Right. Initiation sets the charter, the stakeholders, and the intake call before anything gets built."},
          {t:"Send it straight to QA to check the outline.",fb:"QA reviews built materials. An outline gets clarified at the intake call, not QA'd."}]},
   {tag:"Step 2 of 7 · The intake call",text:"On the intake call you learn the course needs a coding environment and a shared repository learners can break and reset. What do you do with that?",
    opts:[{t:"Note it for later. Infrastructure can be sorted during development.",fb:"Dangerous. Discovering mid-build that the environment can't exist is the classic expensive failure."},
          {t:"Submit an infrastructure request to the infrastructure team now, during initiation.",ok:true,fb:"Exactly. Infrastructure requests belong in initiation, before a single material assumes an environment exists."},
          {t:"Change the design so no shared repository is needed.",fb:"You don't quietly redesign around a constraint, you surface it. The request goes in; design changes only if it can't be met."}]},
   {tag:"Step 3 of 7 · Planning",text:"Now you plan. Which order does planning follow?",
    opts:[{t:"Pick the content first, then figure out how to test it.",fb:"That's forward design: it produces content in search of a purpose. We work backward."},
          {t:"Define outcomes → define the assessment evidence and rubrics → then plan the learning experiences.",ok:true,fb:"Backward design: outcomes, then evidence, then instruction in service of both."},
          {t:"Start with the capstone and improvise the rest.",fb:"The capstone matters, but it's one piece of the evidence plan. Outcomes come first."}]},
   {tag:"Step 4 of 7 · Developing",text:"You're building module materials. A colleague suggests skipping facilitator guides \u201Csince instructors can wing it.\u201D",
    opts:[{t:"Agree. Guides are busywork.",fb:"Facilitator guides are a required deliverable: content breakdown, delivery detail, tips, troubleshooting. Instructors don't wing our courses."},
          {t:"Build the full deliverable set: lessons, labs, assessments, rubrics, facilitator guides, blueprints.",ok:true,fb:"Right, that is the full set. The blueprint links it together, and the facilitator guide is how your build survives contact with a classroom."},
          {t:"Build only what QA checks.",fb:"QA checks everything on the deliverables list, which is what the list is for."}]},
   {tag:"Step 5 of 7 · QA",text:"QA reviews module 3 and flags: a lab with no rubric, and a lesson that drifts off-objective. What now?",
    opts:[{t:"Fix both, resubmit to QA.",ok:true,fb:"Findings go back, get fixed, get re-checked. QA sign-off is what releases the course toward delivery."},
          {t:"Argue the lab doesn't need a rubric.",fb:"Every graded item carries a rubric. That's standard, not preference."},
          {t:"Ship it; instructors will catch problems live.",fb:"Problems caught in a live cohort cost a launch. Problems caught at QA cost an afternoon."}]},
   {tag:"Step 6 of 7 · Implementation",text:"QA has signed off. What does handing off to Delivery include?",
    opts:[{t:"Email a folder link. Done.",fb:"A link is not a handoff. Delivery builds the course in Canvas from the blueprint, and the instructors teaching it need to upskill on the content first."},
          {t:"Handoff via the course blueprint, then work with IDQA so instructors can upskill on the content, grading, and approach.",ok:true,fb:"Right. The blueprint is what Delivery builds the Canvas course from, and instructor readiness is built into the handoff instead of bolted on afterwards."},
          {t:"Personally teach the first cohort.",fb:"Tempting, but delivery is Delivery's lane. Your job is making them able to run it without you."}]},
   {tag:"Step 7 of 7 · After the cohort",text:"The first cohort finishes. Feedback shows learners struggled in module 3's labs. What's the move?",
    opts:[{t:"Nothing, the course shipped; it's done.",fb:"A shipped course isn't a finished course. Evaluation feeds revision. That's step 7 existing at all."},
          {t:"Analyze the feedback, update module 3, and log the change. The next revision starts with evidence.",ok:true,fb:"Right. Continuous improvement: feedback in, revision out, change logged. You've walked the whole pipeline."},
          {t:"Blame the instructor.",fb:"The data points at module 3's design. We follow evidence, not blame."}]}],
  fbGood:"The build went from outline to revision with you making every call. The full pipeline reference is in the Handbook.",
  fbBad:"You got the build through: review the steps you missed on the way; the map is in the Guide."}},

{id:"sip",title:"Review what Design sent you",crumb:"Unit 1 · Readiness check",
 mins:8,
 lead:"Design sends you a package to look over before anyone starts building. Read each one and say what you would raise with them, and whether it is something to sort out first or something to note and keep moving. Saying nothing is how a build fails six weeks later.",
 frame:function(){return {
   prev:"You've seen how a course is structured and how work flows through the readiness gates.",
   now:"Both portfolio projects have submitted design packages awaiting a readiness call.",
   role:"You are the Product Developer accepting (or blocking) each handoff.",
   resp:"For each project, decide: Ready, Ready with documented constraints, or Not ready, and name the gap, its owner, and whether work may proceed.",
   use:"Each project's design package (below) and the Design Readiness section of the Playbook.",
   why:"Accepting an incomplete package silently is how builds fail six weeks later. Your call protects every downstream team.",
   next:"Your verdicts are logged to each project's case file and shape what can enter Development."
 };},
 portfolio:true, 
 coach:`For each package, sort your response: <b>👍 Nothing to raise</b>, <b>✋ Raise it, keep going</b> (note the gap, name who owns closing it, start on the parts that do not depend on it), or <b>✋✋ Raise it before we start</b> (we cannot begin without an answer, so ask for the specific thing). Package checklist: ${gl('process','the Handbook')}.`,
 hint:"One question sorts these: can we start on anything useful right now? If a build specification is missing there is nothing to build from, so that is a conversation before we start. If something is present but aging, note it, name who is refreshing it, and begin on the parts that do not depend on it. On a client-customized build, the client notes are the specification.",
 demo:{eg:"Worked example: Package for UCI 1051 (market course): program overview ✓ · module build specs ✓ · target job description ✓ (current) · classroom tech inventory ✓ (last month) · client notes: n/a for market courses.",steps:[
 "Step 1: Check the load-bearing documents. Build specifications must be present (and, for customized builds only, client notes). Here the specs are present, and client notes don’t apply to a market course. Load-bearing check passes.",
 "Step 2: Check the freshness of what the outcomes depend on. The job description is current; the tech inventory is a month old but still valid. Nothing needs a documented constraint.",
 "Step 3: Make the call and record it. With load-bearing documents present and inputs current, the verdict is ✅ Ready. Record the acceptance so Design Review has a paper trail.",
 "The process every time: load-bearing documents first, freshness second, then stamp and record. Now run the queue below in that order."]},
 html:`<div class="portfolio-badge">Portfolio Review · both projects</div><div class="terms"><div class="th">🔤 The design-intake package, five documents</div><dl>
 <dt>Program Overview</dt><dd>What the course is, for whom, and why now.</dd>
 <dt>Module Build Specs</dt><dd>What each module must contain: the thing you actually build from.</dd>
 <dt>Target Job Description</dt><dd>The job the outcomes must map to. Stale JD = stale outcomes.</dd>
 <dt>Tech Inventory</dt><dd>What the classrooms and labs can actually run.</dd>
 <dt>Client Notes</dt><dd>For customized builds: what the client asked for, the customization’s spec.</dd></dl></div>
 <p><strong>The decision rule.</strong> A gap is either a <strong>documented constraint</strong>, where work proceeds and the gap has an owner and a date, or a <strong>block</strong>, where the work waits on a specific ask. Both are decided in the open at Design Review. The only wrong answer is absorbing a gap silently.</p>
 <p><strong>What readiness actually gates.</strong> Accepting an incomplete package is how a build fails six weeks later, when the missing decision surfaces as rework nobody budgeted. The readiness check exists so that gap is found in a meeting instead of in production. It is not a formality and it is not gatekeeping. It is the last cheap moment to notice something is missing.</p>
 <div class="diag"><svg viewBox="0 0 720 112" role="img" aria-labelledby="sip-d"><title id="sip-d">How to read a handoff package: load-bearing documents first, then whether inputs are current</title><rect x="12" y="26" width="216" height="60" rx="10" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="120" y="50" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1c2b3a">Pass 1</text><text x="120" y="68" text-anchor="middle" font-size="10" fill="#42566a">Load-bearing docs present?</text><line x1="232" y1="56" x2="248" y2="56" stroke="#7a8a99" stroke-width="1.6"/><polygon points="250,56 244,52 244,60" fill="#7a8a99"/><rect x="254" y="26" width="216" height="60" rx="10" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><text x="362" y="50" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1c2b3a">Pass 2</text><text x="362" y="68" text-anchor="middle" font-size="10" fill="#42566a">Inputs still current?</text><line x1="474" y1="56" x2="490" y2="56" stroke="#7a8a99" stroke-width="1.6"/><polygon points="492,56 486,52 486,60" fill="#7a8a99"/><rect x="496" y="26" width="216" height="60" rx="10" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><text x="604" y="50" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1c2b3a">Your response</text><text x="604" y="68" text-anchor="middle" font-size="10" fill="#42566a">Raise it, or nothing to raise</text></svg><div class="dcap">Order matters. A missing specification is a different problem from an aging one.</div></div>
 <div class="box info"><span class="bh">Read the package in two passes</span><p class="tight"><b>Pass 1, the load-bearing documents.</b> Build specifications must be present, and for customized builds, client notes. Without these you would be inventing the design, which means guessing at what the client agreed to.<br><b>Pass 2, the freshness of what outcomes depend on.</b> A job description and technology inventory that are current, because objectives derived from a stale job description train people for a job that changed.</p></div>
 <div class="box rule"><span class="bh">Three verdicts, and what each commits you to</span><p class="tight"><b>Ready.</b> Load-bearing documents present, inputs current. Record the acceptance so Design Review has a trail.<br><b>Ready with constraints.</b> Something is missing or aging, but it is documented, owned, and does not block starting. Name the constraint, name the owner, proceed.<br><b>Not ready.</b> A load-bearing document is absent and no one owns getting it. Block with a <em>specific ask</em>, not a general complaint.</p></div>
 <p><strong>The two failures to avoid.</strong> Starting to build on a guess, and refusing work that a documented constraint could have unblocked. Both are expensive. The middle verdict exists precisely so that a gap does not have to stop a project, as long as someone owns it in writing.</p>
 <p class="tight" style="color:var(--muted)">Read each package, then stamp it. Run load-bearing first, freshness second.</p>`,
 transition:function(){return "Readiness logged for both projects. IT Support proceeds with a documented evidence-gap constraint; MERN is ready pending individual-evidence verification at Development Review. Next: how each project is identified: new UCI, revision, or no change.";},
 activity:{type:"triage",id:"sipt",points:15,buckets:["👍 Nothing to raise","✋ Raise it, keep going","✋✋ Raise it before we start"],
  items:[
   {from:"Design Team → IT Support",subj:"IT Support (CompTIA blend): new cohort",body:"Overview ✓, build specs ✓, job description ✓, virtual environment ✓. But the evidence plan leans on CompTIA quizzes; our own independent performance evidence (SBA / performance task) isn't specified.",ans:1,why:"Ready WITH CONSTRAINTS: proceed on the modules that stand on their own, but the performance-evidence gap gets an owner and must close before Development Review. Vendor knowledge ≠ job-performance evidence."},
   {from:"Design Team → MERN SWE",subj:"MERN full-stack: build/refresh",body:"All package documents present and current: our own content end to end. The one open risk: nothing yet guarantees individual evidence inside the team-based MERN projects.",ans:0,why:"Ready: the package is complete and it's our content. The individual-evidence question is a design risk to verify at Development Review, not a missing input, so it doesn't block acceptance."},
   {from:"Account Team → (hypothetical customization)",subj:"Client MERN customization",body:"Overview ✓, specs ✓, but no client conversation summary, and the account team can't yet say what the client wants changed.",ans:2,why:"NOT READY: for a customization the client notes ARE the spec. Building before they exist means building a guess. Block with the specific ask: documented client requirements."},
   {from:"Design Team → IT Support",subj:"IT Support: 'specs to follow'",body:"Program overview attached. 'CompTIA mapping and our build specs to follow in a couple weeks. You can start updating in the meantime.'",ans:2,why:"NOT READY: 'specs to follow' is how scope arrives mid-build and rework gets normalized. Nothing load-bearing exists yet: block, with the ask in writing."},
   {from:"Design Team → MERN SWE",subj:"MERN: stale job description",body:"All documents present. The target job description predates the current hiring shift toward TypeScript and testing expectations in junior roles.",ans:1,why:"Ready WITH CONSTRAINTS: proceed, but flag the JD for refresh with an owner and validate objectives against current postings before Development Review. Stale inputs are constraints, not secrets."}],
  fbGood:"Five clean readiness calls. In none of them did you start building on a guess, or block work that a documented constraint could have unblocked.",
  fbBad:"You worked the whole queue. The rule behind every miss is the same: gaps are documented-and-owned, or they block with a specific ask. Silence was never one of the options."}},
{id:"s1b",title:"Find the document you need",crumb:"Unit 1 \u00b7 Where things live",
 mins:6,
 lead:"You are three weeks into a build and you need seven different documents, some yours and some other people\u2019s. Nobody keeps an index of the drive. What you have instead is one rule: every stage keeps its own documents in its own folder, so knowing which stage produced something tells you where it is.",
 demo:{eg:"You need last cohort’s survey results.",steps:[
  "The question to ask is not where a document gets used, because a survey gets used by almost everyone. Ask which stage produced it.",
  "Surveys are answered after a cohort has run, so they come out of the last stage, where results come back and feed the next revision.",
  "That puts them in 7 · Evaluate. Work the seven below with the same question each time: which stage made this?"]},
 coach:`<b>Drag each document onto the stage that produced it</b>, or select a document and then select its stage. Both work, and so does the keyboard. A wrong stage bounces the card with an explanation. The pipeline map is in the previous lesson and in ${gl('process','the Handbook')}.`,
 hint:"Ask what produced it, not what uses it. Charters are written when a project opens. Objectives and assessment plans are decisions, made before any content exists. Materials, the blueprint and the facilitator guide are all made while building. Findings come out of review. Instructor training happens at handoff. Surveys come back after a cohort runs.",
 frame:function(){return {
   prev:"You walked a build through all seven stages and named the module repo\u2019s files.",
   now:"You need documents from several of those stages at once, which is the normal condition of a build.",
   role:"You are the Product Developer, mid-build, looking for what you need.",
   resp:"Say whose folder each document is in.",
   why:"A file in the wrong folder is a file nobody finds. This works in both directions: it is how you locate other people\u2019s work, and how you make sure yours can be located.",
   next:"Next, how Design classifies a request and what that obligates you to build."
 };},
 html:`<p><strong>Every stage keeps its own documents in its own folder.</strong> Design's files sit in the design folder, ours in the development folder, QA's findings in theirs. That one rule does all the work: if you know which stage produced a document, you know where it is without asking anyone, and anything you produce lands where the next person will look for it.</p>
 <div class="diag"><svg viewBox="0 0 720 154" role="img" aria-labelledby="s1b-d"><title id="s1b-d">Which stage produces which documents, and therefore which folder they live in</title><rect x="12" y="12" width="164" height="128" rx="12" fill="#f3f0ea" stroke="#e8e1d6" stroke-width="1.5"/><text x="94" y="36" text-anchor="middle" font-size="12" font-weight="700" fill="#7a8a99">DESIGN</text><text x="94" y="60" text-anchor="middle" font-size="11" fill="#42566a">Outline</text><text x="94" y="79" text-anchor="middle" font-size="11" fill="#42566a">Objectives</text><text x="94" y="98" text-anchor="middle" font-size="11" fill="#42566a">Key topics</text><rect x="190" y="12" width="164" height="128" rx="12" fill="#e3edf8" stroke="#1d5fa8" stroke-width="2"/><text x="272" y="36" text-anchor="middle" font-size="12" font-weight="700" fill="#164a85">DEVELOPMENT</text><text x="272" y="60" text-anchor="middle" font-size="11" fill="#1c2b3a">Blueprint (MBP)</text><text x="272" y="79" text-anchor="middle" font-size="11" fill="#1c2b3a">Lessons and labs</text><text x="272" y="98" text-anchor="middle" font-size="11" fill="#1c2b3a">Assessments</text><text x="272" y="117" text-anchor="middle" font-size="11" fill="#1c2b3a">Facilitator guide</text><rect x="368" y="12" width="164" height="128" rx="12" fill="#f3f0ea" stroke="#e8e1d6" stroke-width="1.5"/><text x="450" y="36" text-anchor="middle" font-size="12" font-weight="700" fill="#7a8a99">QA</text><text x="450" y="60" text-anchor="middle" font-size="11" fill="#42566a">Findings log</text><rect x="546" y="12" width="164" height="128" rx="12" fill="#f3f0ea" stroke="#e8e1d6" stroke-width="1.5"/><text x="628" y="36" text-anchor="middle" font-size="12" font-weight="700" fill="#7a8a99">DELIVERY STAGE</text><text x="628" y="60" text-anchor="middle" font-size="11" fill="#42566a">Instructor training</text><text x="628" y="79" text-anchor="middle" font-size="9.5" fill="#7a8a99">(us, with IDQA)</text></svg><div class="dcap">Knowing the producer tells you the folder. It works in both directions.</div></div>
 <div class="box rule"><span class="bh">The two that get filed wrong</span><p class="tight">The <b>module blueprint</b> is the one people miss most, because it reads like a design document and sounds like something Design would hand over. It is not: it is produced during Developing, as soon as the module has content, and it lives in our folder. The <b>facilitator guide</b> goes the same way, because it is written for instructors and people assume it belongs to Delivery. We write it, so it is ours.<br>Both mistakes have the same consequence. A correctly named file in the wrong folder is still a file nobody finds, because people look in the folder that owns that kind of document rather than searching the drive.</p></div>
 <p class="tight" style="color:var(--muted)">You need seven documents. Say whose folder each one is in.</p>`,

 brief:{from:"Product Developer \u00b7 IT domain",re:"Monday intake: five decisions came through",text:"Design sent their classifications this morning. Read each one and tell me what it means for us. I want to know what we are building before I plan anyone\u2019s week."},
 html:`
 <p><strong>Who decides what.</strong> Whether a request becomes a new course, a revision of an existing one, or no product change at all is a <b>Design decision</b>. They own the intake call and the identifier. Development receives that decision and works out the build. Knowing the vocabulary matters anyway, because the classification on a handoff tells you the scope of your own work before you read a single specification.</p>
 <div class="diag"><svg viewBox="0 0 720 154" role="img" aria-labelledby="s2-d"><title id="s2-d">What Development builds for each classification Design assigns</title><rect x="12" y="12" width="224" height="128" rx="12" fill="#e3edf8" stroke="#1d5fa8" stroke-width="2"/><text x="124" y="36" text-anchor="middle" font-size="12" font-weight="700" fill="#164a85">NEW UCI</text><text x="124" y="60" text-anchor="middle" font-size="11" fill="#1c2b3a">Build everything</text><text x="124" y="79" text-anchor="middle" font-size="11" fill="#1c2b3a">Modules, lessons</text><text x="124" y="98" text-anchor="middle" font-size="11" fill="#1c2b3a">Assessments, guide</text><text x="124" y="117" text-anchor="middle" font-size="11" fill="#1c2b3a">New repo</text><rect x="250" y="12" width="224" height="128" rx="12" fill="#e3edf8" stroke="#1d5fa8" stroke-width="2"/><text x="362" y="36" text-anchor="middle" font-size="12" font-weight="700" fill="#164a85">REVISION (.1)</text><text x="362" y="60" text-anchor="middle" font-size="11" fill="#1c2b3a">Update named modules</text><text x="362" y="79" text-anchor="middle" font-size="11" fill="#1c2b3a">Version bump</text><text x="362" y="98" text-anchor="middle" font-size="11" fill="#1c2b3a">Leave the rest alone</text><rect x="488" y="12" width="224" height="128" rx="12" fill="#f3f0ea" stroke="#e8e1d6" stroke-width="1.5"/><text x="600" y="36" text-anchor="middle" font-size="12" font-weight="700" fill="#7a8a99">NO PRODUCT CHANGE</text><text x="600" y="60" text-anchor="middle" font-size="11" fill="#42566a">Build nothing</text><text x="600" y="79" text-anchor="middle" font-size="11" fill="#42566a">Request belongs</text><text x="600" y="98" text-anchor="middle" font-size="11" fill="#42566a">to another team</text></svg><div class="dcap">Design assigns the classification. It tells you the size of your own work.</div></div>
 <div class="box info"><span class="bh">What each classification obligates us to build</span><p class="tight"><b>New UCI.</b> A course that does not exist yet. Development builds the full set: every module, every lesson, every assessment, the facilitator guide, and a new repo. Assume nothing is reusable until you check.<br><b>New revision (.1).</b> The course exists. Development updates the specific modules named in the handoff, bumps the version, and keeps everything else intact. The risk here is scope creep: a revision is not an excuse to rebuild pages nobody asked about.<br><b>No product change.</b> The course runs as it is. Development builds nothing. If someone is asking us for work anyway, the real request belongs to Delivery or Operations, and the answer is a conversation instead of an edit.</p></div>
 <div class="box rule"><span class="bh">The two questions behind every classification</span><p class="tight">You do not make the call, but you should be able to follow the reasoning: <b>does the course already exist</b>, and <b>is the content changing</b>? Existing plus unchanged is no product change. Existing plus changed is a revision. Not existing, or customized for a specific client, is a new UCI. If a handoff\u2019s classification does not match that logic, that is worth raising before you build.</p></div>
 <p class="tight" style="color:var(--muted)">Five decisions follow. For each, sort it by what Development has to produce.</p>
 `,

 html:`<div class="terms"><div class="th">🔤 The files you’re about to create</div><dl><dt>GLAB</dt><dd>Guided lab: step-by-step hands-on work. Numbered to its lesson: GLAB 301.1.1.</dd><dt>ALAB</dt><dd>Assignment lab: the learner drives from a problem statement. Always graded, and written just as ALAB (the grading is implied, no R- needed).</dd><dt>Quiz</dt><dd>The lesson-level knowledge check: Quiz 301.2.</dd><dt>KBA</dt><dd>The module-closing graded assessment: module-level, so just KBA 301.</dd><dt>MBP</dt><dd>Module Blueprint: the module’s index, one per module. Also module-level: MBP 301. Started during Developing, not during Planning.</dd></dl></div><p><strong>The concept:</strong> a file name is an address. Anyone on any team should be able to find any material, or know exactly what a file is before opening it, from the name alone.</p><div class="diag"><svg viewBox="0 0 720 150" role="img" aria-labelledby="dn-t"><title id="dn-t">Anatomy of a file name: select each part</title><text x="360" y="52" text-anchor="middle" font-size="42" font-family="IBM Plex Mono, monospace" fill="#12283f" font-weight="600">R-GLAB 301.2.1</text><g class="fdu hot" tabindex="0" role="button" style="animation-delay:0.2s" aria-label="R-" data-name="R-" data-info="Graded / required. ALABs, Quizzes, KBAs, SBAs, and Capstones are always graded: the R- makes it visible in a file list."><line x1="205" y1="64" x2="205" y2="86" stroke="#3f88c5" stroke-width="2"/><text x="205" y="102" text-anchor="middle" font-size="11" fill="#3f88c5" font-weight="600">R- = graded</text></g><g class="fdu hot" tabindex="0" role="button" style="animation-delay:0.38s" aria-label="GLAB" data-name="GLAB" data-info="The prefix says what a file is before anyone opens it: guided lab, in this case. The full prefix table lives in the Handbook."><line x1="298" y1="64" x2="298" y2="120" stroke="#1d5fa8" stroke-width="2"/><text x="298" y="136" text-anchor="middle" font-size="11" fill="#164a85" font-weight="600">GLAB</text></g><g class="fdu hot" tabindex="0" role="button" style="animation-delay:0.56s" aria-label="301" data-name="301" data-info="The module number. Module-level items: KBA, SBA, MBP. Stop here."><line x1="437" y1="64" x2="437" y2="86" stroke="#1d5fa8" stroke-width="2"/><text x="437" y="102" text-anchor="middle" font-size="11" fill="#164a85" font-weight="600">301</text></g><g class="fdu hot" tabindex="0" role="button" style="animation-delay:0.74s" aria-label=".2" data-name=".2" data-info="The lesson number. Only lesson-level items (labs, quizzes, activities) carry it."><line x1="497" y1="64" x2="497" y2="120" stroke="#1d5fa8" stroke-width="2"/><text x="497" y="136" text-anchor="middle" font-size="11" fill="#164a85" font-weight="600">.2</text></g><g class="fdu hot" tabindex="0" role="button" style="animation-delay:0.92s" aria-label=".1" data-name=".1" data-info="The item number. This is the first lab of lesson 2."><line x1="547" y1="64" x2="547" y2="86" stroke="#1d5fa8" stroke-width="2"/><text x="547" y="102" text-anchor="middle" font-size="11" fill="#164a85" font-weight="600">.1</text></g></svg><div class="dcap">👆 <b>Select each labeled part</b> to see what it encodes.</div></div>`,

{id:"d1x",title:"Unit 1 check: take a request from intake to a staged repo",crumb:"Unit 1 \u00b7 Unit check",mins:10,
 lead:"One real request, start to finish. Everything Unit 1 covered gets used here: who decides what, what a package needs before you build, where files live, and how they are named. Six decisions, and each one shows you the consequence before you move on.",
 html:`<div class="box rule"><span class="bh">How this one works</span><p class="tight">Pick the response you would actually defend, then read what follows from it. A wrong pick explains itself and lets you try again, so the point is to follow the reasoning. The score is beside the point. Nothing here is recorded or sent anywhere.</p></div>`,
 coach:"Work the request one decision at a time.",
variants:{swe:{type:"story",id:"d1xs",points:12,
  steps:[
   {tag:"Step 1 of 6 \u00b7 The request arrives",
    text:"A client wants our MERN course customized to their stack and timeline. The request lands in your inbox before Design has classified it. What do you do?",
    opts:[
     {t:"Start scoping the build, since a customized course clearly needs new work.",fb:"Too early. Whether this becomes a new course, a revision, or nothing at all is Design\u2019s call, and the answer changes what you build. Scoping now risks building the wrong thing."},
     {t:"Wait for Design\u2019s classification, since the intake decision and the identifier are theirs.",ok:true,fb:"Right. Design owns the intake call. Your work starts once you know whether it is a new course, a revision, or no product change."},
     {t:"Classify it yourself as a new UCI and tell Design what you decided.",fb:"Not our call. Development receives the classification. Design makes it. Deciding for Design creates conflicting records of what the client agreed to."}]},
   {tag:"Step 2 of 6 \u00b7 The classification comes back",
    text:"Design classifies it as a new UCI, because the content and constraints diverge from the market course. What does that obligate Development to produce?",
    opts:[
     {t:"Update the existing MERN modules and bump the version.",fb:"That is what a revision obligates. A new UCI means the course does not exist yet, so updating the market course would change a product other cohorts are running."},
     {t:"The full set: modules, lessons, assessments, facilitator guide, and a new repo.",ok:true,fb:"Right. A new UCI is a build from nothing. Check whether anything is genuinely reusable, but assume nothing until you have."},
     {t:"Nothing yet, since the client has not signed off on a timeline.",fb:"The classification is the trigger for planning. Waiting for more certainty than the process provides is how builds start late."}]},
   {tag:"Step 3 of 6 \u00b7 The package arrives",
    text:"Design sends the handoff. Build specifications are present. Client notes are present, with two tooling constraints. The target job description is 14 months old and the client has renamed the role. What is your readiness call?",
    opts:[
     {t:"Not ready. The job description is stale, so the objectives cannot be trusted.",fb:"Too strict. Stale is not the same as missing. The load-bearing documents are here, so this is a constraint to document rather than a reason to block the whole build."},
     {t:"Ready with constraints. Load-bearing documents are present; document the stale job description and name who owns re-confirming the role.",ok:true,fb:"Right. Build specifications and client notes are the load-bearing pieces and both are here. The aging job description is real, so it gets named, owned, and worked around instead of ignored."},
     {t:"Ready. Everything on the list is present, so there is nothing to flag.",fb:"Present is not the same as current. Objectives derived from a 14-month-old description for a renamed role would train people for a job that changed. That needs recording."}]},
   {tag:"Step 4 of 6 \u00b7 Someone asks you to start",
    text:"The client is keen and your director asks whether you can begin building module 1 this week, before the job description is re-confirmed. What do you say?",
    opts:[
     {t:"Yes, and say nothing about the job description, since the constraint is already documented.",fb:"Documenting it is not the same as managing it. If module 1\u2019s objectives depend on the role definition, starting there builds on the part you know is unstable."},
     {t:"No, nothing starts until every input is confirmed.",fb:"That blocks work a documented constraint could have unblocked. Ready-with-constraints exists precisely so a project can move while a gap is being closed."},
     {t:"Yes, on the parts that do not depend on the role definition, and say which parts those are and what is still waiting.",ok:true,fb:"Right. You protect the schedule and the quality at once by naming what can proceed, what cannot, and what you are waiting on."}]},
   {tag:"Step 5 of 6 \u00b7 Staging the repo",
    text:"You are creating the repo for this build. Where does the module blueprint go?",
    opts:[

  <p class="tight"><b>3. Files.</b> <span class="mono">MBP 301</span> for the blueprint, produced during Developing and filed in our folder rather than Design\u2019s. <span class="mono">R-GLAB 301.2.1</span> for the graded guided lab: R- because it is graded, GLAB because it is guided, then module 301, lesson 2, item 1. <span class="mono">Lesson 301.2</span> for the lesson itself.</p>

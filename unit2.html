 mins:12,
 lead:"You know what evidence closes the module. Now the middle of a lesson day: the activities that get learners there. Choosing the type is two decisions, not one, and getting the second wrong is how a day ends up busy and off-objective at the same time.",
 coach:"Read the two questions and what each activity type is for, then <b>choose the four activities by picking an option in each row</b>. The plan assembles above as you choose. Correct rows lock green, and anything off explains itself so you can pick again.",
 hint:"Ask both questions on every row. What is the objective asking for, Know, Do or Decide? And how far through the module are we, so how much support should still be in front of them? An activity can be the right type and the wrong level of support.",
 frame:function(){return {
   prev:"You designed the summative and wrote the items for the knowledge half of it.",
   now:"You are choosing the activities that get learners ready for it.",
   role:"You are the Product Developer planning one lesson\u2019s practice.",
   resp:"Pick activities that match the objective level and the point in the module.",
   use:"The two questions on this page; the modality and rhythm sections of the Handbook.",
   why:"A day can clear the activated bar and still never touch its objective. This is where that happens.",
   next:"Then you place these on a clock and see whether the day actually holds."
 };},
 html:`<p><strong>Activities are where the objective gets earned.</strong> You have budgeted a day and you know the summative. What fills the middle is a sequence of activities, and choosing the wrong type is how a day ends up active and off-objective at the same time.</p>
 <div class="diag"><svg viewBox="0 0 720 214" role="img" aria-labelledby="wact-d"><title id="wact-d">Activity types matched to what the objective asks for, and to how far through the module you are</title>
 <text x="12" y="16" font-size="9.5" font-family="IBM Plex Mono, monospace" letter-spacing="1" fill="#8fa0ae">WHAT THE OBJECTIVE ASKS FOR</text>
 <rect x="12" y="24" width="222" height="76" rx="9" fill="#f3f0ea" stroke="#e8e1d6" stroke-width="1.5"/>
 <text x="28" y="46" font-size="11.5" font-weight="700" fill="#5a6b7b">KNOW</text>
 <text x="28" y="66" font-size="10.5" fill="#42566a">Discussion · research and</text>
 <text x="28" y="82" font-size="10.5" fill="#42566a">share-out · knowledge check</text>
 <rect x="248" y="24" width="222" height="76" rx="9" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.7"/>
 <text x="264" y="46" font-size="11.5" font-weight="700" fill="#164a85">DO</text>
 <text x="264" y="66" font-size="10.5" fill="#1c2b3a">Demo-along · guided lab ·</text>
 <text x="264" y="82" font-size="10.5" fill="#1c2b3a">assignment lab</text>
 <rect x="484" y="24" width="224" height="76" rx="9" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.7"/>
 <text x="500" y="46" font-size="11.5" font-weight="700" fill="#164a85">DECIDE</text>
 <text x="500" y="66" font-size="10.5" fill="#1c2b3a">Case study · pair triage ·</text>
 <text x="500" y="82" font-size="10.5" fill="#1c2b3a">review queue</text>
 <text x="12" y="128" font-size="9.5" font-family="IBM Plex Mono, monospace" letter-spacing="1" fill="#8fa0ae">HOW FAR THROUGH THE MODULE YOU ARE</text>
 <rect x="12" y="136" width="696" height="30" rx="8" fill="#e3edf8"/>
 <rect x="12" y="136" width="232" height="30" rx="8" fill="#1d5fa8"/>
 <text x="128" y="156" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">I do · modelled</text>
 <text x="360" y="156" text-anchor="middle" font-size="11" fill="#164a85">We do · guided</text>
 <text x="590" y="156" text-anchor="middle" font-size="11" fill="#164a85">You do · independent</text>
 <text x="12" y="188" font-size="10.5" fill="#42566a">Same objective, different activity depending on where you are. A guided lab early is right; the same guided lab in lesson six is the</text>
 <text x="12" y="204" font-size="10.5" fill="#42566a">scaffold failing to fade.</text>
</svg><div class="dcap">Two questions, not one. What is the objective asking for, and how much support should still be there?</div></div>
 <div class="box rule"><span class="bh">The two questions, in order</span><p class="tight"><b>1. What does the objective ask for?</b> A Know objective is served by discussion, research, or a knowledge check. A Do objective needs the learner producing something. A Decide objective needs a situation with more than one defensible answer, plus somewhere to record the reasoning.<br><b>2. How far through the module are we?</b> The same objective takes a different activity in lesson one than in lesson six, because support has to fade. Early, the steps are in front of them. Late, they are not.<br>Getting the first right and the second wrong is the most common way a module feels active and proves nothing.</p></div>
 <div class="box info"><span class="bh">What each type is actually for</span><p class="tight"><b>Discussion.</b> Surfacing what the room already thinks, so you can correct it before it compounds. Cheap and genuinely activated.<br><b>Research and share-out.</b> Building knowledge the learner then has to explain. Watch the clock: it is activated time that produces no skill on its own.<br><b>Demo-along.</b> You work, they follow on their own machines. Modelled practice, and the only version of a demo that is activated.<br><b>Guided lab.</b> Steps in front of them, hands on the work. Where most skill actually gets built.<br><b>Assignment lab.</b> A problem statement and no steps. This is the scaffold coming off, and it is always graded.<br><b>Case study or pair triage.</b> A situation with a defensible judgement to make, which is the only way to practise a Decide objective.</p></div>
 <p class="tight" style="color:var(--muted)">Pick the activities for one lesson. Four decisions, each checked on its own.</p>`,

 html:()=>`${(function(){const o=recall("objective");return o?`<div class="box info"><span class="bh">Designing toward</span><p class="tight">\u201C${o}\u201D</p></div>`:"";})()}<p><strong>The concept:</strong> skill comes from doing, so class time is budgeted like money, and passive listening is the expensive luxury.</p><div class="diag"><svg viewBox="0 0 720 78" role="img" aria-labelledby="d7-t"><title id="d7-t">The 75 percent activated-learning budget: select a segment</title><rect x="20" y="24" width="680" height="34" rx="9" fill="#f3eee6"/><g class="fdu hot" tabindex="0" role="button" aria-label="Activated ≥75%" data-name="Activated ≥75%" data-info="Discussion, labs, building, pair work, share-outs, anything where learners PRODUCE. This is where skill actually forms."><rect x="20" y="24" width="510" height="34" rx="9" fill="#1d5fa8"><animate attributeName="width" from="0" to="510" dur="1s" fill="freeze"/></rect><text x="265" y="46" text-anchor="middle" font-size="13" fill="#fff" font-weight="600">ACTIVATED ≥ 75%</text></g><g class="fdu hot" tabindex="0" role="button" style="animation-delay:.5s" aria-label="Passive ≤25%" data-name="Passive ≤25%" data-info="Listening and watching. Useful in doses: the budget caps it at a quarter of the day. A 90-minute lecture alone eats 37% of a 240-minute day."><rect x="530" y="24" width="170" height="34" rx="9" fill="transparent"/><text x="615" y="46" text-anchor="middle" font-size="12" fill="#5b6b7a">passive ≤ 25%</text></g><line x1="530" y1="16" x2="530" y2="66" stroke="#12283f" stroke-width="2.5"/></svg><div class="dcap">👆 <b>Select either segment.</b> The black line is the bar you’ll design against in a minute.</div></div><p>Guide references: ${gl('modality','modality & the 75% rule')} · ${gl('rhythm','assessment rhythm')}.</p>
 <div class="meta"><span class="mi">🔍</span><div><b>Design note:</b> this course budgets its own minutes by the rule it teaches: one warm-up, then simulations, builders, and review queues.</div></div><p>A lesson day isn\u2019t a list of topics; it\u2019s a <b>rhythm</b>. Two things anchor every day:</p>
 <div class="box info"><span class="bh">The shape of a good day</span><p class="tight"><b>1. It opens and closes with the learner active.</b> A warm-up discussion opens; an exit ticket closes. That frame is non-negotiable: it turns arrival and departure into thinking, not logistics.<br><b>2. The middle earns the objective.</b> Every block between should move the learner toward doing the thing the objective names: short input, then practice, with practice winning the clock. If a block is just the instructor talking, it\u2019s spending time the objective can\u2019t afford.</p></div>
 <p><strong>What you are actually budgeting.</strong> A lesson day is 240 minutes of somebody\u2019s working life. Every block you place is a decision about what that person spends their attention on, and the total does not stretch. Adding a lecture block does not add time to the day; it takes that time from practice.</p>
 <div class="box info"><span class="bh">How the blocks behave</span><p class="tight"><b>Input blocks</b> (lecture, demo, reading) set up practice. They are cheap in small doses and expensive in large ones, because a learner listening is not yet a learner who can do the thing.<br><b>Practice blocks</b> (labs, activities, paired work) are where the objective gets earned. These should be the longest blocks on the page.<br><b>Check blocks</b> (warm-up, exit ticket, quick check) bracket the day and tell you whether it worked. Both ends matter: the warm-up turns arrival into thinking, the exit ticket turns departure into synthesis.<br><b>Breaks</b> are real and they count against the clock. A day planned without them is a day that will overrun.</p></div>
 <div class="box rule"><span class="bh">Three things to get right</span><p class="tight"><b>Input close to use.</b> Twenty minutes of explanation immediately before the practice that needs it beats an hour front-loaded, because the learner has somewhere to put it.<br><b>Difficulty rising.</b> Guided work first, more independent later, so the scaffold fades inside the day as well as across the module.<br><b>Room to recover.</b> If the only unguided work sits at the very end with no time after it, nobody finds out what they got wrong until tomorrow.</p></div>
 <p><strong>The meter is not the goal.</strong> Clearing 75 percent activated tells you the shape is plausible. It does not tell you the day earns its objective. Before you commit a schedule, point at the block where the learner does the thing the objective names. If you cannot, the day covers a topic instead of building a skill, and the meter will still be green.</p>
 <p><strong>In our courses.</strong> An IT Support day that is three hours of vendor video and a twenty-minute lab fails the bar and, more importantly, does not produce anyone who can resolve a ticket. A MERN day that front-loads all theory then runs one long build usually leaves no time for review, so the mistakes ship into the next lesson.</p>
 <p class="tight" style="color:var(--muted)">Build the day below and watch the meter. It is telling you whether the day trains a skill or covers a subject.</p>`,

 html:`<div class="box info"><span class="bh">The lens: does this module hold up the simulation?</span><p class="tight">In an immersive course the class runs like a job: daily stand-ups, rotating roles (scrum lead, note-taker), work arriving as tickets, and a capstone that\u2019s a real handoff. A module can be technically complete, with every lesson and assessment present, and still <b>break the fiction</b>. A lesson that ignores the roles, an assessment that is not framed as work, a week with no stand-up. As you review, ask of each decision: does this keep the learner <em>in the job</em>, or drop them back into \u201Cschool\u201D?</p></div>
 <p><strong>What the simulation is doing.</strong> Immersive courses run the classroom like a job: daily stand-ups, rotating roles, work arriving as tickets or specs, and a capstone presented as a real handoff. The purpose is rehearsal. Learners practise the conditions of employment, including collaboration, communication, and working from incomplete information. Employers hire for that as much as for the technical skill.</p>

 <div class="box rule"><span class="bh">The failure mode</span><p class="tight">A module can be technically complete, with every lesson and assessment present, and still break the simulation: a week with no stand-up, an assessment that drops the job framing, an activity that ignores the roles. The learner falls out of the role and back into \u201Cschool,\u201D and the workplace practice stops accumulating.</p></div>

  lead:"Your day plan for Lesson 401.2, and three notes you made on it while re-reading. Decide which of your own notes are right. Watch what happens on the second one.",
  html:`<div class="dossier"><div class="dh"><span>Your draft \u00b7 1 of 1</span><span>Lesson 401.2 \u00b7 day plan</span></div><div class="db"><b>Lesson objective:</b> \u201CGiven a feature spec, implement an Express route that returns the documented JSON shape and passes the provided tests.\u201D<br><br><b>The submitted 240-minute day:</b> stand-up and warm-up on why APIs break in production (15) \u00b7 lecture on REST conventions and status codes (30) \u00b7 paired spec-reading activity, compare three public API designs and present one (60) \u00b7 break (15) \u00b7 group discussion on trade-offs between the three (45) \u00b7 live walkthrough where you build the endpoint on screen while learners follow along in the repo (45) \u00b7 group retro on what they saw (30). No exit ticket.</div></div>
  <p><strong>What you are checking.</strong> Three things, in this order: does the day clear the activated-learning floor, does it earn its objective, and does it open and close with the learner active. They are independent, so a day can pass the first and fail the second. That combination is the most common finding on real work, and it is the one your own draft is most likely to hide from you.</p>

{id:"d2x",title:"Unit 2 check: write the objective and its assessment",crumb:"Unit 2 \u00b7 Unit check",mins:12,
 lead:"Everything in this unit was judging work someone else wrote. Now write your own. This is the same job as Part 1 of your capstone, at one-fifth the size, so the capstone is not the first time you do it.",
 html:`<div class="box rule"><span class="bh">The task</span><p class="tight">Design has handed you this module objective:</p>
 <p class="tight" style="font-family:var(--mono);background:#f3f0ea;border-left:3px solid var(--blue);padding:8px 11px;margin:8px 0">\u201CGiven a workstation with a reported fault, diagnose the cause and document the resolution to the team standard.\u201D</p>
 <p class="tight">You are building lesson 2 of that module. Write one lesson objective that breaks the module objective into a teachable step, then write the assessment that measures it and name it to convention. Nothing is scored. When you save, you get an experienced developer\u2019s version and the criteria to check yours against.</p></div>`,
 coach:"Write both boxes, then save to compare.",
 activity:{type:"journal",id:"d2xw",
  fields:[
   {label:"1. Your lesson objective. One observable behaviour, with the conditions and what counts as good enough.",
    ph:"Given \u2026 the learner will \u2026 to \u2026"},
   {label:"2. The assessment that measures it, named to convention, and one line on why it measures that objective and not something else.",
    ph:"e.g. R-GLAB 301.2.1 \u2026 because \u2026"}],
  modelHead:"An experienced developer\u2019s version, and how to check yours",
  model:`<p class="tight"><b>Lesson objective.</b> \u201CGiven a workstation that fails to reach the network and a provided checklist, identify the layer at fault and state the next diagnostic step, with the reasoning recorded.\u201D</p>
  <p class="tight"><b>Assessment.</b> R-GLAB 301.2.1, a graded guided lab. The learner works a seeded fault on a live machine and submits the layer they identified, the step they took next, and why. It measures the objective because the learner produces the diagnosis and the reasoning, which is exactly what the objective names. A quiz on the OSI model would measure something adjacent and easier.</p>
  <div class="box rule" style="margin-top:10px"><span class="bh">Check your own against these</span><p class="tight">\u2610 One observable verb, and only one behaviour.<br>\u2610 Conditions stated: what the learner has, or does not have, while performing.<br>\u2610 A criterion: what counts as good enough.<br>\u2610 The objective is a step toward the module objective, not a restatement of it.<br>\u2610 The assessment produces the thing the verb names. If the verb is diagnose, the learner diagnoses something.<br>\u2610 Named to convention, with R- if it is graded.</p></div>
  <p class="tight" style="color:var(--muted)">Where yours differs, the useful question is not whose wording is nicer. It is whether a reviewer could build your assessment from your objective without asking you anything.</p>`},
 transition:"You have written the pair the whole module hangs on. Unit 3 builds the materials that get a learner there."},

 html:`<p><strong>By the end of Unit 3 you'll be able to:</strong></p>
<<<<<<< HEAD
 <ul class="obj"><li>Review a guided-lab draft against the GLAB skeleton, section by section</li><li>Audit module elements against the accessibility launch prerequisite</li><li>Take an AI draft from fluent-but-wrong to shippable, and own every line</li></ul><div class="diag"><svg viewBox="0 0 720 96" role="img" aria-labelledby="da-t"><title id="da-t">The AI workflow loop: select each stage</title><g class="fdu hot" tabindex="0" role="button" style="animation-delay:0.0s" aria-label="AI drafts" data-name="AI drafts" data-info="Seconds, 70% of the way there. Prompt from the Handbook library, filled from the approved objective. A blank page produces a lesson for nobody."><rect x="24" y="30" width="150" height="48" rx="10" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="99" y="58" text-anchor="middle" font-size="12.5" fill="#164a85" font-weight="600">AI drafts</text></g><g class="fdu hot" tabindex="0" role="button" style="animation-delay:0.22s" aria-label="You verify" data-name="You verify" data-info="Every statistic, path, version, and claim. [VERIFY] tags resolved or cut. Fluent is not the same as accurate."><rect x="210" y="30" width="150" height="48" rx="10" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><text x="285" y="58" text-anchor="middle" font-size="12.5" fill="#1c2b3a" font-weight="600">You verify</text></g><g class="fdu hot" tabindex="0" role="button" style="animation-delay:0.44s" aria-label="You correct" data-name="You correct" data-info="House voice restored, scope trimmed to the objective, structure fixed."><rect x="396" y="30" width="150" height="48" rx="10" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><text x="471" y="58" text-anchor="middle" font-size="12.5" fill="#1c2b3a" font-weight="600">You correct</text></g><g class="fdu hot" tabindex="0" role="button" style="animation-delay:0.66s" aria-label="You own it" data-name="You own it" data-info="Your name goes on it at QA. “The AI wrote it” carries no weight at review. The reviewer checks the material."><rect x="582" y="30" width="122" height="48" rx="10" fill="#e7f4ee" stroke="#1f9d76" stroke-width="1.5"/><text x="643" y="58" text-anchor="middle" font-size="12.5" fill="#186b52" font-weight="600">You own it</text></g><path class="fdu" style="animation-delay:0.12s" d="M 178 54 L 202 54" stroke="#1d5fa8" stroke-width="2.5" marker-end="url(#arrA)"/><path class="fdu" style="animation-delay:0.34s" d="M 364 54 L 388 54" stroke="#1d5fa8" stroke-width="2.5" marker-end="url(#arrA)"/><path class="fdu" style="animation-delay:0.56s" d="M 550 54 L 574 54" stroke="#1d5fa8" stroke-width="2.5" marker-end="url(#arrA)"/><defs><marker id="arrA" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1d5fa8"/></marker></defs></svg><div class="dcap">👆 <b>Select each stage.</b> The first is the machine’s; the other three are permanently yours.</div></div><div class="pullquote"><div class="pq">“Learners do better when extraneous material is cut, even when it’s interesting.”</div><div class="pa">Richard Mayer’s coherence principle, <em>Multimedia Learning</em>, the research behind deleting the fun-fact from an AI draft.</div></div><div class="video"><iframe src="https://www.youtube.com/embed/IlU-zDU6aQ0" title="Marty Lobdell: Study Less, Study Smart (Pierce College)" loading="lazy" allowfullscreen></iframe></div><div class="vidcap">🎯 <b>Watch task (or save for the evening):</b> catch his case for why re-reading fails, then connect it to why our labs out-teach our lectures. (<a href="https://www.youtube.com/watch?v=IlU-zDU6aQ0" target="_blank" rel="noopener">Open on YouTube</a>)</div>`,

{id:"wlab",title:"Build a lab from the skeleton",crumb:"Unit 3 \u00b7 Write it",
 mins:12,
 lead:"You have named a lab file and mapped it in your assessment plan. You have not written one. Every guided lab we ship uses the same six sections in the same order, so this lesson is that shape, then you assemble the front matter of one.",
 coach:"Read the six sections and what each is for, then <b>assemble the front matter by picking an option in each of the four rows</b>. The lab takes shape above as you choose. Correct rows lock green, and anything off explains itself so you can pick again.",
 hint:"Ask a learner\u2019s question at each row. What will I be able to do? What do I need in front of me? Why am I doing this? And at the end, what do I now know that I did not before? If a section does not answer its question, it is not finished.",
 frame:function(){return {
   prev:"You sorted which artifacts learners touch and which are for the instructor.",
   now:"You are building the first of the learner-facing ones.",
   role:"You are the Product Developer authoring a guided lab.",
   resp:"Assemble a lab front end a learner could start from without asking anyone a question.",
   use:"The six sections on this page, and the Lab Template in the Handbook.",
   why:"A lab is the biggest block of class time we control. A thin front end wastes the first fifteen minutes of it.",
   next:"Then you repair a set of steps that would not survive a room working alone."
 };},
 html:`<p><strong>A lab is a document with a fixed shape.</strong> Every guided lab we ship uses the same six sections in the same order, and the order is not decoration: each section answers the question a learner has at that moment. Skip one and they stall somewhere you did not plan for.</p>
 <div class="diag"><svg viewBox="0 0 720 250" role="img" aria-labelledby="wlab-d"><title id="wlab-d">The six sections of a guided lab, in order, and the learner question each one answers</title>
 <rect x="12" y="10" width="696" height="34" rx="8" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="26" y="32" font-size="12" font-weight="700" fill="#12283f">1 · Title</text><text x="168" y="32" font-size="11.5" fill="#42566a">What is this, and which lesson does it belong to?</text>
 <rect x="12" y="50" width="696" height="34" rx="8" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="26" y="72" font-size="12" font-weight="700" fill="#12283f">2 · Objectives</text><text x="168" y="72" font-size="11.5" fill="#42566a">What will I be able to do at the end? Two or three bullets.</text>
 <rect x="12" y="90" width="696" height="34" rx="8" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><text x="26" y="112" font-size="12" font-weight="700" fill="#12283f">3 · Requirements</text><text x="168" y="112" font-size="11.5" fill="#42566a">What do I need in front of me before I start?</text>
 <rect x="12" y="130" width="696" height="34" rx="8" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><text x="26" y="152" font-size="12" font-weight="700" fill="#12283f">4 · Scenario</text><text x="168" y="152" font-size="11.5" fill="#42566a">Why am I doing this? The work framed as work.</text>
 <rect x="12" y="170" width="696" height="34" rx="8" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><text x="26" y="192" font-size="12" font-weight="700" fill="#12283f">5 · Steps</text><text x="168" y="192" font-size="11.5" fill="#42566a">Named, with subtasks. One action each, and a visible result.</text>
 <rect x="12" y="210" width="696" height="34" rx="8" fill="#e7f4ee" stroke="#186b52" stroke-width="1.5"/><text x="26" y="232" font-size="12" font-weight="700" fill="#12283f">6 · Reflection</text><text x="168" y="232" font-size="11.5" fill="#42566a">What do I now know, and where would I use it again?</text>
 </svg><div class="dcap">The same six, every time. An SBA uses the same skeleton with Steps replaced by Content Parts.</div></div>
 <div class="box info"><span class="bh">What each section is for, and how it goes wrong</span><p class="tight"><b>Objectives.</b> Two or three, lifted from the lesson objective rather than invented here. A lab with five objectives is two labs.<br><b>Requirements.</b> Accounts, files, versions, access. The section that saves the first fifteen minutes of the room, and the one most often left thin.<br><b>Scenario.</b> The work arrives as work: a ticket, a request, a spec. Not “complete the following exercise”.<br><b>Steps.</b> Named groups with subtasks. One action per step, named specifics, a result the learner can see. That is the next lesson.<br><b>Reflection.</b> One question that makes the learner say what they now know. Not a satisfaction survey, and not trivia storage.</p></div>
 <div class="box rule"><span class="bh">Guided or assignment</span><p class="tight">The same skeleton carries both. A <b>GLAB</b> lays the path out step by step and is where most skill gets built. An <b>ALAB</b> gives a problem statement and lets the learner drive, and it is always graded. Which one you write depends on where you are in the module: guided early, independent later. The scaffold has to fade, and the lab type is how it fades.</p></div>
 <p class="tight" style="color:var(--muted)">Now assemble one. Four decisions, each checked on its own, and the lab takes shape above as you choose. The full template is in the ${gl('labs','Handbook')}.</p>`,

  "Step 1 — Count the actions. Install, and start the server. That is two things, so it is two steps, and the learner can stall on either without you knowing which.",

 <ul class="obj"><li>Review a guided-lab draft against the GLAB skeleton, section by section</li><li>Audit module elements against the accessibility launch prerequisite</li><li>Take an AI draft from fluent-but-wrong to shippable, and own every line</li></ul><div class="diag"><svg viewBox="0 0 720 96" role="img" aria-labelledby="da-t"><title id="da-t">The AI workflow loop: select each stage</title><g class="fdu hot" tabindex="0" role="button" style="animation-delay:0.0s" aria-label="AI drafts" data-name="AI drafts" data-info="Seconds, 70% of the way there. Prompt from the Handbook library, filled from the approved objective, never a blank page."><rect x="24" y="30" width="150" height="48" rx="10" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="99" y="58" text-anchor="middle" font-size="12.5" fill="#164a85" font-weight="600">AI drafts</text></g><g class="fdu hot" tabindex="0" role="button" style="animation-delay:0.22s" aria-label="You verify" data-name="You verify" data-info="Every statistic, path, version, and claim. [VERIFY] tags resolved or cut. Fluent is not the same as accurate."><rect x="210" y="30" width="150" height="48" rx="10" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><text x="285" y="58" text-anchor="middle" font-size="12.5" fill="#1c2b3a" font-weight="600">You verify</text></g><g class="fdu hot" tabindex="0" role="button" style="animation-delay:0.44s" aria-label="You correct" data-name="You correct" data-info="House voice restored, scope trimmed to the objective, structure fixed."><rect x="396" y="30" width="150" height="48" rx="10" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><text x="471" y="58" text-anchor="middle" font-size="12.5" fill="#1c2b3a" font-weight="600">You correct</text></g><g class="fdu hot" tabindex="0" role="button" style="animation-delay:0.66s" aria-label="You own it" data-name="You own it" data-info="Your name goes on it at QA. “The AI wrote it” is never a defense: the reviewer checks the material, not the prompt  activity:{type:"journal",id:"d3ij",fields:[
  {label:"Warm-up: what's your biggest worry about using AI to draft learning content? (Keep it. You'll check it against today's failure patterns at the exit.)",ph:"Honestly, I worry that…"}],modelHead:"What to watch for, and what this unit will do about it",model:`<p class="tight">The worries that come up most: it invents facts confidently, it writes fluent material that teaches nothing, it does not know our learners, and using it feels like cheating.</p><p class="tight">The first three are real and this unit gives you a method for each. The fourth is worth naming directly: using AI is not the problem. Handing over the judgement is. By the end of the unit you should be able to say exactly which parts of a draft are yours.</p>`}},

{id:"slb",title:"Build the lab steps",crumb:"Unit 3 \u00b7 Build",mins:10,
 lead:"A guided lab draft came back from a developer who wrote it fast. The bones are right and the steps are not usable yet. Your job is to repair them, because a lab is the biggest block of class time we control and a vague step burns it.",
 brief:{from:"Product Developer \u00b7 IT domain",re:"GLAB 301.2.1, draft steps need work",text:"I got the structure down but the steps need another pass. Fix the ones that would not survive a room of learners working alone."},
>>>>>>> 2d2f0dcb9d7d4508c547129389825bdd0713a7d5
 html:`
 <p><strong>What a lab step has to do.</strong> A learner working alone reads one step at a time and acts on it. If a step leaves them deciding what you meant, they stop and wait for the instructor, and the whole room slows to the speed of one conversation. So a step is finished when someone who has never seen the software could carry it out and know whether it worked.</p>
 <div class="diag"><svg viewBox="0 0 720 242" role="img" aria-labelledby="slb-d"><title id="slb-d">The parts of a usable lab step</title><rect x="12" y="12" width="696" height="44" rx="9" fill="#f3f0ea" stroke="#e8e1d6" stroke-width="1.5"/><text x="360" y="40" text-anchor="middle" font-size="13" font-family="IBM Plex Mono, monospace" fill="#1c2b3a">Open Windows Security, then Firewall, and confirm it shows On</text><circle cx="30" cy="88" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="30" y="92" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">1</text><text x="50" y="85" font-size="11.5" font-weight="700" fill="#1c2b3a">One action</text><text x="50" y="101" font-size="10.5" fill="#42566a">Two verbs means two steps, and a hidden place to get stuck.</text><circle cx="30" cy="128" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="30" y="132" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">2</text><text x="50" y="125" font-size="11.5" font-weight="700" fill="#1c2b3a">Named specifics</text><text x="50" y="141" font-size="10.5" fill="#42566a">The exact menu, field, value, or file. Never "as needed".</text><circle cx="30" cy="168" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="30" y="172" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">3</text><text x="50" y="165" font-size="11.5" font-weight="700" fill="#1c2b3a">A visible result</text><text x="50" y="181" font-size="10.5" fill="#42566a">What the learner should see, so they can tell success from silent failure.</text><circle cx="30" cy="208" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="30" y="212" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">4</text><text x="50" y="205" font-size="11.5" font-weight="700" fill="#1c2b3a">The reason, if unclear</text><text x="50" y="221" font-size="10.5" fill="#42566a">One clause, so they can recover when their screen differs.</text></svg><div class="dcap">Read it as someone with no context. One thing to do, no guessing, and a way to know it worked.</div></div>
 <div class="box info"><span class="bh">The four things every step needs</span><p class="tight"><b>One action.</b> A step that contains two verbs is two steps. \u201CInstall the client and configure the connection\u201D hides a place to get stuck.<br><b>Named specifics.</b> The exact menu, field, value, or file. \u201COpen settings and adjust as needed\u201D is a decision handed to someone who does not have the information to make it.<br><b>A visible result.</b> What the learner should see when the step worked. Without it they cannot tell success from silent failure, and they carry the failure into the next step.<br><b>The reason, where it is not obvious.</b> One clause. Learners who know why a step exists can recover when their screen does not match yours.</p></div>
 <div class="box rule"><span class="bh">The test before you ship a step</span><p class="tight">Read it as someone with no context: is there exactly one thing to do, do I know precisely where and what to type, and will I know whether it worked? If any answer is no, the step is not finished. Guided means the path is laid out, not that the learner guesses less.</p></div>
 <p><strong>What this looks like in our courses.</strong> For IT Support, \u201CConfigure the firewall appropriately\u201D leaves a learner staring at a settings panel; \u201CIn Windows Defender Firewall, open Advanced Settings, create an inbound rule blocking TCP port 23, and confirm it appears in the rule list\u201D does not. For MERN, \u201CSet up your environment\u201D versus \u201CRun npm install, then confirm the server starts on port 3000 and returns 200 at /health.\u201D</p>

{id:"sax",title:"Run the accessibility audit",crumb:"Unit 3 · Simulation",
 mins:8,
 lead:"Your module is nearly built. Accessibility is a launch prerequisite, so before it goes anywhere you check your own materials against the standard. Six elements you made. Some of them will not pass.",
 brief:{from:"You, to yourself",re:"Module 301 — accessibility pass before Delivery Check",text:"Six of your elements. Nothing releases until they pass, and Delivery Check will apply exactly one test: same information, equivalent ease of access. Apply it first."},
 demo:{eg:"Element: recorded lecture narration over slides. No captions, no transcript.",steps:["One test, always: does a learner with a disability get the <em>same information</em> with <em>equivalent ease</em>? This information exists only as audio.","A deaf or hard-of-hearing learner gets nothing, and so does anyone in a loud room. Captions plus a transcript are required for media, not optional polish.","Verdict: ✗ Send back, missing captions/transcript. Run your six elements through the same single test."]},
 coach:`For each of your own elements: <b>\u2713 Ships as is</b> if it meets the standard, or <b>\u2717 I need to fix this</b> if it does not, naming the exact failure. The checklist: ${gl('access','accessibility essentials')}.`,
 hint:"The test from the standard: can a learner with a disability get the same information and interactions with substantially equivalent ease? Check: alt text that describes, descriptive links, contrast, keyboard paths, captions, selectable text.",
 html:`<p><strong>The concept:</strong> \u201Caccessible\u201D has a legal definition: the same information and interactions, with substantially equivalent ease of use. It's verified, never assumed, and it's a launch prerequisite.</p><div class="diag" role="group" aria-label="Contrast examples: select a pair for its ratio verdict"><div style="display:flex;flex-wrap:wrap;justify-content:center"><span class="swatch hot" tabindex="0" role="button" data-name="White on navy" data-info="15.6:1, far above the bar. Safe for body text at any size." style="background:#12283f;color:#ffffff">White on navy</span><span class="swatch hot" tabindex="0" role="button" data-name="Ink on white" data-info="14.9:1: the default for a reason." style="background:#ffffff;color:#1c2b3a;border:1.5px solid #e8e1d6">Ink on white</span><span class="swatch hot" tabindex="0" role="button" data-name="Gray on gray" data-info="1.9:1, FAILS. Low-vision learners lose this content entirely; so does anyone in sunlight." style="background:#d4d4d4;color:#8a8a8a">Gray on gray</span><span class="swatch hot" tabindex="0" role="button" data-name="Cream on cream" data-info="1.3:1, FAILS. Decorative at best; never for text." style="background:#f7efdc;color:#e6d9b8">Cream on cream</span></div><div class="dcap">👆 <b>Select a pair</b> to see its contrast ratio and verdict. If you have to squint, someone else is locked out.</div></div><div class="meta"><span class="mi">🔍</span><div><b>Design note:</b> this course meets the standard it asks you to enforce. Diagrams carry text titles for screen readers, every interaction works by keyboard, contrast passes, and animations respect reduced-motion settings.</div></div>
 <p><strong>Why accessibility is a launch gate here.</strong> Per Scholas learners include people using screen readers, keyboard-only navigation, screen magnification, and captions. An inaccessible lab does not degrade the experience for some learners. It shuts them out of the work entirely. That is why this gets checked before release instead of after: a fix costs minutes during development and days after launch, and a learner who hit the barrier has already lost the lesson.</p>
 <div class="diag"><svg viewBox="0 0 720 212" role="img" aria-labelledby="sax-d"><title id="sax-d">The five accessibility checks that catch most defects</title><rect x="12" y="12" width="336" height="50" rx="9" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><circle cx="32" cy="37" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="32" y="41" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">1</text><text x="52" y="33" font-size="11.5" font-weight="700" fill="#1c2b3a">Text alternatives</text><text x="52" y="49" font-size="10.5" fill="#42566a">Alt text describes the information, not the picture</text><rect x="362" y="12" width="336" height="50" rx="9" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><circle cx="382" cy="37" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="382" y="41" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">2</text><text x="402" y="33" font-size="11.5" font-weight="700" fill="#1c2b3a">Real text, not images</text><text x="402" y="49" font-size="10.5" fill="#42566a">Code must be selectable, zoomable, readable aloud</text><rect x="12" y="74" width="336" height="50" rx="9" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><circle cx="32" cy="99" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="32" y="103" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">3</text><text x="52" y="95" font-size="11.5" font-weight="700" fill="#1c2b3a">Contrast</text><text x="52" y="111" font-size="10.5" fill="#42566a">4.5:1 for body text, 3:1 for large text</text><rect x="362" y="74" width="336" height="50" rx="9" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><circle cx="382" cy="99" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="382" y="103" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">4</text><text x="402" y="95" font-size="11.5" font-weight="700" fill="#1c2b3a">Never colour alone</text><text x="402" y="111" font-size="10.5" fill="#42566a">Pair colour with a label, icon, or text</text><rect x="12" y="136" width="336" height="50" rx="9" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><circle cx="32" cy="161" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="32" y="165" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">5</text><text x="52" y="157" font-size="11.5" font-weight="700" fill="#1c2b3a">Keyboard reachable</text><text x="52" y="173" font-size="10.5" fill="#42566a">Every control operable, with a visible focus ring</text><rect x="362" y="136" width="336" height="50" rx="9" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><circle cx="382" cy="161" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="382" y="165" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">6</text><text x="402" y="157" font-size="11.5" font-weight="700" fill="#1c2b3a">Captions and headings</text><text x="402" y="173" font-size="10.5" fill="#42566a">Spoken instruction captioned; real headings in order</text></svg><div class="dcap">Held to WCAG 2.1 AA, and checked as you build.</div></div>
 <div class="box info"><span class="bh">The five checks that catch most defects</span><p class="tight"><b>1. Text alternatives.</b> Every image that carries meaning needs alt text describing the information, not the picture. A network diagram\u2019s alt text says what the topology is, not \u201Cdiagram.\u201D Decorative images get empty alt so screen readers skip them.<br><b>2. Real text, never text-in-an-image.</b> Code as a screenshot cannot be read aloud, zoomed cleanly, or copied. Code must be selectable text.<br><b>3. Contrast.</b> Body text needs 4.5:1 against its background, large text 3:1. Grey-on-grey and colored text on colored fills are the usual failures.<br><b>4. Colour always carries a second signal.</b> \u201CThe red rows are wrong\u201D fails for colorblind learners. Pair color with a label, icon, or text.<br><b>5. Keyboard reachable.</b> Every control a learner must use has to be reachable and operable by keyboard, with a visible focus indicator.</p></div>
 <p><strong>Two more that get missed in technical content.</strong> Media needs <b>captions</b> for anything spoken that carries instruction, and a transcript where the audio is the primary source. And <b>headings must be real headings</b> in order, because screen-reader users navigate by heading structure. Bold text sized up looks like a heading but is invisible to that navigation.</p>

{id:"aico",title:"Work with AI, do not hand it the work",crumb:"Unit 3 \u00b7 Practice",mins:10,
 lead:"The most common mistake we see is a developer opening a blank prompt, asking for a lesson, and editing whatever comes back. That is subcontracting the thinking. This lesson is about the difference, because the work you do before you prompt determines whether anything usable comes out.",
 html:`
 <p><strong>Why the blank prompt fails.</strong> A tool asked to write a lesson with no context will produce a lesson for nobody in particular. It will be fluent, plausibly structured, pitched at an average learner who does not exist, and aimed at an objective it invented. You then spend longer repairing it than you would have spent writing from your own outline, and the repairs are the hard part, because you are arguing with something that sounds confident.</p>
 <div class="diag"><svg viewBox="0 0 720 173" role="img" aria-labelledby="aic-l"><title id="aic-l">What each side brings to a draft</title><rect x="12" y="12" width="343" height="147" rx="12" fill="#e3edf8" stroke="#1d5fa8" stroke-width="2"/><text x="183" y="36" text-anchor="middle" font-size="12" font-weight="700" fill="#164a85">WHAT YOU BRING</text><text x="183" y="60" text-anchor="middle" font-size="11" fill="#1c2b3a">The objective and why it exists</text><text x="183" y="79" text-anchor="middle" font-size="11" fill="#1c2b3a">Who these learners are</text><text x="183" y="98" text-anchor="middle" font-size="11" fill="#1c2b3a">What broke last cohort</text><text x="183" y="117" text-anchor="middle" font-size="11" fill="#1c2b3a">Time and equipment limits</text><text x="183" y="136" text-anchor="middle" font-size="11" fill="#1c2b3a">What good enough means here</text><rect x="369" y="12" width="343" height="147" rx="12" fill="#f3f0ea" stroke="#e8e1d6" stroke-width="1.5"/><text x="540" y="36" text-anchor="middle" font-size="12" font-weight="700" fill="#7a8a99">WHAT IT BRINGS</text><text x="540" y="60" text-anchor="middle" font-size="11" fill="#42566a">Speed to a first pass</text><text x="540" y="79" text-anchor="middle" font-size="11" fill="#42566a">Phrasings you did not consider</text><text x="540" y="98" text-anchor="middle" font-size="11" fill="#42566a">Patience for revision</text><text x="540" y="117" text-anchor="middle" font-size="11" fill="#42566a">No stake in the outcome</text><text x="540" y="136" text-anchor="middle" font-size="11" fill="#42566a">No knowledge of your room</text></svg><div class="dcap">The left column is the course. The right column is a faster typewriter.</div></div>
 <p><strong>What changes when you direct instead of ask.</strong> The same tool, given the objective, the learners, the time available, and what went wrong last cohort, produces something you can actually react to. The difference is not the tool. It is that you did the deciding first and used the draft as material rather than as an answer.</p>
 <div class="diag"><svg viewBox="0 0 720 112" role="img" aria-labelledby="aic-d"><title id="aic-d">Where your judgement enters when drafting with AI</title><rect x="12" y="26" width="119" height="60" rx="10" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="71" y="50" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1c2b3a">You decide</text><text x="71" y="68" text-anchor="middle" font-size="10" fill="#42566a">Objective, learners, constraints</text><line x1="135" y1="56" x2="151" y2="56" stroke="#7a8a99" stroke-width="1.6"/><polygon points="153,56 147,52 147,60" fill="#7a8a99"/><rect x="157" y="26" width="119" height="60" rx="10" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><text x="216" y="50" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1c2b3a">You direct</text><text x="216" y="68" text-anchor="middle" font-size="10" fill="#42566a">A brief, not a blank prompt</text><line x1="280" y1="56" x2="296" y2="56" stroke="#7a8a99" stroke-width="1.6"/><polygon points="298,56 292,52 292,60" fill="#7a8a99"/><rect x="302" y="26" width="119" height="60" rx="10" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><text x="361" y="50" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1c2b3a">It drafts</text><text x="361" y="68" text-anchor="middle" font-size="10" fill="#42566a">A first pass to react to</text><line x1="425" y1="56" x2="441" y2="56" stroke="#7a8a99" stroke-width="1.6"/><polygon points="443,56 437,52 437,60" fill="#7a8a99"/><rect x="447" y="26" width="119" height="60" rx="10" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><text x="506" y="50" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1c2b3a">You judge</text><text x="506" y="68" text-anchor="middle" font-size="10" fill="#42566a">Keep, cut, redirect</text><line x1="570" y1="56" x2="586" y2="56" stroke="#7a8a99" stroke-width="1.6"/><polygon points="588,56 582,52 582,60" fill="#7a8a99"/><rect x="592" y="26" width="119" height="60" rx="10" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><text x="651" y="50" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1c2b3a">You own it</text><text x="651" y="68" text-anchor="middle" font-size="10" fill="#42566a">Your name at QA</text></svg><div class="dcap">Four of the five steps are yours. Hand step one to the tool and the rest cannot be done properly.</div></div>
 <div class="box rule"><span class="bh">What directing looks like in practice</span><p class="tight"><b>Bring the objective, do not ask for one.</b> The objective comes from Design or from your own lesson breakdown. A tool inventing one is inventing the point of the lesson.<br><b>Say who the learners are.</b> Week three of an IT Support cohort with no prior networking is a different brief from week nine of MERN. Without it you get an average that fits neither.<br><b>Name the constraints.</b> Ninety minutes, no admin rights on the lab machines, one shared server. Constraints are most of what makes a lesson buildable and a tool cannot guess them.<br><b>Ask for a draft, not a deliverable.</b> Expecting to rewrite half of it changes how you read it. Expecting to ship it changes what you accept.<br><b>Reject and redirect rather than patch.</b> If the shape is wrong, say what is wrong and ask again. Editing a badly shaped draft sentence by sentence keeps the bad shape.</p></div>
 <div class="box info"><span class="bh">The tell that someone outsourced instead of collaborated</span><p class="tight">You can usually see it in the finished material. The examples are generic where they should be domain-specific. The lesson covers a topic evenly instead of weighting what learners actually struggle with. The tone shifts between sections. Nobody can say why a particular activity is there. Every one of those is a decision the developer skipped, and no amount of proofreading puts them back.</p></div>
 <p><strong>Where this leaves you.</strong> Using AI heavily is fine. Handing over the judgement is not, and the two look similar from the outside. That is why we ask how you worked instead of whether you used a tool. The next two lessons cover checking what comes back and the rules about what you may put in. This lesson covers what happens before you prompt.</p>
 <div class="box rule"><span class="bh">Required: the Google AI Professional Certificate</span><p class="tight">Every Development SME completes the <a href="https://www.coursera.org/professional-certificates/google-ai" target="_blank" rel="noopener"><b>Google AI Professional Certificate</b></a> on Coursera. Eight short courses, roughly eight hours in total, covering prompting, responsible use, and building with Gemini, Google Workspace, and AI Studio. Send the completion certificate to your manager when you finish it.<br><br><b>Why we ask for it.</b> This lesson gives you our position on AI, which is a position about judgement and ownership. The certificate gives you the tool fluency underneath it, and the two are not substitutes. A developer who has our standards but cannot get a usable draft out of a tool works slowly. A developer who is fluent with the tool but skips the deciding produces the material this unit exists to catch. You need both.<br><br><b>When to do it.</b> Before your first real build if you can, and it is a reasonable use of your onboarding time. It is not a prerequisite for finishing this course or the capstone. Note that it teaches Google tools specifically, so check the ${gl('software','approved software list')} for what is actually cleared for our work before you build anything with a tool it introduces.</p></div>

     {t:"Proofread the whole thing for typos.",fb:"Worth doing eventually, but not the best use of your last fifteen minutes. A typo costs a learner a second; misplaced practice costs them the lesson."}]},

    text:"The second draft includes a paragraph claiming most network faults occur at layer 1, with a specific percentage.",
    opts:[
     {t:"Keep it, since it sounds right and gives learners a useful rule of thumb.",fb:"Sounding right is the problem. That figure has no source, and a learner repeating it in an interview is repeating something we invented."},
     {t:"Cut it, or replace it with something you can stand behind.",ok:true,fb:"Right. Physical-layer faults being common is defensible. A precise percentage with no source is not, and you own every line that ships."},
     {t:"Soften it to \u201Cresearch suggests\u201D and move on.",fb:"That launders the invention instead of removing it. A vague attribution on a made-up number is worse than the number alone."}]},
   {tag:"Step 4 of 5 \u00b7 The part it cannot help with",
    text:"You have a usable draft with fifteen minutes left. What do you spend them on?",
    opts:[
     {t:"Ask the tool to double the practice activities so learners have more to do.",fb:"More volume is not better practice. Whether the practice is right depends on what your learners struggle with, which is a judgement the tool cannot make."},
     {t:"Decide where last cohort got stuck and weight the practice toward that.",ok:true,fb:"Right. This is the decision only you can make, because it comes from having watched a room. It is also what turns a generic lesson into one that fits your cohort."},

    text:"The lesson goes into the repo for QA. What do you record about how it was made?",

     {t:"Note that AI wrote it, so QA knows to check everything.",fb:"That hands your responsibility to QA. You are the one who verified it, and the record should say what you checked instead of asking someone else to start over."}]}],

{id:"s6",title:"Red-pen the AI draft",crumb:"Unit 3 · Simulation",
 mins:10,
 lead:"You used the house prompt to draft Lesson 301.2 narration. Here's what came back. Fix it the same way. Select the problem, choose the repair.",
 
 brief:{from:"Product Developer · IT domain",re:"Lesson 301.2 narration. AI draft attached",text:"The house prompt produced this draft in seconds. It reads well, which is the reason it still needs checking: fluent is not the same as accurate."},
 demo:{eg:"Worked example. Draft sentence: “Studies confirm 73.6% of help-desk tickets are printer-related.”",steps:["Step 1: Spot the problem. A suspiciously precise statistic with no source is the classic AI tell: fluent, confident, and unverifiable. Flag it.","Step 2: Choose the right repair. The fix is not to round the number or add ‘(source: research)’. Either replace it with a claim that stands on its own, such as ‘printer issues are a common ticket category’, or tag it [VERIFY] and find real data before it ships.","Step 3: Repeat for every problem. That was one of four patterns. Now find all four in the draft below: select the sentence, then choose the repair."]},
 coach:`Same mechanic as the KBA repair: <b>select a sentence that shouldn't ship</b>, then pick the correct fix. Four problems: a fabricated statistic, an invented path, off-objective filler, and marketing voice. The prompt library is in the Guide: ${gl('prompts','prompts')}.`,
 hint:"Fluent \u2260 accurate. Precise-looking numbers, confident file paths, fun facts, and \u201Crockstar\u201D energy are AI's four favorite gifts. Return all four.",
 html:`<p>Fluent prose hides its errors well, that\u2019s the danger. When you review an AI draft, you\u2019re hunting for four things specifically:</p>
 <div class="box info"><span class="bh">What to red-pen</span><p class="tight"><b>Factual drift</b>: confident claims, version numbers, or commands that are subtly wrong. <b>Invented specifics</b>: details it made up to sound complete. <b>Filler</b>: words that read smoothly but teach nothing. <b>Voice mismatch</b>: generic tone where the course has a specific one. You own every line that ships, so \u201Cthe AI wrote it\u201D explains nothing about a defect.</p></div><div class="meta"><span class="mi">🔍</span><div><b>Design note:</b> the coach bar and hint button are moment-of-need support, placed at the point of work instead of in a separate help section. Build the same into your own labs.</div></div>
 <p><strong>Why fluent drafts are the dangerous ones.</strong> AI writes confident, well-formed prose whether or not the content is correct. There is no signal in the writing that tells you where it invented something, so \u201Cit reads well\u201D is not evidence it is right. Reviewing an AI draft is a different task from editing a human draft: with a human you are usually improving expression, with AI you are verifying claims.</p>
 <div class="diag"><svg viewBox="0 0 720 150" role="img" aria-labelledby="s6-d"><title id="s6-d">The four patterns to look for in an AI draft</title><rect x="12" y="12" width="336" height="50" rx="9" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><circle cx="32" cy="37" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="32" y="41" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">1</text><text x="52" y="33" font-size="11.5" font-weight="700" fill="#1c2b3a">Factual drift</text><text x="52" y="49" font-size="10.5" fill="#42566a">Versions, flags, paths that are plausible and wrong</text><rect x="362" y="12" width="336" height="50" rx="9" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><circle cx="382" cy="37" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="382" y="41" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">2</text><text x="402" y="33" font-size="11.5" font-weight="700" fill="#1c2b3a">Invented specifics</text><text x="402" y="49" font-size="10.5" fill="#42566a">Statistics and citations added to sound authoritative</text><rect x="12" y="74" width="336" height="50" rx="9" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><circle cx="32" cy="99" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="32" y="103" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">3</text><text x="52" y="95" font-size="11.5" font-weight="700" fill="#1c2b3a">Filler</text><text x="52" y="111" font-size="10.5" fill="#42566a">Sentences that restate or announce, teaching nothing</text><rect x="362" y="74" width="336" height="50" rx="9" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><circle cx="382" cy="99" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="382" y="103" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">4</text><text x="402" y="95" font-size="11.5" font-weight="700" fill="#1c2b3a">Voice mismatch</text><text x="402" y="111" font-size="10.5" fill="#42566a">Generic tone, or vocabulary not yet introduced</text></svg><div class="dcap">Fluent prose hides its errors. You are verifying claims, not improving expression.</div></div>
 <div class="box info"><span class="bh">The four patterns, and how to spot each</span><p class="tight"><b>1. Factual drift.</b> Version numbers, command flags, port numbers, menu paths, and specifications that are plausible but wrong. Spot it by checking anything a learner would type or rely on against the actual source.<br><b>2. Invented specifics.</b> Statistics, study citations, and precise figures added to sound authoritative. Spot it by asking where the number came from. If you cannot trace it, it does not ship.<br><b>3. Filler.</b> Sentences that restate the previous sentence or announce what is about to happen. Spot it by deleting the sentence and checking whether anything was lost.<br><b>4. Voice mismatch.</b> Generic instructional tone where the course has a specific one, or vocabulary the course has not introduced yet. Spot it by reading it next to a page you already trust.</p></div>
 <div class="box rule"><span class="bh">The repair rules</span><p class="tight">Fix the claim, do not soften it. Rounding a fabricated statistic or adding \u201Cresearch suggests\u201D keeps the problem and hides it. Either replace it with something that stands on its own, or tag it <span class="mono">[VERIFY]</span> and confirm it before release. Cutting is a legitimate repair: if a sentence cannot be verified and is not needed, delete it.</p></div>
 <p><strong>Ownership does not transfer.</strong> Whatever ships carries your name at QA, not the tool\u2019s. \u201CThe AI wrote it\u201D is not a defense for a wrong command in a lab that a learner will run. Learners are held to this same standard when they use AI, so we hold it visibly.</p>
 <p><strong>In our courses.</strong> An AI draft of an IT Support lesson will confidently name a Windows settings path that moved two versions ago. A MERN draft will invent an npm flag or a method signature that does not exist. Both read perfectly and both break in a classroom.</p>
 <p class="tight" style="color:var(--muted)">Select each problem sentence in the draft below, then choose the repair. Name which of the four patterns it was.</p>`,

{id:"sai",title:"Use AI without outsourcing responsibility",crumb:"Unit 3 · Review queue",
 mins:8,
 lead:"Technical verification is only half the standard. The other half is governance: what went into the tool, whether the tool was approved for it, and who owns what came out. Five workflows follow, some of them yours. Decide which you would defend.",
 coach:`For each workflow: <b>✓ I would defend this</b> if you could stand behind it, or <b>✗ I would not ship this</b> if you could not, naming the exact failure. Risky inputs, unverifiable outputs, hidden assessment generation, and vague human review are the four that come up. Guardrails: ${gl('ai','the AI section')}.`,
 hint:"Run the checks in order: what went IN (confidential? learner data? approved tool?), what came OUT (verified? sourced?), and who OWNS it (named reviewer? disclosed where required?).",
 demo:{eg:"Workflow: “I pasted the client’s job-task analysis: company name and all: into a free public chatbot to draft objectives. Way faster.”",steps:[
 "Input check comes first, always: client-identifying material entered into an unapproved public tool is protected information leaving our custody. No matter how good the output is.",
 "‘Faster’ is true and irrelevant. The standard is a workflow we could defend to the client whose data it is; speed defends nothing.",
 "So this one does not ship as it stands. Either it runs on an approved tool with the client material scrubbed out, or it does not happen at all. Work your queue in the same order every time: what went in, which tool, how it was verified, and who owns the result."]},
 html:`<div class="box info"><span class="bh">Governance is three questions</span><p class="tight">Technical correctness isn\u2019t enough. An AI workflow also has to pass: <b>(1) Protected information</b>: did anyone paste learner data, client-confidential material, or unreleased content into a tool that isn\u2019t approved for it? <b>(2) Approved tools</b>: is this an org-sanctioned tool, or a convenient unknown? <b>(3) A named owner</b>: is there a specific human accountable for the output, or did the tool quietly become the author? A workflow fails if you couldn\u2019t defend it to a learner, a client, an instructor, or an auditor.</p></div>
 <p><strong>Technical correctness is only half the review.</strong> A draft can be accurate and still be a workflow we cannot defend. Governance asks a different question from \u201Cis this right?\u201D It asks: if a learner, a client, an instructor, or an auditor saw exactly how this was made, would it hold up?</p>
 <div class="diag"><svg viewBox="0 0 720 112" role="img" aria-labelledby="sai-d"><title id="sai-d">The three questions that decide whether an AI workflow is defensible</title><rect x="12" y="26" width="216" height="60" rx="10" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="120" y="50" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1c2b3a">What went in?</text><text x="120" y="68" text-anchor="middle" font-size="10" fill="#42566a">Learner or client data?</text><line x1="232" y1="56" x2="248" y2="56" stroke="#7a8a99" stroke-width="1.6"/><polygon points="250,56 244,52 244,60" fill="#7a8a99"/><rect x="254" y="26" width="216" height="60" rx="10" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><text x="362" y="50" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1c2b3a">Which tool?</text><text x="362" y="68" text-anchor="middle" font-size="10" fill="#42566a">Approved for that data?</text><line x1="474" y1="56" x2="490" y2="56" stroke="#7a8a99" stroke-width="1.6"/><polygon points="492,56 486,52 486,60" fill="#7a8a99"/><rect x="496" y="26" width="216" height="60" rx="10" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><text x="604" y="50" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1c2b3a">Who owns it?</text><text x="604" y="68" text-anchor="middle" font-size="10" fill="#42566a">A named human signs off</text></svg><div class="dcap">All three have to pass. Any one failing makes the workflow indefensible, however useful the output.</div></div>
 <div class="box info"><span class="bh">The three governance questions</span><p class="tight"><b>1. What went in?</b> Learner data, client-confidential material, unreleased curriculum, and anything under NDA do not go into a tool that is not approved for them. Once pasted, you cannot take it back. Pseudonymized or synthetic examples usually do the same job.<br><b>2. Which tool?</b> Approved, org-sanctioned tools only. \u201CIt was free and quick\u201D is how content ends up in a system nobody has vetted for retention or training use.<br><b>3. Who owns the output?</b> A named human verifies and signs off. If the answer is \u201Cthe tool produced it and we shipped it,\u201D the tool has quietly become the author, and no one checked the claims.</p></div>
 <div class="box rule"><span class="bh">The two rules for learner-facing AI</span><p class="tight">When learners use AI in an activity, the activity must make their <b>own thinking visible</b> (what they asked, what they changed, what they rejected and why), and it must be assessed with the <b>AI Integrity Rubric</b> so \u201CI used AI\u201D is not itself the finding. AI use is not the problem. Unexamined AI use is.</p></div>
 <p><strong>Where the line usually falls.</strong> Drafting a lesson outline from your own module blueprint with an approved tool, then verifying every claim, is fine. Pasting a cohort\u2019s submissions into an unapproved tool to \u201Csummarize the trends\u201D is not, regardless of how useful the summary is. The difference is what went in and who is accountable for what came out.</p>
 <p class="tight" style="color:var(--muted)">Read each workflow below. Stand behind the ones you could defend, and where you could not, name which of the three questions it fails.</p>`,

{id:"d3x",title:"Unit 3 check: write a lab step that survives a room",crumb:"Unit 3 \u00b7 Unit check",mins:12,
 lead:"This unit was about producing material other people can use. Write a piece of it. Your capstone asks for a built lesson and activity; this is one step of one, with the same standards applied.",
 html:`<div class="box rule"><span class="bh">The task</span><p class="tight">You are writing the lab for the objective from the last unit: the learner diagnoses a network fault and records the reasoning. Write step 3, the point where the learner runs their first diagnostic.</p>
 <p class="tight">Thirty learners will work this alone, on lab machines with no admin rights, while one instructor circulates. Write it so nobody has to raise a hand to find out what you meant.</p></div>`,
 coach:"Write the step, then note what you did about accessibility and about AI. Save to compare.",
 activity:{type:"journal",id:"d3xw",
  fields:[
   {label:"1. Step 3 of the lab. One action, named specifics, and a result the learner can see.",
    ph:"Step 3: \u2026"},
   {label:"2. One accessibility problem your step could have had, and what you did so it does not.",
    ph:"e.g. I did not say \u201Cclick the red icon\u201D because \u2026"},
   {label:"3. If you drafted any of this with AI, what did you check before keeping it? If you did not use AI, what would you have checked?",
    ph:"I verified \u2026"}],
  modelHead:"An experienced developer\u2019s version, and how to check yours",
  model:`<p class="tight"><b>Step 3.</b> \u201COpen a terminal and run <span class="mono">ping 10.0.0.1</span>, the lab gateway. Record whether you get replies or a timeout. A timeout here points below the network layer, so do not change any settings yet.\u201D</p>
  <p class="tight"><b>Accessibility.</b> The step names the command as selectable text rather than a screenshot, so it can be read aloud, zoomed, and copied. It also describes the outcome in words (replies or timeout) rather than telling the learner to look for a colour or an icon.</p>
  <p class="tight"><b>AI.</b> If a draft produced this, the things to verify are the address, that the command exists on the lab image, and that it runs without admin rights. All three are the kind of detail a tool will supply confidently and get wrong.</p>
  <div class="box rule" style="margin-top:10px"><span class="bh">Check your own against these</span><p class="tight">\u2610 One action. If your step contains two verbs, it is two steps.<br>\u2610 Named specifics: the exact command, address, menu, or file. No \u201Cas needed\u201D or \u201Cappropriately\u201D.<br>\u2610 A visible result, so the learner can tell success from silent failure.<br>\u2610 It works within the stated constraint: no admin rights.<br>\u2610 Nothing depends on seeing a colour, and no instruction lives only inside an image.<br>\u2610 Anything a tool drafted, you can say what you checked.</p></div>`},

{id:"qag",title:"QA your own module before you hand it over",crumb:"Unit 4 \u00b7 Self-check",
 mins:12,
 lead:"Your module will be reviewed against the standards, and the cheapest version of every finding is the one you catch yourself. This is the pass you run the day before you hand over: alignment, flow, accessibility, completeness, filing. Five checks, in that order, on your own work.",
 coach:"Read the five checks and how to run each one, then work through six states of your own module. <b>\u2713 Ready to hand over</b> if it would survive review, <b>\u2717 I fix this first</b> if it would not, and name which check it fails.",
 hint:"Run them in order, because alignment problems make the others pointless to fix. Watch for the two that are easy to wave through: an assessment that is mapped but cannot measure its objective, and a module that clears the activated floor while never letting the scaffold fade.",
 frame:function(){const c=primary()||{domain:"your project"};return {
   prev:"You have built the materials for your "+c.domain+" module and decided what done means.",
   now:"You are reviewing your own module before anyone else does.",
   role:"You are the Product Developer checking your own work, not a reviewer checking someone else\u2019s.",
   resp:"Decide what is ready to hand over and what you fix first.",
   use:"The five checks on this page.",
   why:"A finding you catch costs minutes. The same finding at Delivery Check can hold a launch.",
   next:"Then the judgement calls: your rubric, teachability, change after launch, and holding quality under pressure."
 };},
 html:`<p><strong>Your module gets reviewed. Do it first yourself.</strong> Everything you build goes through review gates before it reaches a learner, and the cheapest version of every finding is the one you catch before anyone else sees it. This lesson is the pass you run over your own module the day before you hand it over.</p>
 <div class="box info"><span class="bh">What happens downstream, so you know what is coming</span><p class="tight">Four gates sit between a request and a cohort. <b>Design Review</b> decides whether the design package is complete enough to build from, before you start. <b>Development Review</b> checks the built materials against the standards, and it is the one your module meets. <b>Delivery Check</b> asks whether the course is launch-ready: accessible, instructor-enabled, environment verified. <b>Delivery Review</b> reads what the cohort produced and feeds the next revision. QA writes findings, you fix them, they get re-checked. None of that is adversarial, and none of it is a substitute for checking your own work.</p></div>

 <rect x="12" y="54" width="696" height="38" rx="9" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="28" y="78" font-size="12" font-weight="700" fill="#12283f">2 · Flow</text><text x="184" y="78" font-size="11.5" fill="#42566a">Activated share clears the floor, and the scaffold fades to independent.</text>
 <rect x="12" y="98" width="696" height="38" rx="9" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><text x="28" y="122" font-size="12" font-weight="700" fill="#12283f">3 · Accessibility</text><text x="184" y="122" font-size="11.5" fill="#42566a">Alt text, real text not images, contrast, keyboard, captions, headings.</text>
 <rect x="12" y="142" width="696" height="38" rx="9" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><text x="28" y="166" font-size="12" font-weight="700" fill="#12283f">4 · Completeness</text><text x="184" y="166" font-size="11.5" fill="#42566a">Deliverables list satisfied, and a rubric on every graded item.</text>
 <rect x="12" y="186" width="696" height="38" rx="9" fill="#e7f4ee" stroke="#186b52" stroke-width="1.5"/><text x="28" y="210" font-size="12" font-weight="700" fill="#12283f">5 · Filing</text><text x="184" y="210" font-size="11.5" fill="#42566a">Named to convention, right subfolders, blueprint matches the repo.</text>
 </svg><div class="dcap">Run them in this order. Alignment problems make the other four pointless to fix.</div></div>
 <div class="box rule"><span class="bh">How to actually run each one</span><p class="tight"><b>Alignment.</b> List your objectives in one column and your assessments in another, and draw the lines. An objective with no line is a gap; an assessment with no line is noise. Then check the last line reaches unaided performance.<br><b>Flow.</b> Add up activated minutes per day against the total. Then read the module start to finish and ask whether support actually decreases, or whether lesson six is as guided as lesson one.<br><b>Accessibility.</b> Tab through every interaction without touching the mouse. Try to select your code samples. Check any colour that carries meaning has a second signal. Look for captions on anything spoken.<br><b>Completeness.</b> Open the deliverables checklist and tick it literally. Then filter for graded items and confirm each has a rubric attached.<br><b>Filing.</b> Read your file names without opening the files, and ask whether you could tell what each one is. Then open the blueprint and check nothing built is missing from it.</p></div>
 <p><strong>The habit this builds.</strong> A developer who runs this pass has a very different relationship with QA. Findings become confirmations rather than surprises, the fix cycle shortens, and the module ships on the date it was supposed to. A developer who does not runs the same checks anyway, just later and with an audience.</p>
 <p class="tight" style="color:var(--muted)">Six states of your own module follow. Decide which are ready to hand over and which you fix first, and name what is wrong.</p>`,

{id:"wqa",title:"Write a finding someone can act on",crumb:"Unit 4 \u00b7 Write it",
 mins:11,
 lead:"Four lessons in this course have told you that a vague verdict does not survive a handoff. None has asked you to write a finding. This one does, because naming a defect precisely is harder than spotting one, and it is the skill that decides whether your QA notes speed a build up or slow it down.",
 coach:"Read the three parts a finding needs, then <b>write one in the box</b> and press <b>Check my draft</b>. Each part is checked on its own, and anything missing tells you what is missing. Revise and check as often as you like.",
 hint:"Three questions, in order. Could the person fixing this open the right file from what you wrote? Have you named a defect or a feeling? And would they know what change closes it? If any answer is no, that is the part to add.",
 frame:function(){return {
   prev:"You know which gate owns which question, and you have scored work against a rubric.",
   now:"You are writing the finding itself, which is what a gate actually produces.",
   role:"You are the reviewer writing to the developer who has to fix it, and next month that is you.",
   resp:"Produce one finding that can be closed without a conversation.",
   use:"The three parts on this page.",
   why:"A finding that cannot be acted on costs a round trip, and a build only has so many before the date moves.",
   next:"Then the judgement calls: teachability, change after launch, and holding quality when the plan slips."
 };},
 html:`<p><strong>You have read this rule four times.</strong> Every review lesson in this course has said some version of it: a vague verdict does not survive a handoff, name the specific defect. Nobody has yet asked you to write one, and writing one is harder than recognising a bad one.</p>
 <p><strong>Why it matters more than it sounds.</strong> A finding is a message to a person who was not in your head. If it does not name the artifact, they hunt for it. If it names a feeling instead of a defect, they guess what you meant. If it stops at diagnosis, they invent a fix you may reject. Each of those costs a round trip, and a build has a limited number of round trips in it before the date moves.</p>
 <div class="diag"><svg viewBox="0 0 720 150" role="img" aria-labelledby="wqa-d"><title id="wqa-d">The three parts of a finding someone can act on</title>
 <rect x="12" y="16" width="220" height="118" rx="10" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.6"/>
 <text x="122" y="44" text-anchor="middle" font-size="11.5" font-weight="700" fill="#164a85">1 · WHICH ARTIFACT</text>
 <text x="122" y="70" text-anchor="middle" font-size="11.5" fill="#1c2b3a">GLAB 301.2.1, step 4</text>
 <text x="122" y="94" text-anchor="middle" font-size="10.5" fill="#5b6b7a">Precise enough to open</text>
 <text x="122" y="112" text-anchor="middle" font-size="10.5" fill="#5b6b7a">without asking you.</text>
 <rect x="250" y="16" width="220" height="118" rx="10" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.6"/>
 <text x="360" y="44" text-anchor="middle" font-size="11.5" font-weight="700" fill="#164a85">2 · WHAT IS WRONG</text>
 <text x="360" y="70" text-anchor="middle" font-size="11.5" fill="#1c2b3a">No path, no expected</text>
 <text x="360" y="88" text-anchor="middle" font-size="11.5" fill="#1c2b3a">output</text>
 <text x="360" y="112" text-anchor="middle" font-size="10.5" fill="#5b6b7a">A defect, not a mood.</text>
 <rect x="488" y="16" width="220" height="118" rx="10" fill="#e7f4ee" stroke="#186b52" stroke-width="1.6"/>
 <text x="598" y="44" text-anchor="middle" font-size="11.5" font-weight="700" fill="#186b52">3 · WHAT CLOSES IT</text>
 <text x="598" y="70" text-anchor="middle" font-size="11.5" fill="#1c2b3a">Add the path and the</text>
 <text x="598" y="88" text-anchor="middle" font-size="11.5" fill="#1c2b3a">passing output</text>
 <text x="598" y="112" text-anchor="middle" font-size="10.5" fill="#5b6b7a">So it can be fixed once.</text>
 </svg><div class="dcap">Drop any one of the three and the finding comes back to you instead of getting fixed.</div></div>
 <div class="box rule"><span class="bh">The words that look like findings and are not</span><p class="tight">Feels weak. Seems unclear. A bit confusing. Could be better. Needs tightening. Every one of these describes the reader rather than the artifact, and none of them can be closed, because nobody can tell when they are done. If you catch yourself writing one, the useful question is: <b>what did I actually notice?</b> Usually the answer is concrete and was there all along.</p></div>
 <div class="box info"><span class="bh">This cuts both ways</span><p class="tight">You will receive findings as well as write them, and the same standard applies. A finding on your work that names the artifact, the defect, and the change is a gift: you can fix it in one pass. One that says a lesson feels thin is a conversation you now have to schedule. Write the kind you would want to receive.</p></div>
 <p class="tight" style="color:var(--muted)">One defect follows. Write the finding, and check it as many times as you like.</p>`,

 html:`<div class="box info"><span class="bh">Confirm your project</span><p class="tight">Each unit is a separate package, so your Unit 1 choice doesn\u2019t carry over automatically. If the picker appears above, just reselect your project: the rest of this unit adapts to it.</p></div><p><strong>Three names for the same work.</strong> Unit 1 gave you our seven-step pipeline. This unit is about backward design. You will also hear ADDIE. They are not three competing methods to choose between: they describe the same build at three different grains, and knowing which one someone is talking about saves a lot of confusion in meetings.</p>
 <div class="diag"><svg viewBox="0 0 720 268" role="img" aria-labelledby="addie-d"><title id="addie-d">ADDIE names the project phases, our seven steps are those phases as we run them, and backward design is the order of decisions inside the Design and Development phases</title>
 <text x="12" y="14" font-size="9.5" font-family="IBM Plex Mono, monospace" letter-spacing="1" fill="#8fa0ae">ADDIE · WHAT PHASE THE PROJECT IS IN</text>
 <rect x="12" y="22" width="132" height="40" rx="8" fill="#f3f0ea" stroke="#e8e1d6" stroke-width="1.4"/>
 <text x="78" y="47" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5a6b7b">Analysis</text>
 <rect x="150" y="22" width="132" height="40" rx="8" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.8"/>
 <text x="216" y="47" text-anchor="middle" font-size="11.5" font-weight="700" fill="#164a85">Design</text>
 <rect x="288" y="22" width="132" height="40" rx="8" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.8"/>
 <text x="354" y="47" text-anchor="middle" font-size="11.5" font-weight="700" fill="#164a85">Development</text>
 <rect x="426" y="22" width="132" height="40" rx="8" fill="#f3f0ea" stroke="#e8e1d6" stroke-width="1.4"/>
 <text x="492" y="47" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5a6b7b">Implementation</text>
 <rect x="564" y="22" width="144" height="40" rx="8" fill="#f3f0ea" stroke="#e8e1d6" stroke-width="1.4"/>
 <text x="636" y="47" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5a6b7b">Evaluation</text>

 <text x="12" y="86" font-size="9.5" font-family="IBM Plex Mono, monospace" letter-spacing="1" fill="#8fa0ae">OUR SEVEN STEPS · THE SAME PHASES, AS WE RUN THEM</text>
 <text x="78" y="106" text-anchor="middle" font-size="10" fill="#42566a">1 Handoff</text>
 <text x="78" y="121" text-anchor="middle" font-size="10" fill="#42566a">2 Initiation</text>
 <text x="216" y="106" text-anchor="middle" font-size="10" font-weight="600" fill="#1c2b3a">3 Planning</text>
 <text x="354" y="106" text-anchor="middle" font-size="10" font-weight="600" fill="#1c2b3a">4 Developing</text>
 <text x="492" y="106" text-anchor="middle" font-size="10" fill="#42566a">5 QA</text>
 <text x="492" y="121" text-anchor="middle" font-size="10" fill="#42566a">6 Delivery</text>
 <text x="636" y="106" text-anchor="middle" font-size="10" fill="#42566a">7 Evaluate</text>

 <path d="M150,138 L150,152 L420,152 L420,138" fill="none" stroke="#1d5fa8" stroke-width="1.6"/>
 <text x="285" y="169" text-anchor="middle" font-size="10" font-style="italic" fill="#164a85">backward design decides the order of these two</text>

 <text x="12" y="196" font-size="9.5" font-family="IBM Plex Mono, monospace" letter-spacing="1" fill="#8fa0ae">BACKWARD DESIGN (UbD) · WHAT ORDER YOU DECIDE THINGS IN</text>
 <rect x="12" y="204" width="216" height="52" rx="8" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.6"/>
 <text x="26" y="222" font-size="10" font-family="IBM Plex Mono, monospace" fill="#8fa0ae">STAGE 1</text>
 <text x="26" y="241" font-size="11.5" font-weight="700" fill="#12283f">Outcomes</text>
 <text x="120" y="241" font-size="10.5" fill="#42566a">what a graduate can do</text>
 <path d="M232,230 L246,230" stroke="#1d5fa8" stroke-width="2"/><polygon points="248,230 242,226 242,234" fill="#1d5fa8"/>
 <rect x="252" y="204" width="216" height="52" rx="8" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.6"/>
 <text x="266" y="222" font-size="10" font-family="IBM Plex Mono, monospace" fill="#8fa0ae">STAGE 2</text>
 <text x="266" y="241" font-size="11.5" font-weight="700" fill="#12283f">Evidence</text>
 <text x="352" y="241" font-size="10.5" fill="#42566a">what would prove it</text>
 <path d="M472,230 L486,230" stroke="#1d5fa8" stroke-width="2"/><polygon points="488,230 482,226 482,234" fill="#1d5fa8"/>
 <rect x="492" y="204" width="216" height="52" rx="8" fill="#fff" stroke="#e8e1d6" stroke-width="1.6"/>
 <text x="506" y="222" font-size="10" font-family="IBM Plex Mono, monospace" fill="#8fa0ae">STAGE 3</text>
 <text x="506" y="241" font-size="11.5" font-weight="700" fill="#12283f">Experiences</text>
 <text x="600" y="241" font-size="10.5" fill="#42566a">lessons, labs, days</text>
</svg><div class="dcap">Stages 1 and 2 are our Planning step. Stage 3 is Developing. Content is decided last in all three descriptions.</div></div>
 <div class="box info"><span class="bh">Which one someone means</span><p class="tight"><b>ADDIE</b> is the project spine. It answers what phase we are in, who owns the work, and what gets produced. When a director asks where a build is, the answer is an ADDIE phase.<br><b>Our seven steps</b> are those same phases as we actually run them, with our gates and our artifacts attached. Handoff and Initiation are Analysis; Planning is Design; Developing is Development; QA and Delivery are Implementation; Evaluate is Evaluation.<br><b>Backward design</b> is not a phase at all. It is the order you make decisions in once you are inside Planning and Developing: outcomes, then evidence, then experiences. You can be in the right ADDIE phase and still get this backwards, which is what happens when someone builds slides first and works out the assessment afterwards.</p></div>
 <div class="box rule"><span class="bh">Why we keep saying it</span><p class="tight">ADDIE tells you nothing about the order of decisions inside Design. That is the gap backward design fills, and it is the gap most modules fail in. A build can sit correctly in the Development phase, on schedule, with every deliverable named, and still have been designed content-first. Everything downstream inherits that: assessments get retro-fitted to material that already exists, and the module measures whatever happens to be teachable rather than what the job needs.</p></div>
 <p><strong>By the end of Unit 2 you'll be able to:</strong></p>
 <ul class="obj"><li>Approve or reject draft objectives using the observable-verb test</li><li>Assemble a 240-minute lesson day that clears the 75% activated-learning bar</li><li>Review KBA items like a QA reviewer, naming the exact violation rather than sensing something is off</li></ul><div class="terms"><div class="th">🔤 Design-day vocabulary</div><dl><dt>Objective</dt><dd>One sentence stating what a learner will be able to do. Outlines are built from these.</dd><dt>Outcome</dt><dd>The job-level capability a whole course produces; objectives ladder up to it.</dd><dt>Evidence</dt><dd>The assessments and rubrics that prove an objective was met, designed before content.</dd><dt>Activated learning</dt><dd>Learners producing (discussing, building, solving) vs. passively receiving. Budgeted at ≥75% of every lesson.</dd></dl></div><div class="diag"><svg viewBox="0 0 720 112" role="img" aria-labelledby="db-t"><title id="db-t">Backward design. Select each stage</title><g class="fdu hot" tabindex="0" role="button" aria-label="1 · Outcomes" data-name="1 · Outcomes" data-info="Written first, sourced from the target job: what a graduate can DO. Everything downstream traces back here."><rect x="18" y="26" width="200" height="60" rx="10" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="118" y="16" text-anchor="middle" font-size="11" font-family="monospace" fill="#8fa0ae">FIRST</text><text x="118" y="51" text-anchor="middle" font-size="13.5" fill="#164a85" font-weight="600">Outcomes</text><text x="118" y="70" text-anchor="middle" font-size="11" fill="#5b6b7a">what a graduate can DO</text></g><path class="fdu" style="animation-delay:.3s" d="M 222 56 L 252 56" stroke="#1d5fa8" stroke-width="2.5" marker-end="url(#arrB)"/><g class="fdu hot" tabindex="0" role="button" style="animation-delay:.4s" aria-label="2 · Evidence" data-name="2 · Evidence" data-info="Assessments and rubrics designed before any content exists, so teaching aims at proof, not coverage."><rect x="260" y="26" width="200" height="60" rx="10" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="360" y="16" text-anchor="middle" font-size="11" font-family="monospace" fill="#8fa0ae">SECOND</text><text x="360" y="51" text-anchor="middle" font-size="13.5" fill="#164a85" font-weight="600">Evidence</text><text x="360" y="70" text-anchor="middle" font-size="11" fill="#5b6b7a">assessments &amp; rubrics</text></g><path class="fdu" style="animation-delay:.7s" d="M 464 56 L 494 56" stroke="#1d5fa8" stroke-width="2.5" marker-end="url(#arrB)"/><g class="fdu hot" tabindex="0" role="button" style="animation-delay:.8s" aria-label="3 · Experiences" data-name="3 · Experiences" data-info="Lessons, labs, and lesson days: designed LAST, in service of the outcomes and the evidence."><rect x="502" y="26" width="200" height="60" rx="10" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><text x="602" y="16" text-anchor="middle" font-size="11" font-family="monospace" fill="#8fa0ae">LAST</text><text x="602" y="51" text-anchor="middle" font-size="13.5" fill="#1c2b3a" font-weight="600">Experiences</text><text x="602" y="70" text-anchor="middle" font-size="11" fill="#5b6b7a">lessons · labs · days</text></g><defs><marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1d5fa8"/></marker></defs></svg><div class="dcap">👆 <b>Select each stage</b>. Note the order. Content comes last.</div></div><div class="diag"><svg viewBox="0 0 720 92" role="img" aria-labelledby="dr-t"><title id="dr-t">The assessment rhythm: select a beat</title><line class="draw" x1="50" y1="40" x2="670" y2="40" stroke="#1d5fa8" stroke-width="2.5"/><g class="fdu hot" tabindex="0" role="button" style="animation-delay:0.2s" aria-label="Daily" data-name="Daily" data-info="Warm-up opens the day, exit ticket closes it. Both are formative and both run every day."><circle cx="80" cy="40" r="9" fill="#1d5fa8"/><text x="80" y="66" text-anchor="middle" font-size="11.5" fill="#1c2b3a" font-weight="600">Daily</text></g><g class="fdu hot" tabindex="0" role="button" style="animation-delay:0.4s" aria-label="Weekly" data-name="Weekly" data-info="2–3 labs reinforcing the week’s skills; at least one graded individual assessment."><circle cx="270" cy="40" r="9" fill="#1d5fa8"/><text x="270" y="66" text-anchor="middle" font-size="11.5" fill="#1c2b3a" font-weight="600">Weekly</text></g><g class="fdu hot" tabindex="0" role="button" style="animation-delay:0.6s" aria-label="Module end" data-name="Module end" data-info="KBA (knowledge) and/or SBA (skill) close every module: the summative gate."><circle cx="470" cy="40" r="9" fill="#3f88c5"/><text x="470" y="66" text-anchor="middle" font-size="11.5" fill="#1c2b3a" font-weight="600">Module end</text></g><g class="fdu hot" tabindex="0" role="button" style="animation-delay:0.8s" aria-label="Course end" data-name="Course end" data-info="The capstone integrates everything, produces a real deliverable, and is presented."><circle cx="650" cy="40" r="9" fill="#1f9d76"/><text x="650" y="66" text-anchor="middle" font-size="11.5" fill="#1c2b3a" font-weight="600">Course end</text></g></svg><div class="dcap">👆 <b>Select a beat</b> to see its instruments. Notice this course follows the same rhythm you’re reading about.</div></div><p style="margin-top:14px"><strong>Go deeper</strong>, backward design, from its co-creator:</p><div class="video"><iframe src="https://www.youtube.com/embed/4isSHf3SBuQ" title="Grant Wiggins: Understanding by Design workshop, part 1" loading="lazy" allowfullscreen></iframe></div><div class="vidcap">🎯 <b>Watch task:</b> listen for how Wiggins separates “interesting activities” from “evidence of learning”. It’s the exact distinction your objectives review will hinge on. (<a href="https://www.youtube.com/watch?v=4isSHf3SBuQ" target="_blank" rel="noopener">Open on YouTube</a>)</div><div class="media-row"><a class="media-card" href="https://www.pnas.org/doi/10.1073/pnas.1319030111" target="_blank" rel="noopener"><span class="mc-ic">📄</span><span><span class="mc-t">Freeman et al. (2014), PNAS</span><span class="mc-m">The 225-study meta-analysis: active learning raises scores ~0.47 SD and cuts failure rates</span></span></a></div>`,

 swe:{demo:{eg:"A first attempt: “Learners will understand REST APIs and be able to build them properly.”",steps:[
  "Start with the verb, because it decides everything after it. “Understand” names something happening inside a learner’s head, so you could not watch it and two instructors would never agree it had happened. And “build…properly” buries the standard in an adverb, where nobody can measure it.",
  "Then look for the conditions, and notice there are none. Nothing says what the learner has in front of them, and a spec, a failing test and an empty repo would each make this a different lesson with different evidence.",
  "The criterion is where “properly” was doing the fake work, so replace it with something a reviewer can actually see, such as the documented JSON shape and the provided tests passing.",
  "Finally, count the behaviours. “Understand” and “build” are two, which means two separate pieces of evidence, so keep whichever one this lesson actually earns and drop the other. Then write yours in the box."]}},
 demo:{eg:"A first attempt: “Learners will understand firewalls and be able to configure them properly.”",steps:[
  "Start with the verb, because it decides everything after it. “Understand” names something happening inside a learner’s head, so you could not watch it and two instructors would never agree it had happened. And “configure…properly” buries the standard in an adverb, where nobody can measure it.",
  "Then look for the conditions, and notice there are none. Nothing says what the learner has in front of them, and a workstation, a checklist and a reported fault would each make this a different lesson with different evidence.",
  "The criterion is where “properly” was doing the fake work, so replace it with something a reviewer can actually see, such as every checklist item satisfied and no inbound ports left open.",
  "Finally, count the behaviours. “Understand” and “configure” are two, which means two separate pieces of evidence, so keep whichever one this lesson actually earns and drop the other. Then write yours in the box."]},

 html:`<div id="dashslot"></div><div class="box info"><span class="bh">Confirm your project</span><p class="tight">Each unit is a separate package, so your Unit 1 choice doesn\u2019t carry over automatically. If the picker appears above, just reselect your project: the rest of this unit adapts to it.</p></div><p><strong>By the end of Unit 2 you'll be able to:</strong></p>
 <ul class="obj"><li>Approve or reject draft objectives using the observable-verb test</li><li>Assemble a 240-minute lesson day that clears the 75% activated-learning bar</li><li>Review KBA items like a QA reviewer, naming the exact violation rather than sensing something is off</li></ul><div class="terms"><div class="th">🔤 Design-day vocabulary</div><dl><dt>Objective</dt><dd>One sentence stating what a learner will be able to do. Outlines are built from these.</dd><dt>Outcome</dt><dd>The job-level capability a whole course produces; objectives ladder up to it.</dd><dt>Evidence</dt><dd>The assessments and rubrics that prove an objective was met, designed before content.</dd><dt>Activated learning</dt><dd>Learners producing (discussing, building, solving) vs. passively receiving. Budgeted at ≥75% of every lesson.</dd></dl></div><div class="diag"><svg viewBox="0 0 720 112" role="img" aria-labelledby="db-t"><title id="db-t">Backward design. Select each stage</title><g class="fdu hot" tabindex="0" role="button" aria-label="1 · Outcomes" data-name="1 · Outcomes" data-info="Written first, sourced from the target job: what a graduate can DO. Everything downstream traces back here."><rect x="18" y="26" width="200" height="60" rx="10" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="118" y="16" text-anchor="middle" font-size="11" font-family="monospace" fill="#8fa0ae">FIRST</text><text x="118" y="51" text-anchor="middle" font-size="13.5" fill="#164a85" font-weight="600">Outcomes</text><text x="118" y="70" text-anchor="middle" font-size="11" fill="#5b6b7a">what a graduate can DO</text></g><path class="fdu" style="animation-delay:.3s" d="M 222 56 L 252 56" stroke="#1d5fa8" stroke-width="2.5" marker-end="url(#arrB)"/><g class="fdu hot" tabindex="0" role="button" style="animation-delay:.4s" aria-label="2 · Evidence" data-name="2 · Evidence" data-info="Assessments and rubrics designed before any content exists, so teaching aims at proof, not coverage."><rect x="260" y="26" width="200" height="60" rx="10" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="360" y="16" text-anchor="middle" font-size="11" font-family="monospace" fill="#8fa0ae">SECOND</text><text x="360" y="51" text-anchor="middle" font-size="13.5" fill="#164a85" font-weight="600">Evidence</text><text x="360" y="70" text-anchor="middle" font-size="11" fill="#5b6b7a">assessments &amp; rubrics</text></g><path class="fdu" style="animation-delay:.7s" d="M 464 56 L 494 56" stroke="#1d5fa8" stroke-width="2.5" marker-end="url(#arrB)"/><g class="fdu hot" tabindex="0" role="button" style="animation-delay:.8s" aria-label="3 · Experiences" data-name="3 · Experiences" data-info="Lessons, labs, and lesson days: designed LAST, in service of the outcomes and the evidence."><rect x="502" y="26" width="200" height="60" rx="10" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><text x="602" y="16" text-anchor="middle" font-size="11" font-family="monospace" fill="#8fa0ae">LAST</text><text x="602" y="51" text-anchor="middle" font-size="13.5" fill="#1c2b3a" font-weight="600">Experiences</text><text x="602" y="70" text-anchor="middle" font-size="11" fill="#5b6b7a">lessons · labs · days</text></g><defs><marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1d5fa8"/></marker></defs></svg><div class="dcap">👆 <b>Select each stage</b>. The order is the whole idea: content comes last.</div></div><div class="diag"><svg viewBox="0 0 720 92" role="img" aria-labelledby="dr-t"><title id="dr-t">The assessment rhythm: select a beat</title><line class="draw" x1="50" y1="40" x2="670" y2="40" stroke="#1d5fa8" stroke-width="2.5"/><g class="fdu hot" tabindex="0" role="button" style="animation-delay:0.2s" aria-label="Daily" data-name="Daily" data-info="Warm-up opens the day, exit ticket closes it. Both are formative and both run every day."><circle cx="80" cy="40" r="9" fill="#1d5fa8"/><text x="80" y="66" text-anchor="middle" font-size="11.5" fill="#1c2b3a" font-weight="600">Daily</text></g><g class="fdu hot" tabindex="0" role="button" style="animation-delay:0.4s" aria-label="Weekly" data-name="Weekly" data-info="2–3 labs reinforcing the week’s skills; at least one graded individual assessment."><circle cx="270" cy="40" r="9" fill="#1d5fa8"/><text x="270" y="66" text-anchor="middle" font-size="11.5" fill="#1c2b3a" font-weight="600">Weekly</text></g><g class="fdu hot" tabindex="0" role="button" style="animation-delay:0.6s" aria-label="Module end" data-name="Module end" data-info="KBA (knowledge) and/or SBA (skill) close every module: the summative gate."><circle cx="470" cy="40" r="9" fill="#3f88c5"/><text x="470" y="66" text-anchor="middle" font-size="11.5" fill="#1c2b3a" font-weight="600">Module end</text></g><g class="fdu hot" tabindex="0" role="button" style="animation-delay:0.8s" aria-label="Course end" data-name="Course end" data-info="The capstone integrates everything, produces a real deliverable, and is presented."><circle cx="650" cy="40" r="9" fill="#1f9d76"/><text x="650" y="66" text-anchor="middle" font-size="11.5" fill="#1c2b3a" font-weight="600">Course end</text></g></svg><div class="dcap">👆 <b>Select a beat</b> to see its instruments. Notice this course follows the same rhythm you’re reading about.</div></div><p style="margin-top:14px"><strong>Go deeper</strong>, backward design, from its co-creator:</p><div class="video"><iframe src="https://www.youtube.com/embed/4isSHf3SBuQ" title="Grant Wiggins: Understanding by Design workshop, part 1" loading="lazy" allowfullscreen></iframe></div><div class="vidcap">🎯 <b>Watch task:</b> listen for how Wiggins separates “interesting activities” from “evidence of learning”. It’s the exact distinction your objectives review will hinge on. (<a href="https://www.youtube.com/watch?v=4isSHf3SBuQ" target="_blank" rel="noopener">Open on YouTube</a>)</div><div class="media-row"><a class="media-card" href="https://www.pnas.org/doi/10.1073/pnas.1319030111" target="_blank" rel="noopener"><span class="mc-ic">📄</span><span><span class="mc-t">Freeman et al. (2014), PNAS</span><span class="mc-m">The 225-study meta-analysis: active learning raises scores ~0.47 SD and cuts failure rates</span></span></a></div>`,

 html:()=>`<p><strong>Which objectives are yours to write.</strong> Design sets the <em>module</em> objective and hands it over. Breaking it into <em>lesson</em> objectives is Development\u2019s work, so these sentences are yours, and every assessment, lab, and lesson day downstream gets built from them. The standard below applies to both: it is what you write to, and what you review Design\u2019s drafts against.</p>
 <p><strong>What an objective is for.</strong> An objective is a contract about evidence. It states what a learner will be able to do, in conditions specific enough that you already know what would prove it. Everything downstream is derived from it: the assessment measures the objective, the lab gives practice toward it, and the lesson day spends its minutes earning it. Write it loosely and each of those decisions becomes a guess.</p>
 <div class="diag"><svg viewBox="0 0 720 210" role="img" aria-labelledby="wobj-a"><title id="wobj-a">The four parts of an objective. The performance and the level are required; the conditions and the criterion are added where they carry information.</title>
 <text x="14" y="20" font-size="10" font-family="IBM Plex Mono, monospace" letter-spacing="1" fill="#8fa0ae">REQUIRED</text>
 <rect x="12" y="28" width="340" height="58" rx="9" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.8"/>
 <text x="28" y="50" font-size="12" font-weight="700" fill="#12283f">1 · The performance</text>
 <text x="28" y="70" font-size="11" fill="#42566a">An observable verb, plus what it acts on</text>
 <rect x="368" y="28" width="340" height="58" rx="9" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.8"/>
 <text x="384" y="50" font-size="12" font-weight="700" fill="#12283f">2 · The level</text>
 <text x="384" y="70" font-size="11" fill="#42566a">Know, Do, or Decide. It picks the instrument</text>
 <text x="14" y="112" font-size="10" font-family="IBM Plex Mono, monospace" letter-spacing="1" fill="#8fa0ae">ADD WHERE IT CARRIES INFORMATION</text>
 <rect x="12" y="120" width="340" height="72" rx="9" fill="#fff" stroke="#e8e1d6" stroke-width="1.5" stroke-dasharray="5 4"/>
 <text x="28" y="142" font-size="12" font-weight="700" fill="#5a6b7b">3 · The conditions</text>
 <text x="28" y="161" font-size="11" fill="#5a6b7b">What the learner has, or does not have</text>
 <text x="28" y="179" font-size="10.5" fill="#8fa0ae">Add when having it would change the assessment</text>
 <rect x="368" y="120" width="340" height="72" rx="9" fill="#fff" stroke="#e8e1d6" stroke-width="1.5" stroke-dasharray="5 4"/>
 <text x="384" y="142" font-size="12" font-weight="700" fill="#5a6b7b">4 · The criterion</text>
 <text x="384" y="161" font-size="11" fill="#5a6b7b">How good counts as good</text>
 <text x="384" y="179" font-size="10.5" fill="#8fa0ae">Add when reasonable people could disagree</text>
</svg><div class="dcap">Two parts always, two parts when they earn their place. Padding every objective with all four produces boilerplate.</div></div>
 <div class="diag"><svg viewBox="0 0 720 176" role="img" aria-labelledby="wobj-b"><title id="wobj-b">The verb level decides what evidence you are committed to: a question, a produced artifact, or a defended decision</title>
 <rect x="12" y="14" width="220" height="148" rx="10" fill="#f3f0ea" stroke="#e8e1d6" stroke-width="1.5"/>
 <text x="122" y="40" text-anchor="middle" font-size="12" font-weight="700" fill="#5a6b7b">KNOW</text>
 <text x="122" y="62" text-anchor="middle" font-size="10.5" fill="#42566a">identify · define</text>
 <text x="122" y="79" text-anchor="middle" font-size="10.5" fill="#42566a">explain · describe</text>
 <line x1="34" y1="94" x2="210" y2="94" stroke="#e0d8c8"/>
 <text x="122" y="116" text-anchor="middle" font-size="11" fill="#1c2b3a">A question can measure it</text>
 <text x="122" y="140" text-anchor="middle" font-size="10.5" fill="#8fa0ae">Legitimate as scaffolding,</text>
 <text x="122" y="155" text-anchor="middle" font-size="10.5" fill="#8fa0ae">never as the end of a module</text>
 <rect x="250" y="14" width="220" height="148" rx="10" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.8"/>
 <text x="360" y="40" text-anchor="middle" font-size="12" font-weight="700" fill="#164a85">DO</text>
 <text x="360" y="62" text-anchor="middle" font-size="10.5" fill="#1c2b3a">configure · build</text>
 <text x="360" y="79" text-anchor="middle" font-size="10.5" fill="#1c2b3a">write · query · resolve</text>
 <line x1="272" y1="94" x2="448" y2="94" stroke="#c3d6e6"/>
 <text x="360" y="116" text-anchor="middle" font-size="11" fill="#1c2b3a">They produce something</text>
 <text x="360" y="140" text-anchor="middle" font-size="10.5" fill="#5b6b7a">A quiz cannot measure</text>
 <text x="360" y="155" text-anchor="middle" font-size="10.5" fill="#5b6b7a">this honestly</text>
 <rect x="488" y="14" width="220" height="148" rx="10" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.8"/>
 <text x="598" y="40" text-anchor="middle" font-size="12" font-weight="700" fill="#164a85">DECIDE</text>
 <text x="598" y="62" text-anchor="middle" font-size="10.5" fill="#1c2b3a">diagnose · prioritise</text>
 <text x="598" y="79" text-anchor="middle" font-size="10.5" fill="#1c2b3a">choose · justify</text>
 <line x1="510" y1="94" x2="686" y2="94" stroke="#c3d6e6"/>
 <text x="598" y="116" text-anchor="middle" font-size="11" fill="#1c2b3a">More than one defensible</text>
 <text x="598" y="133" text-anchor="middle" font-size="11" fill="#1c2b3a">answer, plus the reasoning</text>
 <text x="598" y="155" text-anchor="middle" font-size="10.5" fill="#5b6b7a">The reasoning is the evidence</text>
</svg><div class="dcap">Pick the verb and you have picked the assessment. Getting this wrong is why modules end up measuring recall against a performance objective.</div></div>
 <div class="box info"><span class="bh">The four parts of a usable objective</span><p class="tight"><b>1. The performance.</b> An observable verb plus what it acts on. Configure wireless security settings.<br><b>2. The conditions.</b> What the learner has, or does not have, while performing. Given a SOHO router and a provided checklist.<br><b>3. The criterion.</b> How good counts as good. To the checklist, with no open ports remaining.<br><b>4. The level.</b> Whether this is knowledge that supports later performance, or the performance itself.<br><br>Parts 1 and 4 are not negotiable: without an observable verb there is nothing to assess, and without knowing the level you will reach for the wrong instrument. Parts 2 and 3 are judgement calls. Add conditions when having or not having something would change how you assess the work, and add a criterion when a reviewer and a learner could reasonably disagree about what finished looks like. Plenty of good objectives need neither, and padding every one with \u201Cgiven\u2026\u201D and \u201Cto the standard of\u2026\u201D produces boilerplate rather than clarity.</p></div><div class="box rule"><span class="bh">Two things we do not ask for</span><p class="tight">You do not need to open with <b>\u201CLearners will be able to\u2026\u201D</b>. It is understood, it costs five words on every objective, and it pushes the verb away from the front of the sentence where it belongs. Start with the verb.<br>And you do not need a condition clause on every objective. Use one where it carries information. An objective that reads well and can be assessed is finished, whether or not it has all four parts.</p></div>
 <p><strong>The verb decides everything.</strong> Verbs sort into three levels, and the level commits you to a kind of evidence:</p>
 <table class="mtbl"><tr><th>Level</th><th>Verbs</th><th>Evidence it commits you to</th></tr>
 <tr><td><b>Know</b></td><td>identify, define, explain, describe</td><td>A question can measure it. Legitimate as scaffolding, never as the end of a module.</td></tr>
 <tr><td><b>Do</b></td><td>configure, build, write, query, resolve</td><td>The learner produces something. A quiz cannot measure this honestly.</td></tr>
 <tr><td><b>Decide</b></td><td>diagnose, choose, prioritize, justify</td><td>Requires a situation with more than one defensible answer, plus the reasoning.</td></tr></table>
 <p class="tight">Verbs like understand, know about, learn, appreciate, and be familiar with belong to no level, because they name a state inside someone\u2019s head. You cannot watch them, so you cannot assess them.</p>
 <div class="box rule"><span class="bh">The two tests, in order</span><p class="tight"><b>Observable:</b> could you watch a learner do this, and would two instructors agree it happened?<br><b>Sufficient:</b> does the sentence already tell you what the assessment would be? If you have to invent conditions in order to write the test, the objective is not finished.</p></div>
 <p><strong>The four failure modes,</strong> each with what it looks like repaired:</p>
 <div class="box info"><span class="bh">Send it back when you see these</span><p class="tight"><b>Unmeasurable verb.</b> \u201CUnderstand networking fundamentals.\u201D Repaired: \u201CGiven a failed connection, identify the layer at fault and the next diagnostic step.\u201D<br><b>Compound.</b> \u201CBuild APIs and use Git in a team.\u201D Split it. Two behaviors need two objectives, because they need two pieces of evidence.<br><b>Boundless scope.</b> \u201CKnow the OSI model.\u201D That is a topic, not a behavior. Name what the learner does with it.<br><b>Activity as objective.</b> \u201CComplete GLAB 301.1.1.\u201D The lab is how evidence gets produced; the objective is the capability the lab proves.</p></div>
 <p><strong>What this looks like in our courses.</strong> For IT Support, \u201CUnderstand printer troubleshooting\u201D gives you nothing to build, while \u201CGiven a user-reported print failure, diagnose the cause and document the resolution in the knowledge base\u201D tells you the lab, the assessment, and the rubric in one sentence. For MERN, \u201CLearn about REST\u201D gives you nothing, while \u201CGiven a feature spec, implement and document a REST endpoint that passes the provided tests\u201D does.</p>
 <div class="box rule"><span class="bh">What the checker can and cannot tell you</span><p class="tight">When you submit, each part of the standard above is checked separately and anything missing says what is missing. It is checking the <b>shape</b> of your sentence, not whether the sentence is true or worth teaching. A well-formed objective about the wrong skill passes every check. Judging whether an objective is the right one is what your reviewer does, and what you will do in the capstone.</p></div>
 <p class="tight" style="color:var(--muted)">Verb lists and the objective template are in the Handbook. Now write one, and check it as many times as you like.</p>`,
 variants:{swe:{type:"draft",id:"wobjd",points:15,
  brief:"Write one lesson objective for a MERN module on building REST endpoints.",
  note:"Type the whole sentence. When you press Check, each part of the standard is checked separately and anything missing says what is missing. There is no penalty for checking as often as you like.",
  placeholder:"Given …, implement … that …",
  rules:[
   {label:"Starts from an observable performance verb",
    test:t=>/\b(configure|build|create|write|implement|deploy|install|query|resolve|diagnose|troubleshoot|document|repair|assemble|explain|identify|describe|classify|prioritise|prioritize|justify|choose|select|review)\b/.test(t),
    fail:"No verb here names something you could watch a learner do. Open with one from the Know, Do, or Decide lists: configure, build, diagnose, document, explain, identify, justify."},
   {label:"No unmeasurable verbs",
    test:t=>!/\b(understand|understands|understanding|know about|knows about|knowledge of|appreciate|appreciates|be familiar|familiar with|learn about|learns about|aware of|awareness of|be able to understand|grasp)\b/.test(t),
    fail:"One of the invisible verbs is still in there: understand, know about, appreciate, be familiar with, learn about. They name a state inside someone’s head, so two instructors could never agree on when it happened."},
   {label:"Names the conditions, where they change what counts as success",soft:true,
    test:t=>/\b(given|using|provided|with a|with the|from a|from the|on a|on the|in a|in the)\b/.test(t),
    fail:"No conditions stated, which is fine when they do not change what counts as success. Add them when they do, as in “Given a service-desk ticket…” or “Using the provided checklist…”. If a learner having the checklist or not having it would change how you assess this, say which."},
   {label:"Names a criterion, where good and good-enough could differ",soft:true,
    test:t=>/\b(to the|to a|against the|with no|without|so that|such that|that passes|passes|matching|per|according to|no open|all |every |within)\b/.test(t),
    fail:"No criterion stated, and often the verb and its object are enough. Add one where a reviewer and a learner could reasonably disagree about what finished looks like, as in “…with no open ports remaining” or “…that passes the provided tests”."},
   {label:"No vague qualifiers standing in for a criterion",
    test:t=>!/\b(appropriately|as needed|as required|correctly|properly|well|good|excellent|high quality|professional standard|effectively|efficiently)\b/.test(t),
    fail:"A word like appropriately, correctly, properly, or effectively sounds like a standard and measures nothing. Replace it with the observable end state."},
   {label:"One behaviour, not two bundled together",
    test:t=>{
      var v=/\b(configure|build|create|write|implement|deploy|install|query|resolve|diagnose|troubleshoot|document|repair|assemble|explain|identify|describe|classify|justify|choose|select|review)\b/g;
      var seen={},n=0,m2;
      while((m2=v.exec(t))!==null){ if(!seen[m2[1]]){seen[m2[1]]=1;n++;} }
      return n<2 || !/\b(and|as well as|plus)\b/.test(t);
    },
    fail:"Two performance verbs joined by “and” means two objectives, because each one needs its own piece of evidence. Split it and keep the one this lesson is really about."},
   {label:"One sentence, roughly 8 to 40 words",
    test:(t,raw)=>{var w=raw.trim().split(/\s+/).length;return w>=8&&w<=40;},
    fail:"Aim for a single sentence. Under about eight words there is usually no object for the verb to act on, and over forty there are usually two objectives hiding in there."}],

 activity:{type:"draft",id:"wobjd",points:15,
  brief:"Write one lesson objective for an IT Support module on securing a workstation.",
  note:"Type the whole sentence. When you press Check, each part of the standard is checked separately and anything missing says what is missing. There is no penalty for checking as often as you like.",
  placeholder:"Given …, configure … to …",
  rules:[
   {label:"Starts from an observable performance verb",
    test:t=>/\b(configure|build|create|write|implement|deploy|install|query|resolve|diagnose|troubleshoot|document|repair|assemble|explain|identify|describe|classify|prioritise|prioritize|justify|choose|select|review)\b/.test(t),
    fail:"No verb here names something you could watch a learner do. Open with one from the Know, Do, or Decide lists: configure, build, diagnose, document, explain, identify, justify."},
   {label:"No unmeasurable verbs",
    test:t=>!/\b(understand|understands|understanding|know about|knows about|knowledge of|appreciate|appreciates|be familiar|familiar with|learn about|learns about|aware of|awareness of|be able to understand|grasp)\b/.test(t),
    fail:"One of the invisible verbs is still in there: understand, know about, appreciate, be familiar with, learn about. They name a state inside someone’s head, so two instructors could never agree on when it happened."},
   {label:"Names the conditions, where they change what counts as success",soft:true,
    test:t=>/\b(given|using|provided|with a|with the|from a|from the|on a|on the|in a|in the)\b/.test(t),
    fail:"No conditions stated, which is fine when they do not change what counts as success. Add them when they do, as in “Given a service-desk ticket…” or “Using the provided checklist…”. If a learner having the checklist or not having it would change how you assess this, say which."},
   {label:"Names a criterion, where good and good-enough could differ",soft:true,
    test:t=>/\b(to the|to a|against the|with no|without|so that|such that|that passes|passes|matching|per|according to|no open|all |every |within)\b/.test(t),
    fail:"No criterion stated, and often the verb and its object are enough. Add one where a reviewer and a learner could reasonably disagree about what finished looks like, as in “…with no open ports remaining” or “…that passes the provided tests”."},
   {label:"No vague qualifiers standing in for a criterion",
    test:t=>!/\b(appropriately|as needed|as required|correctly|properly|well|good|excellent|high quality|professional standard|effectively|efficiently)\b/.test(t),
    fail:"A word like appropriately, correctly, properly, or effectively sounds like a standard and measures nothing. Replace it with the observable end state."},
   {label:"One behaviour, not two bundled together",
    test:t=>{
      var v=/\b(configure|build|create|write|implement|deploy|install|query|resolve|diagnose|troubleshoot|document|repair|assemble|explain|identify|describe|classify|justify|choose|select|review)\b/g;
      var seen={},n=0,m2;
      while((m2=v.exec(t))!==null){ if(!seen[m2[1]]){seen[m2[1]]=1;n++;} }
      return n<2 || !/\b(and|as well as|plus)\b/.test(t);
    },
    fail:"Two performance verbs joined by “and” means two objectives, because each one needs its own piece of evidence. Split it and keep the one this lesson is really about."},
   {label:"One sentence, roughly 8 to 40 words",
    test:(t,raw)=>{var w=raw.trim().split(/\s+/).length;return w>=8&&w<=40;},
    fail:"Aim for a single sentence. Under about eight words there is usually no object for the verb to act on, and over forty there are usually two objectives hiding in there."}],

 html:()=>`${(function(){const c=primary();return c?`<div class="pullquote"><div class="pq">Draft objective for review: \u201C${c.objectiveDraft}\u201D</div><div class="pa">${c.domain} \u00b7 ${c.module}${c.ph_obj?" \u00b7 sample wording pending validation":""}</div></div>`:"";})()}<p><strong>Now the other direction.</strong> You just wrote an objective to the standard. Design has sent five drafts, and reviewing them uses the same four parts and the same two tests you worked through. We do not author module objectives, but we cannot build from a bad one, so sending one back is a normal part of the handoff. Nobody reads it as a complaint.</p>
 <div class="box rule"><span class="bh">The two tests, in order</span><p class="tight"><b>Observable:</b> could you watch a learner do this, and would two instructors agree it happened?<br><b>Sufficient:</b> does the sentence already tell you what the assessment would be? If you have to invent conditions in order to write the test, the objective is not finished.</p></div>
 <div class="box info"><span class="bh">The four failure modes, in the order they show up</span><p class="tight"><b>Unmeasurable verb.</b> Understand, know about, appreciate, be familiar with.<br><b>Compound.</b> Two behaviours in one sentence, which needs two pieces of evidence.<br><b>Boundless scope.</b> A topic rather than a behaviour.<br><b>Activity as objective.</b> Naming the lab instead of the capability it proves.</p></div>
 <p class="tight" style="color:var(--muted)">Five drafts follow. Run observable first, then sufficient, and name the failure mode when you send one back.</p>`,

{id:"modref",title:"Compose a module",crumb:"Unit 2 · Module composition",mins:15,
 lead:"The question developers ask most is how many quizzes, labs, and assessments a module actually needs. There is no number, but there is a firm rule and a repeatable way to decide. Read the standard here, then sort four real module situations against it.",
 html:`
 <p>This is the reference you will come back to, so read it once here and then keep it in the Handbook. Two things settle the question: one firm rule about how a module ends, and two tests that decide everything else.</p>

 <div class="box rule"><span class="bh">The north star</span><p class="tight">A module should spend its time letting learners <b>prove mastery</b>, not watch it demonstrated. If a learner could finish your module having only followed instructions, it is not competency-based yet. Guided practice is a <em>ramp</em> toward independent performance. Stopping there leaves the climb unfinished.</p></div>

 <p><b>The one firm rule.</b> Every module ends with a <b>summative task that poses a real problem the learner solves without step-by-step guidance</b>: the competency check. Everything before it exists to get them ready for it. (This is backward design: decide the evidence of competence first, then build toward it.) For your courses that\u2019s concrete: an IT Support module ends with the learner diagnosing and resolving an unscripted ticket; a MERN module ends with them building a working endpoint from a spec, not answering questions <em>about</em> one.</p>

 <p><b>How much of everything else?</b> Enough to support and verify each objective, no more. Two tests replace counting:</p>
 <div class="box info"><span class="bh">The two tests</span><p class="tight"><b>Alignment</b>: every assessment maps to an objective, and every objective has at least one piece of evidence. A quiz that checks no objective is noise; an objective with no evidence is a gap.<br><b>Sufficiency</b>: add a formative check (quiz, knowledge check, reflection) wherever a learner could go wrong <em>undetected</em> before a high-stakes moment. More checks are not better; over-assessing fragments attention.</p></div>

 <div class="diag"><svg viewBox="0 0 720 200" role="img" aria-labelledby="modref-d"><title id="modref-d">Instructor support declines across modelled, guided and independent practice, reaching zero at the summative</title>
 <path d="M30,34 L676,120 L30,120 Z" fill="#e3edf8"/>
 <line x1="30" y1="34" x2="676" y2="120" stroke="#1d5fa8" stroke-width="2"/>
 <line x1="30" y1="120" x2="690" y2="120" stroke="#12283f" stroke-width="1.4"/>
 <text x="40" y="26" font-size="9.5" font-family="IBM Plex Mono, monospace" letter-spacing="1" fill="#1d5fa8">SUPPORT AVAILABLE TO THE LEARNER</text>
 <line x1="245" y1="34" x2="245" y2="128" stroke="#fff" stroke-width="2"/>
 <line x1="460" y1="34" x2="460" y2="128" stroke="#fff" stroke-width="2"/>
 <text x="48" y="62" font-size="9.5" font-family="IBM Plex Mono, monospace" letter-spacing=".8" fill="#5b6b7a">MODELLED</text>
 <text x="48" y="84" font-size="14" font-weight="700" fill="#12283f">I do</text>
 <text x="48" y="148" font-size="10.5" fill="#5b6b7a">Lesson and worked example,</text>
 <text x="48" y="163" font-size="10.5" fill="#5b6b7a">against a real task.</text>
 <text x="263" y="62" font-size="9.5" font-family="IBM Plex Mono, monospace" letter-spacing=".8" fill="#5b6b7a">GUIDED</text>
 <text x="263" y="84" font-size="14" font-weight="700" fill="#12283f">We do</text>
 <text x="263" y="148" font-size="10.5" fill="#5b6b7a">GLAB, activity, case study.</text>
 <text x="263" y="163" font-size="10.5" fill="#5b6b7a">Steps still in front of them.</text>
 <text x="478" y="62" font-size="9.5" font-family="IBM Plex Mono, monospace" letter-spacing=".8" fill="#1d5fa8">INDEPENDENT</text>
 <text x="478" y="84" font-size="14" font-weight="700" fill="#164a85">You do</text>
 <text x="478" y="148" font-size="10.5" fill="#5b6b7a">ALAB, then the summative.</text>
 <text x="478" y="163" font-size="10.5" fill="#5b6b7a">No steps. A real problem.</text>
 <circle cx="676" cy="120" r="5.5" fill="#1d5fa8"/>
 <text x="672" y="30" text-anchor="end" font-size="9.5" font-family="IBM Plex Mono, monospace" fill="#1d5fa8">SUMMATIVE · SUPPORT = 0</text>
 <line x1="676" y1="36" x2="676" y2="112" stroke="#1d5fa8" stroke-width="1" stroke-dasharray="3 3"/>
 <text x="30" y="192" font-size="10.5" font-style="italic" fill="#8fa0ae">If the wedge never reaches zero, the module has not measured competence. That is the most common structural failure in a build.</text>
</svg><div class="dcap">The shape every module aims for. Short modules compress the wedge; they do not flatten it.</div></div>
 <p><b>The scaffold must fade.</b> Across a module, activated time should shift from guided (I-do, we-do) to independent (you-do). The summative is pure you-do. A module that stays guided the whole way feels active but never proves anything. That is the one anti-pattern to watch for.</p>

 <p><b>Match the shape to the situation.</b> Duration and content type change the shape. The rule holds either way:</p>
 <table class="mtbl">
  <tr><th>Module type</th><th>What it needs</th></tr>
  <tr><td><b>Standard</b><br><span class="mnote">~4\u20136+ lessons</span></td><td>The full arc: teach \u2192 guided practice \u2192 fading scaffold \u2192 independent practice \u2192 summative competency task. The default every module aims for.</td></tr>
  <tr><td><b>Short</b><br><span class="mnote">1\u20132 days</span></td><td>Compress the ramp, keep the proof. One tight teach-and-guided pass, then straight to an independent performance task. Drop the mid-module checkpoint, not the summative, even two days ends with the learner <em>doing</em>.</td></tr>
  <tr><td><b>Prep / foundational</b></td><td>When a module genuinely <em>is</em> prerequisite (terminology, safety, setup), its check may be a knowledge check or gated readiness task rather than a full problem-solve, but only if it is honestly foundational, and only the minimum needed to unlock the hands-on work.</td></tr>
  <tr><td><b>Vendor-constrained</b></td><td>When third-party content (e.g. a CompTIA module) only teaches \u201Cfollow the steps,\u201D you often cannot build problem-solving inside it. Author the competency assessment <em>on top</em>: your own SBA posing a real problem, using the vendor material as input. Raise equipment or authoring needs in the design phase, before development.</td></tr>
 </table>

 <div class="box rule"><span class="bh">The checklist: run this before you finalize any module</span><p class="tight">\u2610 Does every objective end in <b>independent</b> evidence, and not stop at guided practice?<br>\u2610 Does the module\u2019s time skew toward <b>doing</b> over consuming?<br>\u2610 Does the scaffold actually <b>fade</b> from guided to independent?<br>\u2610 Does it <b>close with unaided performance</b> (the summative)?<br>\u2610 Which <b>type</b> is this, and does its assessment match that type?<br>\u2610 Is every assessment <b>aligned</b> to an objective, with no orphan quizzes and no unmeasured objectives?</p></div>

 <p>When in doubt: protect the summative, cut the filler. This full reference also lives in the ${gl('composition','Handbook \u2192 What goes in a module')} for when you need it mid-build.</p>
 <p style="margin-top:14px"><strong>Backward design applied, from its co-creator:</strong></p><div class="video"><iframe src="https://www.youtube.com/embed/vgNODvvsgxM" title="Grant Wiggins: Understanding by Design, part 2" loading="lazy" allowfullscreen></iframe></div><div class="vidcap">🎯 <b>Watch task:</b> part 1 made the case for designing from evidence. This one is about what it does to the shape of a unit. Listen for how he decides what to cut, because that is the decision you are about to make four times. (<a href="https://www.youtube.com/watch?v=vgNODvvsgxM" target="_blank" rel="noopener">Open on YouTube</a>)</div>
 <p class="tight" style="color:var(--muted)">Four real situations follow. Match each one to the pattern that fits it, and watch for the trap: the answer is never to drop the summative, it is how the summative adapts.</p>

 html:`<p><strong>Every module closes with a summative, and you have to pick its type.</strong> You have been told several times that a knowledge assessment cannot show a learner can do the job. This is the lesson where you decide what actually closes your module, and design it.</p>
 <div class="diag"><svg viewBox="0 0 720 250" role="img" aria-labelledby="wsum-d"><title id="wsum-d">Knowledge-based and skill-based assessments: what each one asks the learner to produce, and which objectives each can close</title>
 <rect x="12" y="14" width="340" height="150" rx="10" fill="#f3f0ea" stroke="#e8e1d6" stroke-width="1.6"/>
 <text x="30" y="38" font-size="12" font-weight="700" fill="#5a6b7b">KBA · knowledge-based</text>
 <text x="30" y="62" font-size="11" fill="#42566a">The learner answers questions</text>
 <text x="30" y="82" font-size="11" fill="#42566a">Built in New Quizzes, auto-marked</text>
 <text x="30" y="102" font-size="11" fill="#42566a">Closes: Know-level objectives</text>
 <line x1="30" y1="116" x2="334" y2="116" stroke="#e0d8c8"/>
 <text x="30" y="136" font-size="10.5" font-style="italic" fill="#8a6a00">Cannot close a Do or Decide objective,</text>
 <text x="30" y="152" font-size="10.5" font-style="italic" fill="#8a6a00">however well the items are written.</text>
 <rect x="368" y="14" width="340" height="150" rx="10" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.9"/>
 <text x="386" y="38" font-size="12" font-weight="700" fill="#164a85">SBA · skill-based</text>
 <text x="386" y="62" font-size="11" fill="#1c2b3a">The learner produces something</text>
 <text x="386" y="82" font-size="11" fill="#1c2b3a">Minimal guidance, judged by rubric</text>
 <text x="386" y="102" font-size="11" fill="#1c2b3a">Closes: Do and Decide objectives</text>
 <line x1="386" y1="116" x2="690" y2="116" stroke="#c3d6e6"/>
 <text x="386" y="136" font-size="10.5" font-style="italic" fill="#164a85">Same skeleton as a lab, but Steps become</text>
 <text x="386" y="152" font-size="10.5" font-style="italic" fill="#164a85">Content Parts. No steps to follow.</text>
 <rect x="12" y="180" width="696" height="58" rx="9" fill="#e7f4ee" stroke="#186b52" stroke-width="1.6"/>
 <text x="30" y="202" font-size="11.5" font-weight="700" fill="#186b52">Often you need both</text>
 <text x="30" y="222" font-size="11" fill="#1c2b3a">The KBA checks the knowledge the performance depends on. The SBA shows the performance. Neither replaces the other.</text>
</svg><div class="dcap">The verb in the objective picks the instrument. Everything else follows from that.</div></div>
 <div class="box rule"><span class="bh">The decision, in one question</span><p class="tight">Read your module objective and find the verb. If it is <b>identify, define, explain, describe</b>, a KBA can close it. If it is <b>configure, build, write, resolve, implement</b>, or <b>diagnose, prioritise, justify</b>, only a performance task can, and that is an SBA. Writing better quiz items never bridges that gap: a learner choosing the right answer about configuring a firewall has not configured one.<br>Most real modules have objectives at more than one level, which is why most real modules close with both.</p></div>
 <div class="box info"><span class="bh">What makes an SBA an SBA and not just a hard lab</span><p class="tight"><b>Minimal guidance.</b> A GLAB lays the path out. An SBA states the problem and the required output, and the learner decides the route. If your SBA has numbered steps, it is a lab.<br><b>Unseen conditions.</b> The situation has to be one they have not already been walked through. Same skill, new instance.<br><b>Content Parts, not Steps.</b> The section that would list steps in a lab lists the parts of the deliverable instead: what has to be produced, not how to produce it.<br><b>Client-style questions.</b> Questions a real requester would ask, answered inside the learner's own documentation rather than on a separate answer sheet.<br><b>A real deliverable.</b> Learners submit a knowledge-base article on the Student KB Template, so the output looks like work rather than coursework.<br><b>A rubric.</b> It is graded, so it carries one, with criteria from the objective.</p></div>
 <div class="box info"><span class="bh">The three ways this goes wrong</span><p class="tight"><b>A quiz wearing an SBA's name.</b> Renaming a knowledge assessment does not change what it measures.<br><b>An SBA with steps.</b> If the learner can finish by following instructions, you have measured compliance, not competence.<br><b>A seen scenario.</b> Assessing the exact case they practised measures recall of that case. Change the instance.</p></div>
 <p class="tight" style="color:var(--muted)">Design one. Four decisions, each checked on its own, and the assessment takes shape above as you choose. Templates are in the ${gl('labs','Handbook')}.</p>`,

{id:"wkba",title:"Write a quiz item",crumb:"Unit 2 · Write it",
 swe:{demo:{eg:"A first attempt at a stem: “Which of the following is not an acceptable status code to always return?”",steps:[
  "Count the problems before fixing any of them, because there are three here and they interact: the negative is unmarked, “always” is an absolute, and “an” quietly points at an answer beginning with a vowel.",
  "Fix the negative first, since it is the one that makes learners fail for a reason that has nothing to do with what they know. Turning it positive is usually enough: ask which code <em>is</em> correct.",
  "Then drop “always”, because a stem claiming a rule holds in every single case is nearly always arguable, and an arguable stem cannot have one best answer.",
  "That leaves you with “Which status code should a successful POST that creates a resource return?”, which asks one thing, gives nothing away, and can actually be answered. Work through yours in the same order."]}},

  "That leaves you with “Which port does HTTPS use by default?”, which asks one thing, gives nothing away, and can actually be answered. Work through yours in the same order."]},

 html:`<p><strong>First, three things people mix up.</strong> A multiple-choice question can appear in three different places in a module, and they are not interchangeable. The <em>writing</em> rules below are the same for all three. What changes is where it sits, whether it is graded, and what it is allowed to prove.</p>
 <div class="diag"><svg viewBox="0 0 720 214" role="img" aria-labelledby="wkba-m"><title id="wkba-m">Where each assessment type sits in a module, whether it is graded, and what it can prove</title>
 <text x="14" y="18" font-size="9.5" font-family="IBM Plex Mono, monospace" letter-spacing="1" fill="#8fa0ae">INSIDE A LESSON</text>
 <rect x="12" y="26" width="216" height="80" rx="9" fill="#f3f0ea" stroke="#e8e1d6" stroke-width="1.5"/>
 <text x="28" y="48" font-size="12.5" font-weight="700" fill="#12283f">Knowledge check</text>
 <text x="28" y="68" font-size="10.5" fill="#5a6b7b">Ungraded · no file of its own</text>
 <text x="28" y="86" font-size="10.5" fill="#5a6b7b">Catches a misunderstanding</text>
 <text x="28" y="100" font-size="10.5" fill="#5a6b7b">before it compounds</text>
 <text x="248" y="18" font-size="9.5" font-family="IBM Plex Mono, monospace" letter-spacing="1" fill="#8fa0ae">CLOSES A LESSON</text>
 <rect x="246" y="26" width="216" height="80" rx="9" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.6"/>
 <text x="262" y="48" font-size="12.5" font-weight="700" fill="#12283f">Quiz 301.2</text>
 <text x="262" y="68" font-size="10.5" fill="#42566a">Graded · its own file</text>
 <text x="262" y="86" font-size="10.5" fill="#42566a">Numbered to the lesson</text>
 <text x="262" y="100" font-size="10.5" fill="#42566a">One per lesson at most</text>
 <text x="482" y="18" font-size="9.5" font-family="IBM Plex Mono, monospace" letter-spacing="1" fill="#8fa0ae">CLOSES THE MODULE</text>
 <rect x="480" y="26" width="228" height="80" rx="9" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.8"/>
 <text x="496" y="48" font-size="12.5" font-weight="700" fill="#12283f">KBA 301</text>
 <text x="496" y="68" font-size="10.5" fill="#42566a">Graded · summative</text>
 <text x="496" y="86" font-size="10.5" fill="#42566a">No lesson number</text>
 <text x="496" y="100" font-size="10.5" fill="#42566a">Reports what they know</text>
 <line x1="12" y1="126" x2="708" y2="126" stroke="#e0d8c8"/>
 <text x="14" y="148" font-size="9.5" font-family="IBM Plex Mono, monospace" letter-spacing="1" fill="#8a6a00">WHAT NONE OF THE THREE CAN DO</text>
 <rect x="12" y="156" width="696" height="46" rx="9" fill="#fff7e8" stroke="#c9a227" stroke-width="1.6"/>
 <text x="28" y="177" font-size="11.5" fill="#12283f">Show that a learner can <tspan font-style="italic">perform</tspan> the objective. That is the SBA or the performance task.</text>
 <text x="28" y="194" font-size="10.5" fill="#8a6a00">A module whose only summative is a KBA has not measured competence.</text>
</svg><div class="dcap">Same writing rules for all three. What changes is where it sits, whether it is graded, and what it is allowed to prove.</div></div>
 <div class="terms"><div class="th">\ud83d\udd24 Knowledge check, quiz, KBA</div><dl>
 <dt>Knowledge check</dt><dd><b>Inside a lesson. Formative.</b> A quick check dropped into the teaching to catch a misunderstanding before it compounds. Ungraded, and it carries no file of its own: it lives in the lesson. Use one wherever a learner could go wrong undetected before something high-stakes.</dd>
 <dt>Quiz</dt><dd><b>Lesson level. Graded.</b> Its own file, numbered to the lesson: <span class="mono">Quiz 301.2</span>. It closes out a day's content and the mark counts. One lesson, one quiz at most, and only where the lesson has knowledge worth checking formally.</dd>
 <dt>KBA</dt><dd><b>Module level. Graded and summative.</b> <span class="mono">KBA 301</span>, with no lesson number, because it closes the whole module. This is the one with real stakes, and the one people overload: a KBA is knowledge evidence, so it can never be the module's proof that a learner can <em>do</em> the job. That proof is the SBA or the performance task.</dd></dl></div>
 <div class="box rule"><span class="bh">The line that matters</span><p class="tight">Knowledge checks and quizzes are how you find out whether learners are following. The KBA is how the module reports what they know. None of the three measures whether a learner can perform the objective, so a module whose only summative is a KBA has not measured competence. Pair it with an SBA or a performance task, or replace it, depending on what the objective asks for.</p></div>
 <p><strong>What all three are for.</strong> Every one of them measures whether a learner holds knowledge a later performance depends on. That makes them scaffolding, and two things follow: each has to be honest about what it measures, and none of them can become the module\u2019s evidence that someone can do the job. That second one is the mistake that gets modules sent back.</p>
 <p><strong>A quiz item is a measuring instrument.</strong> Every flaw adds noise: a giveaway, an overlap, a leak between items. Enough noise and the score measures test-taking instead of knowledge, which means you can no longer tell a learner who is ready from one who is good at exams.</p>
 <div class="diag"><svg viewBox="0 0 720 242" role="img" aria-labelledby="wkba-d"><title id="wkba-d">The parts of a usable knowledge-check item</title><rect x="12" y="12" width="696" height="44" rx="9" fill="#f3f0ea" stroke="#e8e1d6" stroke-width="1.5"/><text x="360" y="40" text-anchor="middle" font-size="13" font-family="IBM Plex Mono, monospace" fill="#1c2b3a">Which port does HTTPS use?   A) 21   B) 80   C) 443   D) 3389</text><circle cx="30" cy="88" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="30" y="92" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">1</text><text x="50" y="85" font-size="11.5" font-weight="700" fill="#1c2b3a">Stem</text><text x="50" y="101" font-size="10.5" fill="#42566a">Complete question. The learner knows what is asked before reading the options.</text><circle cx="30" cy="128" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="30" y="132" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">2</text><text x="50" y="125" font-size="11.5" font-weight="700" fill="#1c2b3a">One idea</text><text x="50" y="141" font-size="10.5" fill="#42566a">A single concept, so a wrong answer tells you which thing they missed.</text><circle cx="30" cy="168" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="30" y="172" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">3</text><text x="50" y="165" font-size="11.5" font-weight="700" fill="#1c2b3a">Plausible distractors</text><text x="50" y="181" font-size="10.5" fill="#42566a">Wrong options that represent real misconceptions, not filler.</text><circle cx="30" cy="208" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="30" y="212" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">4</text><text x="50" y="205" font-size="11.5" font-weight="700" fill="#1c2b3a">One defensible answer</text><text x="50" y="221" font-size="10.5" fill="#42566a">No option a knowledgeable person could argue for.</text></svg><div class="dcap">Every part earns its place. Remove one and the item stops measuring what you think it measures.</div></div>
 <div class="box info"><span class="bh">Writing the stem</span><p class="tight"><b>Make it a complete question.</b> A learner should know exactly what is being asked before reading a single option.<br><b>Keep the wording simple.</b> You are measuring the content, not reading speed. Long or ornate stems measure the wrong thing.<br><b>One idea only.</b> Two concepts in one stem means a wrong answer tells you nothing about which one they missed.<br><b>Avoid negatives.</b> If you genuinely cannot, put the <b>not</b> or <b>except</b> in bold so nobody misses it.<br><b>No absolutes.</b> \u201CAlways\u201D and \u201Cnever\u201D in a stem almost always make the item unanswerable.<br><b>No leaks.</b> One item must never answer another, and never reference \u201Cquestion 2\u201D.</p></div>
 <div class="box info"><span class="bh">Writing the options</span><p class="tight"><b>One best answer.</b> If a knowledgeable person could argue for two, the item is broken.<br><b>Grammatically consistent with the stem.</b> An \u201Ca/an\u201D mismatch or a singular-plural slip hands the answer over for free.<br><b>Parallel in form and length.</b> The odd one out gets picked because it looks different, not because it is right.<br><b>Mutually exclusive.</b> Overlapping ranges or \u201Csometimes / often / always\u201D sets have no single best answer.<br><b>In a logical order.</b> Numeric options ascend; steps run in sequence.<br><b>Distractors are real misconceptions,</b> so a wrong answer tells you <em>which</em> misunderstanding to address. Joke options measure nothing.<br><b>Vary where the answer sits</b> across the bank, and avoid \u201Call of the above\u201D. If you use it, use it sometimes when it is wrong too.</p></div>
 <div class="box rule"><span class="bh">The rule that outranks all the craft</span><p class="tight">Match the instrument to the objective. If the objective says <em>configure</em>, no multiple-choice item can measure it, however well built. That is not a bad question, it is the wrong tool, and the module needs a performance task instead. Clean recall items are legitimate and expected: recall is not a flaw, it is a level. Writing past recall into application and analysis where you can is what makes a bank worth having.</p></div>
 <p><strong>In our courses.</strong> For IT Support, \u201CWhich port does HTTPS use?\u201D is a legitimate knowledge check that supports later configuration work, while \u201CConfigure the firewall\u201D cannot be assessed by a quiz item at all. For MERN, an item on what a given status code signals is fair scaffolding; whether the learner can build the endpoint is not something a quiz can answer.</p>
 <p style="margin-top:14px"><strong>Go deeper</strong>, on why these checks matter more than their size suggests:</p><div class="video"><iframe src="https://www.youtube.com/embed/sYdVe5O7KBE" title="Dylan Wiliam: Formative assessment" loading="lazy" allowfullscreen></iframe></div><div class="vidcap">🎯 <b>Watch task:</b> listen for the difference between a check that <em>generates</em> information a teacher can act on and one that just produces a mark. That distinction is the whole reason a knowledge check exists inside a lesson rather than only at the end. (<a href="https://www.youtube.com/watch?v=sYdVe5O7KBE" target="_blank" rel="noopener">Open on YouTube</a>)</div>
 <p class="tight" style="color:var(--muted)">Now build one. Four decisions, each checked on its own, and the item assembles above as you choose. Full rules stay in the ${gl('kba','Handbook')} for when you are writing a whole bank.</p>`,

 coach:"<b>Drag blocks from the palette into the schedule</b> (clicking works too); select ✕ on a scheduled block to remove it. Watch the two meters: fill all 240 minutes, keep Activated ≥ 75%, and include the required elements (chips turn green). Then press Check my day.",
 hint:"A 90-minute lecture alone eats 37% of the day as passive time. Convert lecture into demo-along, labs, or discussion, and don't forget the day opens with a warm-up and closes with an exit ticket.",
 html:()=>`${(function(){const o=recall("objective");return o?`<div class="box info"><span class="bh">Designing toward</span><p class="tight">\u201C${o}\u201D</p></div>`:"";})()}<p><strong>The concept:</strong> skill comes from doing, so class time is budgeted like money, and passive listening is the expensive luxury.</p><div class="diag"><svg viewBox="0 0 720 78" role="img" aria-labelledby="d7-t"><title id="d7-t">The 75 percent activated-learning budget: select a segment</title><rect x="20" y="24" width="680" height="34" rx="9" fill="#f3eee6"/><g class="fdu hot" tabindex="0" role="button" aria-label="Activated ≥75%" data-name="Activated ≥75%" data-info="Discussion, labs, building, pair work, share-outs, anything where learners PRODUCE. This is where skill actually forms."><rect x="20" y="24" width="510" height="34" rx="9" fill="#1d5fa8"><animate attributeName="width" from="0" to="510" dur="1s" fill="freeze"/></rect><text x="265" y="46" text-anchor="middle" font-size="13" fill="#fff" font-weight="600">ACTIVATED ≥ 75%</text></g><g class="fdu hot" tabindex="0" role="button" style="animation-delay:.5s" aria-label="Passive ≤25%" data-name="Passive ≤25%" data-info="Listening and watching. Useful in doses: the budget caps it at a quarter of the day. A 90-minute lecture alone eats 37% of a 240-minute day."><rect x="530" y="24" width="170" height="34" rx="9" fill="transparent"/><text x="615" y="46" text-anchor="middle" font-size="12" fill="#5b6b7a">passive ≤ 25%</text></g><line x1="530" y1="16" x2="530" y2="66" stroke="#12283f" stroke-width="2.5"/></svg><div class="dcap">👆 <b>Select either segment.</b> The black line is the bar you’ll design against in a minute.</div></div><p>Guide references: ${gl('modality','modality & the 75% rule')} · ${gl('rhythm','assessment rhythm')}.</p>
 <div class="meta"><span class="mi">🔍</span><div><b>Design note:</b> this course budgets its own minutes by the rule it teaches: one warm-up, then simulations, builders, and review queues.</div></div><p>A lesson day isn\u2019t a list of topics; it\u2019s a <b>rhythm</b>. Two things anchor every day:</p>
 <div class="box info"><span class="bh">The shape of a good day</span><p class="tight"><b>1. It opens and closes with the learner active.</b> A warm-up discussion opens; an exit ticket closes. That frame is non-negotiable: it turns arrival and departure into thinking, not logistics.<br><b>2. The middle earns the objective.</b> Every block between should move the learner toward doing the thing the objective names: short input, then practice, with practice winning the clock. If a block is just the instructor talking, it\u2019s spending time the objective can\u2019t afford.</p></div>
 <p><b>The 75% bar is a floor, not a target.</b> \u201CActivated\u201D means the learner is doing, deciding, or producing, not watching. Lecture and demo have a place (they set up practice), but if they cross 25% of the day, the day has drifted from performance back to consumption. As you place blocks, watch the meter: it\u2019s telling you whether the day trains a skill or just covers a topic.</p>
 <p><strong>Budgeting a day, not filling it.</strong> A lesson day is 240 minutes of a learner\u2019s working life, and the design question is what fraction of it they spend doing rather than receiving. The 75 percent activated bar is a floor, not a target: activated means deciding, producing, or practicing, and if input blocks cross a quarter of the day, the day has drifted from training a skill to covering a topic.</p>
 <div class="box info"><span class="bh">The shape of a day that works</span><p class="tight"><b>It opens and closes with the learner active.</b> A warm-up turns arrival into thinking; an exit ticket turns departure into synthesis. Both are non-negotiable, and both are cheap.<br><b>Input arrives in short blocks, close to where it is used.</b> Twenty minutes of explanation immediately before the practice that needs it beats an hour of front-loading, because the learner has somewhere to put it.<br><b>Practice carries the middle.</b> The longest blocks are the ones where learners work, and the day\u2019s objective is earned there or not at all.<br><b>Difficulty rises across the day.</b> Guided first, more independent later, so the scaffold fades within the day as well as across the module.</p></div>
 <div class="box rule"><span class="bh">The check before you commit a schedule</span><p class="tight">Point at the block where the objective actually gets earned. If you cannot, the day is a sequence of topics rather than a lesson. And if the only unguided work is at the end and there is no time for feedback on it, learners never find out what they got wrong.</p></div>
 <p><strong>In our courses.</strong> An IT Support day that is three hours of vendor video and a twenty-minute lab fails the bar and, more importantly, does not produce anyone who can resolve a ticket. A MERN day that front-loads all theory then runs one long build usually leaves no time for review, so the mistakes ship into the next lesson.</p>
 <p class="tight" style="color:var(--muted)">Build the day below and watch the meter. It is telling you whether the day trains a skill or covers a subject.</p>
 <p><strong>What you are actually budgeting.</strong> A lesson day is 240 minutes of somebody\u2019s working life. Every block you place is a decision about what that person spends their attention on, and the total does not stretch. Adding a lecture block does not add time to the day; it takes that time from practice.</p>
 <div class="box info"><span class="bh">How the blocks behave</span><p class="tight"><b>Input blocks</b> (lecture, demo, reading) set up practice. They are cheap in small doses and expensive in large ones, because a learner listening is not yet a learner who can do the thing.<br><b>Practice blocks</b> (labs, activities, paired work) are where the objective gets earned. These should be the longest blocks on the page.<br><b>Check blocks</b> (warm-up, exit ticket, quick check) bracket the day and tell you whether it worked. Both ends matter: the warm-up turns arrival into thinking, the exit ticket turns departure into synthesis.<br><b>Breaks</b> are real and they count against the clock. A day planned without them is a day that will overrun.</p></div>
 <div class="box rule"><span class="bh">Three things to get right</span><p class="tight"><b>Input close to use.</b> Twenty minutes of explanation immediately before the practice that needs it beats an hour front-loaded, because the learner has somewhere to put it.<br><b>Difficulty rising.</b> Guided work first, more independent later, so the scaffold fades inside the day as well as across the module.<br><b>Room to recover.</b> If the only unguided work sits at the very end with no time after it, nobody finds out what they got wrong until tomorrow.</p></div>
 <p><strong>The meter is not the goal.</strong> Clearing 75 percent activated tells you the shape is plausible. It does not tell you the day earns its objective. Before you commit a schedule, point at the block where the learner does the thing the objective names. If you cannot, the day covers a topic instead of building a skill, and the meter will still be green.</p>`,

 coach:`For each of your items: <b>✓ Ships as is</b> if it meets the rules, or <b>✗ I need to fix this</b> if it does not. Choosing to fix one requires you to <b>name what is actually wrong</b>, which is the part that takes practice. Nothing here is penalised. Rules: ${gl('kba','writing KBAs')}.`,
 hint:"Good items: concise stem, one best answer, parallel and mutually exclusive options, no giveaways. Bad tells: unmarked negatives, a/an vowel clues, absolutes, lazy all/none-of-the-above, items that lean on other items, and remember: clean recall items are legitimate; recall \u2260 bad.",
 html:`<p><strong>Now the harder version.</strong> You just built one item carefully. Real work is drafting a bank of them at speed, then catching your own defects before anyone else does. These five are yours. “Something feels off” is not usable: you have to name what is wrong in order to fix it.</p>
 <div class="box info"><span class="bh">The rules you just wrote to, in one line each</span><p class="tight"><b>Stem:</b> a complete question, simply worded, one idea, no unmarked negative, no absolute, no leak between items.<br><b>Options:</b> one best answer, grammatically consistent, parallel in form and length, mutually exclusive, logically ordered, distractors that are real misconceptions, no lazy \u201Call of the above\u201D.<br><b>Instrument:</b> match it to the objective. A performance objective needs a performance task, however well the item is written.</p></div>
 <div class="box rule"><span class="bh">The failure modes to send back</span><p class="tight"><b>Trick questions.</b> Testing careful reading rather than knowledge.<br><b>Give-aways.</b> Grammar, length, or specificity that signals the answer without knowing the content.<br><b>Recall where performance is required.</b> The wrong instrument, not a bad question.<br><b>Vague verdicts.</b> Name the specific defect or the send-back is useless to whoever has to fix it.</p></div>
 <div class="meta"><span class="mi">\U0001f50d</span><div><b>Design note:</b> some queue items sit outside your home domain deliberately. When subject expertise cannot carry you, the standard has to.</div></div>
 <p class="tight" style="color:var(--muted)">Read each of your items against the rules. Let the ones that hold stand, and where one does not, name the specific defect.</p>`,

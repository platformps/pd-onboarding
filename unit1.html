{id:"d1x",title:"Unit 1 check: take a request from intake to a staged repo",crumb:"Unit 1 \u00b7 Unit check",mins:10,
 lead:"One real request, start to finish. Everything Unit 1 covered gets used here: who decides what, what a package needs before you build, where files live, and how they are named. Six decisions, and each one shows you the consequence before you move on.",
 html:`<div class="box rule"><span class="bh">How this one works</span><p class="tight">Pick the response you would actually defend, then read what follows from it. A wrong pick explains itself and lets you try again, so the point is to see the reasoning rather than to score. Nothing here is recorded or sent anywhere.</p></div>`,
 coach:"Work the request one decision at a time.",
 activity:{type:"story",id:"d1xs",points:12,
  steps:[
   {tag:"Step 1 of 6 \u00b7 The request arrives",
    text:"A client wants our MERN course customized to their stack and timeline. The request lands in your inbox before Design has classified it. What do you do?",
    opts:[
     {t:"Start scoping the build, since a customized course clearly needs new work.",fb:"Too early. Whether this becomes a new course, a revision, or nothing at all is Design\u2019s call, and the answer changes what you build. Scoping now risks building the wrong thing."},
     {t:"Wait for Design\u2019s classification, since the intake decision and the identifier are theirs.",ok:true,fb:"Right. Design owns the intake call. Your work starts once you know whether it is a new course, a revision, or no product change."},
     {t:"Classify it yourself as a new UCI and tell Design what you decided.",fb:"Not our call. Development receives the classification rather than making it. Deciding for Design creates conflicting records of what the client agreed to."}]},
   {tag:"Step 2 of 6 \u00b7 The classification comes back",
    text:"Design classifies it as a new UCI, because the content and constraints diverge from the market course. What does that obligate Development to produce?",
    opts:[
     {t:"Update the existing MERN modules and bump the version.",fb:"That is what a revision obligates. A new UCI means the course does not exist yet, so updating the market course would change a product other cohorts are running."},
     {t:"The full set: modules, lessons, assessments, facilitator guide, and a new repo.",ok:true,fb:"Right. A new UCI is a build from nothing. Check whether anything is genuinely reusable, but assume nothing until you have."},
     {t:"Nothing yet, since the client has not signed off on a timeline.",fb:"The classification is the trigger for planning. Waiting for more certainty than the process provides is how builds start late."}]},
   {tag:"Step 3 of 6 \u00b7 The package arrives",
    text:"Design sends the handoff. Build specifications are present. Client notes are present, with two tooling constraints. The target job description is 14 months old and the client has renamed the role. What is your readiness call?",
    opts:[
     {t:"Not ready. The job description is stale, so the objectives cannot be trusted.",fb:"Too strict. Stale is not the same as missing. The load-bearing documents are here, so this is a constraint to document rather than a reason to block the whole build."},
     {t:"Ready with constraints. Load-bearing documents are present; document the stale job description and name who owns re-confirming the role.",ok:true,fb:"Right. Build specifications and client notes are the load-bearing pieces and both are here. The aging job description is real, so it gets named, owned, and worked around rather than ignored."},
     {t:"Ready. Everything on the list is present, so there is nothing to flag.",fb:"Present is not the same as current. Objectives derived from a 14-month-old description for a renamed role would train people for a job that changed. That needs recording."}]},
   {tag:"Step 4 of 6 \u00b7 Someone asks you to start",
    text:"The client is keen and your director asks whether you can begin building module 1 this week, before the job description is re-confirmed. What do you say?",
    opts:[
     {t:"Yes, and say nothing about the job description, since the constraint is already documented.",fb:"Documenting it is not the same as managing it. If module 1\u2019s objectives depend on the role definition, starting there builds on the part you know is unstable."},
     {t:"No, nothing starts until every input is confirmed.",fb:"That blocks work a documented constraint could have unblocked. Ready-with-constraints exists precisely so a project can move while a gap is being closed."},
     {t:"Yes, on the parts that do not depend on the role definition, and say which parts those are and what is still waiting.",ok:true,fb:"Right. You protect the schedule and the quality at once by naming what can proceed, what cannot, and what you are waiting on."}]},
   {tag:"Step 5 of 6 \u00b7 Staging the repo",
    text:"You are creating the repo for this build. Where does the module blueprint go?",
    opts:[
     {t:"Under Design, since the blueprint reflects design decisions.",fb:"This is the one people get wrong most. The blueprint is produced during Developing, once there is content to map, so it belongs in our folder. Put it in the design folder and the people who need it will not look there."},
     {t:"Under Developing, since it is created as soon as the module has content and kept current as files are built.",ok:true,fb:"Right. The blueprint is ours, produced during Developing. Each stage keeps its own documents in its own folder, which is how anyone finds them."},
     {t:"Anywhere, as long as the file name is correct.",fb:"Both matter. A correctly named file in the wrong folder is still a file nobody finds, because people look in the folder that owns that kind of document."}]},
   {tag:"Step 6 of 6 \u00b7 Naming the first lab",
    text:"You are creating a graded guided lab, the first item in lesson 2 of module 301. What do you name it?",
    opts:[
     {t:"ALAB 301.2.1",fb:"Wrong prefix. An ALAB is an assignment lab, where the learner drives from a problem statement. A guided lab is a GLAB."},
     {t:"R-GLAB 301.2.1",ok:true,fb:"Right. GLAB for a guided lab, R- because it is graded, then module 301, lesson 2, item 1. A reviewer can tell what it is without opening it."},
     {t:"GLAB 301.2.1",fb:"Close, but this one is graded, and the R- prefix is what marks that. Without it, the file name says the lab is ungraded."}]}],
  fbGood:"You took the request from intake to a staged repo without building on a guess and without blocking work a constraint could unblock. Those are the two failures this unit exists to prevent.",
  fbBad:"Read the explanations on the ones you changed. The three that separate reviewers: the intake call belongs to Design, a stale input is a documented constraint rather than a blocker, and the blueprint is a Developing artifact."},
 transition:"That is Unit 1 applied end to end. Unit 2 moves from judging what arrives to designing what goes inside it."}
]},

 html:`<div id="dashslot"></div><div class="box info"><span class="bh">Confirm your project</span><p class="tight">Each unit is a separate package, so your Unit 1 choice doesn\u2019t carry over automatically. If the picker appears above, just reselect your project: the rest of this unit adapts to it.</p></div><p><strong>By the end of Unit 2 you'll be able to:</strong></p>
 <ul class="obj"><li>Approve or reject draft objectives using the observable-verb test</li><li>Assemble a 240-minute lesson day that clears the 75% activated-learning bar</li><li>Review KBA items like a QA reviewer, naming the exact violation rather than sensing something is off</li></ul><div class="terms"><div class="th">🔤 Design-day vocabulary</div><dl><dt>Objective</dt><dd>One sentence stating what a learner will be able to do. Outlines are built from these.</dd><dt>Outcome</dt><dd>The job-level capability a whole course produces; objectives ladder up to it.</dd><dt>Evidence</dt><dd>The assessments and rubrics that prove an objective was met, designed before content.</dd><dt>Activated learning</dt><dd>Learners producing (discussing, building, solving) vs. passively receiving. Budgeted at ≥75% of every lesson.</dd></dl></div><div class="diag"><svg viewBox="0 0 720 112" role="img" aria-labelledby="db-t"><title id="db-t">Backward design. Select each stage</title><g class="fdu hot" tabindex="0" role="button" aria-label="1 · Outcomes" data-name="1 · Outcomes" data-info="Written first, sourced from the target job: what a graduate can DO. Everything downstream traces back here."><rect x="18" y="26" width="200" height="60" rx="10" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="118" y="16" text-anchor="middle" font-size="11" font-family="monospace" fill="#8fa0ae">FIRST</text><text x="118" y="51" text-anchor="middle" font-size="13.5" fill="#164a85" font-weight="600">Outcomes</text><text x="118" y="70" text-anchor="middle" font-size="11" fill="#5b6b7a">what a graduate can DO</text></g><path class="fdu" style="animation-delay:.3s" d="M 222 56 L 252 56" stroke="#1d5fa8" stroke-width="2.5" marker-end="url(#arrB)"/><g class="fdu hot" tabindex="0" role="button" style="animation-delay:.4s" aria-label="2 · Evidence" data-name="2 · Evidence" data-info="Assessments and rubrics designed before any content exists, so teaching aims at proof, not coverage."><rect x="260" y="26" width="200" height="60" rx="10" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="360" y="16" text-anchor="middle" font-size="11" font-family="monospace" fill="#8fa0ae">SECOND</text><text x="360" y="51" text-anchor="middle" font-size="13.5" fill="#164a85" font-weight="600">Evidence</text><text x="360" y="70" text-anchor="middle" font-size="11" fill="#5b6b7a">assessments &amp; rubrics</text></g><path class="fdu" style="animation-delay:.7s" d="M 464 56 L 494 56" stroke="#1d5fa8" stroke-width="2.5" marker-end="url(#arrB)"/><g class="fdu hot" tabindex="0" role="button" style="animation-delay:.8s" aria-label="3 · Experiences" data-name="3 · Experiences" data-info="Lessons, labs, and lesson days: designed LAST, in service of the outcomes and the evidence."><rect x="502" y="26" width="200" height="60" rx="10" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><text x="602" y="16" text-anchor="middle" font-size="11" font-family="monospace" fill="#8fa0ae">LAST</text><text x="602" y="51" text-anchor="middle" font-size="13.5" fill="#1c2b3a" font-weight="600">Experiences</text><text x="602" y="70" text-anchor="middle" font-size="11" fill="#5b6b7a">lessons · labs · days</text></g><defs><marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1d5fa8"/></marker></defs></svg><div class="dcap">👆 <b>Select each stage</b>. The order is the whole idea: content comes last.</div></div><div class="diag"><svg viewBox="0 0 720 92" role="img" aria-labelledby="dr-t"><title id="dr-t">The assessment rhythm: select a beat</title><line class="draw" x1="50" y1="40" x2="670" y2="40" stroke="#1d5fa8" stroke-width="2.5"/><g class="fdu hot" tabindex="0" role="button" style="animation-delay:0.2s" aria-label="Daily" data-name="Daily" data-info="Warm-up opens the day, exit ticket closes it. Both are formative and both run every day."><circle cx="80" cy="40" r="9" fill="#1d5fa8"/><text x="80" y="66" text-anchor="middle" font-size="11.5" fill="#1c2b3a" font-weight="600">Daily</text></g><g class="fdu hot" tabindex="0" role="button" style="animation-delay:0.4s" aria-label="Weekly" data-name="Weekly" data-info="2–3 labs reinforcing the week’s skills; at least one graded individual assessment."><circle cx="270" cy="40" r="9" fill="#1d5fa8"/><text x="270" y="66" text-anchor="middle" font-size="11.5" fill="#1c2b3a" font-weight="600">Weekly</text></g><g class="fdu hot" tabindex="0" role="button" style="animation-delay:0.6s" aria-label="Module end" data-name="Module end" data-info="KBA (knowledge) and/or SBA (skill) close every module: the summative gate."><circle cx="470" cy="40" r="9" fill="#3f88c5"/><text x="470" y="66" text-anchor="middle" font-size="11.5" fill="#1c2b3a" font-weight="600">Module end</text></g><g class="fdu hot" tabindex="0" role="button" style="animation-delay:0.8s" aria-label="Course end" data-name="Course end" data-info="The capstone integrates everything, produces a real deliverable, and is presented."><circle cx="650" cy="40" r="9" fill="#1f9d76"/><text x="650" y="66" text-anchor="middle" font-size="11.5" fill="#1c2b3a" font-weight="600">Course end</text></g></svg><div class="dcap">👆 <b>Select a beat</b> to see its instruments. Notice this course follows the same rhythm you’re reading about.</div></div><p style="margin-top:14px"><strong>Go deeper</strong>, backward design, from its co-creator:</p><div class="video"><iframe src="https://www.youtube.com/embed/4isSHf3SBuQ" title="Grant Wiggins: Understanding by Design workshop, part 1" loading="lazy" allowfullscreen></iframe></div><div class="vidcap">🎯 <b>Watch task:</b> listen for how Wiggins separates “interesting activities” from “evidence of learning”. It’s the exact distinction your objectives review will hinge on. (<a href="https://www.youtube.com/watch?v=4isSHf3SBuQ" target="_blank" rel="noopener">Open on YouTube</a>)</div><div class="media-row"><a class="media-card" href="https://www.pnas.org/doi/10.1073/pnas.1319030111" target="_blank" rel="noopener"><span class="mc-ic">📄</span><span><span class="mc-t">Freeman et al. (2014), PNAS</span><span class="mc-m">The 225-study meta-analysis: active learning raises scores ~0.47 SD and cuts failure rates</span></span></a></div>`,

{id:"sob",title:"Review the draft objectives",crumb:"Unit 2 · Simulation",
 mins:8,
 lead:"Five module objectives arrived in the outline from Design. We work with them during the design phase, and this review is where that collaboration gets concrete: check that each objective is measurable enough to build an assessment from, and send back the ones that are not. Once they hold, the lesson objectives we write from them are ours.",
 demo:{eg:"Draft objective: “Know the OSI model.”",steps:["Observable-verb test first: could I <em>watch</em> a learner ‘know,’ and would two instructors agree it happened? No. ‘know’ is invisible.","Scope next: ‘the OSI model’ is a whole topic, not a behavior, and nothing here hints at what evidence would prove it.","Verdict: ✗ Send back, unmeasurable verb, boundless scope. Your five drafts: verb, scope, evidence, in that order, every time."]},
 frame:function(){const c=primary()||{domain:"your project",objectiveDraft:"a draft objective",module:"your module"};return {
   prev:"Design sent draft objectives for your "+c.domain+" module ahead of the handoff meeting.",
   now:"One draft reads: \u201C"+c.objectiveDraft+"\u201D "+(c.ph_obj?"(sample wording. Pending validation)":"")+"",
   role:"You are reviewing objectives like a QA reviewer before the handoff.",
   resp:"Approve what holds; send back what doesn't: naming the exact violation.",
   use:"The Objectives section of the Playbook; your case file.",
   why:"Bad objectives are where bad courses are born. Everything downstream inherits this.",
   next:"The objective you approve is logged and reused in the schedule and assessment work."
 };},
 coach:`<b>✓ Approve</b> objectives that meet the standard, <b>✗ Send back</b> those that don't, and name exactly why. The standard: ${gl('objectives','writing objectives')}.`,
 hint:"The test: could you watch a learner do it, and would two instructors agree it happened? \u201CUnderstand / learn / appreciate\u201D fail that test. And an activity (\u201Ccomplete the lab\u201D) is evidence of an objective, never the objective itself.",
 html:()=>`${(function(){const c=primary();return c?`<div class="pullquote"><div class="pq">Draft objective for review: \u201C${c.objectiveDraft}\u201D</div><div class="pa">${c.domain} · ${c.module}${c.ph_obj?" · sample wording pending validation":""}</div></div>`:"";})()}<p><strong>Why we review objectives we did not write.</strong> Design sets the module objectives, with us at the table during the design phase. We do not author them, but we cannot build from a bad one: an unmeasurable objective gives you no assessment to write and no way to tell whether a lesson worked. So reviewing the handoff is the first thing we do, and sending one back is a normal part of the process rather than a complaint. Here is the standard we review against, and the same standard applies to the lesson objectives we write from them.</p>
 <p><strong>What an objective is for.</strong> An objective is a contract about evidence. It states what a learner will be able to do, in conditions specific enough that you already know what would prove it. Everything downstream is derived from it: the assessment measures the objective, the lab gives practice toward it, and the lesson day spends its minutes earning it. Write it loosely and each of those decisions becomes a guess.</p>
 <div class="box info"><span class="bh">The four parts of a usable objective</span><p class="tight"><b>1. The performance.</b> An observable verb plus what it acts on. Configure wireless security settings.<br><b>2. The conditions.</b> What the learner has, or does not have, while performing. Given a SOHO router and a provided checklist.<br><b>3. The criterion.</b> How good counts as good. To the checklist, with no open ports remaining.<br><b>4. The level.</b> Whether this is knowledge that supports later performance, or the performance itself.<br>Parts 2 and 3 are the ones most often missing. Without them, two reviewers read the same objective and picture different assessments.</p></div>
 <p><strong>The verb decides everything.</strong> Verbs sort into three levels, and the level commits you to a kind of evidence:</p>
 <table class="mtbl"><tr><th>Level</th><th>Verbs</th><th>Evidence it commits you to</th></tr>
 <tr><td><b>Know</b></td><td>identify, define, explain, describe</td><td>A question can measure it. Legitimate as scaffolding, never as the end of a module.</td></tr>
 <tr><td><b>Do</b></td><td>configure, build, write, query, resolve</td><td>The learner produces something. A quiz cannot measure this honestly.</td></tr>
 <tr><td><b>Decide</b></td><td>diagnose, choose, prioritize, justify</td><td>Requires a situation with more than one defensible answer, plus the reasoning.</td></tr></table>
 <p class="tight">Verbs like understand, know about, learn, appreciate, and be familiar with belong to no level, because they name a state inside someone\u2019s head. You cannot watch them, so you cannot assess them.</p>
 <div class="box rule"><span class="bh">The two tests, in order</span><p class="tight"><b>Observable:</b> could you watch a learner do this, and would two instructors agree it happened?<br><b>Sufficient:</b> does the sentence already tell you what the assessment would be? If you have to invent conditions in order to write the test, the objective is not finished.</p></div>
 <p><strong>The four failure modes,</strong> each with what it looks like repaired:</p>
 <div class="box info"><span class="bh">Send it back when you see these</span><p class="tight"><b>Unmeasurable verb.</b> \u201CUnderstand networking fundamentals.\u201D Repaired: \u201CGiven a failed connection, identify the layer at fault and the next diagnostic step.\u201D<br><b>Compound.</b> \u201CBuild APIs and use Git in a team.\u201D Split it. Two behaviors need two objectives, because they need two pieces of evidence.<br><b>Boundless scope.</b> \u201CKnow the OSI model.\u201D That is a topic, not a behavior. Name what the learner does with it.<br><b>Activity as objective.</b> \u201CComplete GLAB 301.1.1.\u201D The lab is how evidence gets produced; the objective is the capability the lab proves.</p></div>
 <p><strong>What this looks like in our courses.</strong> For IT Support, \u201CUnderstand printer troubleshooting\u201D gives you nothing to build, while \u201CGiven a user-reported print failure, diagnose the cause and document the resolution in the knowledge base\u201D tells you the lab, the assessment, and the rubric in one sentence. For MERN, \u201CLearn about REST\u201D gives you nothing, while \u201CGiven a feature spec, implement and document a REST endpoint that passes the provided tests\u201D does.</p>
 <p class="tight" style="color:var(--muted)">Verb lists and the objective template are in the Handbook. Five drafts are below. Run observable first, then sufficient, and name the failure mode when you send one back.</p>`,
 transition:function(){const c=primary()||{objectiveFixed:"the corrected objective"};remember("objective",c.objectiveFixed);return "Approved objective logged: \u201C"+c.objectiveFixed+"\u201D "+((c&&c.ph_obj)?"(sample, validate)":"")+". It now drives your lesson-day design and assessment review.";},
 activity:{type:"review",id:"sobr",points:15,queueTag:"Outline draft · objectives",
  items:[
   {content:"\u201CUnderstand networking fundamentals.\u201D",
    good:false,
    why:"✗ Sent back: \u201Cunderstand\u201D isn't observable or measurable. No two instructors could agree on when it happened, and \u201Cnetworking fundamentals\u201D is a whole domain, not a behavior.",
    reasons:[
     {t:"The verb isn't observable or measurable, and the scope is an entire domain rather than a specific behavior",ok:true,fb:""},
     {t:"It's too short. Objectives need to be at least a full sentence",fb:"Length isn't the standard; observability is. A short objective with a performance verb would pass."},
     {t:"It should mention which lesson covers it",fb:"Mapping to lessons happens in the blueprint. The violation here is the unmeasurable verb and boundless scope."}]},
   {content:"\u201CConfigure wireless security settings on a SOHO router to a provided checklist.\u201D",
    good:true,
    why:"✓ Approved. A performance verb you can watch (\u201Cconfigure\u201D), a specific scope (SOHO router, wireless security), and built-in evidence (the checklist). An assessment practically writes itself from this.",
    reasons:[]},

{id:"modref",title:"What goes in a module",crumb:"Unit 2 · Reference",mins:9,
 lead:"Before you compose a module, the standard itself. What a module must contain, how much is enough, and how the answer changes with the situation. This is the reference you\u2019ll come back to; read it once here, then keep it in the Handbook.",
 html:`
 <p>The most common question new developers ask is: <b>how many quizzes, reflections, and graded assignments does a module actually need?</b> There is no single number, but there is a firm rule and a repeatable way to decide. This page is the whole answer.</p>

 <div class="box rule"><span class="bh">The north star</span><p class="tight">A module should spend its time letting learners <b>prove mastery</b>, not watch it demonstrated. If a learner could finish your module having only followed instructions. It is not competency-based yet. Guided practice is a <em>ramp</em> toward independent performance, never the destination.</p></div>

 <p><b>The one firm rule.</b> Every module ends with a <b>summative task that poses a real problem the learner solves without step-by-step guidance</b>: the competency check. Everything before it exists to get them ready for it. (This is backward design: decide the evidence of competence first, then build toward it.) For your courses that\u2019s concrete: an IT Support module ends with the learner diagnosing and resolving an unscripted ticket; a MERN module ends with them building a working endpoint from a spec, not answering questions <em>about</em> one.</p>

 <p><b>How much of everything else?</b> Enough to support and verify each objective, no more. Two tests replace counting:</p>
 <div class="box info"><span class="bh">The two tests</span><p class="tight"><b>Alignment</b>: every assessment maps to an objective, and every objective has at least one piece of evidence. A quiz that checks no objective is noise; an objective with no evidence is a gap.<br><b>Sufficiency</b>: add a formative check (quiz, knowledge check, reflection) wherever a learner could go wrong <em>undetected</em> before a high-stakes moment. More checks are not better; over-assessing fragments attention.</p></div>

 <p><b>The scaffold must fade.</b> Across a module, activated time should shift from guided (I-do, we-do) to independent (you-do). The summative is pure you-do. A module that stays guided the whole way feels active but never proves anything. That is the one anti-pattern to watch for.</p>

 <p><b>Match the shape to the situation.</b> Duration and content type change the shape, never the rule:</p>
 <table class="mtbl">
  <tr><th>Module type</th><th>What it needs</th></tr>
  <tr><td><b>Standard</b><br><span class="mnote">~4\u20136+ lessons</span></td><td>The full arc: teach \u2192 guided practice \u2192 fading scaffold \u2192 independent practice \u2192 summative competency task. The default every module aims for.</td></tr>
  <tr><td><b>Short</b><br><span class="mnote">1\u20132 days</span></td><td>Compress the ramp, keep the proof. One tight teach-and-guided pass, then straight to an independent performance task. Drop the mid-module checkpoint, not the summative, even two days ends with the learner <em>doing</em>.</td></tr>
  <tr><td><b>Prep / foundational</b></td><td>When a module genuinely <em>is</em> prerequisite (terminology, safety, setup), its check may be a knowledge check or gated readiness task rather than a full problem-solve, but only if it is honestly foundational, and only the minimum needed to unlock the hands-on work.</td></tr>
  <tr><td><b>Vendor-constrained</b></td><td>When third-party content (e.g. a CompTIA module) only teaches \u201Cfollow the steps,\u201D you often cannot build problem-solving inside it. Author the competency assessment <em>on top</em>: your own SBA posing a real problem, using the vendor material as input. Raise equipment or authoring needs in the design phase, before development.</td></tr>
 </table>

 <div class="box rule"><span class="bh">The checklist: run this before you finalize any module</span><p class="tight">\u2610 Does every objective end in <b>independent</b> evidence, and not stop at guided practice?<br>\u2610 Does the module\u2019s time skew toward <b>doing</b> over consuming?<br>\u2610 Does the scaffold actually <b>fade</b> from guided to independent?<br>\u2610 Does it <b>close with unaided performance</b> (the summative)?<br>\u2610 Which <b>type</b> is this, and does its assessment match that type?<br>\u2610 Is every assessment <b>aligned</b> to an objective, with no orphan quizzes and no unmeasured objectives?</p></div>

 <p class="tight" style="color:var(--muted)">When in doubt: protect the summative, cut the filler. This full reference also lives in the ${gl('composition','Handbook \u2192 What goes in a module')} for when you need it mid-build.</p>
 `,
 transition:"That is the standard. Next you will apply it, matching real module situations to the right shape."},
{id:"mcomp",title:"Compose the module",crumb:"Unit 2 · Module composition",mins:8,
 lead:"You have read the standard for what a module contains, and this is where you apply it. Developers ask most often how many quizzes, labs, and assessments a module needs. There is no number, but there is a way of deciding, and four situations that tell you which way to go.",
 html:`<div class="box info"><span class="bh">The rule under all four</span><p class="tight">Every module ends with a <b>summative task that poses a real problem the learner solves unaided</b>: the competency check. If a learner could finish having only followed instructions. It isn't competency-based yet. The <em>type</em> of module changes how you get there, never whether you get there. Full detail lives in the Handbook \u2192 <b>What goes in a module</b>.</p></div>
 <p><strong>Why the answer is a pattern, not a number.</strong> The question SMEs ask is how many quizzes, labs, and assessments a module needs. There is no number, because a two-day vendor-constrained module and a six-lesson module we own end to end have genuinely different shapes. What is constant is the rule, and there are four recognizable situations that tell you how to apply it.</p>
 <div class="box rule"><span class="bh">The constant</span><p class="tight">Every module ends with a summative task where the learner solves a real problem unaided. Duration and content ownership change how you get there. They never change whether you get there.</p></div>
 <p><strong>Two tests decide the rest.</strong> <b>Alignment:</b> every assessment maps to an objective, and every objective has evidence. <b>Sufficiency:</b> add a formative check wherever a learner could go wrong undetected before something high-stakes. Those two replace counting, and they also tell you when to stop adding.</p>
 <p class="tight" style="color:var(--muted)">Match each real situation below to the pattern that fits it. Watch for the trap: the answer is never to drop the summative, it is how the summative adapts.</p>`,

{id:"s4",title:"Design a lesson day",crumb:"Unit 2 · Simulation",
 mins:10,
 lead:"You have a 240-minute class day to fill. Build a schedule that clears the 75% activated-learning bar, and actually earns its objective.",
 
 brief:{from:"Product Developer · IT domain",re:"Lesson 301.2 — day plan needed",text:"This day is 240 minutes and the current draft is lecture-heavy. Rebuild it so the activated-learning meter clears the bar."},
 demo:{eg:"The first block I place: Warm-up discussion: 15 min, activated.",steps:["I anchor the skeleton first: warm-up opens the day, exit ticket closes it. That rhythm is non-negotiable; content fits <em>between</em>.","Then I budget the big activated block: a lab, before spending a single passive minute. Passive time is the luxury I buy last, inside the 25%.","The meter runs the same math QA does: watch it as you place. Your 240 minutes: build."]},
 frame:function(){const c=primary()||{domain:"your project"};const obj=recall("objective");return {
   prev: obj ? ("You approved this objective: \u201C"+obj+"\u201D"): ("You're designing a lesson day for your "+c.domain+" module."),
   now:"That objective needs a lesson day built around it. 240 minutes, \u226575% activated.",
   role:"You are the Product Developer planning the lesson day.",
   resp:"Build the day so it earns its objective without slipping below the activated-learning bar.",
   use:"The Rhythm & Modality sections of the Playbook; the live meter.",
   why:"A day that drifts from its objective wastes the learner's time no matter how active it looks.",
   next:"The shape you build informs the assessment review that follows."
 };},
 coach:"<b>Drag blocks from the palette into the schedule</b> (clicking works too); select ✕ on a scheduled block to remove it. Watch the two meters: fill all 240 minutes, keep Activated ≥ 75%, and include the required elements (chips turn green). Then press Check my day.",
 hint:"A 90-minute lecture alone eats 37% of the day as passive time. Convert lecture into demo-along, labs, or discussion, and don't forget the day opens with a warm-up and closes with an exit ticket.",
 html:()=>`${(function(){const o=recall("objective");return o?`<div class="box info"><span class="bh">Designing toward</span><p class="tight">\u201C${o}\u201D</p></div>`:"";})()}<p><strong>The concept:</strong> skill comes from doing, so class time is budgeted like money, and passive listening is the expensive luxury.</p><div class="diag"><svg viewBox="0 0 720 78" role="img" aria-labelledby="d7-t"><title id="d7-t">The 75 percent activated-learning budget: select a segment</title><rect x="20" y="24" width="680" height="34" rx="9" fill="#f3eee6"/><g class="fdu hot" tabindex="0" role="button" aria-label="Activated ≥75%" data-name="Activated ≥75%" data-info="Discussion, labs, building, pair work, share-outs, anything where learners PRODUCE. This is where skill actually forms."><rect x="20" y="24" width="510" height="34" rx="9" fill="#1d5fa8"><animate attributeName="width" from="0" to="510" dur="1s" fill="freeze"/></rect><text x="265" y="46" text-anchor="middle" font-size="13" fill="#fff" font-weight="600">ACTIVATED ≥ 75%</text></g><g class="fdu hot" tabindex="0" role="button" style="animation-delay:.5s" aria-label="Passive ≤25%" data-name="Passive ≤25%" data-info="Listening and watching. Useful in doses: the budget caps it at a quarter of the day. A 90-minute lecture alone eats 37% of a 240-minute day."><rect x="530" y="24" width="170" height="34" rx="9" fill="transparent"/><text x="615" y="46" text-anchor="middle" font-size="12" fill="#5b6b7a">passive ≤ 25%</text></g><line x1="530" y1="16" x2="530" y2="66" stroke="#12283f" stroke-width="2.5"/></svg><div class="dcap">👆 <b>Select either segment.</b> The black line is the bar you’ll design against in a minute.</div></div><p>Guide references: ${gl('modality','modality & the 75% rule')} · ${gl('rhythm','assessment rhythm')}.</p>
 <div class="meta"><span class="mi">🔍</span><div><b>Design note:</b> this course budgets its own minutes by the rule it teaches: one warm-up, then simulations, builders, and review queues.</div></div><p>A lesson day isn\u2019t a list of topics; it\u2019s a <b>rhythm</b>. Two things anchor every day:</p>
 <div class="box info"><span class="bh">The shape of a good day</span><p class="tight"><b>1. It opens and closes with the learner active.</b> A warm-up discussion opens; an exit ticket closes. That frame is non-negotiable: it turns arrival and departure into thinking, not logistics.<br><b>2. The middle earns the objective.</b> Every block between should move the learner toward doing the thing the objective names: short input, then practice, with practice winning the clock. If a block is just the instructor talking, it\u2019s spending time the objective can\u2019t afford.</p></div>
 <p><b>The 75% bar is a floor, not a target.</b> \u201CActivated\u201D means the learner is doing, deciding, or producing, not watching. Lecture and demo have a place (they set up practice), but if they cross 25% of the day, the day has drifted from performance back to consumption. As you place blocks, watch the meter: it\u2019s telling you whether the day trains a skill or just covers a topic.</p>
 <p><strong>Budgeting a day, not filling it.</strong> A lesson day is 240 minutes of a learner\u2019s working life, and the design question is what fraction of it they spend doing rather than receiving. The 75 percent activated bar is a floor, not a target: activated means deciding, producing, or practicing, and if input blocks cross a quarter of the day, the day has drifted from training a skill to covering a topic.</p>
 <div class="box info"><span class="bh">The shape of a day that works</span><p class="tight"><b>It opens and closes with the learner active.</b> A warm-up turns arrival into thinking; an exit ticket turns departure into synthesis. Both are non-negotiable, and both are cheap.<br><b>Input arrives in short blocks, close to where it is used.</b> Twenty minutes of explanation immediately before the practice that needs it beats an hour of front-loading, because the learner has somewhere to put it.<br><b>Practice carries the middle.</b> The longest blocks are the ones where learners work, and the day\u2019s objective is earned there or not at all.<br><b>Difficulty rises across the day.</b> Guided first, more independent later, so the scaffold fades within the day as well as across the module.</p></div>
 <div class="box rule"><span class="bh">The check before you commit a schedule</span><p class="tight">Point at the block where the objective actually gets earned. If you cannot, the day is a sequence of topics rather than a lesson. And if the only unguided work is at the end and there is no time for feedback on it, learners never find out what they got wrong.</p></div>
 <p><strong>In our courses.</strong> An IT Support day that is three hours of vendor video and a twenty-minute lab fails the bar and, more importantly, does not produce anyone who can resolve a ticket. A MERN day that front-loads all theory then runs one long build usually leaves no time for review, so the mistakes ship into the next lesson.</p>
 <p class="tight" style="color:var(--muted)">Build the day below and watch the meter. It is telling you whether the day trains a skill or covers a subject.</p>
 <p><strong>What you are actually budgeting.</strong> A lesson day is 240 minutes of somebody\u2019s working life. Every block you place is a decision about what that person spends their attention on, and the total does not stretch. Adding a lecture block does not add time to the day; it takes that time from practice.</p>
 <div class="box info"><span class="bh">How the blocks behave</span><p class="tight"><b>Input blocks</b> (lecture, demo, reading) set up practice. They are cheap in small doses and expensive in large ones, because a learner listening is not yet a learner who can do the thing.<br><b>Practice blocks</b> (labs, activities, paired work) are where the objective gets earned. These should be the longest blocks on the page.<br><b>Check blocks</b> (warm-up, exit ticket, quick check) bracket the day and tell you whether it worked. Both ends matter: the warm-up turns arrival into thinking, the exit ticket turns departure into synthesis.<br><b>Breaks</b> are real and they count against the clock. A day planned without them is a day that will overrun.</p></div>
 <div class="box rule"><span class="bh">Three things to get right</span><p class="tight"><b>Input close to use.</b> Twenty minutes of explanation immediately before the practice that needs it beats an hour front-loaded, because the learner has somewhere to put it.<br><b>Difficulty rising.</b> Guided work first, more independent later, so the scaffold fades inside the day and not only across the module.<br><b>Room to recover.</b> If the only unguided work sits at the very end with no time after it, nobody finds out what they got wrong until tomorrow.</p></div>
 <p><strong>The meter is not the goal.</strong> Clearing 75 percent activated tells you the shape is plausible. It does not tell you the day earns its objective. Before you commit a schedule, point at the block where the learner does the thing the objective names. If you cannot, the day covers a topic instead of building a skill, and the meter will still be green.</p>`,
 activity:{type:"day",id:"s4d",points:15,total:240,
  palette:[
   {t:"Warm-up discussion",min:15,act:true,req:"warmup"},
   {t:"Lecture",min:30,act:false},
   {t:"Lecture (long)",min:60,act:false},
   {t:"Demo-along (learners follow on their machines)",min:30,act:true},
   {t:"Guided lab",min:60,act:true,req:"lab"},
   {t:"Guided lab (long)",min:90,act:true,req:"lab"},
   {t:"Pair troubleshooting scenario",min:30,act:true},
   {t:"Research activity + share-out",min:30,act:true},

  reqs:[{k:"warmup",label:"Warm-up"},{k:"lab",label:"≥1 lab"},{k:"exit",label:"Exit ticket"},{k:"t240",label:"240 min filled"},{k:"a75",label:"Activated ≥75%"}],
  fbGood:"That day clears the bar: full, activated, and rhythmically correct: warm-up in, exit ticket out, hands on a lab in between. This is the shape of every day you'll design.",
  fbBad:"Check the red chips. That's exactly what QA (and learners) would feel. Adjust and check again."}},
{id:"s5",title:"Run the KBA review queue",crumb:"Unit 2 · Simulation",
 mins:10,
 lead:"Five draft quiz items are waiting for review. Some are good, some aren't, and \u201Cit's bad\u201D isn't a verdict. Approve the good ones; send the bad ones back with the precise violation named.",
 brief:{from:"Product Quality & Experience (QA)",re:"KBA 301 — draft item bank review",text:"Five draft items are in your queue, from a bank that has not been reviewed. Give each a verdict plus the specific violation."},
 demo:{eg:"Q: Which OSI layer handles routing?&nbsp; A) Layer 2 &nbsp;B) Layer 3 &nbsp;C) Layer 4 &nbsp;D) Layer 5",steps:["Structure before content: concise stem, no negatives, no absolutes, no grammatical giveaways. Clean so far.","Options: parallel, mutually exclusive, plausible, in logical order, one best answer. Yes, it’s recall, and recall, cleanly built, is legal.","Verdict: ✓ Approve. Work your queue the same way: judge the structure before you judge the difficulty."]},
 coach:`For each item: <b>✓ Approve</b> if it meets our KBA rules, or <b>✗ Send back</b> if it doesn't. Sending back requires you to <b>name the exact violation</b>, which is the part that takes practice. Mistakes here just explain themselves. Rules: ${gl('kba','writing KBAs')}.`,
 hint:"Good items: concise stem, one best answer, parallel and mutually exclusive options, no giveaways. Bad tells: unmarked negatives, a/an vowel clues, absolutes, lazy all/none-of-the-above, items that lean on other items, and remember: clean recall items are legitimate; recall \u2260 bad.",
 html:`<p><strong>First, the term:</strong> a KBA. Knowledge-Based Assessment. Is the graded quiz closing every module; you created the file for one yesterday (KBA 301). <strong>Now the concept:</strong> a quiz item is a measuring instrument. Every flaw. A giveaway, an overlap, a leak: adds noise until the score measures test-taking instead of knowledge.</p>
 <div class="box info"><span class="bh">A good item, at a glance</span>Concise stem · one best answer · parallel, mutually exclusive options · no grammatical clues · no absolutes · stands alone. Full rules: ${gl('kba','writing KBAs')}.</div>
 <div class="meta"><span class="mi">🔍</span><div><b>Design note:</b> some queue items sit outside your home domain deliberately. When subject expertise cannot carry you, the standard has to.</div></div>
 <p><strong>What a knowledge check is for.</strong> A KBA measures whether a learner holds the knowledge a later performance depends on. It is scaffolding, not proof of competence, which means two things: it has to be honest about what it measures, and it must not become the module\u2019s evidence that someone can do the job.</p>
 <div class="diag"><svg viewBox="0 0 720 242" role="img" aria-labelledby="s5-d"><title id="s5-d">The parts of a usable knowledge-check item</title><rect x="12" y="12" width="696" height="44" rx="9" fill="#f3f0ea" stroke="#e8e1d6" stroke-width="1.5"/><text x="360" y="40" text-anchor="middle" font-size="13" font-family="IBM Plex Mono, monospace" fill="#1c2b3a">Which port does HTTPS use?   A) 21   B) 80   C) 443   D) 3389</text><circle cx="30" cy="88" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="30" y="92" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">1</text><text x="50" y="85" font-size="11.5" font-weight="700" fill="#1c2b3a">Stem</text><text x="50" y="101" font-size="10.5" fill="#42566a">Complete question. The learner knows what is asked before reading the options.</text><circle cx="30" cy="128" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="30" y="132" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">2</text><text x="50" y="125" font-size="11.5" font-weight="700" fill="#1c2b3a">One idea</text><text x="50" y="141" font-size="10.5" fill="#42566a">A single concept, so a wrong answer tells you which thing they missed.</text><circle cx="30" cy="168" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="30" y="172" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">3</text><text x="50" y="165" font-size="11.5" font-weight="700" fill="#1c2b3a">Plausible distractors</text><text x="50" y="181" font-size="10.5" fill="#42566a">Wrong options that represent real misconceptions, not filler.</text><circle cx="30" cy="208" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="30" y="212" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">4</text><text x="50" y="205" font-size="11.5" font-weight="700" fill="#1c2b3a">One defensible answer</text><text x="50" y="221" font-size="10.5" fill="#42566a">No option a knowledgeable person could argue for.</text></svg><div class="dcap">Every part earns its place. Remove one and the item stops measuring what you think it measures.</div></div>
 <div class="box info"><span class="bh">What makes an item usable</span><p class="tight"><b>It measures a stated objective.</b> If no objective covers it, the item is trivia, however interesting.<br><b>One idea per item.</b> Two concepts in one question means a wrong answer tells you nothing about which one they missed.<br><b>The stem is complete.</b> A learner should know what is being asked before reading the options.<br><b>Distractors are plausible and diagnostic.</b> Wrong options should represent real misconceptions, so a wrong answer tells you <em>which</em> misunderstanding. Joke options and \u201Call of the above\u201D measure test-taking, not knowledge.<br><b>One defensible answer.</b> If a knowledgeable person could argue for two options, the item is broken.</p></div>
 <div class="box rule"><span class="bh">The failure modes to send back</span><p class="tight"><b>Trick questions.</b> Testing careful reading rather than knowledge.<br><b>Give-aways.</b> Grammar, length, or specificity that signals the right answer without knowing the content.<br><b>Recall where performance is required.</b> If the objective says <em>configure</em>, a multiple-choice item cannot measure it. That is not a bad question, it is the wrong instrument.<br><b>Vague verdicts.</b> \u201CThis feels weak\u201D does not survive a handoff. Name the specific defect.</p></div>
 <p><strong>In our courses.</strong> For IT Support, \u201CWhich port does HTTPS use?\u201D is a legitimate knowledge check that supports later configuration work. \u201CConfigure the firewall\u201D cannot be assessed by a quiz item at all. For MERN, an item about what a given HTTP status code signals is fair scaffolding; whether the learner can build the endpoint is not something a quiz can answer.</p>
 <p class="tight" style="color:var(--muted)">Review each item. Approve what meets the rules, and when you send one back, name the specific defect.</p>`,
 activity:{type:"review",id:"s5r",points:15,queueTag:"KBA 301 · draft bank",
  items:[
   {content:"Q: How will the text and photo be aligned using the code below?<br><span class=\"mono\">CSS: .photo { float: right; }</span> &nbsp;<span class=\"mono\">HTML: My Cat &lt;img src=\"cat.jpg\" class=\"photo\"&gt;</span><br>A) Photo on the right, text wraps on the left &nbsp;B) Photo on the left, text wraps on the right &nbsp;C) Photo centered above the text &nbsp;D) Photo below the text",
    good:true,
    why:"✓ Approved. Higher-order thinking: the learner applies CSS knowledge to predict behavior instead of recalling a definition. Concise stem, parallel, mutually exclusive options. This is the framework's own model of a good item.",
    reasons:[]},
   {content:"Q: Which of the following is not an example of an input device?<br>A) Keyboard &nbsp;B) Mouse &nbsp;C) Scanner &nbsp;D) All of the above",
    good:false,
    why:"✗ Sent back: an unmarked negative (\u201Cnot\u201D), the \u201Can\u201D vowel giveaway, and \u201CAll of the above\u201D as a one-off crutch: three violations in one item.",
    reasons:[
     {t:"Unmarked negative in the stem, a grammatical (\u201Can\u201D) giveaway, and \u201CAll of the above\u201D used as a lazy default",ok:true,fb:""},
     {t:"The stem is too short. Stems should give more context",fb:"Concise stems are the rule, not the violation. The problems are the negative, the giveaway, and the crutch option."},
     {t:"It tests recall, and recall questions aren't allowed",fb:"Recall items are allowed: KBAs mix recall with higher-order. The violations here are structural, not cognitive."}]},
   {content:"Q: How often should backups always be verified?<br>A) Never &nbsp;B) Sometimes &nbsp;C) Often &nbsp;D) Always",
    good:false,
    why:"✗ Sent back: \u201Calways\u201D in the stem is an absolute, and the options overlap. \u201Csometimes,\u201D \u201Coften,\u201D and \u201Calways\u201D aren't mutually exclusive, so there's no one best answer.",
    reasons:[
     {t:"An absolute in the stem, and overlapping options with no single best answer",ok:true,fb:""},
     {t:"The options should be in alphabetical order",fb:"Logical ordering matters, but reordering these wouldn't fix them, they overlap. No arrangement produces one best answer."},
     {t:"It needs an image to be engaging",fb:"Engagement isn't the standard, measurement is. The item fails because it can't be answered, not because it's plain."}]},
   {content:"Q: Which port does HTTPS use by default?<br>A) 21 &nbsp;B) 80 &nbsp;C) 443 &nbsp;D) 3389",
    good:true,
    why:"✓ Approved. Yes. It's recall, and that's fine: KBAs mix recall with higher-order items. This one is cleanly built: concise stem, one best answer, parallel real-port distractors in logical order, no giveaways.",
    reasons:[]},
   {content:"Q: As you saw in question 2, scanners are input devices. Which category does a printer belong to, and why is documentation important in IT support?<br>A) Output; because clients require it &nbsp;B) Input; because of compliance &nbsp;C) Output; documentation is optional &nbsp;D) Storage; because of backups",
    good:false,
    why:"✗ Sent back: it leans on another question (\u201Cas you saw in question 2\u201D. Items must never feed each other answers) and it's double-barreled, asking two unrelated things at once, so the options can't be parallel.",
    reasons:[
     {t:"It references another question's content and asks two unrelated things in one item",ok:true,fb:""},
     {t:"Printers are too easy a topic for a KBA",fb:"Difficulty isn't the violation. The structure is: cross-item leakage plus a double-barreled stem."},
     {t:"The options are too long",fb:"Length isn't the issue. The options can't be parallel because the stem asks two different questions."}]}],
  fbGood:"Five verdicts, five correct, every violation named. Your own items get the same review at QA.",
  fbBad:"Queue cleared. Where you missed, re-read the verdict. The skill being built is naming the exact violation rather than sensing that something is off."}},
{id:"sws",title:"Design the workplace around the lessons",crumb:"Unit 2 · Review queue",
 mins:8,
 lead:"Immersive courses run as a simulated workplace: stand-ups, rotating roles, work arriving as tickets, a capstone that’s a handoff. A module can have every lesson and assessment finished and still break the simulation, so each decision is worth checking against the workplace the course is running.",
 coach:"<b>✓ Approve</b> decisions that make the module a believable slice of work; <b>✗ Send back</b> those that break the simulation: naming the thread they cut. The threads are in the hint.",
 hint:"The simulation runs on seven threads: daily stand-ups, rotating team roles, a running job scenario, labs framed as tickets/tasks, workplace-style documentation, reflection, and a capstone presented as a real handoff. Every module decision reinforces a thread or cuts one.",
 demo:{eg:"Design decision: “Lab 2 arrives as a ticket: ‘Client reports intermittent Wi-Fi drops in the east office. Investigate, resolve, and document your fix.’”",steps:[
 "Which thread does this touch? Two: the job scenario (work arrives as a client problem) and the artifact thread (output leaves as documentation).",
 "Voice check: it addresses the learner as the professional inside the scenario, not as ‘a student completing exercise 4.’ The simulation holds.",
 "Verdict: ✓ Approve: the simulation doing its job. Your five: name the thread, check the voice."]},
 html:`<div class="box info"><span class="bh">The lens: does this module hold up the simulation?</span><p class="tight">In an immersive course the class runs like a job: daily stand-ups, rotating roles (scrum lead, note-taker), work arriving as tickets, and a capstone that\u2019s a real handoff. A module can be technically complete: all lessons and assessments present, and still <b>break the fiction</b>: a lesson that ignores the roles, an assessment that isn\u2019t framed as work, a week with no stand-up. As you review, ask of each decision: does this keep the learner <em>in the job</em>, or drop them back into \u201Cschool\u201D?</p></div>
 <p><strong>What the simulation is doing.</strong> Immersive courses run the classroom like a job: daily stand-ups, rotating roles, work arriving as tickets or specs, and a capstone that functions as a handoff. The point is not atmosphere, it is that learners rehearse the conditions of employment, including collaboration, communication, and working from incomplete information. Employers hire for that as much as for the technical skill.</p>
 <div class="diag"><svg viewBox="0 0 720 212" role="img" aria-labelledby="sws-d"><title id="sws-d">The five things a module has to carry for the workplace simulation to hold</title><rect x="12" y="12" width="336" height="50" rx="9" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><circle cx="32" cy="37" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="32" y="41" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">1</text><text x="52" y="33" font-size="11.5" font-weight="700" fill="#1c2b3a">Roles used</text><text x="52" y="49" font-size="10.5" fill="#42566a">Activities require the scrum lead, note-taker, and so on</text><rect x="362" y="12" width="336" height="50" rx="9" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><circle cx="382" cy="37" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="382" y="41" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">2</text><text x="402" y="33" font-size="11.5" font-weight="700" fill="#1c2b3a">Work framed as work</text><text x="402" y="49" font-size="10.5" fill="#42566a">Assessments arrive as tickets or specs</text><rect x="12" y="74" width="336" height="50" rx="9" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><circle cx="32" cy="99" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="32" y="103" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">3</text><text x="52" y="95" font-size="11.5" font-weight="700" fill="#1c2b3a">Cadence held</text><text x="52" y="111" font-size="10.5" fill="#42566a">Stand-ups and retros sit in the lesson days</text><rect x="362" y="74" width="336" height="50" rx="9" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><circle cx="382" cy="99" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="382" y="103" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">4</text><text x="402" y="95" font-size="11.5" font-weight="700" fill="#1c2b3a">Shared artifacts</text><text x="402" y="111" font-size="10.5" fill="#42566a">Docs, commits, handoff notes a team would produce</text><rect x="12" y="136" width="336" height="50" rx="9" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><circle cx="32" cy="161" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="32" y="165" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">5</text><text x="52" y="157" font-size="11.5" font-weight="700" fill="#1c2b3a">Reflection on performance</text><text x="52" y="173" font-size="10.5" fill="#42566a">Not only on content, since the role is being learned</text></svg><div class="dcap">A module can be complete and still break the fiction. These are where it breaks.</div></div>
 <div class="box info"><span class="bh">What each module owes the simulation</span><p class="tight"><b>Roles used, and not only named.</b> If the course assigns a scrum lead and note-taker, the module\u2019s activities have to actually require them.<br><b>Work framed as work.</b> An assessment arrives as a ticket, a request, or a spec rather than \u201cQuiz 3.\u201D Same rigor, different framing.<br><b>The cadence held.</b> Stand-ups and retros are in the lesson days, not assumed to happen somewhere.<br><b>Shared artifacts.</b> Learners produce things a team would produce: documentation, a commit history, a knowledge-base entry, a handoff note.<br><b>Reflection on performance as well as content,</b> since operating in a role is part of what is being learned.</p></div>
 <div class="box rule"><span class="bh">The failure mode</span><p class="tight">A module can be technically complete, with every lesson and assessment present, and still break the simulation: a week with no stand-up, an assessment that drops the job framing, an activity that ignores the roles. The learner falls out of the role and back into \u201Cschool,\u201D and the workplace practice stops accumulating.</p></div>
 <p><strong>The question to hold each decision against:</strong> does this keep the learner in the job, or does it hand them a worksheet? Both can teach the same content. Only one rehearses the work.</p>
 <p class="tight" style="color:var(--muted)">Review the module draft against the simulation. Approve what holds the fiction, and name what breaks it when you send one back.</p>`,
 activity:{type:"review",id:"swsr",points:15,queueTag:"Module draft · WS integration",
  items:[
   {content:"<strong>Daily rhythm:</strong> “Each day opens with a 10-minute stand-up: yesterday, today, blockers: logged in the team channel.”",
    good:true,
    why:"✓ Approved. The cadence thread, made concrete, and it normalizes surfacing blockers early, which is the workplace habit the whole simulation exists to build.",
    reasons:[]},
   {content:"<strong>Lab voice:</strong> instructions address learners as “students completing Exercise 4” and remind them the work “counts toward your grade.”",
    good:false,
    why:"✗ Sent back: breaks the scenario voice. Inside the simulation, work arrives as tickets and tasks addressed to professionals; grading language lives in the syllabus layer, not the workplace layer.",
    reasons:[
     {t:"It breaks the in-simulation voice. Work should arrive as professional tasks, with grading language kept out of the workplace layer",ok:true,fb:""},
     {t:"Exercises shouldn’t be numbered",fb:"Numbering is fine, tickets have numbers too. The register is the problem, not the count."},
     {t:"Grades shouldn’t exist in immersive courses",fb:"Grades absolutely exist. The KBA you reviewed yesterday is one. The flaw is where the grading voice intrudes, not that grading happens."}]},
   {content:"<strong>Roles:</strong> “Team roles rotate weekly; this module’s schedule names who leads stand-up and who owns the documentation log.”",
    good:true,
    why:"✓ Approved. The roles thread with named ownership. Rotation means everyone practices leading and everyone practices documenting.",
    reasons:[]},
   {content:"<strong>Work products:</strong> “Deliverables are submitted privately to the instructor; there is no shared documentation trail.”",
    good:false,
    why:"✗ Sent back: cuts the artifact thread. Workplace output lives where the team can build on it: shared docs, ticket logs, runbooks. Instructor-only submission turns work products back into homework.",
    reasons:[
     {t:"It cuts the shared-documentation thread. Workplace artifacts must be visible to the team that depends on them",ok:true,fb:""},
     {t:"Instructors shouldn’t collect work at all",fb:"Instructors still assess. The flaw is that nothing lives in the shared trail, not that the instructor sees it."},
     {t:"All work must always be public to the whole cohort",fb:"“Always public” overshoots, some assessment stays private. The team-facing artifacts are what belong in the shared trail."}]},
   {content:"<strong>Module finale:</strong> “Capstone: a 20-question quiz covering the module’s concepts.”",
    good:false,
    why:"✗ Sent back: wrong instrument for the thread. The capstone is the simulation’s finale: work presented as a real handoff, evidence of <em>doing</em>. A quiz measures knowing; that’s what the KBA is for.",
    reasons:[
     {t:"The capstone thread is a presented handoff of real work. A quiz measures the wrong thing and belongs to the KBA, not the finale",ok:true,fb:""},
     {t:"Quizzes are never acceptable",fb:"Quizzes are fine, as quizzes. KBA 301 is one. The finale is the one place the simulation must end as work, not as a test."},
     {t:"Capstones should be optional",fb:"The capstone is the simulation’s payoff and a required deliverable in immersive courses. The fix is its format, not its existence."}]}],
  fbGood:"Five for five: you reviewed the module the way the simulation experiences it. Lessons teach skills; the workplace threads turn them into habits.",
  fbBad:"Queue cleared. The test behind every send-back: which thread. Cadence, roles, scenario, artifacts, reflection, handoff. Does the decision reinforce or cut?"}},

{id:"d3i",title:"Unit 3 · Building content",crumb:"Unit 3 · Open",
 mins:6,
 lead:"The design decisions are made. This unit is about producing the materials: writing labs learners can follow, making them accessible, and correcting the AI drafts you use along the way.",
 coach:"Read the objectives and the loop diagram, then answer the warm-up and Save to begin.",
 html:`<p><strong>By the end of Unit 3 you'll be able to:</strong></p>
 <ul class="obj"><li>Review a guided-lab draft against the GLAB skeleton, section by section</li><li>Audit module elements against the accessibility launch prerequisite</li><li>Take an AI draft from fluent-but-wrong to shippable, and own every line</li></ul><div class="diag"><svg viewBox="0 0 720 96" role="img" aria-labelledby="da-t"><title id="da-t">The AI workflow loop: select each stage</title><g class="fdu hot" tabindex="0" role="button" style="animation-delay:0.0s" aria-label="AI drafts" data-name="AI drafts" data-info="Seconds, 70% of the way there. Prompt from the Handbook library, filled from the approved objective, never a blank page."><rect x="24" y="30" width="150" height="48" rx="10" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="99" y="58" text-anchor="middle" font-size="12.5" fill="#164a85" font-weight="600">AI drafts</text></g><g class="fdu hot" tabindex="0" role="button" style="animation-delay:0.22s" aria-label="You verify" data-name="You verify" data-info="Every statistic, path, version, and claim. [VERIFY] tags resolved or cut. Fluent is not the same as accurate."><rect x="210" y="30" width="150" height="48" rx="10" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><text x="285" y="58" text-anchor="middle" font-size="12.5" fill="#1c2b3a" font-weight="600">You verify</text></g><g class="fdu hot" tabindex="0" role="button" style="animation-delay:0.44s" aria-label="You correct" data-name="You correct" data-info="House voice restored, scope trimmed to the objective, structure fixed."><rect x="396" y="30" width="150" height="48" rx="10" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><text x="471" y="58" text-anchor="middle" font-size="12.5" fill="#1c2b3a" font-weight="600">You correct</text></g><g class="fdu hot" tabindex="0" role="button" style="animation-delay:0.66s" aria-label="You own it" data-name="You own it" data-info="Your name goes on it at QA. “The AI wrote it” is never a defense: the reviewer checks the material, not the prompt."><rect x="582" y="30" width="122" height="48" rx="10" fill="#e7f4ee" stroke="#1f9d76" stroke-width="1.5"/><text x="643" y="58" text-anchor="middle" font-size="12.5" fill="#186b52" font-weight="600">You own it</text></g><path class="fdu" style="animation-delay:0.12s" d="M 178 54 L 202 54" stroke="#1d5fa8" stroke-width="2.5" marker-end="url(#arrA)"/><path class="fdu" style="animation-delay:0.34s" d="M 364 54 L 388 54" stroke="#1d5fa8" stroke-width="2.5" marker-end="url(#arrA)"/><path class="fdu" style="animation-delay:0.56s" d="M 550 54 L 574 54" stroke="#1d5fa8" stroke-width="2.5" marker-end="url(#arrA)"/><defs><marker id="arrA" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1d5fa8"/></marker></defs></svg><div class="dcap">👆 <b>Select each stage.</b> The first is the machine’s; the other three are permanently yours.</div></div><div class="pullquote"><div class="pq">“Learners do better when extraneous material is cut, even when it’s interesting.”</div><div class="pa">Richard Mayer’s coherence principle, <em>Multimedia Learning</em>, the research behind deleting the fun-fact from an AI draft.</div></div><div class="video"><iframe src="https://www.youtube.com/embed/IlU-zDU6aQ0" title="Marty Lobdell: Study Less, Study Smart (Pierce College)" loading="lazy" allowfullscreen></iframe></div><div class="vidcap">🎯 <b>Watch task (or save for the evening):</b> catch his case for why re-reading fails: then connect it to why our labs out-teach our lectures. (<a href="https://www.youtube.com/watch?v=IlU-zDU6aQ0" target="_blank" rel="noopener">Open on YouTube</a>)</div>`,

{id:"slb",title:"Build the lab steps",crumb:"Unit 3 \u00b7 Build",mins:10,
 lead:"A guided lab draft came back from a developer who wrote it fast. The bones are right and the steps are not usable yet. Your job is to repair them, because a lab is the biggest block of class time we control and a vague step burns it.",
 brief:{from:"Product Developer \u00b7 IT domain",re:"GLAB 301.2.1, draft steps need work",text:"I got the structure down but the steps need another pass. Fix the ones that would not survive a room of learners working alone."},
 html:`
 <p><strong>What a lab step has to do.</strong> A learner working alone reads one step at a time and acts on it. If a step leaves them deciding what you meant, they stop and wait for the instructor, and the whole room slows to the speed of one conversation. So a step is finished when someone who has never seen the software could carry it out and know whether it worked.</p>
 <div class="diag"><svg viewBox="0 0 720 242" role="img" aria-labelledby="slb-d"><title id="slb-d">The parts of a usable lab step</title><rect x="12" y="12" width="696" height="44" rx="9" fill="#f3f0ea" stroke="#e8e1d6" stroke-width="1.5"/><text x="360" y="40" text-anchor="middle" font-size="13" font-family="IBM Plex Mono, monospace" fill="#1c2b3a">Open Windows Security, then Firewall, and confirm it shows On</text><circle cx="30" cy="88" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="30" y="92" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">1</text><text x="50" y="85" font-size="11.5" font-weight="700" fill="#1c2b3a">One action</text><text x="50" y="101" font-size="10.5" fill="#42566a">Two verbs means two steps, and a hidden place to get stuck.</text><circle cx="30" cy="128" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="30" y="132" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">2</text><text x="50" y="125" font-size="11.5" font-weight="700" fill="#1c2b3a">Named specifics</text><text x="50" y="141" font-size="10.5" fill="#42566a">The exact menu, field, value, or file. Never "as needed".</text><circle cx="30" cy="168" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="30" y="172" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">3</text><text x="50" y="165" font-size="11.5" font-weight="700" fill="#1c2b3a">A visible result</text><text x="50" y="181" font-size="10.5" fill="#42566a">What the learner should see, so they can tell success from silent failure.</text><circle cx="30" cy="208" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="30" y="212" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">4</text><text x="50" y="205" font-size="11.5" font-weight="700" fill="#1c2b3a">The reason, if unclear</text><text x="50" y="221" font-size="10.5" fill="#42566a">One clause, so they can recover when their screen differs.</text></svg><div class="dcap">Read it as someone with no context. One thing to do, no guessing, and a way to know it worked.</div></div>
 <div class="box info"><span class="bh">The four things every step needs</span><p class="tight"><b>One action.</b> A step that contains two verbs is two steps. \u201CInstall the client and configure the connection\u201D hides a place to get stuck.<br><b>Named specifics.</b> The exact menu, field, value, or file. \u201COpen settings and adjust as needed\u201D is a decision handed to someone who does not have the information to make it.<br><b>A visible result.</b> What the learner should see when the step worked. Without it they cannot tell success from silent failure, and they carry the failure into the next step.<br><b>The reason, where it is not obvious.</b> One clause. Learners who know why a step exists can recover when their screen does not match yours.</p></div>
 <div class="box rule"><span class="bh">The test before you ship a step</span><p class="tight">Read it as someone with no context: is there exactly one thing to do, do I know precisely where and what to type, and will I know whether it worked? If any answer is no, the step is not finished. Guided means the path is laid out, not that the learner guesses less.</p></div>
 <p><strong>What this looks like in our courses.</strong> For IT Support, \u201CConfigure the firewall appropriately\u201D leaves a learner staring at a settings panel; \u201CIn Windows Defender Firewall, open Advanced Settings, create an inbound rule blocking TCP port 23, and confirm it appears in the rule list\u201D does not. For MERN, \u201CSet up your environment\u201D versus \u201CRun npm install, then confirm the server starts on port 3000 and returns 200 at /health.\u201D</p>
 `,
 coach:"Select a step that would not survive a learner working alone, then choose the repair. Four steps need work.",
 hint:"Look for two verbs in one step, a value you cannot see (appropriately, as needed, properly), a step with no visible result, and an instruction that assumes the learner already knows where something lives.",
 demo:{eg:"Worked example \u2014 the draft step: \u201CStep 2: Install VirtualBox and set up a VM with reasonable specs.\u201D",steps:[
  "Step 1 \u2014 Count the actions. Install, and set up a VM. That is two things, so it is two steps, and the learner can stall on either without you knowing which.",
  "Step 2 \u2014 Find the invisible value. \u201CReasonable specs\u201D means nothing to someone who has not built a VM before. Reasonable to whom, and measured how?",
  "Step 3 \u2014 Check for a result. Nothing here tells the learner what a working VM looks like, so they cannot tell whether to continue.",
  "Step 4 \u2014 Rewrite it. \u201CInstall VirtualBox 7.0 and confirm it opens\u201D, then \u201CCreate a VM with 4 GB RAM and a 40 GB disk, and confirm it appears in the VirtualBox list.\u201D Two steps, named values, visible results.",
  "Now repair the four below the same way."]},
 activity:{type:"fix",id:"slbf",points:15,
  intro:"Lab objective: \u201CGiven a workstation and a provided checklist, configure a secure baseline and verify it.\u201D The draft steps:",
  sents:[
   {t:"Step 1: Log in to the lab workstation using the credentials in the course shell.",bad:false},
   {t:" Step 2: Open the security settings and configure them appropriately for a work environment.",bad:true,
    fixes:[
     {t:"Add \u201Cif you are unsure, ask your instructor.\u201D",fb:"That moves the problem into the room instead of fixing it. Thirty learners asking the same question is the cost of the vague step, not a solution to it."},
     {t:"Replace with: \u201COpen Windows Security, then Firewall & network protection, and confirm the firewall is On for Domain, Private, and Public.\u201D",ok:true,fb:"Named location, named setting, and a result the learner can see. One action, and they know whether it worked."},
     {t:"Change \u201Cappropriately\u201D to \u201Ccorrectly.\u201D",fb:"Both words hide the same missing information. The learner still does not know which settings or what value."}],
    fixed:" Step 2: Open Windows Security, then Firewall & network protection, and confirm the firewall is On for Domain, Private, and Public."},
   {t:" Step 3: Install the endpoint agent and register the device with the management console.",bad:true,
    fixes:[
     {t:"Split it: \u201CInstall the endpoint agent from the provided installer, and confirm the tray icon shows Connected.\u201D Then a separate step for registering.",ok:true,fb:"Two actions became two steps, each with a visible result. A learner who stalls now stalls somewhere you can identify."},
     {t:"Leave it, since both actions are part of the same task.",fb:"They are related but not simultaneous, and either can fail on its own. A learner stuck between them cannot tell you where they are."},
     {t:"Add a screenshot of the finished state.",fb:"A screenshot helps, but it does not fix a step that asks for two things at once. Split first, then illustrate."}],
    fixed:" Step 3: Install the endpoint agent from the provided installer, and confirm the tray icon shows Connected."},
   {t:" Step 4: Run the baseline verification script.",bad:true,
    fixes:[
     {t:"Add where the script lives and what a pass looks like: \u201CFrom the lab folder, run verify-baseline.ps1. A pass prints OK for all six checks.\u201D",ok:true,fb:"The learner now knows where the script is and how to read the output. Without the expected result they cannot tell a pass from a partial run."},
     {t:"Add \u201Cthe script is in the usual place.\u201D",fb:"Usual to whom? A learner on day one has no usual place. Name the path."},
     {t:"Leave it, since the script name is enough.",fb:"The name tells them what to run but not where it is or what success looks like, which are the two things that stop people."}],
    fixed:" Step 4: From the lab folder, run verify-baseline.ps1. A pass prints OK for all six checks."},
   {t:" Step 5: Take a screenshot of the passing output and attach it to your submission.",bad:false},
   {t:" Step 6: If any check fails, review the checklist and try again, then note which check failed and what you changed.",bad:false}],
  fbGood:"Every step now has one action, a named value, and a result the learner can see. That is the difference between a lab a room can work through and a lab that turns into a queue at the instructor\u2019s desk.",
  fbBad:"Read the repairs on the ones you changed. The pattern is the same each time: one action per step, name the thing you are referring to, and say what the learner should see when it worked."},

{id:"sax",title:"Run the accessibility audit",crumb:"Unit 3 · Simulation",
 mins:8,
 lead:"Module 301 is nearly built. Before it can move, every element has to pass accessibility, which is a condition of release rather than a later improvement. Work through the queue.",
 brief:{from:"Product Quality & Experience (QA)",re:"Module 301 — accessibility audit before Delivery Check",text:"Six elements are queued for the accessibility gate. Nothing in this module releases until they pass. The test is the same each time: same information, equivalent ease of access."},
 demo:{eg:"Element: recorded lecture narration over slides. No captions, no transcript.",steps:["One test, always: does a learner with a disability get the <em>same information</em> with <em>equivalent ease</em>? This information exists only as audio.","A deaf or hard-of-hearing learner gets nothing, and so does anyone in a loud room. Captions plus a transcript are required for media, not optional polish.","Verdict: ✗ Send back, missing captions/transcript. Run your six elements through the same single test."]},
 coach:`<b>\u2713 Approve</b> elements that meet the accessibility standard, <b>\u2717 Send back</b> what doesn't, naming the exact failure. The checklist: ${gl('access','accessibility essentials')}.`,
 hint:"The test from the standard: can a learner with a disability get the same information and interactions with substantially equivalent ease? Check: alt text that describes, descriptive links, contrast, keyboard paths, captions, selectable text.",
 html:`<p><strong>The concept:</strong> \u201Caccessible\u201D has a legal definition: the same information and interactions, with substantially equivalent ease of use. It's verified, never assumed, and it's a launch prerequisite.</p><div class="diag" role="group" aria-label="Contrast examples: select a pair for its ratio verdict"><div style="display:flex;flex-wrap:wrap;justify-content:center"><span class="swatch hot" tabindex="0" role="button" data-name="White on navy" data-info="15.6:1, far above the bar. Safe for body text at any size." style="background:#12283f;color:#ffffff">White on navy</span><span class="swatch hot" tabindex="0" role="button" data-name="Ink on white" data-info="14.9:1: the default for a reason." style="background:#ffffff;color:#1c2b3a;border:1.5px solid #e8e1d6">Ink on white</span><span class="swatch hot" tabindex="0" role="button" data-name="Gray on gray" data-info="1.9:1, FAILS. Low-vision learners lose this content entirely; so does anyone in sunlight." style="background:#d4d4d4;color:#8a8a8a">Gray on gray</span><span class="swatch hot" tabindex="0" role="button" data-name="Cream on cream" data-info="1.3:1, FAILS. Decorative at best; never for text." style="background:#f7efdc;color:#e6d9b8">Cream on cream</span></div><div class="dcap">👆 <b>Select a pair</b> to see its contrast ratio and verdict. If you have to squint, someone else is locked out.</div></div><div class="meta"><span class="mi">🔍</span><div><b>Design note:</b> this course meets the standard it asks you to enforce. Diagrams carry text titles for screen readers, every interaction works by keyboard, contrast passes, and animations respect reduced-motion settings.</div></div>
 <p><strong>Why accessibility is a launch gate here.</strong> Per Scholas learners include people using screen readers, keyboard-only navigation, screen magnification, and captions. An inaccessible lab is not a lower-quality lab, it is a lab some learners cannot complete at all. That is why this is checked before release rather than after: a fix costs minutes during development and days after launch, and a learner who hit the barrier has already lost the lesson.</p>
 <div class="diag"><svg viewBox="0 0 720 212" role="img" aria-labelledby="sax-d"><title id="sax-d">The five accessibility checks that catch most defects</title><rect x="12" y="12" width="336" height="50" rx="9" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><circle cx="32" cy="37" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="32" y="41" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">1</text><text x="52" y="33" font-size="11.5" font-weight="700" fill="#1c2b3a">Text alternatives</text><text x="52" y="49" font-size="10.5" fill="#42566a">Alt text describes the information, not the picture</text><rect x="362" y="12" width="336" height="50" rx="9" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><circle cx="382" cy="37" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="382" y="41" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">2</text><text x="402" y="33" font-size="11.5" font-weight="700" fill="#1c2b3a">Real text, not images</text><text x="402" y="49" font-size="10.5" fill="#42566a">Code must be selectable, zoomable, readable aloud</text><rect x="12" y="74" width="336" height="50" rx="9" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><circle cx="32" cy="99" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="32" y="103" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">3</text><text x="52" y="95" font-size="11.5" font-weight="700" fill="#1c2b3a">Contrast</text><text x="52" y="111" font-size="10.5" fill="#42566a">4.5:1 for body text, 3:1 for large text</text><rect x="362" y="74" width="336" height="50" rx="9" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><circle cx="382" cy="99" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="382" y="103" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">4</text><text x="402" y="95" font-size="11.5" font-weight="700" fill="#1c2b3a">Never colour alone</text><text x="402" y="111" font-size="10.5" fill="#42566a">Pair colour with a label, icon, or text</text><rect x="12" y="136" width="336" height="50" rx="9" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><circle cx="32" cy="161" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="32" y="165" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">5</text><text x="52" y="157" font-size="11.5" font-weight="700" fill="#1c2b3a">Keyboard reachable</text><text x="52" y="173" font-size="10.5" fill="#42566a">Every control operable, with a visible focus ring</text><rect x="362" y="136" width="336" height="50" rx="9" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><circle cx="382" cy="161" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="382" y="165" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">6</text><text x="402" y="157" font-size="11.5" font-weight="700" fill="#1c2b3a">Captions and headings</text><text x="402" y="173" font-size="10.5" fill="#42566a">Spoken instruction captioned; real headings in order</text></svg><div class="dcap">Held to WCAG 2.1 AA, and checked while you build rather than at the end.</div></div>
 <div class="box info"><span class="bh">The five checks that catch most defects</span><p class="tight"><b>1. Text alternatives.</b> Every image that carries meaning needs alt text describing the information, not the picture. A network diagram\u2019s alt text says what the topology is, not \u201Cdiagram.\u201D Decorative images get empty alt so screen readers skip them.<br><b>2. Real text, never text-in-an-image.</b> Code as a screenshot cannot be read aloud, zoomed cleanly, or copied. Code must be selectable text.<br><b>3. Contrast.</b> Body text needs 4.5:1 against its background, large text 3:1. Grey-on-grey and colored text on colored fills are the usual failures.<br><b>4. Color is never the only signal.</b> \u201CThe red rows are wrong\u201D fails for colorblind learners. Pair color with a label, icon, or text.<br><b>5. Keyboard reachable.</b> Every control a learner must use has to be reachable and operable by keyboard, with a visible focus indicator.</p></div>
 <p><strong>Two more that get missed in technical content.</strong> Media needs <b>captions</b> for anything spoken that carries instruction, and a transcript where the audio is the primary source. And <b>headings must be real headings</b> in order, because screen-reader users navigate by heading structure. Bold text sized up looks like a heading but is invisible to that navigation.</p>
 <div class="box rule"><span class="bh">The standard we hold</span><p class="tight">WCAG 2.1 Level AA. In practice that means the checks above, applied while you build rather than at the end. If an element cannot meet the standard, the fix is an accessible equivalent that teaches the same thing, not a note apologizing for it.</p></div>
 <p><strong>What this looks like in our courses.</strong> An IT Support lab that says \u201Cclick the red X in the corner\u201D fails on color-only signaling and on an unlabeled control. A MERN lab pasting a terminal session as a PNG fails text alternatives and zoom. Both are quick fixes during the build and both block a learner if they ship.</p>
 <p class="tight" style="color:var(--muted)">Run each queued element against the five checks. Approve what passes, and when you send one back, name the check it failed.</p>`,
 activity:{type:"review",id:"saxr",points:15,queueTag:"Module 301 · accessibility audit",
  items:[
   {content:"A 12-minute chaptered demo video with closed captions and a downloadable transcript.",
    good:true,
    why:"\u2713 Approved. Captions plus a transcript: both required for media, and chaptering helps everyone navigate.",
    reasons:[]},
   {content:"Network architecture diagram. Alt text: <span class=\"mono\">\u201Cimage.png\u201D</span>",
    good:false,
    why:"\u2717 Sent back: alt text must concisely describe what the image shows (\u201CRouter connecting three VLANs to the internet through a firewall\u201D), not restate the filename. A screen-reader user currently gets nothing.",
    reasons:[
     {t:"The alt text doesn't describe the image's content. A filename conveys nothing",ok:true,fb:""},
     {t:"Diagrams aren't allowed in modules",fb:"Diagrams are great. They just need descriptive alt text so the information isn't visual-only."},
     {t:"The alt text is too short",fb:"Short is fine if it describes. \u2018image.png\u2019 fails because it describes nothing, not because of length."}]},
   {content:"In the lesson text: \u201CFor the template, <u>select here</u>.\u201D",
    good:false,
    why:"\u2717 Sent back: links need descriptive text. \u201Cdownload the Lab Template\u201D, because screen readers often navigate by a list of links, and a page of \u201Cclick here\u201D is unusable.",
    reasons:[
     {t:"The link text describes nothing. Out of context, \u201Cclick here\u201D is meaningless to a screen-reader user",ok:true,fb:""},
     {t:"Links must always be buttons instead",fb:"Links are fine. The requirement is descriptive text, not a different control."},
     {t:"The sentence is too casual in tone",fb:"Tone is a style-guide question. The accessibility failure is the undescriptive link text."}]},
   {content:"Slide 6: body text in medium gray <span class=\"mono\">#8a8a8a</span> on a light gray <span class=\"mono\">#d4d4d4</span> background.",
    good:false,
    why:"\u2717 Sent back: that combination fails contrast: low-vision and colorblind learners lose the content. Use high-contrast pairings (and colorblind-safe palettes like blue/orange for meaning-carrying color).",
    reasons:[
     {t:"Insufficient color contrast between text and background",ok:true,fb:""},
     {t:"Gray is a banned color",fb:"No color is banned, contrast is the standard. Dark gray on white passes easily."},
     {t:"Slide 6 has too much text",fb:"Density is a design note. The accessibility failure is that the text is hard to physically see."}]},
   {content:"An interactive matching activity that can only be completed by dragging tiles with the mouse.",
    good:false,
    why:"\u2717 Sent back: all content and interactions must be operable by keyboard alone. Drag-only interactions lock out learners who can't use a mouse. Add keyboard controls or an equivalent alternative.",
    reasons:[
     {t:"The interaction has no keyboard path. Mouse-only operation excludes learners",ok:true,fb:""},
     {t:"Matching activities are too easy for this module",fb:"Difficulty isn't the audit's concern. Operability is: no keyboard path, no pass."},
     {t:"Interactive content requires instructor approval",fb:"No such rule. The failure is the missing keyboard access."}]},
   {content:"A code sample presented as a selectable, syntax-highlighted text block with a copy button.",
    good:true,
    why:"\u2713 Approved. Selectable text (never a screenshot of code), so it works with screen readers, zoom, and copy-paste: exactly the standard.",
    reasons:[]}],
  fbGood:"Clean audit, six calls, six right. Accessibility verified at build time costs minutes; discovered at Delivery Check, it holds a launch.",
  fbBad:"Audit complete, study the misses. Every one of these failures is cheap now and expensive later; that's why it's a launch prerequisite."}},
{id:"aico",title:"Work with AI, do not hand it the work",crumb:"Unit 3 \u00b7 Practice",mins:10,
 lead:"The most common mistake we see is a developer opening a blank prompt, asking for a lesson, and editing whatever comes back. That is not using a tool, it is subcontracting the thinking. This lesson is about the difference, because the work you do before you prompt determines whether anything usable comes out.",
 html:`
 <p><strong>Why the blank prompt fails.</strong> A tool asked to write a lesson with no context will produce a lesson for nobody in particular. It will be fluent, plausibly structured, pitched at an average learner who does not exist, and aimed at an objective it invented. You then spend longer repairing it than you would have spent writing from your own outline, and the repairs are the hard part, because you are arguing with something that sounds confident.</p>
 <div class="diag"><svg viewBox="0 0 720 173" role="img" aria-labelledby="aic-l"><title id="aic-l">What each side brings to a draft</title><rect x="12" y="12" width="343" height="147" rx="12" fill="#e3edf8" stroke="#1d5fa8" stroke-width="2"/><text x="183" y="36" text-anchor="middle" font-size="12" font-weight="700" fill="#164a85">WHAT YOU BRING</text><text x="183" y="60" text-anchor="middle" font-size="11" fill="#1c2b3a">The objective and why it exists</text><text x="183" y="79" text-anchor="middle" font-size="11" fill="#1c2b3a">Who these learners are</text><text x="183" y="98" text-anchor="middle" font-size="11" fill="#1c2b3a">What broke last cohort</text><text x="183" y="117" text-anchor="middle" font-size="11" fill="#1c2b3a">Time and equipment limits</text><text x="183" y="136" text-anchor="middle" font-size="11" fill="#1c2b3a">What good enough means here</text><rect x="369" y="12" width="343" height="147" rx="12" fill="#f3f0ea" stroke="#e8e1d6" stroke-width="1.5"/><text x="540" y="36" text-anchor="middle" font-size="12" font-weight="700" fill="#7a8a99">WHAT IT BRINGS</text><text x="540" y="60" text-anchor="middle" font-size="11" fill="#42566a">Speed to a first pass</text><text x="540" y="79" text-anchor="middle" font-size="11" fill="#42566a">Phrasings you did not consider</text><text x="540" y="98" text-anchor="middle" font-size="11" fill="#42566a">Patience for revision</text><text x="540" y="117" text-anchor="middle" font-size="11" fill="#42566a">No stake in the outcome</text><text x="540" y="136" text-anchor="middle" font-size="11" fill="#42566a">No knowledge of your room</text></svg><div class="dcap">The left column is the course. The right column is a faster typewriter.</div></div>
 <p><strong>What changes when you direct instead of ask.</strong> The same tool, given the objective, the learners, the time available, and what went wrong last cohort, produces something you can actually react to. The difference is not the tool. It is that you did the deciding first and used the draft as material rather than as an answer.</p>
 <div class="diag"><svg viewBox="0 0 720 112" role="img" aria-labelledby="aic-d"><title id="aic-d">Where your judgement enters when drafting with AI</title><rect x="12" y="26" width="119" height="60" rx="10" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="71" y="50" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1c2b3a">You decide</text><text x="71" y="68" text-anchor="middle" font-size="10" fill="#42566a">Objective, learners, constraints</text><line x1="135" y1="56" x2="151" y2="56" stroke="#7a8a99" stroke-width="1.6"/><polygon points="153,56 147,52 147,60" fill="#7a8a99"/><rect x="157" y="26" width="119" height="60" rx="10" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><text x="216" y="50" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1c2b3a">You direct</text><text x="216" y="68" text-anchor="middle" font-size="10" fill="#42566a">A brief, not a blank prompt</text><line x1="280" y1="56" x2="296" y2="56" stroke="#7a8a99" stroke-width="1.6"/><polygon points="298,56 292,52 292,60" fill="#7a8a99"/><rect x="302" y="26" width="119" height="60" rx="10" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><text x="361" y="50" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1c2b3a">It drafts</text><text x="361" y="68" text-anchor="middle" font-size="10" fill="#42566a">A first pass to react to</text><line x1="425" y1="56" x2="441" y2="56" stroke="#7a8a99" stroke-width="1.6"/><polygon points="443,56 437,52 437,60" fill="#7a8a99"/><rect x="447" y="26" width="119" height="60" rx="10" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><text x="506" y="50" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1c2b3a">You judge</text><text x="506" y="68" text-anchor="middle" font-size="10" fill="#42566a">Keep, cut, redirect</text><line x1="570" y1="56" x2="586" y2="56" stroke="#7a8a99" stroke-width="1.6"/><polygon points="588,56 582,52 582,60" fill="#7a8a99"/><rect x="592" y="26" width="119" height="60" rx="10" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><text x="651" y="50" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1c2b3a">You own it</text><text x="651" y="68" text-anchor="middle" font-size="10" fill="#42566a">Your name at QA</text></svg><div class="dcap">Four of the five steps are yours. Hand step one to the tool and the rest cannot be done properly.</div></div>
 <div class="box rule"><span class="bh">What directing looks like in practice</span><p class="tight"><b>Bring the objective, do not ask for one.</b> The objective comes from Design or from your own lesson breakdown. A tool inventing one is inventing the point of the lesson.<br><b>Say who the learners are.</b> Week three of an IT Support cohort with no prior networking is a different brief from week nine of MERN. Without it you get an average that fits neither.<br><b>Name the constraints.</b> Ninety minutes, no admin rights on the lab machines, one shared server. Constraints are most of what makes a lesson buildable and a tool cannot guess them.<br><b>Ask for a draft, not a deliverable.</b> Expecting to rewrite half of it changes how you read it. Expecting to ship it changes what you accept.<br><b>Reject and redirect rather than patch.</b> If the shape is wrong, say what is wrong and ask again. Editing a badly shaped draft sentence by sentence keeps the bad shape.</p></div>
 <div class="box info"><span class="bh">The tell that someone outsourced instead of collaborated</span><p class="tight">You can usually see it in the finished material. The examples are generic where they should be domain-specific. The lesson covers a topic evenly instead of weighting what learners actually struggle with. The tone shifts between sections. Nobody can say why a particular activity is there. Every one of those is a decision the developer skipped, and no amount of proofreading puts them back.</p></div>
 <p><strong>Where this leaves you.</strong> Using AI heavily is fine. Handing over the judgement is not, and the two look similar from the outside, which is why we care about how you work rather than whether you used a tool. The next two lessons cover checking what comes back and the rules about what you may put in. This one is about the part that comes first.</p>
 `,
 coach:"Walk one drafting task from start to finish. At each point, pick what you would actually do.",
 activity:{type:"story",id:"aicos",points:12,
  steps:[
   {tag:"Step 1 of 5 \u00b7 The task",
    text:"You need a lesson for week three of the IT Support course, covering basic network troubleshooting. You have the module objective from Design and forty minutes before your next meeting. Where do you start?",
    opts:[
     {t:"Ask the tool to write a lesson on network troubleshooting for a beginner IT course.",fb:"This is the blank prompt. You will get something generic aimed at an invented objective, and you will spend your forty minutes arguing with it. Nothing about your cohort or your constraints reached the tool."},
     {t:"Write down the objective, who the learners are at week three, and what equipment the lab has. Then prompt.",ok:true,fb:"Right. Five minutes of your own decisions makes the draft usable instead of generic. You are giving it a brief rather than a topic."},
     {t:"Write the lesson yourself, since the tool will not know your cohort.",fb:"Defensible, but it gives up real speed. The tool cannot know your cohort, which is why you tell it. Refusing to use it is not the same as using it well."}]},
   {tag:"Step 2 of 5 \u00b7 The draft comes back",
    text:"The draft has a clear structure, a decent explanation of the OSI model, and a lab where learners run ping and tracert and write down what they see. Your cohort has no prior networking and the lab machines have no admin rights.",
    opts:[
     {t:"Accept the structure and fix the wording as you go.",fb:"The wording is not the problem. A lab that needs admin rights cannot run on your machines, and that is a shape problem. Patching sentences leaves the broken lab in place."},
     {t:"Tell it the constraint it did not have, and ask for a lab that works without admin rights.",ok:true,fb:"Right. You found a shape problem and redirected instead of patching. This is the iteration the tool is actually good for."},
     {t:"Keep the lab and add a note asking the instructor to sort out permissions.",fb:"That moves your problem into the classroom. Delivery inherits a lab that does not run, and finds out on the day."}]},
   {tag:"Step 3 of 5 \u00b7 It adds something you did not ask for",
    text:"The second draft includes a paragraph claiming most network faults occur at layer 1, with a specific percentage.",
    opts:[
     {t:"Keep it, since it sounds right and gives learners a useful rule of thumb.",fb:"Sounding right is the problem. That figure has no source, and a learner repeating it in an interview is repeating something we invented."},
     {t:"Cut it, or replace it with something you can stand behind.",ok:true,fb:"Right. Physical-layer faults being common is defensible. A precise percentage with no source is not, and you own every line that ships."},
     {t:"Soften it to \u201Cresearch suggests\u201D and move on.",fb:"That launders the invention rather than removing it. A vague attribution on a made-up number is worse than the number alone."}]},
   {tag:"Step 4 of 5 \u00b7 The part it cannot help with",
    text:"You have a usable draft with fifteen minutes left. What do you spend them on?",
    opts:[
     {t:"Ask the tool to double the practice activities so learners have more to do.",fb:"More volume is not better practice. Whether the practice is right depends on what your learners struggle with, which is a judgement the tool cannot make."},
     {t:"Decide where last cohort got stuck and weight the practice toward that.",ok:true,fb:"Right. This is the decision only you can make, because it comes from having watched a room. It is also what turns a generic lesson into one that fits your cohort."},
     {t:"Proofread the whole thing for typos.",fb:"Worth doing eventually, but not the best use of your last fifteen minutes. A typo costs a learner a second; misplaced practice costs them the lesson."}]},
   {tag:"Step 5 of 5 \u00b7 Handing it over",
    text:"The lesson goes into the repo for QA. What do you record about how it was made?",
    opts:[
     {t:"Nothing. The material stands on its own.",fb:"QA reviews claims, and knowing which parts came from a draft tells a reviewer where to look hardest. Silence also makes it impossible to improve how the team uses these tools."},
     {t:"Note that you drafted with AI, what you verified, and what you rewrote.",ok:true,fb:"Right. It is honest, it directs QA to the right places, and it keeps ownership visible. Using the tool is not the thing to hide; unexamined use is."},
     {t:"Note that AI wrote it, so QA knows to check everything.",fb:"That hands your responsibility to QA. You are the one who verified it, and the record should say what you checked rather than asking someone else to start over."}]}],
  fbGood:"You brought the decisions, gave the tool a brief, redirected when the shape was wrong, cut what could not be defended, and spent your last minutes on the judgement only you could make. That is co-authorship.",
  fbBad:"Look again at the ones you changed. The pattern in each: the tool cannot know your objective, your learners, your equipment, or where last cohort struggled. Everything it does well depends on you supplying those first."},
 transition:"You have worked the partnership from both ends. Next, the four patterns to look for in whatever comes back."},
{id:"s6",title:"Red-pen the AI draft",crumb:"Unit 2 · Simulation",
 mins:10,
 lead:"You used the house prompt to draft Lesson 301.2 narration. Here's what came back. Fix it the same way. Select the problem, choose the repair.",
 
 brief:{from:"Product Developer · IT domain",re:"Lesson 301.2 narration. AI draft attached",text:"The house prompt produced this draft in seconds. It reads well, which is the reason it still needs checking: fluent is not the same as accurate."},
 demo:{eg:"Worked example. Draft sentence: “Studies confirm 73.6% of help-desk tickets are printer-related.”",steps:["Step 1: Spot the problem. A suspiciously precise statistic with no source is the classic AI tell: fluent, confident, and unverifiable. Flag it.","Step 2: Choose the right repair. The fix is not to round the number or add ‘(source: research)’. Either replace it with a claim that stands on its own. ‘printer issues are a common ticket category’, or tag it [VERIFY] and find real data before it ships.","Step 3: Repeat for every problem. That was one of four patterns. Now find all four in the draft below: select the sentence, then choose the repair."]},
 coach:`Same mechanic as the KBA repair: <b>select a sentence that shouldn't ship</b>, then pick the correct fix. Four problems: a fabricated statistic, an invented path, off-objective filler, and marketing voice. The prompt library is in the Guide: ${gl('prompts','prompts')}.`,
 hint:"Fluent \u2260 accurate. Precise-looking numbers, confident file paths, fun facts, and \u201Crockstar\u201D energy are AI's four favorite gifts. Return all four.",
 html:`<p>Fluent prose hides its errors well, that\u2019s the danger. When you review an AI draft, you\u2019re hunting for four things specifically:</p>
 <div class="box info"><span class="bh">What to red-pen</span><p class="tight"><b>Factual drift</b>: confident claims, version numbers, or commands that are subtly wrong. <b>Invented specifics</b>: details it made up to sound complete. <b>Filler</b>: words that read smoothly but teach nothing. <b>Voice mismatch</b>: generic tone where the course has a specific one. You own every line that ships, so \u201Cthe AI wrote it\u201D is never the reason it\u2019s wrong.</p></div><div class="meta"><span class="mi">🔍</span><div><b>Design note:</b> the coach bar and hint button are moment-of-need support, placed where the work happens rather than in a separate help section. Build the same into your own labs.</div></div>
 <p><strong>Why fluent drafts are the dangerous ones.</strong> AI writes confident, well-formed prose whether or not the content is correct. There is no signal in the writing that tells you where it invented something, so \u201Cit reads well\u201D is not evidence it is right. Reviewing an AI draft is a different task from editing a human draft: with a human you are usually improving expression, with AI you are verifying claims.</p>
 <div class="diag"><svg viewBox="0 0 720 150" role="img" aria-labelledby="s6-d"><title id="s6-d">The four patterns to look for in an AI draft</title><rect x="12" y="12" width="336" height="50" rx="9" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><circle cx="32" cy="37" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="32" y="41" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">1</text><text x="52" y="33" font-size="11.5" font-weight="700" fill="#1c2b3a">Factual drift</text><text x="52" y="49" font-size="10.5" fill="#42566a">Versions, flags, paths that are plausible and wrong</text><rect x="362" y="12" width="336" height="50" rx="9" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><circle cx="382" cy="37" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="382" y="41" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">2</text><text x="402" y="33" font-size="11.5" font-weight="700" fill="#1c2b3a">Invented specifics</text><text x="402" y="49" font-size="10.5" fill="#42566a">Statistics and citations added to sound authoritative</text><rect x="12" y="74" width="336" height="50" rx="9" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><circle cx="32" cy="99" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="32" y="103" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">3</text><text x="52" y="95" font-size="11.5" font-weight="700" fill="#1c2b3a">Filler</text><text x="52" y="111" font-size="10.5" fill="#42566a">Sentences that restate or announce, teaching nothing</text><rect x="362" y="74" width="336" height="50" rx="9" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><circle cx="382" cy="99" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="382" y="103" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">4</text><text x="402" y="95" font-size="11.5" font-weight="700" fill="#1c2b3a">Voice mismatch</text><text x="402" y="111" font-size="10.5" fill="#42566a">Generic tone, or vocabulary not yet introduced</text></svg><div class="dcap">Fluent prose hides its errors. You are verifying claims, not improving expression.</div></div>
 <div class="box info"><span class="bh">The four patterns, and how to spot each</span><p class="tight"><b>1. Factual drift.</b> Version numbers, command flags, port numbers, menu paths, and specifications that are plausible but wrong. Spot it by checking anything a learner would type or rely on against the actual source.<br><b>2. Invented specifics.</b> Statistics, study citations, and precise figures added to sound authoritative. Spot it by asking where the number came from. If you cannot trace it, it does not ship.<br><b>3. Filler.</b> Sentences that restate the previous sentence or announce what is about to happen. Spot it by deleting the sentence and checking whether anything was lost.<br><b>4. Voice mismatch.</b> Generic instructional tone where the course has a specific one, or vocabulary the course has not introduced yet. Spot it by reading it next to a page you already trust.</p></div>
 <div class="box rule"><span class="bh">The repair rules</span><p class="tight">Fix the claim, do not soften it. Rounding a fabricated statistic or adding \u201Cresearch suggests\u201D keeps the problem and hides it. Either replace it with something that stands on its own, or tag it <span class="mono">[VERIFY]</span> and confirm it before release. Cutting is a legitimate repair: if a sentence cannot be verified and is not needed, delete it.</p></div>
 <p><strong>Ownership is the part that matters.</strong> Whatever ships carries your name at QA, not the tool\u2019s. \u201CThe AI wrote it\u201D is not a defense for a wrong command in a lab that a learner will run. This is the same standard learners are held to when they use AI, which is why we hold it visibly.</p>
 <p><strong>In our courses.</strong> An AI draft of an IT Support lesson will confidently name a Windows settings path that moved two versions ago. A MERN draft will invent an npm flag or a method signature that does not exist. Both read perfectly and both break in a classroom.</p>
 <p class="tight" style="color:var(--muted)">Select each problem sentence in the draft below, then choose the repair. Name which of the four patterns it was.</p>`,
 variants:{swe:{type:"fix",id:"s6f",points:15,

{id:"sai",title:"Use AI without outsourcing responsibility",crumb:"Unit 3 · Review queue",
 mins:8,
 lead:"Technical verification is only half the standard. The other half is governance: protected information, approved tools, and a named human who owns the output.",
 coach:`<b>✓ Approve</b> responsible workflows; <b>✗ Send back</b> risky inputs, unverifiable outputs, hidden assessment generation, or vague human review, naming the exact failure. Guardrails: ${gl('ai','the AI section')}.`,
 hint:"Run the checks in order: what went IN (confidential? learner data? approved tool?), what came OUT (verified? sourced?), and who OWNS it (named reviewer? disclosed where required?).",
 demo:{eg:"Workflow: “I pasted the client’s job-task analysis: company name and all: into a free public chatbot to draft objectives. Way faster.”",steps:[
 "Input check comes first, always: client-identifying material entered into an unapproved public tool is protected information leaving our custody. No matter how good the output is.",
 "‘Faster’ is true and irrelevant. The standard is a workflow we could defend to the client whose data it is; speed defends nothing.",
 "Verdict: ✗ Send back, approved tool with scrubbed input, or don’t. Your queue runs the same order: input, tool, verification, ownership."]},
 html:`<div class="box info"><span class="bh">Governance is three questions</span><p class="tight">Technical correctness isn\u2019t enough. An AI workflow also has to pass: <b>(1) Protected information</b>: did anyone paste learner data, client-confidential material, or unreleased content into a tool that isn\u2019t approved for it? <b>(2) Approved tools</b>: is this an org-sanctioned tool, or a convenient unknown? <b>(3) A named owner</b>: is there a specific human accountable for the output, or did the tool quietly become the author? A workflow fails if you couldn\u2019t defend it to a learner, a client, an instructor, or an auditor.</p></div>
 <p><strong>Technical correctness is only half the review.</strong> A draft can be accurate and still be a workflow we cannot defend. Governance asks a different question from \u201Cis this right?\u201D It asks: if a learner, a client, an instructor, or an auditor saw exactly how this was made, would it hold up?</p>
 <div class="diag"><svg viewBox="0 0 720 112" role="img" aria-labelledby="sai-d"><title id="sai-d">The three questions that decide whether an AI workflow is defensible</title><rect x="12" y="26" width="216" height="60" rx="10" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="120" y="50" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1c2b3a">What went in?</text><text x="120" y="68" text-anchor="middle" font-size="10" fill="#42566a">Learner or client data?</text><line x1="232" y1="56" x2="248" y2="56" stroke="#7a8a99" stroke-width="1.6"/><polygon points="250,56 244,52 244,60" fill="#7a8a99"/><rect x="254" y="26" width="216" height="60" rx="10" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><text x="362" y="50" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1c2b3a">Which tool?</text><text x="362" y="68" text-anchor="middle" font-size="10" fill="#42566a">Approved for that data?</text><line x1="474" y1="56" x2="490" y2="56" stroke="#7a8a99" stroke-width="1.6"/><polygon points="492,56 486,52 486,60" fill="#7a8a99"/><rect x="496" y="26" width="216" height="60" rx="10" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><text x="604" y="50" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1c2b3a">Who owns it?</text><text x="604" y="68" text-anchor="middle" font-size="10" fill="#42566a">A named human signs off</text></svg><div class="dcap">All three have to pass. Any one failing makes the workflow indefensible, however useful the output.</div></div>
 <div class="box info"><span class="bh">The three governance questions</span><p class="tight"><b>1. What went in?</b> Learner data, client-confidential material, unreleased curriculum, and anything under NDA do not go into a tool that is not approved for them. Once pasted, you cannot take it back. Pseudonymized or synthetic examples usually do the same job.<br><b>2. Which tool?</b> Approved, org-sanctioned tools only. \u201CIt was free and quick\u201D is how content ends up in a system nobody has vetted for retention or training use.<br><b>3. Who owns the output?</b> A named human verifies and signs off. If the answer is \u201Cthe tool produced it and we shipped it,\u201D the tool has quietly become the author, and no one checked the claims.</p></div>
 <div class="box rule"><span class="bh">The two rules for learner-facing AI</span><p class="tight">When learners use AI in an activity, the activity must make their <b>own thinking visible</b> (what they asked, what they changed, what they rejected and why), and it must be assessed with the <b>AI Integrity Rubric</b> so \u201CI used AI\u201D is not itself the finding. AI use is not the problem. Unexamined AI use is.</p></div>
 <p><strong>Where the line usually falls.</strong> Drafting a lesson outline from your own module blueprint with an approved tool, then verifying every claim, is fine. Pasting a cohort\u2019s submissions into an unapproved tool to \u201Csummarize the trends\u201D is not, regardless of how useful the summary is. The difference is what went in and who is accountable for what came out.</p>
 <p class="tight" style="color:var(--muted)">Review each workflow below. Approve the ones we could defend, and when you send one back, name which of the three questions it fails.</p>`,
 activity:{type:"review",id:"sair",points:12,queueTag:"AI governance",
  items:[
   {content:"A Product Developer uses an approved assistant to outline a lab from approved objectives, replaces client names with neutral placeholders, marks uncertain technical details [VERIFY], tests every command, and records the human reviewer.",good:true,why:"✓ Approved. The input is controlled, uncertainty is visible, and human verification is concrete.",reasons:[]},
   {content:"A developer pastes a client conversation transcript containing names, pricing, internal systems, and unresolved contract details into a public AI tool to generate the module plan.",good:false,why:"✗ Send back. Confidential and proprietary information cannot be treated as prompt material without an approved tool and data pathway.",reasons:[{t:"Use an approved tool and remove or abstract confidential, personal, contractual, and proprietary information before prompting",ok:true,fb:""},{t:"Add a note that the AI output is confidential",fb:"A note after disclosure does not undo the disclosure."},{t:"Ask the AI not to remember it",fb:"A prompt instruction is not an organizational data-control mechanism."}]},
   {content:"An AI assistant drafts distractors. The author checks the source content, verifies one best answer, tests for grammatical cues, documents revisions, and submits the bank through normal QA.",good:true,why:"✓ Approved. AI accelerated drafting; the author and QA still own validity and security.",reasons:[]},
   {content:"A complete KBA is generated and uploaded directly to Canvas because the questions 'look right' and the SME is busy.",good:false,why:"✗ Send back. Appearance is not validity; assessment security and accuracy require human review.",reasons:[{t:"Require objective alignment, source verification, item-quality review, SME validation where needed, and normal QA before release",ok:true,fb:""},{t:"Generate twice as many questions",fb:"Quantity does not repair validity or review."},{t:"Tell learners the quiz was AI-generated",fb:"Disclosure does not substitute for quality assurance."}]},
   {content:"A learner activity permits an AI assistant for brainstorming, requires the learner to verify two claims, show one rejected suggestion, explain the final decision, and avoid entering employer/client or personal data.",good:true,why:"✓ Approved. The activity preserves human evidence and teaches responsible use.",reasons:[]}],
  fbGood:"AI workflow approved. Speed is useful; accountability is non-transferable.",
  fbBad:"Review complete. Recheck the rejected workflows: approved tools, protected inputs, visible verification, and named ownership are the floor."}},

{day:4,mod:"4 · Quality",lessons:[
{id:"d4i",title:"Unit 4 · Quality & your first module",crumb:"Unit 4 · Open",
 mins:5,
 lead:"Last unit: calibrate your judgment against an expert's, then plan a real module. After this, the Handbook is your working reference.",
 coach:"Read the loop, answer the warm-up, Save, and head into the QA desk.",
 html:`<p><strong>By the end of Unit 4 you'll be able to:</strong></p>
 <ul class="obj"><li>Score AI-assisted work on the Integrity Rubric, calibrated to expert judgment</li><li>Plan a complete module: assessments in rhythm, files in convention, AI plan stated</li></ul><div class="diag"><svg viewBox="0 0 720 118" role="img" aria-labelledby="dq-t"><title id="dq-t">The quality loop: select each stage</title><g class="fdu hot" tabindex="0" role="button" style="animation-delay:0.0s" aria-label="Build" data-name="Build" data-info="Materials made to the standards, which you now know cold."><rect x="20" y="26" width="118" height="44" rx="9" fill="#fff" stroke="#e8e1d6"/><text x="79" y="52" text-anchor="middle" font-size="12" fill="#1c2b3a" font-weight="600">Build</text></g><g class="fdu hot" tabindex="0" role="button" style="animation-delay:0.18s" aria-label="QA review" data-name="QA review" data-info="Module and course review against the deliverables list; findings documented."><rect x="172" y="26" width="118" height="44" rx="9" fill="#e3edf8" stroke="#1d5fa8"/><text x="231" y="52" text-anchor="middle" font-size="12" fill="#164a85" font-weight="600">QA review</text></g><g class="fdu hot" tabindex="0" role="button" style="animation-delay:0.36s" aria-label="Fix & recheck" data-name="Fix & recheck" data-info="Findings go back, get fixed, get re-verified. Cheap here, expensive later."><rect x="324" y="26" width="118" height="44" rx="9" fill="#fff" stroke="#e8e1d6"/><text x="383" y="52" text-anchor="middle" font-size="12" fill="#1c2b3a" font-weight="600">Fix & recheck</text></g><g class="fdu hot" tabindex="0" role="button" style="animation-delay:0.54s" aria-label="Ship" data-name="Ship" data-info="QA sign-off releases the course to Delivery and instructor training."><rect x="476" y="26" width="108" height="44" rx="9" fill="#e7f4ee" stroke="#1f9d76"/><text x="530" y="52" text-anchor="middle" font-size="12" fill="#186b52" font-weight="600">Ship</text></g><g class="fdu hot" tabindex="0" role="button" style="animation-delay:0.72s" aria-label="Cohort" data-name="Cohort" data-info="Surveys and results come back, and become the next revision’s inputs."><rect x="618" y="26" width="88" height="44" rx="9" fill="#fff" stroke="#e8e1d6"/><text x="662" y="52" text-anchor="middle" font-size="12" fill="#1c2b3a" font-weight="600">Cohort</text></g><path class="fdu" style="animation-delay:0.1s" d="M 142 48 L 164 48" stroke="#1d5fa8" stroke-width="2.5" marker-end="url(#arrQ)"/><path class="fdu" style="animation-delay:0.28s" d="M 294 48 L 316 48" stroke="#1d5fa8" stroke-width="2.5" marker-end="url(#arrQ)"/><path class="fdu" style="animation-delay:0.46s" d="M 446 48 L 468 48" stroke="#1d5fa8" stroke-width="2.5" marker-end="url(#arrQ)"/><path class="fdu" style="animation-delay:0.64s" d="M 588 48 L 610 48" stroke="#1d5fa8" stroke-width="2.5" marker-end="url(#arrQ)"/><path d="M 662 74 Q 360 122 82 74" fill="none" stroke="#3f88c5" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arrQg)"/><text x="372" y="108" text-anchor="middle" font-size="10.5" fill="#3f88c5">findings become the next revision’s inputs</text><defs><marker id="arrQ" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1d5fa8"/></marker><marker id="arrQg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3f88c5"/></marker></defs></svg><div class="dcap">👆 <b>Select each stage</b> of the loop your capstone plan will enter.</div></div>
 <div class="pullquote"><div class="pq">“Feedback is one of the most powerful influences on learning and achievement, but its impact depends entirely on the kind of feedback given.”</div><div class="pa">Hattie &amp; Timperley, “The Power of Feedback,” Review of Educational Research, 2007. Why every activity in this course answers you, and every rubric you write must too.</div></div><div class="meta"><span class="mi">🔍</span><div><b>Design note:</b> across the four units you got objectives up front, warm-ups, concepts with visuals, activated practice, unit checks, and a capstone that produces something real. That arc is the template.</div></div>`,
 activity:{type:"journal",id:"d4ij",fields:[
  {label:"Warm-up: in your own words. What does \u201Cdone\u201D mean for a module?",ph:"Done means…"}],model:"“Done” is a checklist, not a feeling: every deliverable on the list, every graded item carrying a rubric, accessibility verified, files named to convention, and QA-ready. If your answer was about effort or completeness-as-vibe, today will sharpen it into evidence."}},

{id:"msy",title:"When the plan meets Tuesday",crumb:"Unit 4 · Simulation",
 mins:10,
 lead:"The work so far has assumed things go to plan. This lesson covers what happens when they do not: the client changes course, the SME slips, the environment breaks, and you have to make a defensible call.",
 
 brief:{from:"ID&D Director",re:"Five situations from real builds",text:"None of these have a comfortable answer, which is why they are worth practising. What I care about is the pattern in your calls: never silent. Document, propose options, escalate early, and let the owner of the decision decide."},
 coach:"Read each situation, then <b>select the call you’d make</b>. Wrong calls explain their downstream cost and let you try again: that’s the design.",
 hint:"The pattern behind every right answer: no silent changes, no silent absorption, no silent shipping. Constraints get documented, options get proposed, decisions get made by their owners, in writing.",
 html:`<p>There\u2019s no answer key for a plan meeting reality, but there is a <b>pattern that separates a defensible call from a panic move</b>.</p>
 <div class="box info"><span class="bh">The rule when things break</span><p class="tight"><b>Never go silent.</b> Whatever the disruption. Client pivots, SME slips, environment fails. The professional move is the same shape: <b>document</b> what changed, <b>propose options</b> with tradeoffs rather than presenting a dead end, and <b>escalate early</b> while there\u2019s still room to act. The wrong move is almost never the wrong <em>option</em>: it\u2019s absorbing the problem quietly and hoping.</p></div>
 <p><strong>Plans meet reality on every build.</strong> Clients change direction, SMEs miss dates, environments break, and equipment arrives late. None of that is a failure of planning, it is the normal condition of the work. What separates a professional response from a panic response is not the option chosen, it is the shape of the response.</p>
 <div class="diag"><svg viewBox="0 0 720 112" role="img" aria-labelledby="msy-d"><title id="msy-d">The three moves when a plan meets reality</title><rect x="12" y="26" width="216" height="60" rx="10" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="120" y="50" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1c2b3a">Document</text><text x="120" y="68" text-anchor="middle" font-size="10" fill="#42566a">What changed, dated, with impact</text><line x1="232" y1="56" x2="248" y2="56" stroke="#7a8a99" stroke-width="1.6"/><polygon points="250,56 244,52 244,60" fill="#7a8a99"/><rect x="254" y="26" width="216" height="60" rx="10" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><text x="362" y="50" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1c2b3a">Bring options</text><text x="362" y="68" text-anchor="middle" font-size="10" fill="#42566a">With tradeoffs, not a dead end</text><line x1="474" y1="56" x2="490" y2="56" stroke="#7a8a99" stroke-width="1.6"/><polygon points="492,56 486,52 486,60" fill="#7a8a99"/><rect x="496" y="26" width="216" height="60" rx="10" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><text x="604" y="50" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1c2b3a">Escalate early</text><text x="604" y="68" text-anchor="middle" font-size="10" fill="#42566a">While there is room to act</text></svg><div class="dcap">The shape of the response matters more than which option you pick.</div></div>
 <div class="box info"><span class="bh">The three moves, every time</span><p class="tight"><b>1. Document what changed.</b> In writing, with the date and the specific impact on scope, timeline, or quality. A change nobody recorded becomes a dispute later about what was agreed.<br><b>2. Bring options, not a dead end.</b> \u201CThis cannot be done\u201D stops the conversation. \u201CWe can do A by the date, or B in full two weeks later, and here is what each costs\u201D lets someone decide. Include the tradeoff you would accept.<br><b>3. Escalate early, while there is room to act.</b> The value of a warning decays fast. A flag raised in week two is a decision, the same flag in week six is a fire.</p></div>
 <div class="box rule"><span class="bh">The move that is always wrong</span><p class="tight">Absorbing the problem quietly. Hidden absorption means leadership plans the next build on data saying this one went fine, so the same slip repeats. It also converts a shared problem into a personal one, usually at your own expense.</p></div>
 <p><strong>Where quality gets protected.</strong> When scope has to give, protect the evidence: the summative that proves competency is the last thing to cut, because without it the module cannot show learners can do the job. Trim practice volume, reduce polish, narrow scope, or move the date, but keep the proof.</p>
 <p class="tight" style="color:var(--muted)">Five real situations follow. For each, pick the response you would defend in writing to your director.</p>`,
 activity:{type:"story",id:"msys",points:18,
  steps:[
   {tag:"Situation 1 of 6 · Mid-build platform change",text:"Six weeks into a customized build, the client announces their environment is moving to a different platform. Half your labs assume the old one. What’s your first move?",
    opts:[{t:"Quietly start rewriting the labs for the new platform: it’s going to happen anyway.",fb:"Now the blueprint, charter, and timeline all describe a project that no longer exists. Undocumented scope change is how builds lose their paper trail."},
          {t:"File a change request with an impact assessment: affected materials, added time, environment needs, before touching anything.",ok:true,fb:"Right. Client changes are routed, not absorbed: impact first, decision by the owner, then work. The change log is the project’s memory."},
          {t:"Push back. The charter says the old platform, so the client is out of scope.",fb:"Charters are agreements, not walls. Client-driven change is normal; the discipline is routing it, not blocking it unilaterally."}]},
   {tag:"Situation 2 of 6 · The SME misses the deadline",text:"Your domain reviewer is a week late on module 3 review, and QA is scheduled. You could probably cover it yourself over the weekend.",
    opts:[{t:"Absorb it. Work the weekend, keep the timeline green.",fb:"The timeline is now lying. Hidden absorption means leadership plans the next build on data that says this one was fine. The same slip repeats on the next build."},
          {t:"Escalate early with options: shift QA a week, descope module 3 review to critical items, or bring in an alternate reviewer.",ok:true,fb:"Exactly, escalation is options, not blame. Early and with alternatives, it’s a professional act; late and bare, it’s a crisis."},
          {t:"Report the SME to leadership and demand consequences.",fb:"Escalation is about the work, not the person. Bring options for the schedule, not a case for the prosecution."}]},
   {tag:"Situation 3 of 6 · The environment can’t support the lab",text:"Infrastructure confirms the planned lab environment can’t exist as designed. The lab is the evidence for a key objective.",
    opts:[{t:"Ship the lab as written. Infra will probably catch up by launch.",fb:"“Probably” is not an environment. Learners hitting a lab that cannot run is the most expensive possible way to discover this."},
          {t:"Document the constraint, propose alternative evidence for the same objective, and get the change approved.",ok:true,fb:"Right: the objective stays, the evidence adapts, and the decision is documented and owned. Constraints are design inputs, not secrets."},
          {t:"Delete the objective: no environment, no objective.",fb:"Objectives trace to job tasks, not to environments. When evidence can’t exist, the evidence changes: the outcome shouldn’t silently vanish."}]},
   {tag:"Situation 4 of 6 · QA finds a serious problem near launch",text:"Ten days out, QA flags a serious defect in module 2. Fixing it properly risks the launch date.",
    opts:[{t:"Ship quietly and patch after the cohort starts. Nobody will notice week-one.",fb:"Learners will notice, instructors will notice, and the defect log will notice that it was known. Quiet shipping converts a product problem into a trust problem."},
          {t:"Force a readiness decision: fix before ship, or ship with a documented, owner-approved exception and a dated fix plan.",ok:true,fb:"That’s the discipline: launch readiness is a decision someone owns, made in the open. Either outcome can be right. Silence never is."},
          {t:"Push back on QA for flagging it this late.",fb:"The timing stings, but the defect is real regardless of when it was found. Shooting the messenger just teaches QA to stop finding things."}]},
   {tag:"Situation 5 of 6 · The hours get cut",text:"The client cuts the program’s hours substantially, but wants “all the same outcomes.”",
    opts:[{t:"Compress, same content, faster. Learners will keep up.",fb:"Compression collapses the activated-learning time where skill actually forms. Same topics, less learning: the outcomes become fiction."},
          {t:"Renegotiate scope openly: fewer outcomes, done to standard, documented and agreed.",ok:true,fb:"Right. Hours are the budget outcomes are bought with. Fewer hours honestly buys fewer outcomes, done well. That conversation belongs in daylight, in writing."},
          {t:"Quietly pad the difference with self-study homework.",fb:"That’s a modality and scope change wearing a disguise: it needs the same open approval as any other scope decision."}]},
   {tag:"Situation 6 of 6 · The vendor pulls the lab",text:"Two weeks before launch, the vendor discontinues the hosted lab environment module 2 depends on. A similar free alternative exists. What’s the move?",
    opts:[{t:"Swap in the free alternative quietly: it covers the same skills.",fb:"Content changed after review, unseen by QA, undocumented in the blueprint, and the instructors discover the surprise live, in front of a cohort. Fast isn’t the problem; silent is."},
          {t:"Run change control: impact assessment, approval by the review owner, blueprint and change log updated, and Delivery notified with an updated facilitator guide before day one.",ok:true,fb:"Right. A fix can be fast AND governed. Approve it, document it, and above all: the instructors find out from you, not from a broken link."},
          {t:"Push the launch until the original vendor environment is restored.",fb:"Launch dates have owners too. Delaying unilaterally is the same governance failure as swapping silently, pointed the other way. Bring options to the owner."}]}],
  fbGood:"Five Tuesdays survived, one pattern: never silent. Document, propose options, escalate early, let owners decide. That pattern is the whole skill.",
  fbBad:"Five Tuesdays survived. Reread any step where you got burned. Every wrong call here was some flavor of silence."}},
{id:"fgq",title:"Make it teachable",crumb:"Unit 4 · Review queue",
 mins:8,
 lead:"A course is finished when an instructor who was not part of building it can teach it well from what we hand over. Review these facilitator-guide excerpts the way Delivery will experience them.",
 
 brief:{from:"Product Quality & Experience (QA)",re:"Facilitator guide: pre-Delivery review",text:"Instructors consistently report receiving courses without truly understanding how to teach them. These five excerpts are from the 1042 facilitator guide draft. Approve what would help an instructor at 2pm on a hard day; send back what wouldn’t."},
 demo:{eg:"FG excerpt: “Warm-up (20 min): if the room is quiet, seed with the two starter questions below; if it runs long, cut to one and move on. The lab needs its full hour.”",steps:["My lens: does this help an instructor who <em>didn’t build the course</em>, at 2pm on a hard day? It hands them a concrete move for a real classroom moment.","And it protects the load-bearing block: the lab, by naming the tradeoff out loud. Pacing plus priority: that’s the teaching layer.","Verdict: ✓ Approve. Your five excerpts: teach the teacher, and assume the author is absent."]},
 coach:`<b>✓ Approve</b> excerpts that make the module teachable by someone who didn’t build it; <b>✗ Send back</b> those that don’t, naming exactly what’s missing. FG template: ${gl('templates','templates & links')}.`,
 hint:"A facilitator guide is the teaching layer, not a copy of learner materials: pacing with priorities (what compresses, what’s never skipped), known misconceptions, demo notes, self-serve troubleshooting, and it must work with the author nowhere in the building.",
 html:`<div class="box info"><span class="bh">Teachable means a stranger can run it</span><p class="tight">The test for a facilitator guide: <b>could an instructor who didn\u2019t build the course teach it well from this alone?</b> That means it carries more than a schedule. It needs the <em>why</em> behind activities, the common places learners get stuck and how to respond, timing and setup for labs, model answers or look-fors on assessments, and what to do when the room is ahead or behind. A guide that only lists what happens, without how to teach it, hands Delivery a script with no direction.</p></div>
 <p><strong>The standard is a stranger.</strong> A facilitator guide is not a summary for the person who built the course, it is instructions for an instructor who was not in any of the design conversations and will teach this next month. The test: could someone who has never seen this module run it well from the guide alone? Everything else follows from that.</p>
 <div class="diag"><svg viewBox="0 0 720 212" role="img" aria-labelledby="fgq-d"><title id="fgq-d">What a facilitator guide has to carry for a stranger to teach from it</title><rect x="12" y="12" width="336" height="50" rx="9" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><circle cx="32" cy="37" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="32" y="41" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">1</text><text x="52" y="33" font-size="11.5" font-weight="700" fill="#1c2b3a">Purpose per activity</text><text x="52" y="49" font-size="10.5" fill="#42566a">What happens and why, so it can be adapted</text><rect x="362" y="12" width="336" height="50" rx="9" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><circle cx="382" cy="37" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="382" y="41" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">2</text><text x="402" y="33" font-size="11.5" font-weight="700" fill="#1c2b3a">Timing and setup</text><text x="402" y="49" font-size="10.5" fill="#42566a">Durations, prep, accounts and environments</text><rect x="12" y="74" width="336" height="50" rx="9" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><circle cx="32" cy="99" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="32" y="103" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">3</text><text x="52" y="95" font-size="11.5" font-weight="700" fill="#1c2b3a">Where learners stick</text><text x="52" y="111" font-size="10.5" fill="#42566a">Predictable wrong turns and how to respond</text><rect x="362" y="74" width="336" height="50" rx="9" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><circle cx="382" cy="99" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="382" y="103" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">4</text><text x="402" y="95" font-size="11.5" font-weight="700" fill="#1c2b3a">Look-fors</text><text x="402" y="111" font-size="10.5" fill="#42566a">What correct and partial work look like</text><rect x="12" y="136" width="336" height="50" rx="9" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><circle cx="32" cy="161" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="32" y="165" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">5</text><text x="52" y="157" font-size="11.5" font-weight="700" fill="#1c2b3a">Contingencies</text><text x="52" y="173" font-size="10.5" fill="#42566a">Room ahead, room behind, environment down</text></svg><div class="dcap">The test: could someone who never saw this module run it well from the guide alone?</div></div>
 <div class="box info"><span class="bh">What a guide has to carry</span><p class="tight"><b>Purpose per activity.</b> What happens and why it happens, so the instructor can adapt without breaking the objective.<br><b>Timing and setup.</b> How long each block runs, what must be prepared beforehand, what accounts or environments need to exist before class.<br><b>Where learners get stuck.</b> The predictable wrong turns and how to respond, which is the most-used section in practice and the one most often missing.<br><b>Look-fors and model answers.</b> What correct work looks like, and what partial understanding looks like, so feedback is consistent between instructors.<br><b>Contingencies.</b> What to do if the room is ahead, behind, or the environment fails. A lab that depends on a live service needs a fallback.</p></div>
 <div class="box rule"><span class="bh">The failure mode</span><p class="tight">A guide that only lists what happens is a schedule, not a guide. It hands Delivery a sequence with no direction, and the instructor reconstructs the intent by guessing. That is where classroom quality quietly diverges from what was designed.</p></div>
 <p><strong>Why this sits with us and not Delivery.</strong> We do not teach the course, so the guide is how our design intent survives the handoff. If the guide is thin, the module is not finished, no matter how good the lessons are.</p>
 <p><strong>In our courses.</strong> For an IT Support ticket lab, the guide needs the seeded fault, the expected diagnostic path, and what to say when a learner fixes the symptom instead of the cause. For a MERN build lab, it needs the environment setup, the common dependency failure, and what \u201Cworking\u201D looks like versus \u201Cpasses by accident.\u201D</p>
 <p class="tight" style="color:var(--muted)">Review each excerpt as Delivery would experience it. Approve what makes the module teachable by a stranger, and name what is missing when you send one back.</p>`,
 activity:{type:"review",id:"fgqr",points:15,queueTag:"Facilitator guide · draft excerpts",
  items:[
   {content:"<strong>Pacing:</strong> “The configuration demo (15 min) can compress to 8 if the morning ran long. GLAB 301.2.1 is never skipped: it produces the evidence KBA 301 measures.”",
    good:true,
    why:"✓ Approved. Priorities plus pacing: exactly what an instructor needs when time collapses: what flexes, what’s load-bearing, and why.",
    reasons:[]},
   {content:"<strong>Lesson steps:</strong> the same numbered steps as the learner lab, pasted verbatim, nothing added.",
    good:false,
    why:"✗ Sent back: a facilitator guide adds the <em>teaching</em> layer. What to demonstrate, where learners stall, what to ask. It doesn’t duplicate what learners already have.",
    reasons:[
     {t:"It duplicates learner-facing content instead of adding delivery guidance. The teaching layer is entirely missing",ok:true,fb:""},
     {t:"The formatting doesn’t match the template",fb:"Formatting is fixable in a pass. The structural problem is that there’s nothing here an instructor doesn’t already have."},
     {t:"Steps shouldn’t appear in facilitator guides at all",fb:"Steps can absolutely appear: annotated with how to teach them. Duplication without annotation is the flaw."}]},
   {content:"<strong>Troubleshooting:</strong> “If the VM image fails to load, message the course developer on Slack.”",
    good:false,
    why:"✗ Sent back: the course must run with its author nowhere in the building. The guide needs the actual troubleshooting steps. Checks, fixes, and the proper escalation path when those fail.",
    reasons:[
     {t:"It outsources troubleshooting to the author instead of equipping the instructor. The self-serve steps are missing",ok:true,fb:""},
     {t:"Slack is the wrong tool for escalation",fb:"The channel isn’t the issue. The issue is there’s nothing to try before escalating. The instructor is helpless by design."},
     {t:"Developers must never be contacted after launch",fb:"Escalation paths exist and sometimes reach the developer. The flaw is skipping straight there with zero self-serve steps."}]},
   {content:"<strong>Misconception note:</strong> “Learners reliably conflate bandwidth and latency. Surface it with the warm-up poll before the demo, then name the difference explicitly during it.”",
    good:true,
    why:"✓ Approved. Anticipating a known misconception and giving the instructor a concrete move for it. This is the guide earning its keep.",
    reasons:[]},
   {content:"<strong>Delivery notes:</strong> “(section left blank. This module is self-explanatory)”",
    good:false,
    why:"✗ Sent back: “self-explanatory” is how courses fail contact with a real classroom. Delivery detail is a required part of the deliverable. If there is truly nothing to say, the module hasn’t been thought about from the instructor’s seat.",
    reasons:[
     {t:"Delivery guidance is a required part of the deliverable. A blank section means the instructor’s experience was never designed",ok:true,fb:""},
     {t:"It should say “TBD” instead of being blank",fb:"“TBD” is a blank section with better manners. The content is what’s owed, not a placeholder."},
     {t:"Simple modules are allowed blank sections",fb:"Simplicity is the builder’s view. Instructors still need pacing, pitfalls, and priorities. Those exist even in simple modules."}]}],
  fbGood:"Five for five. You just reviewed for the person this course will actually live with. Instructor enablement is stewardship’s front line.",
  fbBad:"Queue cleared. The through-line in every send-back: the guide must teach the teacher, and it must work with the author absent."}},
{id:"schg",title:"Route the change evidence",crumb:"Unit 4 · Review queue",
 mins:8,
 lead:"Requests to change a live course land with us because we built it. Fixes that do not change what learners must be able to do are ours to make. Anything that changes objectives, or needs a new version number, goes back to Design, because the identifier decision is theirs. Diagnose the impact before urgency decides for you.",
 coach:`<b>✓ Approve</b> proposed routes that match the evidence; <b>✗ Send back</b> anything over- or under-classified, naming the right route. Change types: ${gl('process','the Handbook')}.`,
 hint:"Hotfix = a narrow live blocker or material defect. Maintenance = low-risk correction. Planned revision = changed intent, scope, hours, outcomes, technology, or assessment strategy. No product change = a delivery, access, or support issue wearing a product costume.",
 demo:{eg:"Delivery reports: “Module 2 quiz, question 4 has a typo. ‘teh’ for ‘the.’ Proposed route: planned revision, next quarter.”",steps:[
 "Diagnose before routing: is anything blocked? No. Is intent, scope, or the assessment strategy changing? No: it’s a spelling defect.",
 "That’s maintenance: a low-risk correction, logged and done. Parking it behind a quarterly revision leaves a known defect live for months; escalating it to hotfix burns the emergency lane.",
 "Verdict: ✗ Send back, reroute as maintenance. Your queue: match the route to the impact, never to the urgency."]},
 html:`<div class="box info"><span class="bh">Route by impact, not by volume</span><p class="tight">Four routes, and the skill is telling them apart <em>before</em> urgency forces a bad call: <b>Hotfix</b>: something is broken and live; fix now. <b>Maintenance</b>: a small correction, no new version. <b>Planned revision</b>: a real content change; it earns a version bump and goes through the process. <b>No product change</b>: the issue is delivery or expectation, not the course. The trap: a loud request isn\u2019t automatically a hotfix, and \u201cwhile you\u2019re in there\u201d is how scope creeps. Diagnose impact first.</p></div>
 <p><strong>Routing is the skill, not fixing.</strong> Requests arrive urgent and unsorted, and the cost of misrouting is real in both directions: treating a small correction as a full revision burns weeks, and treating a real content change as a quick fix ships an unversioned course that nobody can reconstruct later. Diagnose impact before you touch anything.</p>

</svg><div class="dcap">Three questions in order. Only the revision route leaves our hands.</div></div>
 <div class="box info"><span class="bh">What we decide, and what we hand back</span><p class="tight"><b>Hotfix.</b> Something is broken and live: a dead link, a wrong command a learner is running right now, a missing file. Fix immediately, log it, no version change.<br><b>Maintenance.</b> A small correction with no instructional impact: a typo, a formatting fix, a clarified sentence. No new version.<br><b>Planned revision.</b> A real change to content, objectives, sequence, or assessments. This one is not ours to authorise: it earns a version bump, so it goes back to Design for the identifier decision, then through the process and QA. Our job is to diagnose it, size it, and hand it over with evidence.<br><b>No product change.</b> The issue is delivery, expectation, or scheduling rather than the course. The fix is a conversation, not an edit.</p></div>
 <div class="box rule"><span class="bh">The two traps</span><p class="tight"><b>Volume is not impact.</b> A loud or senior request is not automatically a hotfix. The route depends on what is actually broken and for whom.<br><b>\u201CWhile you are in there.\u201D</b> Bundling extra changes onto a hotfix is how a one-line fix becomes an untested release. Additional changes get their own route.</p></div>
 <p><strong>Ask three questions in order.</strong> Is anything broken for learners right now? Does this change what learners are expected to know or do? Is the real problem in the product at all? The answers pick the route, and the route decides the paperwork.</p>
 <p><strong>In our courses.</strong> \u201CThe lab link 404s\u201D is a hotfix. \u201CThis explanation is confusing\u201D is maintenance, unless the confusion is an objective problem, in which case it is a revision. \u201CLearners are arriving without prerequisites\u201D is usually no product change, however urgent it feels.</p>
 <p class="tight" style="color:var(--muted)">Route each request in the queue and name the evidence that put it there.</p>`,

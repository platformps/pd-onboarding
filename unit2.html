{id:"s7",title:"Test whether your rubric holds",crumb:"Unit 4 · Simulation",
 swe:{demo:{eg:"Dimension 1, Purposeful AI Use. The submission reads: “I asked the AI for the route, then added validation before the database call.”",steps:["I score against the anchors, never my mood: explaining <em>how</em> AI was used earns a 2 on this dimension.","But adding the validation is <em>refinement</em>: visible judgment applied to the output. Refinement is what separates a 3 from a 2.","I’d score it 3, then check my reasoning against the anchor text. Now score all three dimensions yourself; we compare after."]}},
 mins:8,
 lead:"You wrote a rubric. The only way to know whether it works is to check that two people scoring the same work land in the same place. Score this submission on the AI Integrity Rubric, then compare with an experienced reviewer. Where you differ, the rubric wording is what needs fixing, not the scorer.",
 demo:{eg:"Dimension 1, Purposeful AI Use. The submission reads: “I asked the AI for a plan, then reordered its steps based on the symptoms.”",steps:["I score against the anchors, never my mood: explaining <em>how</em> AI was used earns a 2 on this dimension.","But the reorder is <em>refinement</em>: visible judgment applied to the output. Refinement is what separates a 3 from a 2.","I’d score it 3, then check my reasoning against the anchor text. Now score all three dimensions yourself; we compare after."]},
 coach:`Read the submission, then <b>score each dimension 0–3</b>. Score all three before you compare, so you are testing your own reading of the rubric rather than following someone else's. Then press Compare. The rubric: ${gl('ai','AI standards')}.`,
 hint:"Explanation alone earns a 2. What earns a 3 is visible refinement and independent judgment: reordering, rejecting, correcting.",
 html:`<p><strong>First, the instrument.</strong> The AI Integrity Rubric grades learner AI use on three dimensions, each scored 0 to 3: purposeful use, verification and judgment, and responsible reflection. Passing means 2 or better on all three. <strong>Now the concept.</strong> A rubric only standardizes grading if the graders are calibrated, and calibration is built by scoring a submission an expert has already scored and then comparing.</p>
 <p><strong>What a rubric is actually for.</strong> A rubric exists so that two reviewers scoring the same work land in the same place, and so the learner knows what good looks like before they submit. If it does not do both, it is decoration. That is also why criteria come from the objectives and not from the steps of the activity: you are judging whether the learner demonstrated the capability, not whether they followed your instructions in order.</p>
 <div class="diag"><svg viewBox="0 0 720 242" role="img" aria-labelledby="s7-d"><title id="s7-d">The parts of a usable rubric</title><rect x="12" y="12" width="696" height="44" rx="9" fill="#f3f0ea" stroke="#e8e1d6" stroke-width="1.5"/><text x="360" y="40" text-anchor="middle" font-size="13" font-family="IBM Plex Mono, monospace" fill="#1c2b3a">Criterion  |  Exemplary  |  Proficient  |  Needs Improvement</text><circle cx="30" cy="88" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="30" y="92" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">1</text><text x="50" y="85" font-size="11.5" font-weight="700" fill="#1c2b3a">Criteria</text><text x="50" y="101" font-size="10.5" fill="#42566a">One row per thing judged, each tracing to a stated objective.</text><circle cx="30" cy="128" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="30" y="132" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">2</text><text x="50" y="125" font-size="11.5" font-weight="700" fill="#1c2b3a">Levels</text><text x="50" y="141" font-size="10.5" fill="#42566a">Three to five. Canvas shows a maximum of five per criterion.</text><circle cx="30" cy="168" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="30" y="172" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">3</text><text x="50" y="165" font-size="11.5" font-weight="700" fill="#1c2b3a">Descriptions</text><text x="50" y="181" font-size="10.5" fill="#42566a">What is observable at each level, distinct enough to tell apart.</text><circle cx="30" cy="208" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="30" y="212" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">4</text><text x="50" y="205" font-size="11.5" font-weight="700" fill="#1c2b3a">Points</text><text x="50" y="221" font-size="10.5" fill="#42566a">Scaled to the item’s weight, reconciling with the gradebook.</text></svg><div class="dcap">The test for every row: could two reviewers scoring independently agree on the level?</div></div>
 <div class="box info"><span class="bh">How a usable rubric is built</span><p class="tight"><b>Criteria.</b> One row per thing you are judging, and every row traces back to a stated objective. If a criterion does not trace to an objective, cut it.<br><b>Levels.</b> Exemplary, Proficient, Needs Improvement. Keep it to five or fewer, because Canvas shows a maximum of five per criterion.<br><b>Descriptions.</b> Each level says what is observable at that level, in language different enough from its neighbors that a reader can tell them apart without the points. \u201CGood organization\u201D versus \u201Cexcellent organization\u201D gives a reader nothing to see. That is a rating scale with adjectives.<br><b>Points.</b> Scaled to the item\u2019s weight in the course. A rubric whose total does not reconcile with the gradebook is a QA finding.</p></div>
 <div class="box rule"><span class="bh">The test for every criterion</span><p class="tight">Could two reviewers, scoring independently, agree on the level? If the difference between Proficient and Needs Improvement depends on the reviewer\u2019s mood, the descriptions are not observable yet. Write what you would <em>see</em> in the work at each level.</p></div>
 <p><strong>Two audiences, two versions.</strong> Learners get the simplified rubric so they know the target. Instructors get the full version with look-fors: common wrong turns, what partial credit looks like, and examples of work at each level. Where the task involves AI, the three AI Integrity Rubric criteria go in alongside your own.</p>
 <p><strong>In our courses.</strong> An IT Support SBA rubric row might read: <em>diagnoses the fault before changing settings</em>, with Exemplary described as \u201Cisolates the cause with a documented test before any change,\u201D and Needs Improvement as \u201Cchanges settings without establishing the cause.\u201D That is observable. \u201CDemonstrates strong troubleshooting\u201D is not.</p>
 <p class="tight" style="color:var(--muted)">Score the submission below on each dimension, then compare with the expert scoring. Where you differ, the question is which of you the rubric wording actually supports.</p>`,

{id:"fgq",title:"Check that a stranger could teach it",crumb:"Unit 4 · Review queue",
 mins:8,
 lead:"Your module is built and your facilitator guide is drafted. A course is finished when an instructor who was not part of building it can teach it well from what you hand over, so read your own excerpts the way that instructor will.",
 
 brief:{from:"You, to yourself",re:"Facilitator guide: read it as the instructor",text:"Instructors consistently report receiving courses without understanding how to teach them. Five excerpts from your own draft. Keep what would help someone at 2pm on a hard day, and fix what would not."},
 demo:{eg:"FG excerpt: “Warm-up (20 min): if the room is quiet, seed with the two starter questions below; if it runs long, cut to one and move on. The lab needs its full hour.”",steps:["My lens: does this help an instructor who <em>didn’t build the course</em>, at 2pm on a hard day? It hands them a concrete move for a real classroom moment.","And it protects the load-bearing block: the lab, by naming the tradeoff out loud. Pacing plus priority: that’s the teaching layer.","Verdict: ✓ Approve. Your five excerpts: teach the teacher, and assume the author is absent."]},
 coach:`For each of your own excerpts: <b>✓ Ships as is</b> if it would make the module teachable by someone who did not build it, or <b>✗ I need to fix this</b> if it would not, naming exactly what is missing. FG template: ${gl('templates','templates & links')}.`,
 hint:"A facilitator guide is the teaching layer, not a copy of learner materials: pacing with priorities (what compresses, what’s never skipped), known misconceptions, demo notes, self-serve troubleshooting, and it must work with the author nowhere in the building.",
 html:`<div class="box info"><span class="bh">Teachable means a stranger can run it</span><p class="tight">The test for a facilitator guide: <b>could an instructor who didn\u2019t build the course teach it well from this alone?</b> That means it carries more than a schedule. It needs the <em>why</em> behind activities, the common places learners get stuck and how to respond, timing and setup for labs, model answers or look-fors on assessments, and what to do when the room is ahead or behind. A guide that only lists what happens, without how to teach it, hands Delivery a script with no direction.</p></div>
 <p><strong>The standard is a stranger.</strong> A facilitator guide is written for an instructor who sat in none of the design conversations and teaches this next month. The test: could someone who has never seen this module run it well from the guide alone? Everything else follows from that.</p>
 <div class="diag"><svg viewBox="0 0 720 212" role="img" aria-labelledby="fgq-d"><title id="fgq-d">What a facilitator guide has to carry for a stranger to teach from it</title><rect x="12" y="12" width="336" height="50" rx="9" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><circle cx="32" cy="37" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="32" y="41" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">1</text><text x="52" y="33" font-size="11.5" font-weight="700" fill="#1c2b3a">Purpose per activity</text><text x="52" y="49" font-size="10.5" fill="#42566a">What happens and why, so it can be adapted</text><rect x="362" y="12" width="336" height="50" rx="9" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><circle cx="382" cy="37" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="382" y="41" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">2</text><text x="402" y="33" font-size="11.5" font-weight="700" fill="#1c2b3a">Timing and setup</text><text x="402" y="49" font-size="10.5" fill="#42566a">Durations, prep, accounts and environments</text><rect x="12" y="74" width="336" height="50" rx="9" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><circle cx="32" cy="99" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="32" y="103" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">3</text><text x="52" y="95" font-size="11.5" font-weight="700" fill="#1c2b3a">Where learners stick</text><text x="52" y="111" font-size="10.5" fill="#42566a">Predictable wrong turns and how to respond</text><rect x="362" y="74" width="336" height="50" rx="9" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><circle cx="382" cy="99" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="382" y="103" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">4</text><text x="402" y="95" font-size="11.5" font-weight="700" fill="#1c2b3a">Look-fors</text><text x="402" y="111" font-size="10.5" fill="#42566a">What correct and partial work look like</text><rect x="12" y="136" width="336" height="50" rx="9" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><circle cx="32" cy="161" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="32" y="165" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">5</text><text x="52" y="157" font-size="11.5" font-weight="700" fill="#1c2b3a">Contingencies</text><text x="52" y="173" font-size="10.5" fill="#42566a">Room ahead, room behind, environment down</text></svg><div class="dcap">The test: could someone who never saw this module run it well from the guide alone?</div></div>
 <div class="box info"><span class="bh">What a guide has to carry</span><p class="tight"><b>Purpose per activity.</b> What happens and why it happens, so the instructor can adapt without breaking the objective.<br><b>Timing and setup.</b> How long each block runs, what must be prepared beforehand, what accounts or environments need to exist before class.<br><b>Where learners get stuck.</b> The predictable wrong turns and how to respond, which is the most-used section in practice and the one most often missing.<br><b>Look-fors and model answers.</b> What correct work looks like, and what partial understanding looks like, so feedback is consistent between instructors.<br><b>Contingencies.</b> What to do if the room is ahead, behind, or the environment fails. A lab that depends on a live service needs a fallback.</p></div>
 <div class="box rule"><span class="bh">The failure mode</span><p class="tight">A guide that only lists what happens is a schedule, not a guide. It hands Delivery a sequence with no direction, and the instructor reconstructs the intent by guessing. That is where classroom quality quietly diverges from what was designed.</p></div>
 <p><strong>Why this sits with us and not Delivery.</strong> We do not teach the course, so the guide is how our design intent survives the handoff. If the guide is thin, the module is not finished, no matter how good the lessons are.</p>
 <p><strong>In our courses.</strong> For an IT Support ticket lab, the guide needs the seeded fault, the expected diagnostic path, and what to say when a learner fixes the symptom instead of the cause. For a MERN build lab, it needs the environment setup, the common dependency failure, and what \u201Cworking\u201D looks like versus \u201Cpasses by accident.\u201D</p>
 <p class="tight" style="color:var(--muted)">Read each of your excerpts the way the instructor will. Let the ones that would carry a stranger through stand, and where one would not, name what is missing.</p>`,

     {t:"The instructor should just ask each learner what they did",fb:"Closer, but a guide has to say what counts as evidence rather than leaving the standard to whoever is teaching."}]}],

  fbBad:"Excerpts all decided. The through-line in every send-back: the guide must teach the teacher, it must work with the author absent, and on this build it must say how individual competence is seen inside team work."}},

{id:"schg",title:"Route a change request after launch",crumb:"Unit 4 · Review queue",
 mins:8,
 lead:"Requests to change a live course land with us because we built it. Fixes that do not change what learners must be able to do are ours to make. Anything that changes objectives, or needs a new version number, goes back to Design, because the identifier decision is theirs. Diagnose the impact before urgency decides for you.",
 coach:`<b>✓ Approve</b> proposed routes that match the evidence; <b>✗ Send back</b> anything over- or under-classified, naming the right route. Change types: ${gl('process','the Handbook')}.`,
 hint:"Hotfix = a narrow live blocker or material defect. Maintenance = low-risk correction. Planned revision = changed intent, scope, hours, outcomes, technology, or assessment strategy. No product change = a delivery, access, or support issue wearing a product costume.",
 demo:{eg:"Delivery reports: “Module 2 quiz, question 4 has a typo. ‘teh’ for ‘the.’ Proposed route: planned revision, next quarter.”",steps:[
 "Diagnose before routing: is anything blocked? No. Is intent, scope, or the assessment strategy changing? No: it’s a spelling defect.",
 "That’s maintenance: a low-risk correction, logged and done. Parking it behind a quarterly revision leaves a known defect live for months; escalating it to hotfix burns the emergency lane.",
 "Verdict: ✗ Send back, reroute as maintenance. Your queue: match the route to the impact, never to the urgency."]},
 html:`<div class="box info"><span class="bh">Route by impact, not by volume</span><p class="tight">Four routes, and the skill is telling them apart <em>before</em> urgency forces a bad call: <b>Hotfix</b>: something is broken and live; fix now. <b>Maintenance</b>: a small correction, no new version. <b>Planned revision</b>: a real content change; it earns a version bump and goes through the process. <b>No product change</b>: the issue is delivery or expectation, not the course. The trap: a loud request isn\u2019t automatically a hotfix, and \u201cwhile you\u2019re in there\u201d is how scope creeps. Diagnose impact first.</p></div>
 <p><strong>Routing is the skill, not fixing.</strong> Requests arrive urgent and unsorted, and the cost of misrouting is real in both directions: treating a small correction as a full revision burns weeks, and treating a real content change as a quick fix ships an unversioned course that nobody can reconstruct later. Diagnose impact before you touch anything.</p>
 <div class="diag"><svg viewBox="0 0 720 240" role="img" aria-labelledby="schg-t"><title id="schg-t">Routing a change request: three questions decide the route</title>
 <rect x="270" y="10" width="180" height="40" rx="8" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/>

 <rect x="248" y="70" width="224" height="34" rx="8" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/>
 <text x="360" y="92" text-anchor="middle" font-size="11.5" fill="#1c2b3a">Broken for learners right now?</text>
 <line x1="248" y1="87" x2="150" y2="87" stroke="#8a97a4" stroke-width="1.5"/><text x="196" y="82" text-anchor="middle" font-size="10" fill="#7a8a99">yes</text>
 <rect x="30" y="70" width="118" height="34" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
 <text x="89" y="92" text-anchor="middle" font-size="11.5" font-weight="600" fill="#9a2f2f">Hotfix (ours)</text>
 <line x1="360" y1="104" x2="360" y2="124" stroke="#8a97a4" stroke-width="1.5"/><text x="374" y="118" font-size="10" fill="#7a8a99">no</text>
 <rect x="228" y="124" width="264" height="34" rx="8" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/>

 <text x="360" y="200" text-anchor="middle" font-size="11.5" fill="#1c2b3a">Is the problem in the course at all?</text>

</svg><div class="dcap">Three questions in order. Only the revision route leaves our hands.</div></div>
 <div class="box info"><span class="bh">What we decide, and what we hand back</span><p class="tight"><b>Hotfix.</b> Something is broken and live: a dead link, a wrong command a learner is running right now, a missing file. Fix immediately, log it, no version change.<br><b>Maintenance.</b> A small correction with no instructional impact: a typo, a formatting fix, a clarified sentence. No new version.<br><b>Planned revision.</b> A real change to content, objectives, sequence, or assessments. This one is not ours to authorise: it earns a version bump, so it goes back to Design for the identifier decision, then through the process and QA. Our job is to diagnose it, size it, and hand it over with evidence.<br><b>No product change.</b> The issue is delivery, expectation, or scheduling rather than the course. The fix is a conversation, not an edit.</p></div>
 <div class="box rule"><span class="bh">The two traps</span><p class="tight"><b>Volume is not impact.</b> A loud or senior request is not automatically a hotfix. The route depends on what is actually broken and for whom.<br><b>\u201CWhile you are in there.\u201D</b> Bundling extra changes onto a hotfix is how a one-line fix becomes an untested release. Additional changes get their own route.</p></div>
 <p><strong>Ask three questions in order.</strong> Is anything broken for learners right now? Does this change what learners are expected to know or do? Is the real problem in the product at all? The answers pick the route, and the route decides the paperwork.</p>
 <p><strong>In our courses.</strong> \u201CThe lab link 404s\u201D is a hotfix. \u201CThis explanation is confusing\u201D is maintenance, unless the confusion is an objective problem, in which case it is a revision. \u201CLearners are arriving without prerequisites\u201D is usually no product change, however urgent it feels.</p>
 <p class="tight" style="color:var(--muted)">Route each request in the queue and name the evidence that put it there.</p>`,

{id:"msy",title:"Hold quality when the plan slips",crumb:"Unit 4 · Simulation",
 mins:10,
 lead:"The work so far has assumed things go to plan. This lesson covers what happens when they do not: the client changes course, the SME slips, the environment breaks, and you have to make a defensible call.",
 
 brief:{from:"ID&D Director",re:"Five situations from real builds",text:"None of these have a comfortable answer. That is what makes them worth practising. What I care about is the pattern in your calls: never silent, and never deciding something that is not yours to decide. Document what you know, put options in front of whoever owns the call, and do it early."},
 coach:"Read each situation, then <b>select the call you’d make</b>. Wrong calls explain their downstream cost and let you try again: that’s the design.",
 hint:"The pattern behind every right answer: no silent changes, no silent absorption, no silent shipping. Constraints get documented, options get proposed, decisions get made by their owners, in writing.",
 html:`<p>There\u2019s no answer key for a plan meeting reality, but there is a <b>pattern that separates a defensible call from a panic move</b>.</p>
 <div class="box info"><span class="bh">The rule when things break</span><p class="tight"><b>Never go silent.</b> Whatever the disruption. Client pivots, SME slips, environment fails. The professional move is the same shape: <b>document</b> what changed, <b>propose options</b> with tradeoffs instead of presenting a dead end, and <b>escalate early</b> while there\u2019s still room to act. The damaging move is almost always the quiet one: absorbing the problem and hoping.</p></div>
 <p><strong>Plans meet reality on every build.</strong> Clients change direction, SMEs miss dates, environments break, and equipment arrives late. None of that is a failure of planning, it is the normal condition of the work. What separates a professional response from a panic response is its shape, not which option gets picked.</p>
 <div class="diag"><svg viewBox="0 0 720 112" role="img" aria-labelledby="msy-d"><title id="msy-d">The three moves when a plan meets reality</title><rect x="12" y="26" width="216" height="60" rx="10" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="120" y="50" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1c2b3a">Document</text><text x="120" y="68" text-anchor="middle" font-size="10" fill="#42566a">What changed, dated, with impact</text><line x1="232" y1="56" x2="248" y2="56" stroke="#7a8a99" stroke-width="1.6"/><polygon points="250,56 244,52 244,60" fill="#7a8a99"/><rect x="254" y="26" width="216" height="60" rx="10" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><text x="362" y="50" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1c2b3a">Bring options</text><text x="362" y="68" text-anchor="middle" font-size="10" fill="#42566a">With tradeoffs, not a dead end</text><line x1="474" y1="56" x2="490" y2="56" stroke="#7a8a99" stroke-width="1.6"/><polygon points="492,56 486,52 486,60" fill="#7a8a99"/><rect x="496" y="26" width="216" height="60" rx="10" fill="#fff" stroke="#e8e1d6" stroke-width="1.5"/><text x="604" y="50" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1c2b3a">Escalate early</text><text x="604" y="68" text-anchor="middle" font-size="10" fill="#42566a">While there is room to act</text></svg><div class="dcap">The shape of the response matters more than which option you pick.</div></div>
 <div class="box info"><span class="bh">The three moves, every time</span><p class="tight"><b>1. Document what changed.</b> In writing, with the date and the specific impact on scope, timeline, or quality. A change nobody recorded becomes a dispute later about what was agreed.<br><b>2. Bring options, not a dead end.</b> \u201CThis cannot be done\u201D stops the conversation. \u201CWe can do A by the date, or B in full two weeks later, and here is what each costs\u201D lets someone decide. Include the tradeoff you would accept.<br><b>3. Escalate early, while there is room to act.</b> The value of a warning decays fast. A flag raised in week two is a decision, the same flag in week six is a fire.</p></div>
 <div class="box rule"><span class="bh">The move that is always wrong</span><p class="tight">Absorbing the problem quietly. Hidden absorption means leadership plans the next build on data saying this one went fine, so the same slip repeats. It also converts a shared problem into a personal one, usually at your own expense.</p></div>
 <p><strong>Where quality gets protected.</strong> When scope has to give, protect the evidence: the summative that proves competency is the last thing to cut, because without it the module cannot show learners can do the job. Trim practice volume, reduce polish, narrow scope, or move the date, but keep the proof.</p>
 <p class="tight" style="color:var(--muted)">Five real situations follow. For each, pick the response you would defend in writing to your director.</p>`,
 variants:{swe:{type:"story",id:"msys",points:18,
  steps:[
   {tag:"Situation 1 of 6 · Mid-build framework change",text:"Six weeks into a customized build, Design tells you the client is moving to a different framework and asks what it means for the module. Half your labs assume the old one. What do you send back?",
    opts:[{t:"Start rewriting the labs for the new framework. It is going to happen anyway.",fb:"Not yet, and not your call. Whether the change is accepted, deferred, or renegotiated with the client sits with Design. Rewriting first means the blueprint, the charter and the timeline all describe a project nobody has approved."},
          {t:"An impact assessment: which labs and assessments are affected, how much time it adds, what the environment would need. Then Design decides.",ok:true,fb:"Right, and note the split. The impact on the build is yours to work out, because you are the only one who knows what is affected. The decision is Design’s, because they own the outcomes and the client conversation. You give them something to decide with."},
          {t:"Tell Design the charter says the old framework, so the change is out of scope.",fb:"Charters are agreements, not walls, and scope is not ours to rule on. Say what the change costs and let Design weigh it against what they agreed with the client."}]},
   {tag:"Situation 2 of 6 · The SME misses the deadline",text:"Your domain reviewer is a week late on module 3 review, and QA is scheduled. You could probably cover it yourself over the weekend.",
    opts:[{t:"Absorb it. Work the weekend, keep the timeline green.",fb:"The timeline is now lying. Hidden absorption means leadership plans the next build on data that says this one was fine. The same slip repeats on the next build."},
          {t:"Escalate early with options: shift QA a week, descope module 3 review to critical items, or bring in an alternate reviewer.",ok:true,fb:"Exactly, escalation is options, not blame. Early and with alternatives, it’s a professional act; late and bare, it’s a crisis."},
          {t:"Report the SME to leadership and demand consequences.",fb:"Escalation is about the work, not the person. Bring options for the schedule, not a case for the prosecution."}]},
   {tag:"Situation 3 of 6 · The environment can’t support the lab",text:"Infrastructure confirms the planned coding environment can’t exist as designed. The lab is the evidence for a key objective.",
    opts:[{t:"Ship the lab as written. Infra will probably catch up by launch.",fb:"“Probably” is not an environment. Learners hitting a lab that cannot run is the most expensive possible way to discover this."},
          {t:"Document the constraint, propose alternative evidence for the same objective, and get the change approved.",ok:true,fb:"Right: the objective stays, the evidence adapts, and the decision is documented and owned. Constraints are design inputs, not secrets."},
          {t:"Delete the objective: no environment, no objective.",fb:"Objectives trace to job tasks, not to environments. When evidence can’t exist, the evidence changes: the outcome shouldn’t silently vanish."}]},
   {tag:"Situation 4 of 6 · QA finds a serious problem near launch",text:"Ten days out, QA flags a serious defect in module 2. Fixing it properly risks the launch date.",
    opts:[{t:"Ship quietly and patch after the cohort starts. Nobody will notice week-one.",fb:"Learners will notice, instructors will notice, and the defect log will notice that it was known. Quiet shipping converts a product problem into a trust problem."},
          {t:"Force a readiness decision: fix before ship, or ship with a documented, owner-approved exception and a dated fix plan.",ok:true,fb:"That’s the discipline: launch readiness is a decision someone owns, made in the open. Either outcome can be right. Silence never is."},
          {t:"Push back on QA for flagging it this late.",fb:"The timing stings, but the defect is real regardless of when it was found. Shooting the messenger just teaches QA to stop finding things."}]},
   {tag:"Situation 5 of 6 · The hours get cut",text:"The client cuts the program’s hours substantially, but wants “all the same outcomes.”",
    opts:[{t:"Compress: same content, faster. Learners will keep up.",fb:"Compression collapses the activated-learning time where skill actually forms, so you keep the topics and lose the learning, and the outcomes quietly become fiction. It is also a scope decision made without the people who own scope."},
          {t:"Document what the cut costs, in outcomes, and hand the decision to Design with options.",ok:true,fb:"Right, and note where the decision sits. Hours are the budget outcomes are bought with, so fewer hours buys fewer outcomes. Which outcomes go is not ours to choose and not ours to agree with the client: we produce the impact and the options, Design owns the outcomes and the conversation."},
          {t:"Quietly pad the difference with self-study homework.",fb:"That is a modality and scope change wearing a disguise, and it needs the same approval from Design as any other scope decision. There is also a cap on self-study hours, so this may not even be available."}]},
   {tag:"Situation 6 of 6 · The vendor pulls the lab",text:"Two weeks before launch, the hosted service module 2’s labs call is discontinued. A similar free alternative exists. What’s the move?",
    opts:[{t:"Swap in the free alternative quietly: it exposes the same endpoints.",fb:"Content changed after review, unseen by QA, undocumented in the blueprint, and the instructors discover the surprise live, in front of a cohort. Fast isn’t the problem; silent is."},
          {t:"Run change control: impact assessment, approval by the review owner, blueprint and change log updated, and Delivery notified with an updated facilitator guide before day one.",ok:true,fb:"Right. A fix can be fast AND governed. Approve it, document it, and above all: the instructors find out from you, not from a broken link."},
          {t:"Push the launch until the original service is restored.",fb:"Launch dates have owners too. Delaying unilaterally is the same governance failure as swapping silently, pointed the other way. Bring options to the owner."}]}],
  fbGood:"Five Tuesdays survived, one pattern: never silent. Document, propose options, escalate early, let owners decide. That pattern is the skill.",
  fbBad:"Five Tuesdays survived. Reread any step where you got burned. Every wrong call here was some flavor of silence."}},

{id:"s7",title:"Test whether your rubric holds",crumb:"Unit 3 · Simulation",
 mins:8,
 lead:"You wrote a rubric. The only way to know whether it works is to check that two people scoring the same work land in the same place. Score this submission on the AI Integrity Rubric, then compare with an experienced reviewer. Where you differ, the rubric wording is what needs fixing, not the scorer.",
 demo:{eg:"Dimension 1, Purposeful AI Use. The submission reads: “I asked the AI for a plan, then reordered its steps based on the symptoms.”",steps:["I score against the anchors, never my mood: explaining <em>how</em> AI was used earns a 2 on this dimension.","But the reorder is <em>refinement</em>: visible judgment applied to the output. Refinement is what separates a 3 from a 2.","I’d score it 3, then check my reasoning against the anchor text. Now score all three dimensions yourself; we compare after."]},
 coach:`Read the submission, then <b>score each dimension 0–3</b>. Score all three before you compare, so you are testing your own reading of the rubric rather than following someone else's. Then press Compare. The rubric: ${gl('ai','AI standards')}.`,
 hint:"Explanation alone earns a 2. Visible refinement and independent judgment. Reordering, rejecting, correcting. Is what earns a 3.",
 html:`<p><strong>First, the instrument:</strong> the AI Integrity Rubric grades learner AI use on three dimensions, each 0–3, purposeful use, verification &amp; judgment, responsible reflection. Passing means 2+ on all three. <strong>Now the concept:</strong> a rubric only standardizes grading if the graders are calibrated. Scoring the same submission an expert scored. Then comparing, is how calibration is built.</p>
 <p><strong>What a rubric is actually for.</strong> A rubric exists so that two reviewers scoring the same work land in the same place, and so the learner knows what good looks like before they submit. If it does not do both, it is decoration. That is also why criteria come from the objectives and not from the steps of the activity: you are judging whether the learner demonstrated the capability, not whether they followed your instructions in order.</p>
 <div class="diag"><svg viewBox="0 0 720 242" role="img" aria-labelledby="s7-d"><title id="s7-d">The parts of a usable rubric</title><rect x="12" y="12" width="696" height="44" rx="9" fill="#f3f0ea" stroke="#e8e1d6" stroke-width="1.5"/><text x="360" y="40" text-anchor="middle" font-size="13" font-family="IBM Plex Mono, monospace" fill="#1c2b3a">Criterion  |  Exemplary  |  Proficient  |  Needs Improvement</text><circle cx="30" cy="88" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="30" y="92" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">1</text><text x="50" y="85" font-size="11.5" font-weight="700" fill="#1c2b3a">Criteria</text><text x="50" y="101" font-size="10.5" fill="#42566a">One row per thing judged, each tracing to a stated objective.</text><circle cx="30" cy="128" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="30" y="132" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">2</text><text x="50" y="125" font-size="11.5" font-weight="700" fill="#1c2b3a">Levels</text><text x="50" y="141" font-size="10.5" fill="#42566a">Three to five. Canvas shows a maximum of five per criterion.</text><circle cx="30" cy="168" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="30" y="172" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">3</text><text x="50" y="165" font-size="11.5" font-weight="700" fill="#1c2b3a">Descriptions</text><text x="50" y="181" font-size="10.5" fill="#42566a">What is observable at each level, distinct enough to tell apart.</text><circle cx="30" cy="208" r="11" fill="#e3edf8" stroke="#1d5fa8" stroke-width="1.5"/><text x="30" y="212" text-anchor="middle" font-size="11" font-weight="700" fill="#164a85">4</text><text x="50" y="205" font-size="11.5" font-weight="700" fill="#1c2b3a">Points</text><text x="50" y="221" font-size="10.5" fill="#42566a">Scaled to the item’s weight, reconciling with the gradebook.</text></svg><div class="dcap">The test for every row: could two reviewers scoring independently agree on the level?</div></div>
 <div class="box info"><span class="bh">How a usable rubric is built</span><p class="tight"><b>Criteria.</b> One row per thing you are judging, and every row traces back to a stated objective. If a criterion does not trace to an objective, cut it.<br><b>Levels.</b> Exemplary, Proficient, Needs Improvement. Keep it to five or fewer, because Canvas shows a maximum of five per criterion.<br><b>Descriptions.</b> Each level says what is observable at that level, in language different enough from its neighbors that a reader can tell them apart without the points. \u201CGood organization\u201D versus \u201Cexcellent organization\u201D is not a rubric, it is a rating scale with adjectives.<br><b>Points.</b> Scaled to the item\u2019s weight in the course. A rubric whose total does not reconcile with the gradebook is a QA finding.</p></div>
 <div class="box rule"><span class="bh">The test for every criterion</span><p class="tight">Could two reviewers, scoring independently, agree on the level? If the difference between Proficient and Needs Improvement depends on the reviewer\u2019s mood, the descriptions are not observable yet. Write what you would <em>see</em> in the work at each level.</p></div>
 <p><strong>Two audiences, two versions.</strong> Learners get the simplified rubric so they know the target. Instructors get the full version with look-fors: common wrong turns, what partial credit looks like, and examples of work at each level. Where the task involves AI, the three AI Integrity Rubric criteria go in alongside your own.</p>
 <p><strong>In our courses.</strong> An IT Support SBA rubric row might read: <em>diagnoses the fault before changing settings</em>, with Exemplary described as \u201Cisolates the cause with a documented test before any change,\u201D and Needs Improvement as \u201Cchanges settings without establishing the cause.\u201D That is observable. \u201CDemonstrates strong troubleshooting\u201D is not.</p>
 <p class="tight" style="color:var(--muted)">Score the submission below on each dimension, then compare with the expert scoring. Where you differ, the question is which of you the rubric wording actually supports.</p>`,
 activity:{type:"rubric",id:"s7r",points:15,
  dossier:{meta:"GLAB 402.1.1 · AI-assisted troubleshooting plan · Learner: J.R.",
   text:"\u201CI asked the AI assistant to draft a troubleshooting plan for the ticket. Its first plan skipped checking the event logs, so I added that step and reordered it to check hardware last since the symptoms pointed to software. I used its wording for the client-facing summary but rewrote the technical steps from what we did in GLAB 402.1.1. One thing it suggested. Resetting the BIOS. I left out because it didn't match the symptoms and I couldn't verify it was safe on our hardware.\u201D"},
  dims:[
   {t:"Purposeful AI Use: used AI intentionally and explained how it supported the task?",ans:3,why:"Expert: 3. Explains how AI was used AND how the approach was refined (added a step, reordered): refinement pushes past a 2."},
   {t:"Verification & Human Judgment: checked the output and applied their own thinking?",ans:3,why:"Expert: 3. Caught the missing step, reordered on evidence, rejected an unverifiable suggestion: strong independent judgment."},
   {t:"Responsible Use & Reflection: appropriate, acknowledged use with real reflection?",ans:2,why:"Expert: 2. Acknowledged and appropriate, with honest notes on what was kept and cut, but the reflection stays task-level, so it meets rather than exceeds."}],
  fbGood:"3 / 3 / 2 = 8: a clear pass, scored exactly like the expert. Note what earned the 3s: visible refinement, described rather than asserted.",
  fbBad:"Compare with the expert calls above: the calibration point: explanation earns a 2; visible refinement and judgment earn the 3."}},
{id:"d4x",title:"Unit 4 check: write the plan you will hand your manager",crumb:"Unit 4 \u00b7 Unit check",mins:12,
 lead:"Your capstone opens with a plan: the objective you were given, how you intend to meet it, and how you will know it worked. Write a short version of that now, on the module you have been working, so the capstone starts from something rather than a blank page.",
 html:`<div class="box rule"><span class="bh">The task</span><p class="tight">Three boxes. This is the capstone\u2019s Part 1 compressed into about ten minutes. Whatever you write here is a usable first draft of it.</p></div>`,
 coach:"Write all three, then save to compare against an experienced developer\u2019s version.",
 activity:{type:"journal",id:"d4xw",
  fields:[
   {label:"1. Your approach. Which activities and tools will get learners to the objective, and why those rather than something else?",
    ph:"A guided lab, because \u2026"},
   {label:"2. How the module ends. What does the learner do, unaided, that proves they can do the job?",
    ph:"The summative asks them to \u2026"},
   {label:"3. What could go wrong on this build, and what you would do about it now rather than in week six.",
    ph:"The risk is \u2026 so I would \u2026"}],
  modelHead:"An experienced developer\u2019s version, and how to check yours",
  model:`<p class="tight"><b>Approach.</b> \u201CA guided lab first, because the diagnostic sequence has an order and getting it wrong early teaches the wrong habit. Then an assignment lab on a different fault, so the learner drives it. Tools are the lab image we already have, so nothing depends on admin rights I cannot guarantee.\u201D</p>
  <p class="tight"><b>How it ends.</b> \u201CAn unseen fault on a live machine. The learner diagnoses it, resolves it, and writes the knowledge-base entry. No checklist, no prompts. That is the job.\u201D</p>
  <p class="tight"><b>Risk.</b> \u201CThe job description is fourteen months old and the client renamed the role. I would raise it now, name who is re-confirming it, and build the two lessons that do not depend on the role definition while we wait.\u201D</p>
  <div class="box rule" style="margin-top:10px"><span class="bh">Check your own against these</span><p class="tight">\u2610 Your approach says <em>why</em> as well as what. A list of activities on its own is not a plan.<br>\u2610 The module ends with the learner working unaided. If your ending is guided, it is practice, not proof.<br>\u2610 The summative matches the objective\u2019s verb.<br>\u2610 Your risk is specific to this build, and your response is something you would do this week.<br>\u2610 Nothing in your plan needs a decision that belongs to Design.</p></div>
  <p class="tight" style="color:var(--muted)">Keep what you wrote. Paste it into your capstone plan and expand it there.</p>`},
 transition:"That is the plan. The capstone is the same thinking at full size, with the files built."},

{id:"capprep",title:"Review a package the way your manager will",crumb:"Capstone · Calibrate",
 swe:{demo:{eg:"Submitted item: “Assessment plan: Quiz 401.1, Quiz 401.2, Quiz 401.3, KBA 401. Each quiz covers its own lesson’s content.”",steps:[
  "Check alignment first, and on that count it holds: each quiz maps to a lesson and the KBA closes the module, so nothing is orphaned and no objective is unmeasured.",
  "Then the rule that outranks alignment: the module has to end with a real problem the learner solves unaided. Four knowledge checks never get there, and the objectives in this package ask learners to <em>build</em> an endpoint.",
  "So this goes back, because the module has no summative competency check. What it needs is an SBA rather than a fourth quiz. Work the six below in the same order, checking alignment and then asking what actually proves competence."]}},
 mins:12,
 lead:"Before you build your own package, read someone else's. These six items come from Module Development Packages submitted by new developers. Your manager reads yours against the same readiness rubric, so the quickest way to learn what ready looks like is to make the call yourself on work that is not yours.",
 coach:"<b>✓ Approve</b> items that would pass a readiness review; <b>✗ Send back</b> the ones that would not, and name what is missing. Every standard in this queue comes from a unit you have already worked through.",
 hint:"Run the rubric in its own order. Is the given objective left alone and are the authored ones measurable? Does the plan close with unaided performance? Does the blueprint match the repo? Could a stranger teach the lesson from the guide? Does the rubric describe what a reviewer would see? Does the AI record say what was actually checked?",
 demo:{eg:"Submitted item: “Assessment plan: Quiz 301.1, Quiz 301.2, Quiz 301.3, KBA 301. Each quiz covers its own lesson’s content.”",steps:[
  "Check alignment first, and on that count it holds: each quiz maps to a lesson and the KBA closes the module, so nothing is orphaned and no objective is unmeasured.",
  "Then the rule that outranks alignment: the module has to end with a real problem the learner solves unaided. Four knowledge checks never get there, and the lesson objectives in this package are performance objectives.",
  "So this goes back, because the module has no summative competency check. Adding a fifth quiz would not help: the problem is the instrument rather than the quantity. Work the six below in the same order, checking alignment and then asking what actually proves competence."]},
 html:`<p><strong>Why you review before you build.</strong> You have spent three units applying single standards one at a time. A capstone package is all of them arriving together, which is a different kind of reading. Six items follow, each pulled from a real weak spot in first packages, and each one is something the readiness rubric has a row for.</p>
 <div class="box rule"><span class="bh">What the readiness rubric asks, in one list</span><p class="tight">Is the repo named and filed to convention? Is the given objective quoted rather than rewritten, and are the authored ones measurable? Does every objective have an aligned assessment, ending in unaided performance? Does the blueprint match the repo? Is the built lesson in rhythm, with the activity, the assessment, and its rubric built to standard? Could a stranger teach it from the facilitator guide? Is accessibility in the materials? Does the AI record show verification? And the headline: <b>is this ready to build?</b></p></div>`,
 variants:{swe:{type:"review",id:"capprepr",points:15,queueTag:"Readiness review · submitted packages",
  items:[
   {content:"<strong>From the plan:</strong> “Module objective, revised for clarity: <em>Learners will understand REST and be able to work with APIs.</em> Design’s wording was vague so we tightened it.”",
    good:false,
    why:"✗ Sent back on two counts. Design owns the module objective and it gets quoted as it arrived, not edited. And the replacement is less measurable than what it replaced: “understand” and “work with” are not behaviours you can watch. If the original genuinely could not be built from, the move is to raise it with Design, not to quietly rewrite it.",
    reasons:[
     {t:"The module objective belongs to Design and must be quoted as given. Rewriting it also produced an unmeasurable verb",ok:true,fb:""},
     {t:"The objective is too short to be useful",fb:"Length is not the standard. A one-line objective with a performance verb and named conditions would pass."},
     {t:"Objectives should not name specific technologies like REST",fb:"Naming the real work is exactly right. The violations are the rewrite and the unobservable verb."}]},
   {content:"<strong>From the plan:</strong> “Lesson objectives: (1) Given a feature spec, implement an Express route that returns the documented JSON shape. (2) Given a failing test, identify the assertion that fails and correct the handler so the suite passes.”",
    good:true,
    why:"✓ Approved. Two objectives, one behaviour each, both with an observable verb and stated conditions. You can already picture the assessment for each, which is the test for whether an objective is finished.",
    reasons:[]},
   {content:"<strong>From the blueprint:</strong> MBP 401 lists Lesson 401.1, GLAB 401.1.1, and SBA 401. The repo also contains ALAB 401.2.1 and Quiz 401.2, both built last week.",
    good:false,
    why:"✗ Sent back: the blueprint does not match the repo. QA and Delivery navigate a build from the blueprint, so two unlisted files are two files nobody downstream knows exist. The blueprint is kept current as each file is built, not written once and left.",
    reasons:[
     {t:"The blueprint is out of date: built files are missing from it, so the module cannot be navigated from the index",ok:true,fb:""},
     {t:"ALABs and quizzes do not belong in a blueprint",fb:"Everything in the module belongs in the blueprint, listed in delivery order. Omitting them is the defect."},
     {t:"The blueprint should have been written by Design",fb:"The blueprint is ours, produced during Developing. Ownership is not the problem here; currency is."}]},
   {content:"<strong>From the facilitator guide:</strong> “Lesson 401.1 runs 240 minutes. Stand-up 15, lecture 30, guided lab 90, break 15, pair review 30, lab continued 45, exit ticket 15.”",
    good:false,
    why:"✗ Sent back: that is a schedule, not a guide. An instructor who was in none of your design conversations still does not know why any block is there, that half the room will hit a dependency error in the first ten minutes, what a correct endpoint looks like, or what to cut when stand-up overruns. The timings are useful and they are the easy part.",
    reasons:[
     {t:"It lists what happens without the teaching layer: purpose, pitfalls, look-fors, and what flexes when time collapses",ok:true,fb:""},
     {t:"The timings do not add up to 240 minutes",fb:"They do add up. The gap is that timing alone does not tell an instructor how to teach the day."},
     {t:"Facilitator guides should not include a schedule",fb:"A schedule belongs in the guide. It just cannot be the whole guide."}]},
   {content:"<strong>From the rubric:</strong> “Criterion: <em>Code quality.</em> Exemplary: excellent code. Proficient: good code. Needs Improvement: poor code.”",
    good:false,
    why:"✗ Sent back: that is a rating scale with adjectives, not a rubric. Nothing here says what a reviewer would see, so two instructors reviewing the same pull request would land in different places. Write the observable difference: “validates input before the database call and returns the agreed status codes” reads differently from “returns 200 for every outcome.”",
    reasons:[
     {t:"The level descriptions are adjectives rather than observable differences, so two reviewers could not agree",ok:true,fb:""},
     {t:"There should be more than three levels",fb:"Three levels is the house standard, and Canvas shows five at most. The number is fine; the descriptions are the problem."},
     {t:"Code quality should not be graded",fb:"It is in the objective, so it must be measured. How the levels are described is the flaw."}]},
   {content:"<strong>From the AI-use record:</strong> “I drafted the lab steps with an approved assistant, working from my own lesson objective and the lab template. I ran every command on a clean clone and corrected the install step, which assumed a global package. It suggested a middleware that was deprecated two majors ago, which I removed after checking the docs. The reflection question and the code-review checklist are mine.”",
    good:true,
    why:"✓ Approved. It names what the tool drafted, what was checked and against what, what was corrected, what was cut and why, and what the developer wrote. That is the record the standard asks for, and it points a reviewer at the places worth checking hardest.",
    reasons:[]}],
  fbGood:"Six clean calls. You just read a package the way your reviewer will read yours, which is the most useful thing you can do before you start building one.",
  fbBad:"All six read. Go back over the verdicts you changed, because those are the rows of the readiness rubric most likely to catch your own package."}},

 mins:20,
 lead:"This is where onboarding turns into real work. So far you have practised on projects handed to you. Now you build one of your own. Your capstone is a <b>Module Development Package</b>: you take a module objective Design gave you, decide how it gets met, and build one lesson of it for real, filed in a repo you create. It is not a quiz. It is the work itself, reviewed the way real work is. Read the preview below, reflect for your own thinking, and complete the course. Your final step is the assignment in Canvas.",
 brief:function(){const c=primary()||{domain:"your project"};return {from:"ID&D Director",re:"Your first module: plan requested",text:"You have walked your "+c.domain+" project end to end: set its readiness, built its repo, reviewed its objectives, designed its days, developed and repaired its materials, and judged its quality. Take one of the module objectives from your project's outline and show me how you would meet it. Your lesson objectives, your choice of activities and tools, one lesson built for real with everything it needs in order to run, and a repo I would actually want on my desk. Take the time it needs. I would rather see one solid slice than a rushed module."};},
 coach:"Read the preview so you know what you are taking on, then jot a short answer to each reflection. Those are <b>private, for your own thinking</b>, not graded or submitted. Then press <b>Save &amp; complete</b> to finish the course. Your real deliverable, the Module Development Package, gets built and submitted in the Canvas assignment, where your manager reviews it against the readiness rubric.",
 hint:"Work backwards from the objective, the way you have all course. Decide what would prove a learner can do it, then build the lesson that earns it, then the activity that practises it, then the check that measures it. The plan is the cheap part to get right, so spend real time there before you build anything.",
 prompt:{label:"Copy this: the eight items your repo has to contain",text:"MODULE DEVELOPMENT PACKAGE \u2014 CHECKLIST\n\nStart from a module objective Design has given you. You are not writing the module\nobjective. You are deciding how it gets met.\n\nSubmit: a link to your Google Drive folder (your module repo), named to convention.\nTime: 16 hours, which is two full working days. Spread it out.\n\nPART 1 \u2014 THE PLAN  (Resources/)\n1. Module plan\n   \u2022 the module objective you were given, quoted as it arrived, and the job task\n   \u2022 your lesson objectives: observable, measurable, one behaviour each\n   \u2022 your approach: activities, technology, sequence, and why (including what you ruled out)\n   \u2022 assessment plan: each item named to convention, mapped to the objective it measures\n   \u2022 the module-end summative: how the module closes with unaided performance\n   \u2022 your accessibility plan, as build-time decisions rather than later fixes\n2. Module blueprint (MBP): every item in delivery order, named, with built files linked\n3. AI-use record: what AI drafted, what you verified and how, what you corrected or cut\n\nPART 2 \u2014 THE BUILT SLICE  (Lessons/ Assignments/ Assessments/)\n4. One lesson, fully built: warm-up in, hands-on practice in the middle, exit out\n5. One activity (GLAB or ALAB): one action per step, named specifics, a visible result\n6. One assessment aligned to that same lesson objective, with a type that fits it\n7. A rubric for the graded item: criteria from objectives, levels a reader can tell apart\n8. The facilitator-guide section for that lesson: purpose, timing, pitfalls, look-fors,\n   contingencies. A stranger has to be able to run it.\n\nFILE IT PROPERLY\nEverything named to convention, in the right subfolders. A reviewer should find any\nfile from its name alone.\n\nThen set the folder's sharing, paste the link into the Canvas assignment, and review\nthe package live with your manager. That conversation is the real capstone."},
 html:function(){const c=primary()||{domain:"your project"};return `<div class="cframe"><div class="cf-row"><span class="cf-k">This week</span><span class="cf-v">You set your ${c.domain} project\u2019s readiness, built its repo, reviewed its objectives, designed a lesson day, developed its materials, and judged its quality.</span></div><div class="cf-row"><span class="cf-k">Now</span><span class="cf-v">Read what the capstone asks for, reflect on the module you\u2019d build first, then complete the course and build the package for real review.</span></div></div>
 <div class="box rule"><span class="bh">What this costs you, honestly</span><p class="tight">Plan on <b>16 hours</b>, which is two full working days. Do not try it in one sitting. Most people spread it across a week or two, and that is the right way to work on it. Where the sixteen hours go: about five on the plan, the blueprint and the AI-use record, four on the built lesson, three on the activity, two on the assessment and its rubric, and two on the facilitator-guide section. If you are four hours in and feel nearly done, something in the package is thinner than it looks.</p></div>
 <p><strong>A preview of the assignment.</strong> The full brief and the readiness rubric live in the Canvas assignment: <a href="${(typeof CAPSTONE_ASSIGNMENT_URL!=="undefined"&&CAPSTONE_ASSIGNMENT_URL)?CAPSTONE_ASSIGNMENT_URL:"#"}" target="_blank" rel="noopener"><b>Capstone: Module Development Package →</b></a>. Here is what it asks for, so you can start thinking about it now.</p>

/* ================= ENGINE ================= */
const COURSE=ALL.filter(m=>DAY==="__ALL__"||String(m.day)===DAY);
const FLAT=[];COURSE.forEach(m=>m.lessons.forEach(l=>{l._mod=m.mod;l._day=m.day;FLAT.push(l);}));
const TOTAL=FLAT.reduce((s,l)=>s+((l.activity&&l.activity.points)||0),0);
let ST={current:FLAT[0].id,done:{},earned:{},cap:false,data:{},track:null,mem:{}};

function load(){
  const s=SCORM.getSuspend();if(s)ST=Object.assign(ST,s);
  // The unit files share one storage, so ST.current may point at a lesson that
  // does not exist in this file. Resolve a valid starting lesson for THIS unit.
  try{
    const bm=SCORM.getBookmark(DAY);           // per-unit bookmark
    if(bm && FLAT.some(l=>l.id===bm)){ ST.current=bm; return; }
  }catch(e){}
  if(!FLAT.some(l=>l.id===ST.current)){
    // no valid bookmark: open at the first lesson of this unit that is not finished,
    // which is where the learner actually left off
    const firstUndone=FLAT.find(l=>!ST.done[l.id]);
    ST.current=(firstUndone||FLAT[FLAT.length-1]).id;
  }
}
function persist(){
  SCORM.setSuspend(ST);
  try{ if(ST.current) SCORM.setBookmark(ST.current, DAY); }catch(e){}
  // completion progress (%). How many of THIS unit's activities are done, ignoring correctness
  try{
    const acts=FLAT.filter(l=>l.activity);
    if(acts.length){
      const doneCount=acts.filter(l=>ST.done[l.id]).length;
      SCORM.setScore(Math.round(100*doneCount/acts.length));
    }
  }catch(e){}
  if(FLAT.length&&FLAT.every(x=>ST.done[x.id]))SCORM.markComplete();
  const d=document.getElementById("savedot");d.textContent="saving…";clearTimeout(persist._t);persist._t=setTimeout(()=>d.textContent="saved",500);
  updateRing();
}
function updateRing(){
  const pct=Math.round(FLAT.filter(l=>ST.done[l.id]).length/FLAT.length*100);
  const _r=document.getElementById("ring"); if(_r)_r.style.setProperty("--p",pct);
  const _rp=document.getElementById("ringpct"); if(_rp)_rp.textContent=pct+"%";
  let earned=0,avail=0;
  FLAT.forEach(l=>{if(l.activity&&l.activity.points!=null&&ST.done[l.id]){avail+=l.activity.points;earned+=(ST.earned[l.activity.id]||0);}});
  const _dn=FLAT.filter(x=>ST.done[x.id]).length;const _sc=document.getElementById("scorechip"); if(_sc)_sc.textContent = _dn? "✓ "+_dn+" / "+FLAT.length+" done": "0 / "+FLAT.length+" done";
}
function idx(id){return FLAT.findIndex(l=>l.id===id);}


function unlocked(i){
  // Lesson gating is handled by Canvas module requirements, not here.
  // Each unit is a separate page, so this file cannot see whether earlier units
  // were finished. Everything in this unit is open; Canvas decides unit order.
  return true;
}
function markDone(id,pts){
  ST.done[id]=true;
  if(pts!=null)ST.earned[FLAT[idx(id)].activity.id]=pts;
  // analytics: log activity completion as a SCORM interaction (harmless if LMS ignores it)
  try{
    const l=FLAT[idx(id)];const a=l&&l.activity;
    if(a&&a.id&&!ST.data['int-'+a.id]){
      const track=ST.track||"none";
      SCORM.logInteraction(a.id+"|"+track, "completed", true, "completed");
      ST.data['int-'+a.id]=1;
    }
  }catch(e){}
  persist();renderLessonNav();refreshNav();paintResult(FLAT[idx(id)]);
}
function paintResult(l){
  const a=l.activity;if(!a||a.points==null||!ST.done[l.id])return;
  const pts=ST.earned[a.id]??0,max=a.points;
  const fb=document.getElementById("fb-"+a.id);if(!fb)return;
  let r=document.getElementById("res-"+a.id);
  if(!r){r=document.createElement("div");r.id="res-"+a.id;fb.parentNode.insertBefore(r,fb.nextSibling);}
  r.className="result full";
  // Report what actually happened. Per-item try counts exist for judged activities
  // (review, triage); anything else just reports completion.
  let firstTry=0, tracked=0;
  for(let i=0;i<40;i++){
    const t=ST.data[a.id+'-t'+i];
    if(t===undefined) continue;
    tracked++; if(t===0) firstTry++;
  }
  let msg;
  if(tracked>0 && firstTry===tracked){
    msg='<b>Complete. '+tracked+' of '+tracked+' right on the first try.</b>';
  }else if(tracked>0){
    msg='<b>Complete. '+firstTry+' of '+tracked+' right on the first try.</b> Review the items you corrected: the explanation for each is above.';
  }else{
    msg='<b>Activity complete.</b>';
  }
  r.innerHTML='<span class="star">★</span><span>'+msg+'</span>';
}

function renderLessonNav(){
  const el=document.getElementById("ldbody");
  const _pj=ST.track&&CASES[ST.track]?CASES[ST.track].domain:"not chosen yet";
  const projBox=`<div style="background:#f3f0ea;border:1px solid #e8e1d6;border-radius:9px;padding:9px 11px;margin:0 0 12px">
    <div style="font-size:10px;letter-spacing:.06em;color:#7a8a99;font-family:var(--mono);margin-bottom:3px">YOUR PROJECT</div>
    <div style="font-size:12.5px;font-weight:700;color:#1c2b3a;margin-bottom:7px">${_pj}</div>
    <div id="pjsw" style="display:flex;gap:6px">${CASE_ORDER.map(id=>`<button type="button" data-t="${id}" style="flex:1;padding:5px 6px;font-size:10.5px;border-radius:6px;cursor:pointer;border:1.5px solid ${ST.track===id?'#1d5fa8':'#e8e1d6'};background:${ST.track===id?'#e3edf8':'#fff'};color:${ST.track===id?'#164a85':'#5a6b7b'};font-weight:${ST.track===id?'700':'400'}">${CASES[id].tag}</button>`).join("")}</div>
  </div>`;
  const adminBtn=projBox;
  el.innerHTML=adminBtn+COURSE.map(m=>{
    const _note=``;
    return `<div><div class="mod-title">${m.mod}</div>${_note}<div class="lnav">${
    m.lessons.map(l=>{const i=idx(l.id),u=unlocked(i),d=ST.done[l.id];
      return `<a data-id="${l.id}" class="${ST.current===l.id?'on':''} ${u?'':'locked'}"${u?'':' title="Locked until you finish the previous unit"'}><span class="dot ${d?'done':''}">${d?'✓':(u?'':'🔒')}</span><span>${l.title}${l.mins?` <small style="opacity:.55">· ${l.mins}m</small>`:``}</span></a>`;}).join("")
  }</div></div>`;}).join("");
  try{ document.querySelectorAll("#pjsw button").forEach(b=>{
    b.onclick=()=>{ ST.track=b.dataset.t; remember("track",CASES[b.dataset.t].domain); persist(); renderLessonNav(); render(); };
  }); }catch(e){ console.warn("project switch:",e); }
  el.querySelectorAll("a").forEach(a=>a.onclick=()=>{
    const i=idx(a.dataset.id);if(!unlocked(i))return;
    ST.current=a.dataset.id;closeLessons();render();});
}
function openLessons(){renderLessonNav();document.getElementById("ld").classList.add("open");document.getElementById("ldscrim").classList.add("open");}
function closeLessons(){document.getElementById("ld").classList.remove("open");document.getElementById("ldscrim").classList.remove("open");}
document.getElementById("menuopen").onclick=openLessons;
document.getElementById("ldclose").onclick=closeLessons;
document.getElementById("ldscrim").onclick=closeLessons;

let gdSection=GUIDE[0].id;

function renderGuide(){
  const list=GUIDE.filter(g=>!gdQ||g.title.toLowerCase().includes(gdQ)||g.html.toLowerCase().includes(gdQ));

    `<input id="gdsearch" value="${gdQ.replace(/"/g,'&quot;')}" placeholder="🔎 Search the Handbook…" style="width:100%;box-sizing:border-box;margin:2px 0 8px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font-family:var(--sans);font-size:12.5px">`+

  const si=document.getElementById("gdsearch");

function openGuide(sec){if(sec)gdSection=sec;renderGuide();document.getElementById("gd").classList.add("open");document.getElementById("gdscrim").classList.add("open");}
